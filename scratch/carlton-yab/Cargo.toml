[workspace]
resolver = "2"
members = [
  "crates/pub-core",
  "crates/pub-cfb",
  "crates/pub-contents",
  "crates/pub-quill",
  "crates/pub-escher",
  "crates/pub-model",
  "crates/pub-format-registry",
  "crates/pub-layout",
  "crates/pub-export",
  "crates/pub-idml",
  "crates/pub-odg",
  "crates/pub-reader",
  "crates/pub-writer",
  "crates/pub-editor",
  "crates/pub-viewer",
  "runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
cfb = "0.14"
harfrust = "=0.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
uax14-linebreak = "=0.1.0"
uuid = { version = "1", features = ["v5", "v7"] }
zip = { version = "=2.4.2", default-features = false }
