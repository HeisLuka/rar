[workspace]
resolver = "2"

[package]
name = "chaptera-pub-check-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[[bin]]
name = "chaptera-pub-check"
path = "src/main.rs"

[dependencies]
pub-viewer = { path = "../../vendor/producer-a/crates/pub-viewer" }
pub-contents = { path = "../../vendor/producer-a/crates/pub-contents" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
