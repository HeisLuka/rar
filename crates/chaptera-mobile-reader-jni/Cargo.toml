[package]
name = "chaptera-mobile-reader-jni"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
chaptera-mobile-reader-core = { path = "../chaptera-mobile-reader-core" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
resolver = "2"
