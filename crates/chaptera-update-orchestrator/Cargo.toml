[package]
name = "chaptera-update-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sha2 = "0.10"
chaptera-update-engine = { path = "../chaptera-update-engine" }
chaptera-update-trust = { path = "../chaptera-update-trust" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_RestartManager"] }

[dev-dependencies]
tempfile = "3"


[[bin]]
name = "chaptera-update-recovery-probe"
path = "src/bin/chaptera-update-recovery-probe.rs"
