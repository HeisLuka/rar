# Canonical public-safe production shape.
# Secret *references* are allowed here; secret values are not.
# systemd credentials are exposed to the service through CREDENTIALS_DIRECTORY.

environment = "prod"
listen = "127.0.0.1:8080"
public_origin = "https://cloud.example.invalid"

[sqlite]
path = "/var/lib/chaptera/chaptera.sqlite"
journal_mode = "wal"
synchronous = "full"
busy_timeout_ms = 5000
pool_max = 4

[worker]
# Legacy/general worker policy knobs retained in the typed config. The current
# V0 configured Export worker is single-flight; these values do not yet set
# WorkerLoop parallelism.
heavy_concurrency = 1
light_concurrency = 2
# Explicit deployment policy. Tune from measured capacity; do not infer these
# budgets from worker concurrency.
quota_shared_capacity = 2
quota_semantic_headroom = 1
quota_export_cap = 1
quota_background_cap = 1

[storage]
provider = "s3-compatible"
quarantine_namespace = "chaptera-quarantine"
private_namespace = "chaptera-private"

[limits]
worker_spool_bytes = 4294967296
min_free_disk_bytes = 1073741824

[upload_admission]
# One explicit V0 upload admission envelope shared by web + worker.
principal_concurrent_cap = 2
tenant_concurrent_cap = 8
principal_bytes_cap = 536870912
tenant_bytes_cap = 2147483648
max_single_upload_bytes = 268435456
lease_seconds = 3600
retention_seconds = 604800

[source_validation]
# ClamD is a host-local service; parser child remains separately no-network.
clamd_endpoint = "127.0.0.1:3310"
clamd_connect_timeout_ms = 2000
clamd_io_timeout_ms = 5000
isolation_python = "/usr/bin/python3"
isolation_harness = "/opt/chaptera/current/tools/migration_pdf_worker_isolation.py"
worker_binary = "/opt/chaptera/current/chaptera-untrusted-pub-worker"
worker_wall_timeout_ms = 15000
worker_address_space_mb = 512
worker_cpu_seconds = 10
worker_open_files = 64
worker_output_file_mb = 32
max_file_bytes = 268435456
max_cfb_entries = 8192
max_declared_stream_bytes = 536870912
temp_root = "/var/lib/chaptera/source-scan-tmp"

[source_ingress]
# HTTP-owned upload lifecycle only. Validation/scanner policy above belongs to
# the durable Parse worker and is intentionally not duplicated here.
upload_ttl_seconds = 1800
direct_grant_ttl_seconds = 300

[source_ingress.baseline]
# Project creation derives the canonical baseline from the validated immutable
# source in a bounded isolated child.
isolation_python = "/usr/bin/python3"
isolation_harness = "/opt/chaptera/current/tools/migration_pdf_worker_isolation.py"
worker_binary = "/opt/chaptera/current/chaptera"
worker_wall_timeout_ms = 30000
worker_address_space_mb = 1024
worker_cpu_seconds = 20
worker_open_files = 64
worker_output_file_mb = 32
temp_root = "/var/lib/chaptera/source-baseline-tmp"

[edge]
# Only these immediate peers may assert X-Forwarded-* authority to Chaptera.
trusted_proxy_ips = ["127.0.0.1", "::1"]
max_header_bytes = 32768
max_api_body_bytes = 8388608
max_upload_body_bytes = 268435456
request_timeout_ms = 30000

# Example deployment policy only; Chaptera has no hidden product-default auth TTLs.
# Operators must choose these values explicitly for their environment.
[auth]
login_flow_ttl_seconds = 600
session_idle_ttl_seconds = 1800
session_absolute_ttl_seconds = 86400

[auth.oidc]
issuer = "https://id.example.invalid"
client_id = "chaptera-cloud"
redirect_path = "/v1/auth/callback"
client_secret = { source = "systemd", name = "oidc_client_secret" }

# Optional short-lived application key ring. Enable only when an owning
# protocol actually uses application-managed symmetric keys.
#
# [key_ring]
# active = "grant-2026-09"
# previous = ["grant-2026-08"]
#
# [[key_ring.keys]]
# id = "grant-2026-09"
# secret = { source = "systemd", name = "grant_key_2026_09" }
#
# [[key_ring.keys]]
# id = "grant-2026-08"
# secret = { source = "systemd", name = "grant_key_2026_08" }
