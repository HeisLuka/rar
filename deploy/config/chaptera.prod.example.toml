# Canonical public-safe production shape.
# Secret *references* are allowed here; secret values are not.
# systemd credentials are exposed to the service through CREDENTIALS_DIRECTORY.

environment = "prod"
listen = "127.0.0.1:8080"
public_origin = "https://cloud.example.invalid"

[sqlite]
path = "/var/lib/chaptera/chaptera.sqlite"
journal_mode = "wal"
synchronous = "full"
busy_timeout_ms = 5000
pool_max = 4

[worker]
heavy_concurrency = 1
light_concurrency = 2
# Explicit deployment policy. Tune from measured capacity; do not infer these
# budgets from worker concurrency.
quota_shared_capacity = 2
quota_semantic_headroom = 1
quota_export_cap = 1
quota_background_cap = 1

[storage]
provider = "s3-compatible"
quarantine_namespace = "chaptera-quarantine"
private_namespace = "chaptera-private"

[limits]
worker_spool_bytes = 4294967296
min_free_disk_bytes = 1073741824

[edge]
# Only these immediate peers may assert X-Forwarded-* authority to Chaptera.
trusted_proxy_ips = ["127.0.0.1", "::1"]
max_header_bytes = 32768
max_api_body_bytes = 8388608
max_upload_body_bytes = 268435456
request_timeout_ms = 30000

[auth.oidc]
issuer = "https://id.example.invalid"
client_id = "chaptera-cloud"
redirect_path = "/v1/auth/callback"
client_secret = { source = "systemd", name = "oidc_client_secret" }

# Optional short-lived application key ring. Enable only when an owning
# protocol actually uses application-managed symmetric keys.
#
# [key_ring]
# active = "grant-2026-09"
# previous = ["grant-2026-08"]
#
# [[key_ring.keys]]
# id = "grant-2026-09"
# secret = { source = "systemd", name = "grant_key_2026_09" }
#
# [[key_ring.keys]]
# id = "grant-2026-08"
# secret = { source = "systemd", name = "grant_key_2026_08" }
