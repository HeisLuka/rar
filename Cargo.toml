[workspace]
members = [
  "apps/chaptera-server",
  "crates/pub-model",
  "crates/pub-paint-bridge",
  "crates/pub-plccmob-projection",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
