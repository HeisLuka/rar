[package]
name = "chaptera-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "chaptera"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", features = ["http1", "json", "tokio"] }
clap = { version = "=4.6.7", features = ["derive"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
idna_adapter = "=1.1.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
