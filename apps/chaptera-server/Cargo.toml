[package]
name = "chaptera-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "chaptera"
path = "src/main.rs"

[dependencies]
pub-editor = { path = "../../vendor/producer-a/crates/pub-editor" }
chaptera-cdm-model = { package = "pub-model", path = "../../crates/pub-model" }
chaptera-untrusted-pub-scan = { path = "../../crates/chaptera-untrusted-pub-scan" }
aws-config = "=1.12.0"
aws-sdk-s3 = "=1.149.0"
aws-smithy-types = { version = "=1.8.0", features = ["http-body-1-x"] }
bytes = "=1.12.1"
http-body = "=1.1.0"
futures-util = "=0.3.31"
async-trait = "=0.1.89"
axum = { version = "=0.8.9", features = ["http1", "json", "tokio"] }
axum-extra = { version = "=0.12.6", features = ["cookie"] }
clap = { version = "=4.6.7", features = ["derive"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
idna_adapter = "=1.1.0"
openidconnect = "=4.0.1"
rand = "=0.8.5"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=1.1.6+spec-1.1.0"
url = "=2.5.8"
zeroize = "=1.9.0"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
