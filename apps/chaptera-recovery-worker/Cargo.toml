[package]
name = "chaptera-recovery-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"

[[bin]]
name = "chaptera-recovery-worker"
path = "src/main.rs"

[[bin]]
name = "chaptera-recovery-fixture-executor"
path = "src/bin/fixture_executor.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace]
resolver = "2"
