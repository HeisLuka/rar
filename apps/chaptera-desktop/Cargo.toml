[package]
name = "chaptera-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "chaptera-editor"
path = "src/main.rs"

[[bin]]
name = "chaptera-resize-producer"
path = "src/bin/resize_node_producer.rs"

[[bin]]
name = "chaptera-resize-producer"
path = "src/bin/resize_node_producer.rs"

[features]
default = []
reader-only = []
embedded-fixture-tests = []

[dependencies]
chaptera-suite-handoff = { path = "../../crates/chaptera-suite-handoff" }
chaptera-scene-instance = { path = "../../crates/chaptera-scene-instance" }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
pub-editor = { path = "../../vendor/producer-a/crates/pub-editor" }
pub-export = { path = "../../vendor/producer-a/crates/pub-export" }
pub-interaction = { path = "../../vendor/producer-a/crates/pub-interaction" }
pub-viewer = { path = "../../vendor/producer-a/crates/pub-viewer" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip = "=2.4.2"

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[dev-dependencies]
egui_kittest = { version = "=0.31.1", features = ["eframe", "wgpu"] }
