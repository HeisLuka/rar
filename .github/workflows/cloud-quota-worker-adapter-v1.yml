name: CLOUD-QUOTA-WORKER-ADAPTER-01

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/quota_admission.rs"
      - "apps/chaptera-server/src/quota_store.rs"
      - "apps/chaptera-server/src/job_worker.rs"
      - "apps/chaptera-server/src/job_queue.rs"
      - "apps/chaptera-server/src/lib.rs"
      - "apps/chaptera-server/migrations/0008_quota_reservations.sql"
      - ".github/workflows/cloud-quota-worker-adapter-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-worker-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check chaptera-server formatting
        run: cargo fmt --package chaptera-server -- --check
      - name: Clippy chaptera-server
        run: cargo clippy -p chaptera-server --all-targets -- -D warnings
      - name: Test quota worker adapter
        run: cargo test -p chaptera-server quota_admission::
      - name: Test quota authority
        run: cargo test -p chaptera-server quota_store::
      - name: Test worker lifecycle regressions
        run: cargo test -p chaptera-server job_worker::
