name: Chaptera Desktop Windows V0

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "apps/chaptera-desktop/**"
      - "crates/chaptera-scene-instance/**"
      - "vendor/producer-a/**"
      - ".github/workflows/chaptera-desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Check desktop package
        run: cargo check -p chaptera-desktop --all-targets

      - name: Test current scene-instance mutation gate
        run: cargo test -p chaptera-scene-instance

      - name: Build Chaptera desktop release
        run: cargo build -p chaptera-desktop --release

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "target/release/chaptera.exe"
          if (-not (Test-Path $exe)) {
            throw "Chaptera desktop executable was not produced"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $exe).Length
          @{
            schema_version = "chaptera.desktop-build.v1"
            target = "x86_64-pc-windows-msvc"
            executable = "chaptera.exe"
            sha256 = $hash
            byte_len = $bytes
            source_commit = "${{ github.sha }}"
          } | ConvertTo-Json | Set-Content -Encoding utf8 target/release/chaptera.desktop-build.json

      - uses: actions/upload-artifact@v4
        with:
          name: chaptera-editor-windows-x86_64
          path: |
            target/release/chaptera.exe
            target/release/chaptera.desktop-build.json
          if-no-files-found: error

  source-free-product-smoke:
    needs: build-windows-editor
    runs-on: windows-latest
    steps:
      - name: Download Chaptera desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: chaptera-editor-windows-x86_64
          path: artifact

      - name: Move artifact outside workspace and remove workspace copy
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP "chaptera-source-free-smoke"
          if (Test-Path $clean) {
            Remove-Item -Recurse -Force $clean
          }
          New-Item -ItemType Directory -Path $clean | Out-Null
          Copy-Item artifact/chaptera.exe $clean/chaptera.exe
          Copy-Item artifact/chaptera.desktop-build.json $clean/chaptera.desktop-build.json
          Remove-Item -Recurse -Force artifact
          "CHAPTERA_CLEAN_DIR=$clean" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run source-free product smoke
        shell: pwsh
        run: |
          Push-Location $env:CHAPTERA_CLEAN_DIR
          try {
            $raw = & .\chaptera.exe --product-smoke-check
            if ($LASTEXITCODE -ne 0) {
              throw "chaptera.exe product smoke failed with exit code $LASTEXITCODE"
            }
            $receipt = $raw | ConvertFrom-Json
            if ($receipt.schema_version -ne "chaptera.desktop-product-smoke.v1") {
              throw "unexpected smoke schema"
            }
            if (-not $receipt.editor_enabled -or $receipt.reader_only) {
              throw "artifact is not editor-enabled"
            }
            if ($receipt.runtime_boundary.source_checkout_required) {
              throw "product smoke claims source checkout dependency"
            }
            if ($receipt.runtime_boundary.cargo_required) {
              throw "product smoke claims Cargo dependency"
            }
            if ($receipt.runtime_boundary.repo_relative_assets_required_by_smoke_path) {
              throw "product smoke claims repo-relative smoke dependency"
            }

            $actualHash = (Get-FileHash .\chaptera.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($receipt.executable_sha256 -ne $actualHash) {
              throw "smoke receipt executable hash mismatch"
            }

            $build = Get-Content .\chaptera.desktop-build.json -Raw | ConvertFrom-Json
            if ($build.sha256 -ne $actualHash) {
              throw "build receipt executable hash mismatch"
            }

            $raw | Set-Content -Encoding utf8 chaptera.desktop-product-smoke.json
          }
          finally {
            Pop-Location
          }

      - name: Upload source-free smoke receipt
        uses: actions/upload-artifact@v4
        with:
          name: chaptera-editor-source-free-smoke
          path: ${{ env.CHAPTERA_CLEAN_DIR }}/chaptera.desktop-product-smoke.json
          if-no-files-found: error
