name: Chaptera Desktop Windows V0

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "apps/chaptera-desktop/**"
      - "crates/chaptera-scene-instance/**"
      - "vendor/producer-a/**"
      - ".github/workflows/chaptera-desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acceptance validator
        run: python -m pip install "jsonschema==4.23.0"

      - name: Check desktop package
        run: cargo check -p chaptera-desktop --all-targets

      - name: Test current scene-instance mutation gate
        run: cargo test -p chaptera-scene-instance

      - name: Test Chaptera agent protocol core
        run: cargo test -p chaptera-desktop

      - name: Test canonical desktop Story range wire
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --test story_range_v1

      - name: Build Chaptera desktop release
        run: cargo build -p chaptera-desktop --release

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "target/release/chaptera.exe"
          if (-not (Test-Path $exe)) {
            throw "Chaptera desktop executable was not produced"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $exe).Length
          @{
            schema_version = "chaptera.desktop-build.v1"
            target = "x86_64-pc-windows-msvc"
            executable = "chaptera.exe"
            sha256 = $hash
            byte_len = $bytes
            source_commit = "${{ github.sha }}"
          } | ConvertTo-Json | Set-Content -Encoding utf8 target/release/chaptera.desktop-build.json

      - name: Acquire pinned Apache POI SampleNewsletter
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          $url = "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub"
          Invoke-WebRequest -Uri $url -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $fixture).Length
          if ($hash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") {
            throw "SampleNewsletter SHA-256 mismatch: $hash"
          }
          if ($bytes -ne 291840) {
            throw "SampleNewsletter byte length mismatch: $bytes"
          }
          "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run real Desktop V0 continuity receipt
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "chaptera-desktop-v0"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $project = Join-Path $out "desktop-v0.project.json"
          $export = Join-Path $out "desktop-v0.edited.idml"
          $receipt = Join-Path $out "editor-desktop-vertical.real.json"
          python tools/run_local_editor_desktop_vertical.py --fixture "$env:CHAPTERA_SAMPLE_NEWSLETTER" --project-output "$project" --export-output "$export" --receipt-output "$receipt" -- target/release/chaptera.exe --desktop-acceptance-v1 "{fixture}" "{project}" "{export}"
          python tools/validate_editor_desktop_vertical_receipt.py "$receipt"
          Copy-Item "$receipt" "target/release/editor-desktop-vertical.real.json"

      - name: Run real agent-control protocol
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "chaptera-agent-v1"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          python tools/test_chaptera_agent_v1.py --exe target/release/chaptera.exe --fixture "$env:CHAPTERA_SAMPLE_NEWSLETTER" --work-dir "$out" --receipt target/release/editor-agent-control.real.json

      - uses: actions/upload-artifact@v4
        with:
          name: chaptera-editor-windows-x86_64
          path: |
            target/release/chaptera.exe
            target/release/chaptera.desktop-build.json
            target/release/editor-desktop-vertical.real.json
            target/release/editor-agent-control.real.json
          if-no-files-found: error
