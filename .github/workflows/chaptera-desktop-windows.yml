name: Chaptera Editor Desktop Windows V0

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "apps/chaptera-desktop/**"
      - "crates/chaptera-scene-instance/**"
      - "vendor/producer-a/**"
      - "packages/product/editor-live-trial/**"
      - "packages/protocol/editor-agent-control/**"
      - "tools/package_editor_live_trial.py"
      - "tools/build_editor_live_trial_package_receipt.py"
      - "tools/validate_editor_live_trial_package_receipt.py"
      - "tools/run_editor_live_trial_package_smoke.py"
      - "tools/validate_editor_desktop_ux_snapshots.py"
      - ".github/workflows/chaptera-desktop-windows.yml"
      - "packages/product/desktop-suite/**"
      - "tools/validate_chaptera_desktop_suite_manifest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acceptance validator
        run: python -m pip install "jsonschema==4.23.0"

      - name: Test portable package mechanics
        run: python -m unittest tools.test_package_editor_live_trial -v

      - name: Validate suite product identity
        run: python tools/validate_chaptera_desktop_suite_manifest.py packages/product/desktop-suite/v1/product-manifest.json --editor-cargo apps/chaptera-desktop/Cargo.toml

      - name: Check desktop package
        run: cargo check -p chaptera-desktop --all-targets

      - name: Test current scene-instance mutation gate
        run: cargo test -p chaptera-scene-instance

      - name: Test Chaptera agent protocol core
        run: cargo test -p chaptera-desktop

      - name: Test canonical desktop Story range wire
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --test story_range_v1

      - name: Build Chaptera desktop release
        run: cargo build -p chaptera-desktop --release

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "target/release/chaptera-editor.exe"
          if (-not (Test-Path $exe)) {
            throw "Chaptera desktop executable was not produced"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $exe).Length
          @{
            schema_version = "chaptera.editor-desktop-build.v1"
            product_id = "chaptera.editor"
            target = "x86_64-pc-windows-msvc"
            executable = "chaptera-editor.exe"
            sha256 = $hash
            byte_len = $bytes
            source_commit = "${{ github.sha }}"
          } | ConvertTo-Json | Set-Content -Encoding utf8 target/release/chaptera-editor.desktop-build.json

      - name: Acquire pinned Apache POI SampleNewsletter
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          $url = "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub"
          Invoke-WebRequest -Uri $url -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $fixture).Length
          if ($hash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") {
            throw "SampleNewsletter SHA-256 mismatch: $hash"
          }
          if ($bytes -ne 291840) {
            throw "SampleNewsletter byte length mismatch: $bytes"
          }
          "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test GUI-only Desktop V0 walkthrough
        run: cargo test -p chaptera-desktop gui_only_v0_walkthrough_uses_real_widgets -- --nocapture

      - name: Capture headless Chaptera UX snapshots
        shell: pwsh
        run: |
          $snapshotDir = (Resolve-Path "target/release").Path
          $env:CHAPTERA_UX_SNAPSHOT_DIR = $snapshotDir
          cargo test -p chaptera-desktop headless_wgpu_ux_snapshots_render_current_viewer_app -- --nocapture
          python tools/validate_editor_desktop_ux_snapshots.py --default target/release/chaptera-editor-ux-1280x820.png --minimum target/release/chaptera-editor-ux-900x600.png --output target/release/editor-desktop-ux-snapshots.real.json

      - name: Run real Desktop V0 continuity receipt
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "chaptera-desktop-v0"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $project = Join-Path $out "desktop-v0.project.json"
          $export = Join-Path $out "desktop-v0.edited.idml"
          $receipt = Join-Path $out "editor-desktop-vertical.real.json"
          python tools/run_local_editor_desktop_vertical.py --fixture "$env:CHAPTERA_SAMPLE_NEWSLETTER" --project-output "$project" --export-output "$export" --receipt-output "$receipt" -- target/release/chaptera-editor.exe --desktop-acceptance-v1 "{fixture}" "{project}" "{export}"
          python tools/validate_editor_desktop_vertical_receipt.py "$receipt"
          Copy-Item "$receipt" "target/release/editor-desktop-vertical.real.json"

      - name: Build portable Chaptera Editor ZIP
        shell: pwsh
        run: |
          python tools/package_editor_live_trial.py --editor-exe target/release/chaptera-editor.exe --output-zip target/release/Chaptera-Editor-Windows-x86_64.zip --binary-entry Chaptera-Editor.exe --manifest target/release/Chaptera-Editor.package.json

      - name: Run real packaged-product smoke and receipt
        shell: pwsh
        run: |
          python tools/build_editor_live_trial_package_receipt.py --zip target/release/Chaptera-Editor-Windows-x86_64.zip --binary-entry Chaptera-Editor.exe --chaptera-version "0.1.0-ci${{ github.run_number }}" --fixture-kind real_pub_sanitized --output target/release/editor-live-trial-package.real.json -- python tools/run_editor_live_trial_package_smoke.py --fixture "$env:CHAPTERA_SAMPLE_NEWSLETTER" --rar-commit "${{ github.sha }}"
          python tools/validate_editor_live_trial_package_receipt.py target/release/editor-live-trial-package.real.json

      - name: Run real agent-control protocol
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "chaptera-agent-v1"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          python tools/test_chaptera_agent_v1.py --exe target/release/chaptera-editor.exe --fixture "$env:CHAPTERA_SAMPLE_NEWSLETTER" --work-dir "$out" --receipt target/release/editor-agent-control.real.json

      - uses: actions/upload-artifact@v4
        with:
          name: chaptera-editor-windows-x86_64
          path: |
            target/release/chaptera-editor.exe
            target/release/chaptera-editor.desktop-build.json
            target/release/editor-desktop-vertical.real.json
            target/release/Chaptera-Editor-Windows-x86_64.zip
            target/release/Chaptera-Editor.package.json
            target/release/editor-live-trial-package.real.json
            target/release/editor-agent-control.real.json
          if-no-files-found: error

  validate-portable-editor:
    needs: build-windows-editor
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chaptera-editor-windows-x86_64
          path: ${{ runner.temp }}/chaptera-artifact

      - name: Validate clean extracted Editor
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP "chaptera-artifact"
          $zip = Join-Path $artifact "Chaptera-Editor-Windows-x86_64.zip"
          $manifestPath = Join-Path $artifact "Chaptera-Editor.package.json"
          if (-not (Test-Path $zip)) { throw "portable Editor ZIP is missing" }
          if (-not (Test-Path $manifestPath)) { throw "portable package manifest is missing" }

          $clean = Join-Path $env:RUNNER_TEMP "chaptera-portable-clean"
          if (Test-Path $clean) { Remove-Item -Recurse -Force $clean }
          New-Item -ItemType Directory -Force -Path $clean | Out-Null
          Expand-Archive -Path $zip -DestinationPath $clean

          $exe = Join-Path $clean "Chaptera-Editor.exe"
          if (-not (Test-Path $exe)) { throw "portable ZIP did not contain Chaptera-Editor.exe" }
          $catalogPath = Join-Path $clean "agent-control-v1.catalog.json"
          if (-not (Test-Path $catalogPath)) { throw "portable ZIP did not contain Agent V1 catalog" }
          if (Test-Path (Join-Path $clean "Cargo.toml")) { throw "portable ZIP leaked a Cargo checkout" }

          try {
            $catalog = Get-Content -Raw $catalogPath | ConvertFrom-Json
          } catch {
            throw "portable Agent V1 catalog is not valid JSON"
          }
          if ($catalog.schema -ne "chaptera.agent-control.catalog.v1") { throw "portable Agent catalog schema mismatch" }
          if ($catalog.protocol_version -ne "chaptera.agent-control.v1") { throw "portable Agent protocol mismatch" }
          if ($catalog.executable -ne "chaptera-editor.exe") { throw "portable Agent executable identity mismatch" }
          if ($catalog.global_laws.native_pub_write -ne $false) { throw "portable Agent catalog widened native PUB write" }
          if ($catalog.global_laws.source_pub_immutable -ne $true) { throw "portable Agent catalog lost immutable-source law" }

          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $catalogHash = (Get-FileHash $catalogPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $catalogBytes = (Get-Item $catalogPath).Length
          $exeBytes = (Get-Item $exe).Length
          $env:CHAPTERA_PRODUCT_SMOKE_BINARY_SHA256 = $exeHash
          $env:CHAPTERA_PRODUCT_SMOKE_BINARY_BYTE_LEN = [string]$exeBytes

          $receipt = Join-Path $artifact "chaptera.desktop-source-free-smoke.json"
          $process = Start-Process -FilePath $exe -ArgumentList @("--product-smoke-v1", $receipt) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "source-free Chaptera product smoke failed with exit code $($process.ExitCode)"
          }
          if (-not (Test-Path $receipt)) { throw "source-free product smoke receipt is missing" }
          try {
            $smoke = Get-Content -Raw $receipt | ConvertFrom-Json
          } catch {
            throw "source-free product smoke did not emit valid JSON"
          }

          if ($smoke.protocol_version -ne "chaptera.desktop-source-free-smoke.v1") {
            throw "source-free product smoke protocol mismatch"
          }
          if ($smoke.product -ne "Chaptera Editor") { throw "portable binary is not Chaptera Editor" }
          if ($smoke.reader_only -ne $false) { throw "portable binary is reader-only" }
          if ($smoke.editor_controls_enabled -ne $true) { throw "Editor controls are disabled" }
          if ($smoke.native_save_pub_claimed -ne $false) { throw "portable V0 widened native Save PUB claims" }

          foreach ($field in @("checkout_required", "cargo_required", "vendor_path_required", "external_runtime_assets_required")) {
            if ($smoke.runtime.$field -ne $false) { throw "source-free runtime dependency detected: $field" }
          }

          if ($smoke.binary_sha256 -ne $exeHash) { throw "bound executable hash mismatch" }
          if ([int64]$smoke.binary_byte_len -ne $exeBytes) { throw "bound executable byte length mismatch" }

          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.binary_sha256 -ne $exeHash) { throw "package manifest executable hash mismatch" }
          if ($manifest.zip_sha256 -ne $zipHash) { throw "package manifest ZIP hash mismatch" }
          if ([int64]$manifest.binary_size -ne $exeBytes) { throw "package manifest executable byte length mismatch" }
          if ([int64]$manifest.zip_size -ne (Get-Item $zip).Length) { throw "package manifest ZIP byte length mismatch" }
          if ($manifest.agent_catalog_entry -ne "agent-control-v1.catalog.json") { throw "package manifest Agent catalog entry mismatch" }
          if ($manifest.agent_catalog_sha256 -ne $catalogHash) { throw "package manifest Agent catalog hash mismatch" }
          if ([int64]$manifest.agent_catalog_size -ne $catalogBytes) { throw "package manifest Agent catalog byte length mismatch" }

      - uses: actions/upload-artifact@v4
        with:
          name: chaptera-editor-portable-windows-x86_64
          path: |
            ${{ runner.temp }}/chaptera-artifact/Chaptera-Editor-Windows-x86_64.zip
            ${{ runner.temp }}/chaptera-artifact/Chaptera-Editor.package.json
            ${{ runner.temp }}/chaptera-artifact/editor-live-trial-package.real.json
            ${{ runner.temp }}/chaptera-artifact/chaptera.desktop-source-free-smoke.json
          if-no-files-found: error
