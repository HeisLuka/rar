name: TEMP T721 authority proof
on:
  pull_request:
    paths:
      - 'tools/corpus/receipts/current-rar-1521.sha256.txt'
      - 'tools/corpus/receipts/publisher2002-sbs-06-input-2026-09-25.json'
      - '.github/workflows/tmp-t721-authority-proof.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove 1515 + 6 -> 1521
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, re
          root=pathlib.Path('.')
          pred=(root/'tools/corpus/receipts/current-rar-1515.sha256.txt').read_text().splitlines()
          succ=(root/'tools/corpus/receipts/current-rar-1521.sha256.txt').read_text().splitlines()
          spec=json.loads((root/'tools/corpus/receipts/publisher2002-sbs-06-input-2026-09-25.json').read_text())
          six=[x['sha256'] for x in spec['files']]
          def digest(xs):
              return hashlib.sha256(('\n'.join(sorted(xs))+'\n').encode('ascii')).hexdigest()
          assert len(pred)==len(set(pred))==1515
          assert digest(pred)=='3151155207344da1e611b690c0c7c80dfcb08fd3edf3191da59e2f14be45675c'
          assert len(six)==len(set(six))==6
          assert digest(six)=='74eccc943b9187a6a351b27ecdb3b666880953f8cbfeb9aa45cec8794afc0f15'
          assert set(pred).isdisjoint(six)
          assert succ==sorted(succ)
          assert len(succ)==len(set(succ))==1521
          assert set(succ)==set(pred)|set(six)
          sd=digest(succ)
          print(json.dumps({
            'schema':'chaptera.t721-authority-proof.v1',
            'predecessor_count':1515,
            'predecessor_digest':'sha256:'+digest(pred),
            'new_unique_sha_count':6,
            'new_tranche_digest':'sha256:'+digest(six),
            'overlap_with_predecessor':0,
            'successor_count':1521,
            'successor_digest':'sha256:'+sd
          },sort_keys=True))
          PY
