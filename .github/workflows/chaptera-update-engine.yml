name: Chaptera update transaction engine

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/chaptera-update-engine/**"
      - ".github/workflows/chaptera-update-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaptera-update-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transaction-engine:
    name: transaction engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Test journaled activation and crash recovery
        run: cargo test -p chaptera-update-engine --all-targets
