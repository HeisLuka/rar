name: Cloud blob store rustfmt repair

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/blob_store.rs"
      - "apps/chaptera-server/src/lib.rs"
      - ".github/workflows/cloud-blob-store-autoformat.yml"

permissions:
  contents: write

jobs:
  rustfmt-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'cloud-blob-store-v0-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "rustfmt already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/chaptera-server/src/blob_store.rs apps/chaptera-server/src/lib.rs
          git commit -m "CLOUD-BLOB-STORE-V0-01: apply rustfmt"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
