name: TEMP Publisher 2002 textbook second-level routes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect exact observed textbook companion routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import urlencode, urljoin
          from urllib.request import Request, urlopen

          UA="rar-publisher2002-textbook-second-level/1.0"
          # Both are grounded in #665/#747; no domain-wide crawl.
          targets=[
            {
              "label":"cashman-complete-instructional-site",
              "url":"http://www.scsite.com:80/catalog/viewtitle.cfm?isbn=0-7895-6353-3&help=Shelly%20Cashman%20Instructional%20Web%20Site",
              "mode":"cdx"
            },
            {
              "label":"gaskin-prenhall-root",
              "url":"http://www.prenhall.com:80/gaskin/",
              "mode":"known-replay",
              "timestamp":"20071226171813"
            }
          ]
          attr_re=re.compile(r'''(?is)\b(?:href|src|action)\s*=\s*["']([^"']+)["']''')
          refresh_re=re.compile(r'''(?is)http-equiv\s*=\s*["']refresh["'][^>]*content\s*=\s*["'][^"']*url\s*=\s*([^"';>\s]+)''')
          carrier_re=re.compile(r'\.(?:pub|zip|cab|exe|msi|iso|img|bin|cue|7z|rar)(?:$|[?#])',re.I)
          relevant_re=re.compile(r'(publisher|student|data.?file|download|exercise|project|practice|chapter|cashman|gaskin|companion|graphic.?design|6353|14676)',re.I)

          def cdx(u):
            params=[
              ("url",u),("matchType","exact"),("output","json"),
              ("fl","timestamp,original,mimetype,statuscode,digest,length"),
              ("filter","statuscode:200"),("collapse","digest"),("limit","20"),("gzip","false")
            ]
            q="https://web.archive.org/cdx/search/cdx?"+urlencode(params)
            req=Request(q,headers={"User-Agent":UA,"Accept":"application/json"})
            with urlopen(req,timeout=30) as r:
              data=json.load(r)
            return [dict(zip(data[0],x)) for x in data[1:]] if data else []

          target_rows=[]; pages=[]; observed=[]; errors=[]
          for t in targets:
            attempts=[]
            if t["mode"]=="known-replay":
              attempts=[{"timestamp":t["timestamp"],"original":t["url"],"source":"proven-665"}]
            else:
              try:
                caps=cdx(t["url"])
              except Exception as e:
                caps=[]
                errors.append({"surface":"cdx","label":t["label"],"url":t["url"],"error":f"{type(e).__name__}: {e}"})
              attempts=[{**c,"source":"exact-cdx"} for c in caps[:8]]
            target_rows.append({"label":t["label"],"url":t["url"],"attempt_count":len(attempts),"attempts":attempts})
            for a in attempts:
              ts=a["timestamp"]; original=a.get("original") or t["url"]
              replay=f"https://web.archive.org/web/{ts}id_/{original}"
              row={"label":t["label"],"timestamp":ts,"original":original,"replay":replay}
              try:
                req=Request(replay,headers={"User-Agent":UA,"Accept":"text/html,*/*;q=0.1"})
                with urlopen(req,timeout=25) as r:
                  body=r.read(1024*1024)
                  row["status"]=getattr(r,"status",None)
                  row["final_url"]=r.geturl()
                  row["content_type"]=r.headers.get("Content-Type")
                row["length"]=len(body)
                text=body.decode("utf-8","replace")
                vals=[m.group(1) for m in attr_re.finditer(text)]
                vals += [m.group(1) for m in refresh_re.finditer(text)]
                links=[]
                for v in vals:
                  v=html.unescape(v.strip())
                  if not v or v.startswith(("#","javascript:","mailto:")): continue
                  u=urljoin(original,v)
                  links.append(u)
                  observed.append({"source_label":t["label"],"source_timestamp":ts,"source_page":original,"url":u})
                row["links"]=sorted(set(links))
                row["preview"]=text[:3000]
              except Exception as e:
                row["error"]=f"{type(e).__name__}: {e}"
                errors.append({"surface":"replay","label":t["label"],"timestamp":ts,"url":original,"error":row["error"]})
              pages.append(row)
              time.sleep(.2)

          seen=set(); links=[]
          for r in observed:
            k=r["url"].casefold()
            if k in seen: continue
            seen.add(k)
            u=r["url"]
            links.append({**r,"carrier_like":bool(carrier_re.search(u)),"relevant_like":bool(relevant_re.search(u))})

          summary={
            "schema":"chaptera.corpus-publisher2002-textbook-second-level.v1",
            "source_safe":True,
            "raw_binary_retained":False,
            "targets":target_rows,
            "pages_fetched":sum("error" not in x for x in pages),
            "unique_observed_links":len(links),
            "carrier_rows":[x for x in links if x["carrier_like"]],
            "relevant_rows":[x for x in links if x["relevant_like"]],
            "errors":errors,
            "guardrail":"Only two exact routes already proven by #665/#747 are inspected. No linked binary bodies are downloaded or executed."
          }
          Path("out/summary.json").write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding="utf-8")
          Path("out/pages.json").write_text(json.dumps(pages,indent=2,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - name: Metadata-only guard
        shell: bash
        run: |
          set -euo pipefail
          if find out -type f \( -iname '*.pub' -o -iname '*.zip' -o -iname '*.cab' -o -iname '*.exe' -o -iname '*.msi' -o -iname '*.iso' -o -iname '*.img' -o -iname '*.7z' -o -iname '*.rar' \) | grep -q .; then
            echo 'unexpected carrier bytes in metadata artifact' >&2
            exit 1
          fi
          sha256sum out/* | sort > out/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-publisher2002-textbook-second-level
          path: out/**
          retention-days: 60
          if-no-files-found: error
