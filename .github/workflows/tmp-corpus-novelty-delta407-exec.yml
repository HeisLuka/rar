name: TEMP CORPUS novelty delta407 execution

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-corpus-novelty-delta407-exec.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: tmp-corpus-novelty-delta407-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        root_index: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public CFB/archive tools
        run: |
          python -m pip install --disable-pip-version-check olefile==0.47
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
      - name: Execute one admitted root
        run: |
          set -euo pipefail
          python tools/corpus/structural_novelty_container_delta.py scan-root             --root-index "${{ matrix.root_index }}"             --out out
      - name: Prove no raw PUB retained
        if: always()
        run: |
          set -euo pipefail
          if find out -type f -iname '*.pub' | grep -q .; then
            echo "raw PUB leaked into retained output" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-container-delta-407-${{ github.run_id }}-${{ matrix.root_index }}
          path: out/**
          if-no-files-found: error
          retention-days: 7

  aggregate:
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - uses: actions/download-artifact@v4
        with:
          pattern: tmp-container-delta-407-${{ github.run_id }}-*
          path: shards
      - name: Aggregate source-free fingerprints
        run: |
          set -euo pipefail
          python tools/corpus/structural_novelty_container_delta.py aggregate             --input shards             --out aggregate
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("aggregate/summary.json").read_text())
          assert s["analyzed_rows"] == 407, s
          assert s["expected_sha"] == 407, s
          assert s["selected_cover_root_count"] == 6, s
          assert s["selected_cover_total_bytes"] == 762499072, s
          print(json.dumps(s, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tmp-container-delta-407-aggregate-${{ github.run_id }}
          path: aggregate/**
          if-no-files-found: error
          retention-days: 7
