name: Image Decode Contract V1

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/chaptera-image-decode-contract/**"
      - ".github/workflows/image-decode-contract-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Check focused decoder crate
        run: cargo check -p chaptera-image-decode-contract
      - name: Clippy focused decoder crate
        run: cargo clippy -p chaptera-image-decode-contract --all-targets -- -D warnings
      - name: Run deterministic decode contract tests
        run: cargo test -p chaptera-image-decode-contract
      - name: Emit decode receipt
        run: mkdir -p target/image-decode-contract && cargo run -q -p chaptera-image-decode-contract --bin decode_receipt | tee target/image-decode-contract/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-decode-contract-${{ github.run_id }}
          path: target/image-decode-contract/receipt.json
          if-no-files-found: error
