      - name: Gate family presentation consumer and generic no-loss controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("out/carlton/viewer-consumer")
          march = json.loads((root / "march.json").read_text())
          december = json.loads((root / "december.json").read_text())
          newsletter = json.loads((root / "samplenewsletter.json").read_text())
          brochure = json.loads((root / "samplebrochure.json").read_text())

          def codes(receipt):
              return set(receipt["diagnostic_codes"])

          assert march["viewer_page_count"] == 3, march
          assert march["scene_surface_count"] == 3, march
          assert march["viewer_page_indices"] == [1, 2, 3], march
          assert "viewer.page_projection.family_profile_applied" in codes(march), march
          assert "viewer.page_projection.roles_unresolved" not in codes(march), march
          assert "viewer.page_projection.family_profile_unavailable" not in codes(march), march

          assert december["viewer_page_count"] == 5, december
          assert december["scene_surface_count"] == 5, december
          assert december["viewer_page_indices"] == [1, 2, 3, 4, 5], december
          assert "viewer.page_projection.family_profile_applied" in codes(december), december
          assert "viewer.page_projection.roles_unresolved" not in codes(december), december
          assert "viewer.page_projection.family_profile_unavailable" not in codes(december), december

          assert newsletter["viewer_page_count"] == 4, newsletter
          assert newsletter["scene_surface_count"] == 4, newsletter
          assert newsletter["viewer_page_indices"] == [1, 2, 3, 4], newsletter
          assert "viewer.page_projection.family_profile_applied" in codes(newsletter), newsletter
          assert "viewer.page_projection.roles_unresolved" not in codes(newsletter), newsletter
          assert "viewer.page_projection.scenario_order_observed" in codes(newsletter), newsletter

          assert brochure["viewer_page_count"] == 2, brochure
          assert brochure["scene_surface_count"] == 2, brochure
          assert brochure["viewer_page_indices"] == [1, 2], brochure
          assert "viewer.page_projection.family_profile_applied" in codes(brochure), brochure
          assert "viewer.page_projection.roles_unresolved" not in codes(brochure), brochure
          assert "viewer.page_projection.scenario_order_observed" not in codes(brochure), brochure

          print(
              "CARLTON READER PRESENTATION CONSUMER PASS "
              "March=3/3 December=5/5 exact Newsletter=4/4 Brochure=2/2"
          )
          PY

