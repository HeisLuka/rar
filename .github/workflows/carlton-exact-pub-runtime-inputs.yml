                              frame["frame_seq_num"]
                              for frame in check["source_frames"]
                          ),
                          "object_marker_count": check["object_marker_count"],
                      }
                      for qsid, check in sorted(
                          target_checks.items(), key=lambda pair: int(pair[0])
