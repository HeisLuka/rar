                          "carrier_story_qsid": item["carrier_story_qsid"],
                          "source_parent_seq_num": item["parent_seq_num"],
                          "effective_parent_seq_num": item["parent_seq_num"],
                      }
                      for item in receipt["carrier_checks"]
