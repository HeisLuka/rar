name: Carlton exact PUB runtime inputs

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/pub-model/**"
      - "crates/pub-presentation-profile/**"
      - "vendor/producer-a/crates/pub-reader/**"
      - "vendor/producer-a/crates/pub-viewer/**"
      - ".github/workflows/carlton-exact-pub-runtime-inputs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded acquisition dependencies
        run: python -m pip install "requests==2.32.5" "olefile==0.47" "jsonschema==4.23.0"

      - name: Acquire exact Carlton PUBs from School Jotter hydration state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/carlton/exact out/carlton/discovery
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          from pathlib import Path

          import requests

          PAGE = "https://www.carltonji.org.uk/parents/latest-letters"
          ROOT = Path("out/carlton")
          EXACT = ROOT / "exact"
          DISC = ROOT / "discovery"

          specs = {
              "March 2026.pub": {
                  "artifact_name": "March-2026.pub",
                  "expected_id": "5a939344-76a6-4a6a-b30b-7237edac8bfa",
                  "size": 9_580_032,
                  "sha256": "bf9cda0f632b5820ab9dbdbe1b838b2a988b2f3fdd69253c22b4fc3aef9f11c3",
              },
              "December 2025.pub": {
                  "artifact_name": "December-2025.pub",
                  "expected_id": "f7d0fadd-c2a9-4a8c-940b-c81844d0bc29",
                  "size": 9_988_608,
                  "sha256": "41786e9ee564dfc3d10864a49c9e58af5e1689d31479ef0c478ffb79da16f79e",
              },
          }

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; Chaptera-Carlton-Acquisition/2.0)",
              "Accept": "*/*",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          })

          request_page = f"{PAGE}?chaptera_cache_bust={int(time.time())}"
          response = session.get(request_page, timeout=30)
          response.raise_for_status()
          raw = response.text
          (DISC / "latest-letters.html").write_text(raw, encoding="utf-8")

          # Capture the public frontend route vocabulary. The document declares
          # <base href="/">, so resolve Angular bundles through that base exactly as
          # a browser does instead of relative to /parents/latest-letters.
          script_srcs = re.findall(r'<script[^>]+src="([^"]+)"', raw, flags=re.I)
          base_match = re.search(r'<base[^>]+href="([^"]+)"', raw, flags=re.I)
          base_href = base_match.group(1) if base_match else "/"
          document_base = requests.compat.urljoin(response.url, base_href)
          main_src = next((src for src in script_srcs if re.search(r'(^|/)main-[^/]+[.]js$', src)), None)
          frontend_diag = {
              "response_url": response.url,
              "base_href": base_href,
              "document_base": document_base,
              "script_srcs": script_srcs,
              "main_src": main_src,
          }
          (DISC / "frontend-scripts.json").write_text(
              json.dumps(frontend_diag, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if main_src:
              bundle_url = requests.compat.urljoin(document_base, main_src)
              bundle = session.get(bundle_url, timeout=30)
              frontend_diag["bundle_url"] = bundle_url
              frontend_diag["bundle_status"] = bundle.status_code
              (DISC / "frontend-scripts.json").write_text(
                  json.dumps(frontend_diag, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              bundle.raise_for_status()
              (DISC / "school-jotter-main.js").write_bytes(bundle.content)
              candidates = sorted(set(
                  match.group(0)
                  for match in re.finditer(
                      r'[^"\s]{0,120}(?:/api/|download|file)[^"\s]{0,220}',
                      bundle.text,
                      flags=re.I,
                  )
              ))
              (DISC / "frontend-route-candidates.txt").write_text(
                  "\n".join(candidates[:4000]) + "\n",
                  encoding="utf-8",
              )

          # Pull the directly referenced public Angular chunks and scan them for
          # API connector/base-url vocabulary. This remains diagnostics-only.
          js_dir = DISC / "js"
          js_dir.mkdir(exist_ok=True)
          asset_refs = set(script_srcs)
          asset_refs.update(
              re.findall(
                  r'<link[^>]+rel="modulepreload"[^>]+href="([^"]+[.]js)"',
                  raw,
                  flags=re.I,
              )
          )
          if (DISC / "school-jotter-main.js").exists():
              main_text = (DISC / "school-jotter-main.js").read_text(encoding="utf-8")
              asset_refs.update(
                  re.findall(r'from"[.]/([^"]+[.]js)"', main_text)
              )
              asset_refs.update(
                  re.findall(r'import\("[.]/([^"]+[.]js)"\)', main_text)
              )
          chunk_findings = []
          api_base_candidates = set()
          total_js_bytes = 0
          for asset_ref in sorted(asset_refs):
              asset_name = asset_ref.rsplit("/", 1)[-1]
              if not re.fullmatch(r"[A-Za-z0-9._-]+[.]js", asset_name):
                  continue
              asset_url = requests.compat.urljoin(document_base, asset_ref)
              asset_response = session.get(asset_url, timeout=30)
              if not asset_response.ok:
                  chunk_findings.append({
                      "asset": asset_name,
                      "url": asset_url,
                      "status": asset_response.status_code,
                  })
                  continue
              total_js_bytes += len(asset_response.content)
              if total_js_bytes > 10_000_000:
                  raise SystemExit("frontend diagnostics exceeded 10 MB JS ceiling")
              (js_dir / asset_name).write_bytes(asset_response.content)
              text_body = asset_response.text
              api_base_candidates.update(
                  re.findall(
                      r'ApiConnectorConfig:\{DB_URL:"(https://[^"]+)"',
                      text_body,
                  )
              )
              contexts = []
              for needle in [
                  "DB_URL",
                  "DB_URL_VPC",
                  "ApiConnectorConfig",
                  "/api/resources",
                  "resource_lists",
                  "full_tenant_domain_entities",
              ]:
                  pos = text_body.find(needle)
                  if pos >= 0:
                      contexts.append(text_body[max(0, pos - 500): pos + 1200])
              if contexts:
                  chunk_findings.append({
                      "asset": asset_name,
                      "url": asset_url,
                      "status": asset_response.status_code,
                      "contexts": contexts,
                  })
          (DISC / "frontend-api-config-candidates.json").write_text(
              json.dumps(chunk_findings, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if len(api_base_candidates) != 1:
              raise SystemExit(
                  f"public API base is not uniquely grounded: {sorted(api_base_candidates)}"
              )
          api_base = next(iter(api_base_candidates)).rstrip("/")

          tenant_match = re.search(
              r'"TENANT_DOMAIN":\{"id":"([^"]+)"',
              raw,
          )
          if not tenant_match:
              raise SystemExit("TENANT_DOMAIN.id missing from public hydration state")
          tenant_id = tenant_match.group(1)
          (DISC / "frontend-public-api.json").write_text(
              json.dumps(
                  {
                      "api_base": api_base,
                      "tenant_id": tenant_id,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          found = {}
          for public_name, spec in specs.items():
              needle = '"name":"' + public_name + '"'
              idx = raw.find(needle)
              if idx < 0:
                  raise SystemExit(f"{public_name}: not present in hydration state")

              window = raw[max(0, idx - 600): min(len(raw), idx + 14000)]

              resource_match = re.search(
                  r'\{"id":"([^"]+)","file":\{"id":"([^"]+)","name":"'
                  + re.escape(public_name)
                  + r'"',
                  window,
              )
              if not resource_match:
                  raise SystemExit(f"{public_name}: resource/file ids not found")
              resource_id, file_id = resource_match.groups()
              if file_id != spec["expected_id"]:
                  raise SystemExit(
                      f"{public_name}: file id drift {file_id} != {spec['expected_id']}"
                  )

              size_match = re.search(
                  r'"name":"' + re.escape(public_name) + r'".*?"size":(\d+)',
                  window,
                  flags=re.S,
              )
              if not size_match:
                  raise SystemExit(f"{public_name}: declared size missing")
              declared_size = int(size_match.group(1))
              if declared_size != spec["size"]:
                  raise SystemExit(
                      f"{public_name}: declared size drift {declared_size} != {spec['size']}"
                  )

              origin_match = re.search(
                  r'"url":\{"origin":"((?:\\.|[^"\\])*)"',
                  window,
                  flags=re.S,
              )
              if not origin_match:
                  raise SystemExit(f"{public_name}: signed origin URL missing")
              hydration_origin = json.loads('"' + origin_match.group(1) + '"')
              origin = hydration_origin

              # Public UI resource refresh. The shipped client explicitly admits
              # /api/resources/{id}; use it only to refresh the ephemeral origin.
              # Immutable file identity/size/SHA gates below remain authoritative.
              resource_url = f"{api_base}/resources/{resource_id}"
              api_response = session.get(
                  resource_url,
                  timeout=30,
                  headers={
                      "Accept": "application/json",
                      "X-Tenant": tenant_id,
                  },
              )
              api_diag = {
                  "public_name": public_name,
                  "resource_id": resource_id,
                  "file_id": file_id,
                  "resource_url": resource_url,
                  "status": api_response.status_code,
              }
              if api_response.ok:
                  try:
                      api_payload = api_response.json()
                  except ValueError:
                      api_payload = None

                  def find_file(node):
                      if isinstance(node, dict):
                          if (
                              node.get("id") == file_id
                              and node.get("name") == public_name
                              and isinstance(node.get("url"), dict)
                              and isinstance(node["url"].get("origin"), str)
                          ):
                              return node
                          for value in node.values():
                              found_node = find_file(value)
                              if found_node is not None:
                                  return found_node
                      elif isinstance(node, list):
                          for value in node:
                              found_node = find_file(value)
                              if found_node is not None:
                                  return found_node
                      return None

                  refreshed_file = find_file(api_payload)
                  if refreshed_file is not None:
                      refreshed_size = refreshed_file.get("size")
                      if refreshed_size != spec["size"]:
                          raise SystemExit(
                              f"{public_name}: refreshed size drift "
                              f"{refreshed_size} != {spec['size']}"
                          )
                      origin = refreshed_file["url"]["origin"]
                      api_diag["refreshed_origin"] = True
                  else:
                      api_diag["refreshed_origin"] = False
              else:
                  api_diag["refreshed_origin"] = False

              (DISC / f"{spec['artifact_name']}.resource-api.json").write_text(
                  json.dumps(api_diag, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

              print(
                  f"{public_name}: resource={resource_id} id={file_id} "
                  f"declared_size={declared_size} "
                  f"resource_api={api_response.status_code} "
                  f"origin_host={requests.utils.urlparse(origin).hostname}"
              )

              target = EXACT / spec["artifact_name"]
              h = hashlib.sha256()
              size = 0
              with session.get(origin, timeout=(10, 90), stream=True) as download:
                  download.raise_for_status()
                  with target.open("wb") as out:
                      for chunk in download.iter_content(1024 * 1024):
                          if not chunk:
                              continue
                          size += len(chunk)
                          if size > spec["size"]:
                              raise SystemExit(f"{public_name}: download exceeded expected size")
                          h.update(chunk)
                          out.write(chunk)

              digest = h.hexdigest()
              if size != spec["size"]:
                  raise SystemExit(f"{public_name}: size {size} != {spec['size']}")
              if digest != spec["sha256"]:
                  raise SystemExit(f"{public_name}: sha256 {digest} != {spec['sha256']}")

              found[public_name] = {
                  "file_id": file_id,
                  "size": size,
                  "sha256": digest,
                  "artifact_file": target.name,
                  "source_page": PAGE,
              }
              print(f"VERIFIED {public_name}: size={size} sha256={digest}")

          (EXACT / "manifest.json").write_text(
              json.dumps(
                  {
                      "schema": "chaptera.carlton-exact-pub-inputs.v2",
                      "source_page": PAGE,
                      "files": found,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c %s out/carlton/exact/March-2026.pub)" = "9580032"
          test "$(sha256sum out/carlton/exact/March-2026.pub | awk '{print $1}')" = "bf9cda0f632b5820ab9dbdbe1b838b2a988b2f3fdd69253c22b4fc3aef9f11c3"
          test "$(stat -c %s out/carlton/exact/December-2025.pub)" = "9988608"
          test "$(sha256sum out/carlton/exact/December-2025.pub | awk '{print $1}')" = "41786e9ee564dfc3d10864a49c9e58af5e1689d31479ef0c478ffb79da16f79e"

      - name: Extract root Contents and Quill Contents separately
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import olefile

          root = Path("out/carlton/exact")
          for pub in [root / "March-2026.pub", root / "December-2025.pub"]:
              label = pub.stem
              with olefile.OleFileIO(str(pub)) as ole:
                  stream_paths = ole.listdir(streams=True, storages=False)
                  manifest = {
                      "source_file": pub.name,
                      "streams": ["/".join(parts) for parts in stream_paths],
                      "contents": [],
                  }
                  for parts in stream_paths:
                      if parts[-1].lower() != "contents":
                          continue
                      data = ole.openstream(parts).read()
                      ole_path = "/".join(parts)
                      if parts == ["Contents"]:
                          artifact_name = f"{label}-Main-Contents.bin"
                      else:
                          safe = "-".join(parts).replace(" ", "_")
                          artifact_name = f"{label}-{safe}.bin"
                      out = root / artifact_name
                      out.write_bytes(data)
                      manifest["contents"].append({
                          "ole_path": ole_path,
                          "size": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "artifact_file": artifact_name,
                      })
                  if not any(x["ole_path"] == "Contents" for x in manifest["contents"]):
                      raise SystemExit(f"{pub}: root Contents stream missing")
                  (root / f"{label}-cfb-manifest.json").write_text(
                      json.dumps(manifest, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
                  print(pub.name, manifest["contents"])
          PY

      - name: Extract PlcCmob through trailer directory and OplDocq locator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          root = Path("out/carlton/exact")
          expected = {
              "March-2026": {
                  "raw_size": 232,
                  "row_count": 9,
                  "rows": [
                      (1, 218, 319),
                      (5, 216, 344),
                      (6, 120, 343),
                      (7, 49, 441),
                      (9, 49, 446),
                      (12, 49, 453),
                      (13, 49, 462),
                      (15, 49, 470),
                      (16, 49, 471),
                  ],
              },
              "December-2025": {
                  "raw_size": 520,
                  "row_count": 21,
                  "rows": [
                      (1, 218, 319),
                      (2, 218, 323),
                      (3, 139, 315),
                      (4, 139, 316),
                      (5, 170, 423),
                      (6, 120, 343),
                      (7, 49, 441),
                      (9, 49, 446),
                      (11, 192, 366),
                      (12, 49, 453),
                      (13, 49, 462),
                      (15, 49, 470),
                      (16, 49, 471),
                      (35, 170, 431),
                      (36, 170, 448),
                      (37, 170, 454),
                      (42, 170, 468),
                      (46, 170, 457),
                      (47, 170, 461),
                      (51, 170, 467),
                      (52, 170, 469),
                  ],
              },
          }

          def u16(data, off):
              if off + 2 > len(data):
                  raise ValueError(f"u16 out of bounds at {off}")
              return struct.unpack_from("<H", data, off)[0]

          def u32(data, off):
              if off + 4 > len(data):
                  raise ValueError(f"u32 out of bounds at {off}")
              return struct.unpack_from("<I", data, off)[0]

          def parse_reference_fields(payload):
              fields = []
              p = 0
              while p < len(payload):
                  if p + 2 > len(payload):
                      raise ValueError("truncated directory reference field")
                  field_id = payload[p]
                  wire = payload[p + 1]
                  p += 2
                  if wire in (0x08, 0x78):
                      value = None
                  elif wire in (0x10, 0x18):
                      value = u16(payload, p)
                      p += 2
                  elif wire in (0x20, 0x68, 0x70, 0xB8):
                      value = u32(payload, p)
                      p += 4
                  else:
                      raise ValueError(f"unsupported directory reference wire 0x{wire:02x}")
                  fields.append((field_id, wire, value))
              return fields

          def parse_directory(data):
              if data[:4] != b"\xe8\xac\x2c\x00":
                  raise ValueError("not mature 0x2C Contents")
              trailer_offset = u32(data, 0x1A)
              p = trailer_offset
              trailer_length = u32(data, p)
              trailer_end = p + trailer_length
              if trailer_end > len(data):
                  raise ValueError("trailer out of bounds")
              p += 4
              if data[p:p+2] != b"\x01\x20":
                  raise ValueError("trailer slot-count root mismatch")
              slot_count = u32(data, p + 2)
              p += 6
              if data[p:p+2] != b"\x02\x20":
                  raise ValueError("trailer max-ordinal root mismatch")
              max_ordinal = u32(data, p + 2)
              p += 6
              if data[p:p+2] != b"\x03\x90":
                  raise ValueError("trailer directory root mismatch")
              directory_declared = u32(data, p + 2)
              directory_start = p + 6
              directory_end = directory_start + directory_declared - 4
              if directory_end != trailer_end:
                  raise ValueError("directory does not fill admitted trailer")
              if max_ordinal + 1 != slot_count:
                  raise ValueError("slot-count/max-ordinal mismatch")

              refs = {}
              p = directory_start
              for seq_num in range(slot_count):
                  if data[p] != 0:
                      raise ValueError(f"directory slot {seq_num}: id != 0")
                  wire = data[p + 1]
                  if wire == 0x78:
                      refs[seq_num] = {
                          "seq_num": seq_num,
                          "empty": True,
                          "raw_types": [],
                          "chunk_offsets": [],
                          "parent_seq_nums": [],
                      }
                      p += 2
                      continue
                  if wire != 0x88:
                      raise ValueError(
                          f"directory slot {seq_num}: wire 0x{wire:02x} != 0x88"
                      )
                  declared = u32(data, p + 2)
                  payload_start = p + 6
                  payload_end = p + 2 + declared
                  if payload_end > directory_end:
                      raise ValueError(f"directory slot {seq_num}: out of bounds")
                  fields = parse_reference_fields(data[payload_start:payload_end])
                  refs[seq_num] = {
                      "seq_num": seq_num,
                      "empty": False,
                      "raw_types": [
                          value for field_id, field_wire, value in fields
                          if field_id == 0x02 and field_wire == 0x18
                      ],
                      "chunk_offsets": [
                          value for field_id, field_wire, value in fields
                          if field_id == 0x04 and field_wire == 0xB8
                      ],
                      "parent_seq_nums": [
                          value for field_id, field_wire, value in fields
                          if field_id == 0x05 and field_wire == 0x68
                      ],
                  }
                  p = payload_end
              if p != directory_end:
                  raise ValueError("directory parse did not end at boundary")
              return refs

          def unique_ref_by_raw_type(refs, raw_type):
              matches = [
                  ref for ref in refs.values()
                  if ref.get("raw_types") == [raw_type]
              ]
              if len(matches) != 1:
                  raise ValueError(
                      f"raw type 0x{raw_type:02x}: expected one reference, got {len(matches)}"
                  )
              return matches[0]

          def chunk_for_ref(data, ref):
              offsets = ref["chunk_offsets"]
              if len(offsets) != 1:
                  raise ValueError(
                      f"seq {ref['seq_num']}: expected one chunk offset, got {offsets}"
                  )
              off = offsets[0]
              declared = u32(data, off)
              end = off + declared
              if declared < 4 or end > len(data):
                  raise ValueError(f"seq {ref['seq_num']}: invalid chunk length {declared}")
              return off, data[off:end]

          def find_u32_field_before_unknown(chunk, field_id, expected_wire):
              p = 4
              matches = []
              while p < len(chunk):
                  if p + 2 > len(chunk):
                      raise ValueError("truncated chunk field")
                  current_id = chunk[p]
                  wire = chunk[p + 1]
                  p += 2
                  if wire in (0x08, 0x78):
                      value = None
                  elif wire in (0x10, 0x18):
                      value = u16(chunk, p)
                      p += 2
                  elif wire in (0x20, 0x68, 0x70, 0xB8):
                      value = u32(chunk, p)
                      p += 4
                  elif wire == 0x28:
                      p += 8
                      value = None
                  elif wire == 0x38:
                      p += 16
                      value = None
                  elif wire in (0x88, 0x90, 0xA0):
                      declared = u32(chunk, p)
                      if declared < 4:
                          raise ValueError("invalid nested container length")
                      p += declared
                      value = None
                  else:
                      break
                  if current_id == field_id:
                      if wire != expected_wire:
                          raise ValueError(
                              f"field 0x{field_id:02x}: wire 0x{wire:02x} != 0x{expected_wire:02x}"
                          )
                      matches.append(value)
              if len(matches) != 1:
                  raise ValueError(
                      f"field 0x{field_id:02x}/0x{expected_wire:02x}: expected one, got {matches}"
                  )
              return matches[0]

          def optional_u32_field_before_unknown(chunk, field_id, expected_wire):
              p = 4
              matches = []
              while p < len(chunk):
                  if p + 2 > len(chunk):
                      raise ValueError("truncated chunk field")
                  current_id = chunk[p]
                  wire = chunk[p + 1]
                  p += 2
                  if wire in (0x08, 0x78):
                      value = None
                  elif wire in (0x10, 0x18):
                      value = u16(chunk, p)
                      p += 2
                  elif wire in (0x20, 0x68, 0x70, 0xB8):
                      value = u32(chunk, p)
                      p += 4
                  elif wire == 0x28:
                      p += 8
                      value = None
                  elif wire == 0x38:
                      p += 16
                      value = None
                  elif wire in (0x88, 0x90, 0xA0):
                      declared = u32(chunk, p)
                      if declared < 4:
                          raise ValueError("invalid nested container length")
                      p += declared
                      value = None
                  else:
                      break
                  if current_id == field_id:
                      if wire != expected_wire:
                          raise ValueError(
                              f"field 0x{field_id:02x}: wire 0x{wire:02x} != 0x{expected_wire:02x}"
                          )
                      matches.append(value)
              if len(matches) > 1:
                  raise ValueError(
                      f"field 0x{field_id:02x}/0x{expected_wire:02x}: duplicate values {matches}"
                  )
              return matches[0] if matches else None

          def parse_plccmob(chunk):
              if u32(chunk, 0) != len(chunk):
                  raise ValueError("PlcCmob chunk envelope length mismatch")
              if chunk[4:6] != b"\x01\x20":
                  raise ValueError("PlcCmob count wire mismatch")
              count = u32(chunk, 6)
              if chunk[10:12] != b"\x02\xa0":
                  raise ValueError("PlcCmob array wire mismatch")
              if u32(chunk, 12) != len(chunk) - 12:
                  raise ValueError("PlcCmob array length mismatch")
              if len(chunk) != 16 + 24 * count:
                  raise ValueError("PlcCmob size/count law mismatch")
              rows = []
              for source_order in range(count):
                  p = 16 + 24 * source_order
                  if chunk[p:p+2] != b"\x00\x88" or u32(chunk, p + 2) != 22:
                      raise ValueError(f"PlcCmob row {source_order}: envelope mismatch")
                  if chunk[p+6:p+8] != b"\x01\x20":
                      raise ValueError(f"PlcCmob row {source_order}: CmoId wire mismatch")
                  if chunk[p+12:p+14] != b"\x02\x20":
                      raise ValueError(f"PlcCmob row {source_order}: Qsid wire mismatch")
                  if chunk[p+18:p+20] != b"\x03\x68":
                      raise ValueError(f"PlcCmob row {source_order}: Ohpo wire mismatch")
                  rows.append((
                      u32(chunk, p + 8),
                      u32(chunk, p + 14),
                      u32(chunk, p + 20),
                  ))
              return rows

          receipts = {}
          for label, spec in expected.items():
              data = (root / f"{label}-Main-Contents.bin").read_bytes()
              refs = parse_directory(data)

              docq = unique_ref_by_raw_type(refs, 0x5B)
              docq_offset, docq_chunk = chunk_for_ref(data, docq)
              plccmob_seq = find_u32_field_before_unknown(docq_chunk, 0x05, 0x70)
              if plccmob_seq not in refs:
                  raise ValueError(f"{label}: OplDocq field0x05 points outside directory")

              plccmob_ref = refs[plccmob_seq]
              if plccmob_ref["raw_types"] != [0x70]:
                  raise ValueError(
                      f"{label}: OplDocq field0x05 target raw type is {plccmob_ref['raw_types']}"
                  )
              if plccmob_ref["parent_seq_nums"] != [docq["seq_num"]]:
                  raise ValueError(
                      f"{label}: PlcCmob parent {plccmob_ref['parent_seq_nums']} != Docq {docq['seq_num']}"
                  )

              plccmob_offset, plccmob_chunk = chunk_for_ref(data, plccmob_ref)
              rows = parse_plccmob(plccmob_chunk)
              if len(plccmob_chunk) != spec["raw_size"]:
                  raise ValueError(
                      f"{label}: PlcCmob size {len(plccmob_chunk)} != {spec['raw_size']}"
                  )
              if len(rows) != spec["row_count"]:
                  raise ValueError(
                      f"{label}: PlcCmob rows {len(rows)} != {spec['row_count']}"
                  )
              if rows != spec["rows"]:
                  raise ValueError(f"{label}: PlcCmob row map drift: {rows}")

              carrier_checks = []
              for cmo_id, target_qsid, carrier_ohpo in rows:
                  if carrier_ohpo not in refs:
                      raise ValueError(f"{label}: unresolved carrier Ohpo {carrier_ohpo}")
                  carrier_ref = refs[carrier_ohpo]
                  if carrier_ref["raw_types"] != [0x01]:
                      raise ValueError(
                          f"{label}: carrier {carrier_ohpo} raw type {carrier_ref['raw_types']} != 0x01"
                      )
                  if carrier_ref["parent_seq_nums"] != [279]:
                      raise ValueError(
                          f"{label}: carrier {carrier_ohpo} parent {carrier_ref['parent_seq_nums']} != 279"
                      )
                  carrier_offset, carrier_chunk = chunk_for_ref(data, carrier_ref)
                  carrier_cmo_id = find_u32_field_before_unknown(
                      carrier_chunk, 0x0F, 0x20
                  )
                  if carrier_cmo_id != cmo_id:
                      raise ValueError(
                          f"{label}: carrier {carrier_ohpo} CmoID {carrier_cmo_id} != row {cmo_id}"
                      )
                  carrier_story_qsid = optional_u32_field_before_unknown(
                      carrier_chunk, 0x27, 0x20
                  )
                  carrier_checks.append({
                      "carrier_ohpo": carrier_ohpo,
                      "carrier_cmo_id": carrier_cmo_id,
                      "carrier_story_qsid": carrier_story_qsid,
                      "parent_seq_num": 279,
                      "chunk_offset": carrier_offset,
                  })

              raw_path = root / f"{label}-PlcCmob.bin"
              raw_path.write_bytes(plccmob_chunk)

              receipts[label] = {
                  "source_file": f"{label}.pub",
                  "opldocq": {
                      "seq_num": docq["seq_num"],
                      "raw_type": 0x5B,
                      "chunk_offset": docq_offset,
                      "field0x05_wire": 0x70,
                      "plccmob_seq_num": plccmob_seq,
                  },
                  "plccmob": {
                      "seq_num": plccmob_seq,
                      "raw_type": 0x70,
                      "chunk_offset": plccmob_offset,
                      "raw_size": len(plccmob_chunk),
                      "row_count": len(rows),
                      "rows": [
                          {
                              "source_order": i,
                              "cmo_id": cmo_id,
                              "target_qsid": target_qsid,
                              "carrier_ohpo": carrier_ohpo,
                          }
                          for i, (cmo_id, target_qsid, carrier_ohpo) in enumerate(rows)
                      ],
                  },
                  "carrier_checks": carrier_checks,
              }
              print(
                  f"{label}: Docq seq={docq['seq_num']} -> PlcCmob seq={plccmob_seq}, "
                  f"size={len(plccmob_chunk)}, rows={len(rows)}, carriers=PASS"
              )

          (root / "plccmob-runtime-extraction.json").write_text(
              json.dumps(
                  {
                      "schema": "chaptera.plccmob-runtime-extraction.v1",
                      "receipts": receipts,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate target Story markers and source frame resolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import json
          import struct
          from pathlib import Path

          root = Path("out/carlton/exact")
          extraction = json.loads(
              (root / "plccmob-runtime-extraction.json").read_text()
          )

          def u16(data, off):
              if off + 2 > len(data):
                  raise ValueError(f"u16 out of bounds at {off}")
              return struct.unpack_from("<H", data, off)[0]

          def u32(data, off):
              if off + 4 > len(data):
                  raise ValueError(f"u32 out of bounds at {off}")
              return struct.unpack_from("<I", data, off)[0]

          def quill_marker_index(data):
              descriptors = []
              current = 0x18
              seen = set()
              while current != 0xFFFF_FFFF:
                  if current in seen or current >= len(data):
                      raise ValueError("invalid Quill descriptor chain")
                  seen.add(current)
                  count = u16(data, current + 2)
                  next_offset = u32(data, current + 4)
                  p = current + 8
                  for _ in range(count):
                      if u16(data, p) != 0x0018:
                          raise ValueError("invalid Quill descriptor presence marker")
                      name = data[p + 2:p + 6]
                      descriptors.append({
                          "name": name,
                          "option_a": u16(data, p + 6),
                          "offset": u32(data, p + 16),
                          "length": u32(data, p + 20),
                      })
                      p += 24
                  current = next_offset

              def unique(name):
                  matches = [item for item in descriptors if item["name"] == name]
                  if len(matches) != 1:
                      raise ValueError(
                          f"Quill descriptor {name!r}: expected one, got {len(matches)}"
                      )
                  return matches[0]

              syid = unique(b"SYID")
              strs = unique(b"STRS")
              text = unique(b"TEXT")

              syid_count = u32(data, syid["offset"] + 4)
              story_ids = [
                  u32(data, syid["offset"] + 8 + 4 * i)
                  for i in range(syid_count)
              ]

              strs_count = u32(data, strs["offset"])
              if strs_count != syid_count:
                  raise ValueError("Quill SYID/STRS count mismatch")
              service_span = u32(data, strs["offset"] + 4)
              lengths_start = strs["offset"] + 4 + service_span
              lengths = [
                  u32(data, lengths_start + 4 * i)
                  for i in range(strs_count)
              ]
              if sum(lengths) * 2 != text["length"]:
                  raise ValueError("Quill TEXT length mismatch")

              p = text["offset"]
              stories = {}
              for index, (story_id, code_units) in enumerate(zip(story_ids, lengths)):
                  byte_len = 2 * code_units
                  raw = data[p:p + byte_len]
                  if len(raw) != byte_len:
                      raise ValueError("Quill Story out of bounds")
                  marker_count = sum(
                      1
                      for off in range(0, len(raw), 2)
                      if raw[off:off + 2] == b"\xfc\xff"
                  )
                  stories[story_id] = {
                      "story_index": index,
                      "utf16_code_units": code_units,
                      "object_marker_count": marker_count,
                  }
                  p += byte_len
              return stories

          def directory_refs(data):
              trailer = u32(data, 0x1A)
              p = trailer + 4
              if data[p:p + 2] != b"\x01\x20":
                  raise ValueError("bad Contents trailer")
              slot_count = u32(data, p + 2)
              p += 12
              if data[p:p + 2] != b"\x03\x90":
                  raise ValueError("bad Contents directory root")
              directory_len = u32(data, p + 2)
              p += 6
              directory_end = p + directory_len - 4
              refs = {}
              for seq_num in range(slot_count):
                  if data[p] != 0:
                      raise ValueError("bad directory slot id")
                  wire = data[p + 1]
                  if wire == 0x78:
                      refs[seq_num] = {
                          "raw_types": [],
                          "chunk_offsets": [],
                          "parent_seq_nums": [],
                      }
                      p += 2
                      continue
                  if wire != 0x88:
                      raise ValueError("bad directory slot wire")
                  declared = u32(data, p + 2)
                  payload = data[p + 6:p + 2 + declared]
                  q = 0
                  fields = []
                  while q < len(payload):
                      field_id = payload[q]
                      field_wire = payload[q + 1]
                      q += 2
                      if field_wire in (0x08, 0x78):
                          value = None
                      elif field_wire in (0x10, 0x18):
                          value = u16(payload, q)
                          q += 2
                      elif field_wire in (0x20, 0x68, 0x70, 0xB8):
                          value = u32(payload, q)
                          q += 4
                      else:
                          raise ValueError(
                              f"unsupported directory field wire 0x{field_wire:02x}"
                          )
                      fields.append((field_id, field_wire, value))
                  refs[seq_num] = {
                      "raw_types": [
                          value for field_id, field_wire, value in fields
                          if field_id == 0x02 and field_wire == 0x18
                      ],
                      "chunk_offsets": [
                          value for field_id, field_wire, value in fields
                          if field_id == 0x04 and field_wire == 0xB8
                      ],
                      "parent_seq_nums": [
                          value for field_id, field_wire, value in fields
                          if field_id == 0x05 and field_wire == 0x68
                      ],
                  }
                  p += 2 + declared
              if p != directory_end:
                  raise ValueError("directory boundary mismatch")
              return refs

          def top_level_scalar_fields(chunk):
              p = 4
              fields = []
              while p < len(chunk):
                  if p + 2 > len(chunk):
                      raise ValueError("truncated chunk field")
                  field_id = chunk[p]
                  wire = chunk[p + 1]
                  p += 2
                  if wire in (0x08, 0x78):
                      value = None
                  elif wire in (0x10, 0x18):
                      value = u16(chunk, p)
                      p += 2
                  elif wire in (0x20, 0x68, 0x70, 0xB8):
                      value = u32(chunk, p)
                      p += 4
                  elif wire == 0x28:
                      p += 8
                      value = None
                  elif wire == 0x38:
                      p += 16
                      value = None
                  elif wire in (0x88, 0x90, 0xA0):
                      declared = u32(chunk, p)
                      if declared < 4:
                          raise ValueError("invalid nested container")
                      p += declared
                      value = None
                  else:
                      break
                  fields.append((field_id, wire, value))
              return fields

          target_receipts = {}
          for label, receipt in extraction["receipts"].items():
              quill = (root / f"{label}-Quill-QuillSub-CONTENTS.bin").read_bytes()
              stories = quill_marker_index(quill)
              contents = (root / f"{label}-Main-Contents.bin").read_bytes()
              refs = directory_refs(contents)

              frames_by_qsid = collections.defaultdict(list)
              for seq_num, ref in refs.items():
                  if ref["raw_types"] != [0x01] or len(ref["chunk_offsets"]) != 1:
                      continue
                  off = ref["chunk_offsets"][0]
                  declared = u32(contents, off)
                  chunk = contents[off:off + declared]
                  fields = top_level_scalar_fields(chunk)
                  qsid_values = [
                      value
                      for field_id, wire, value in fields
                      if field_id == 0x27 and wire == 0x20
                  ]
                  if len(qsid_values) > 1:
                      raise ValueError(f"{label}: shape {seq_num} has duplicate field0x27")
                  if not qsid_values:
                      continue
                  frame_ordinals = [
                      value
                      for field_id, wire, value in fields
                      if field_id == 0x28 and wire == 0x20
                  ]
                  frames_by_qsid[qsid_values[0]].append({
                      "frame_seq_num": seq_num,
                      "parent_seq_nums": ref["parent_seq_nums"],
                      "frame_ordinal": frame_ordinals[0] if len(frame_ordinals) == 1 else None,
                  })

              relation_counts = collections.Counter(
                  row["target_qsid"] for row in receipt["plccmob"]["rows"]
              )
              checks = {}
              for qsid, relation_count in sorted(relation_counts.items()):
                  if qsid not in stories:
                      raise ValueError(f"{label}: target Qsid {qsid} missing from Quill SYID")
                  story = stories[qsid]
                  if story["object_marker_count"] != relation_count:
                      raise ValueError(
                          f"{label}: Qsid {qsid} relations={relation_count} "
                          f"markers={story['object_marker_count']}"
                      )
                  frames = frames_by_qsid.get(qsid, [])
                  if not frames:
                      raise ValueError(f"{label}: Qsid {qsid} has no source frame shape")
                  checks[str(qsid)] = {
                      "relation_count": relation_count,
                      "quill_story_index": story["story_index"],
                      "quill_utf16_code_units": story["utf16_code_units"],
                      "object_marker_count": story["object_marker_count"],
                      "source_frames": frames,
                  }
                  print(
                      f"{label}: Qsid {qsid} relations={relation_count} "
                      f"markers={story['object_marker_count']} frames={len(frames)} PASS"
                  )

              target_receipts[label] = checks

          (root / "plccmob-target-cardinality.json").write_text(
              json.dumps(
                  {
                      "schema": "chaptera.plccmob-target-cardinality.v1",
                      "targets": target_receipts,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build exact canonical PlcCmob projection contexts
