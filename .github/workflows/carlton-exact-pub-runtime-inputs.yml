name: Carlton exact PUB runtime inputs

on:
  pull_request:
    paths:
      - ".github/workflows/carlton-exact-pub-runtime-inputs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded acquisition dependencies
        run: python -m pip install "requests==2.32.5" "olefile==0.47"

      - name: Acquire exact Carlton March and December PUBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/carlton/exact out/carlton/discovery
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import shutil
          import tempfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import unquote

          import requests

          PAGE = "https://www.carltonji.org.uk/parents/latest-letters"
          OUT = Path("out/carlton")
          EXACT = OUT / "exact"
          DISC = OUT / "discovery"
          EXACT.mkdir(parents=True, exist_ok=True)
          DISC.mkdir(parents=True, exist_ok=True)

          expected = {
              "march": {
                  "sha256": "bf9cda0f632b5820ab9dbdbe1b838b2a988b2f3fdd69253c22b4fc3aef9f11c3",
                  "size": 9_580_032,
                  "filename": "March-2026.pub",
              },
              "december": {
                  "sha256": "41786e9ee564dfc3d10864a49c9e58af5e1689d31479ef0c478ffb79da16f79e",
                  "size": 9_988_608,
                  "filename": "December-2025.pub",
              },
          }

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; Chaptera-Carlton-Acquisition/1.1)",
              "Accept": "*/*",
          })

          page = session.get(PAGE, timeout=30)
          page.raise_for_status()
          raw_html = page.text
          (DISC / "latest-letters.html").write_text(raw_html, encoding="utf-8")
          decoded = unquote(html.unescape(raw_html).replace("\\/", "/"))

          for needle in ("March 2026.pub", "December 2025.pub"):
              pos = decoded.find(needle)
              if pos >= 0:
                  lo = max(0, pos - 1200)
                  hi = min(len(decoded), pos + 1200)
                  print(f"CONTEXT {needle}:")
                  print(decoded[lo:hi].replace("\n", " ")[:2400])

          candidates: set[str] = {
              # Proven in historical PR #51.
              "https://sj3-bucket-media.s3.eu-west-1.amazonaws.com/5a/5a939344-76a6-4a6a-b30b-7237edac8bfa",
              "https://docs-cdn.schooljotter3.com/1fd359a4-cb4e-412d-81a1-79f36166cafc/5a939344-76a6-4a6a-b30b-7237edac8bfa/5a939344-76a6-4a6a-b30b-7237edac8bfa.pub",
              "https://docs-cdn.schooljotter3.com/1fd359a4-cb4e-412d-81a1-79f36166cafc/5a939344-76a6-4a6a-b30b-7237edac8bfa/March%202026.pub",
          }

          for match in re.findall(r"https?://[^\s\"'<>]+", decoded):
              clean = match.rstrip("),]}.;")
              if (
                  "schooljotter" in clean.lower()
                  or "sj3-bucket-media" in clean.lower()
                  or clean.lower().endswith(".pub")
              ):
                  candidates.add(clean)

          uuids = sorted(set(re.findall(
              r"\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b",
              decoded,
          )))
          known_site = "1fd359a4-cb4e-412d-81a1-79f36166cafc"
          for value in uuids:
              u = value.lower()
              candidates.add(f"https://sj3-bucket-media.s3.eu-west-1.amazonaws.com/{u[:2]}/{u}")
              candidates.add(f"https://sj3-bucket-media.s3.eu-west-1.amazonaws.com/{u[:2]}/{u}.pub")
              candidates.add(f"https://docs-cdn.schooljotter3.com/{known_site}/{u}/{u}.pub")
              candidates.add(f"https://docs-cdn.schooljotter3.com/{known_site}/{u}/March%202026.pub")
              candidates.add(f"https://docs-cdn.schooljotter3.com/{known_site}/{u}/December%202025.pub")

          candidate_list = sorted(candidates)
          (DISC / "candidate-urls.json").write_text(
              json.dumps(candidate_list, indent=2) + "\n", encoding="utf-8"
          )
          (DISC / "page-uuids.json").write_text(
              json.dumps(uuids, indent=2) + "\n", encoding="utf-8"
          )
          print(f"page_status={page.status_code} uuids={len(uuids)} candidates={len(candidate_list)}")
          print("UUIDS", json.dumps(uuids))

          def fetch(url: str):
              try:
                  with session.get(url, timeout=(8, 25), stream=True, allow_redirects=True) as resp:
                      if resp.status_code != 200:
                          return {"url": url, "status": resp.status_code}
                      length = resp.headers.get("content-length")
                      if length:
                          try:
                              n = int(length)
                          except ValueError:
                              n = None
                          if n is not None and n > 12_500_000:
                              return {"url": url, "status": 200, "skip": f"content-length={n}"}
                      fd, tmp_name = tempfile.mkstemp(prefix="carlton-", suffix=".candidate")
                      Path(tmp_name).unlink(missing_ok=True)
                      tmp = Path(tmp_name)
                      h = hashlib.sha256()
                      size = 0
                      with tmp.open("wb") as fh:
                          for chunk in resp.iter_content(1024 * 1024):
                              if not chunk:
                                  continue
                              size += len(chunk)
                              if size > 12_500_000:
                                  tmp.unlink(missing_ok=True)
                                  return {"url": url, "status": 200, "skip": "too-large"}
                              h.update(chunk)
                              fh.write(chunk)
                      return {
                          "url": url,
                          "status": 200,
                          "sha256": h.hexdigest(),
                          "size": size,
                          "tmp": str(tmp),
                          "final_url": resp.url,
                      }
              except Exception as exc:
                  return {"url": url, "error": f"{type(exc).__name__}: {exc}"}

          found: dict[str, dict] = {}
          observations: list[dict] = []
          with ThreadPoolExecutor(max_workers=24) as pool:
              futures = {pool.submit(fetch, url): url for url in candidate_list}
              for future in as_completed(futures):
                  result = future.result()
                  observations.append({k: v for k, v in result.items() if k != "tmp"})
                  sha = result.get("sha256")
                  size = result.get("size")
                  matched = False
                  if sha:
                      for key, spec in expected.items():
                          if key in found:
                              continue
                          if sha == spec["sha256"] and size == spec["size"]:
                              dest = EXACT / spec["filename"]
                              shutil.move(result["tmp"], dest)
                              found[key] = {
                                  "source_url": result.get("final_url") or result["url"],
                                  "requested_url": result["url"],
                                  "sha256": sha,
                                  "size": size,
                                  "path": str(dest),
                              }
                              print(f"FOUND {key}: size={size} sha={sha} url={found[key]['source_url']}")
                              matched = True
                              break
                  if not matched:
                      tmp = result.get("tmp")
                      if tmp:
                          Path(tmp).unlink(missing_ok=True)

          (DISC / "observations.json").write_text(
              json.dumps(observations, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (EXACT / "manifest.json").write_text(
              json.dumps(
                  {
                      "schema": "chaptera.carlton-exact-pub-inputs.v1",
                      "source_page": PAGE,
                      "expected": expected,
                      "found": found,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          missing = sorted(set(expected) - set(found))
          if missing:
              raise SystemExit(f"missing exact Carlton files: {missing}")
          PY

      - name: Verify exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c %s out/carlton/exact/March-2026.pub)" = "9580032"
          test "$(sha256sum out/carlton/exact/March-2026.pub | awk '{print $1}')" = "bf9cda0f632b5820ab9dbdbe1b838b2a988b2f3fdd69253c22b4fc3aef9f11c3"
          test "$(stat -c %s out/carlton/exact/December-2025.pub)" = "9988608"
          test "$(sha256sum out/carlton/exact/December-2025.pub | awk '{print $1}')" = "41786e9ee564dfc3d10864a49c9e58af5e1689d31479ef0c478ffb79da16f79e"

      - name: Extract CFB stream inventory and exact Contents streams
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import olefile

          root = Path("out/carlton/exact")
          for pub in [root / "March-2026.pub", root / "December-2025.pub"]:
              label = pub.stem
              with olefile.OleFileIO(str(pub)) as ole:
                  streams = ["/".join(parts) for parts in ole.listdir(streams=True, storages=False)]
                  manifest = {"source_file": pub.name, "streams": streams, "contents": []}
                  for parts in ole.listdir(streams=True, storages=False):
                      if parts[-1].lower() != "contents":
                          continue
                      data = ole.openstream(parts).read()
                      out = root / f"{label}-Contents.bin"
                      out.write_bytes(data)
                      manifest["contents"].append({
                          "ole_path": "/".join(parts),
                          "size": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "artifact_file": out.name,
                      })
                  (root / f"{label}-cfb-manifest.json").write_text(
                      json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
                  )
                  if not manifest["contents"]:
                      raise SystemExit(f"{pub}: no Contents stream")
                  print(pub.name, manifest["contents"])
          PY

      - name: Upload exact runtime inputs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: carlton-exact-pub-runtime-inputs
          path: |
            out/carlton/exact/March-2026.pub
            out/carlton/exact/December-2025.pub
            out/carlton/exact/*-Contents.bin
            out/carlton/exact/*-cfb-manifest.json
            out/carlton/exact/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload acquisition diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carlton-exact-acquisition-diagnostics
          path: |
            out/carlton/discovery/**
            out/carlton/exact/manifest.json
          if-no-files-found: warn
          retention-days: 1
