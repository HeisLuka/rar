      - name: Gate March 8-to-3 and December family control
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("out/carlton/exact")
          march = json.loads((root / "March-2026-presentation-manifest.json").read_text())
          december = json.loads((root / "December-2025-presentation-manifest.json").read_text())

          assert march["profile_id"] == "carlton-school-jotter/march-2026/v1"
          assert march["raw_page_count"] == 8
          assert march["customer_page_count"] == 3
          assert march["customer_page_seq_nums"] == [266, 361, 406]
          assert march["master_page_seq_nums"] == [263]
          assert march["carrier_page_seq_nums"] == [279]
          roles = {
              page["contents_seq_num"]: page["role"]
              for page in march["pages"]
          }
          assert roles == {
              263: "master",
              266: "customer",
              361: "customer",
              406: "customer",
              269: "internal_service",
              272: "internal_service",
              275: "internal_service",
              279: "carrier",
          }, roles
          assert all(
              edge["master_page_seq_num"] == 263
              for edge in march["customer_master_relations"]
          )
          assert march["invariants"] == {
              "exact_source_admission": True,
              "family_scoped_oid_rule": True,
              "canonical_source_graph_mutated": False,
              "canonical_page_ids_preserved": True,
              "carrier_pages_exposed_as_customer_pages": False,
              "master_pages_exposed_as_customer_pages": False,
          }

          assert december["profile_id"] == "carlton-school-jotter/december-2025/v1"
          assert december["customer_page_count"] == 5
          assert set(december["customer_page_seq_nums"]) == {266, 361, 406, 456, 493}
          assert december["master_page_seq_nums"] == [263]
          assert december["carrier_page_seq_nums"] == [279]
          assert all(
              page["role"] != "customer"
              for page in december["pages"]
              if page["contents_seq_num"] in {263, 279}
          )
          assert all(
              edge["master_page_seq_num"] == 263
              for edge in december["customer_master_relations"]
          )

          print(
              "CARLTON PRESENTATION PROFILE PASS "
              "March raw=8 customer=3 master=263 carrier=279; "
              "December customer=5 master=263 carrier=279"
          )
          PY

