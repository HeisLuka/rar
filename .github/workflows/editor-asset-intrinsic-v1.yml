name: Editor Asset Intrinsic V1

on:
  pull_request:
    paths:
      - "services/editor-api/image_asset_intrinsic_v1.py"
      - "services/editor-api/test_image_asset_intrinsic_v1.py"
      - ".github/workflows/editor-asset-intrinsic-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact PNG/JPEG intrinsic metadata tests
        working-directory: services/editor-api
        run: python -m unittest -v test_image_asset_intrinsic_v1
