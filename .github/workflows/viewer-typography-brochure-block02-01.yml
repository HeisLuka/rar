name: VIEWER-TYPOGRAPHY-BROCHURE-BLOCK02-01

on:
  push:
    branches:
      - viewer-typography-brochure-block02-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-block02-width:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROCHURE_BLOB: "00deec14dc6cff6d8a47b120d6d84e7e20c72166"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded read-only dependency
        run: python -m pip install "olefile==0.47"

      - name: Fetch pinned Apache POI SampleBrochure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .inputs out
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          blob = os.environ["BROCHURE_BLOB"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/apache/poi/git/blobs/{blob}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          if payload.get("sha") != blob or payload.get("encoding") != "base64":
              raise SystemExit("unexpected Git blob response")
          raw = base64.b64decode(payload["content"])
          if not raw.startswith(bytes.fromhex("d0cf11e0a1b11ae1")):
              raise SystemExit("not OLE/CFB")
          pathlib.Path(".inputs/SampleBrochure.pub").write_bytes(raw)
          PY

      - name: Enumerate exact type-0x02 physical width candidates
        run: |
          python tools/viewer-typography-brochure-block02/probe_block02.py             .inputs/SampleBrochure.pub             --output out/block02-probe.json

      - name: Publish discriminator
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          row = json.load(open("out/block02-probe.json", encoding="utf-8"))
          print("# VIEWER-TYPOGRAPHY-BROCHURE-BLOCK02-01")
          print()
          print(f"- FDPC styles: **{row['fdpc_style_count']}**")
          print(f"- valid widths in 0..64: **{row['valid_widths']}**")
          print(f"- unique width proven: **{row['unique_width_proven']}**")
          for candidate in row["valid_candidates"]:
              print(
                  f"- width {candidate['width']}: "
                  f"{candidate['occurrence_count']} occurrence(s), "
                  f"{candidate['styles_with_target']} style(s), "
                  f"offsets {[hex(value) for value in candidate['offsets']]}"
              )
          PY

      - name: Prove raw PUB is not retained
        shell: bash
        run: |
          set -euo pipefail
          if find out -type f \( -iname '*.pub' -o -iname '*.ole' \) | grep -q .; then
            echo "raw PUB/CFB leaked into retained output" >&2
            exit 1
          fi
          sha256sum out/*.json | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: viewer-typography-brochure-block02-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 90
