name: Editor Align Page V1

on:
  pull_request:
    paths:
      - "services/editor-api/align_page_ui_v1.py"
      - "services/editor-api/test_align_page_ui_v1.py"
      - ".github/workflows/editor-align-page-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run single-object RelativeToPage adapter tests
        working-directory: services/editor-api
        run: python -m unittest -v test_align_page_ui_v1
