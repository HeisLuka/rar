name: Authoring Table Cell Paint V1

on:
  pull_request:
    paths:
      - "crates/pub-model/**"
      - "crates/pub-paint-bridge/**"
      - "services/editor-api/revision_store.py"
      - "services/editor-api/test_table_cell_paint.py"
      - "packages/protocol/authoring-table-cell-paint/v1/**"
      - ".github/workflows/authoring-table-cell-paint-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RevisionKernel table cell paint tests
        working-directory: services/editor-api
        run: python -m unittest -v test_table_cell_paint
      - name: Validate protocol JSON
        run: |
          for file in packages/protocol/authoring-table-cell-paint/v1/*.json; do
            python -m json.tool "$file" >/dev/null
          done

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
