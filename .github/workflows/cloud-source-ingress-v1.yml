name: Cloud source ingress V1

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/source_ingress.rs"
      - "apps/chaptera-server/src/source_ingress_sqlite.rs"
      - "apps/chaptera-server/src/source_authority.rs"
      - "apps/chaptera-server/src/lib.rs"
      - "apps/chaptera-server/Cargo.toml"
      - "apps/chaptera-server/migrations/0001_source_ingress.sql"
      - ".github/workflows/cloud-source-ingress-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt
      - name: Check Chaptera server formatting
        run: cargo fmt -p chaptera-server -- --check
      - name: Run Chaptera server clippy
        run: cargo clippy -p chaptera-server --all-targets -- -D warnings
      - name: Run Chaptera server tests
        run: cargo test -p chaptera-server
