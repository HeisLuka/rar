name: Text Typing Format State V1

on:
  pull_request:
    paths:
      - "services/editor-api/text_typing_format_state_v1.py"
      - "services/editor-api/test_text_typing_format_state_v1.py"
      - "services/editor-api/text_selection_state_v1.py"
      - "services/editor-api/text_insert_format_v1.py"
      - "services/editor-api/text_format_overlay_v1.py"
      - ".github/workflows/text-typing-format-state-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run transient typing-format lifecycle tests
        working-directory: services/editor-api
        run: python -m unittest -v test_text_typing_format_state_v1
      - name: Regression selection and inserted-format contracts
        working-directory: services/editor-api
        run: python -m unittest -v test_text_selection_state_v1 test_text_insert_format_v1
