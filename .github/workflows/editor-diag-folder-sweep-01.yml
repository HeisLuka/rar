name: EDITOR-DIAG-FOLDER-SWEEP-01

on:
  push:
    branches:
      - editor-diag-folder-sweep-01
    paths-ignore:
      - ".ci/editor-diag-folder-sweep.status"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  editor-diagnostic-sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - id: fmt
        name: rustfmt
        continue-on-error: true
        shell: pwsh
        run: cargo fmt --all --check
      - id: check
        name: chaptera desktop check
        continue-on-error: true
        shell: pwsh
        run: cargo check -p chaptera-desktop --all-targets
      - id: tests
        name: chaptera desktop tests
        continue-on-error: true
        shell: pwsh
        run: cargo test -p chaptera-desktop
      - id: reader
        name: reader-only check
        continue-on-error: true
        shell: pwsh
        run: cargo check -p chaptera-desktop --features reader-only --all-targets
      - name: publish branch-readable validation result
        if: always()
        shell: pwsh
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          READER_OUTCOME: ${{ steps.reader.outcome }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force .ci | Out-Null
          @(
            "schema=editor-diag-folder-sweep-ci-v1"
            "head=$env:HEAD_SHA"
            "fmt=$env:FMT_OUTCOME"
            "check=$env:CHECK_OUTCOME"
            "tests=$env:TEST_OUTCOME"
            "reader=$env:READER_OUTCOME"
          ) | Set-Content -Encoding utf8 .ci/editor-diag-folder-sweep.status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/editor-diag-folder-sweep.status
          git commit -m "CI: record editor diagnostic sweep validation" --allow-empty
          git push origin HEAD:editor-diag-folder-sweep-01
          $failed = @(
            $env:FMT_OUTCOME,
            $env:CHECK_OUTCOME,
            $env:TEST_OUTCOME,
            $env:READER_OUTCOME
          ) -contains "failure"
          if ($failed) {
            exit 1
          }
