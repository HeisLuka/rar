name: Authoring paragraph alignment V1

on:
  pull_request:
    paths:
      - "packages/protocol/authoring-paragraph-align/**"
      - "services/editor-api/revision_store.py"
      - "services/editor-api/test_paragraph_alignment.py"
      - ".github/workflows/authoring-paragraph-align-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run paragraph alignment revision-kernel tests
        working-directory: services/editor-api
        run: python -m unittest -v test_paragraph_alignment
      - name: Validate public intent schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator

          schema = json.load(open("packages/protocol/authoring-paragraph-align/v1/paragraph-alignment-intent.schema.json"))
          Draft202012Validator.check_schema(schema)
          fixture = {
              "protocol_version": "chaptera.paragraph-alignment-intent.v1",
              "document_id": "doc:1",
              "source_hash": "a" * 64,
              "base_revision_id": "sha256:" + "b" * 64,
              "client_operation_id": "align-op-00000001",
              "command": {
                  "kind": "set_paragraph_alignment_override",
                  "paragraph_ids": ["paragraph:1"],
                  "expected_state_ids": {"paragraph:1": "sha256:" + "c" * 64},
                  "value": "center"
              }
          }
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          print("paragraph alignment intent schema valid")
          PY
