name: TEMP CORPUS version identity matrix v2 production rerun

on:
  pull_request:
    paths:
      - 'tools/corpus/version_identity_matrix.py'
      - 'tools/corpus/version_identity_matrix_media_roots.json'
      - 'tools/corpus/version_identity_matrix_family_overrides.json'
      - '.github/workflows/tmp-corpus-version-identity-matrix-v2.yml'

permissions:
  contents: read
  actions: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned generic CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Download accepted T645 source-free artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/t645
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10853776519/zip" \
            -o /tmp/t645.zip
          unzip -q /tmp/t645.zip -d /tmp/t645
          test -f /tmp/t645/matrix/summary.json
      - name: Build durable matrix v2
        run: |
          set -euo pipefail
          python tools/corpus/version_identity_matrix.py self-test
          python tools/corpus/version_identity_matrix.py build \
            --input /tmp/t645 \
            --out out/matrix-v2 \
            --media-roots tools/corpus/version_identity_matrix_media_roots.json \
            --family-overrides tools/corpus/version_identity_matrix_family_overrides.json
      - name: Verify accepted invariants and v2 semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("out/matrix-v2")
          summary=json.loads((root/"summary.json").read_text())
          rows=json.loads((root/"logical_identities.json").read_text())
          gaps=json.loads((root/"gap_queue.json").read_text())

          assert summary["schema"] == "chaptera.corpus-version-identity-matrix.v2"
          assert summary["physical_sha_count"] == 1486
          assert summary["successful_physical_sha_count"] == 1474
          assert summary["logical_identity_count"] == 1314
          assert summary["surplus_physical_sha_count"] == 160
          assert summary["contents_family_logical_counts"] == {
              "0x22": 768,
              "0x2c": 542,
              "malformed_or_invalid_family": 1,
              "unknown_due_to_raw_unavailable": 3,
          }
          assert summary["distribution_media_version_logical_counts"] == {
              "Publisher 2.0": 20,
              "Publisher 3.0 / Windows 95": 128,
              "Publisher 97": 520,
              "unknown": 646,
          }
          assert summary["distribution_media_provenance_covered_logical_count"] == 668
          assert not any(g["gap"] == "unknown_contents_family" for g in gaps)

          opcls_sha="6cb88d4e02f823876a23d7f7414c7d370ca30996c30f145ec92b62f519b22170"
          opcls=[r for r in rows if opcls_sha in r["physical_sha256"]]
          assert len(opcls) == 1
          opcls=opcls[0]
          assert opcls["contents_family"] == "malformed_or_invalid_family"
          assert opcls["distribution_media_version"] == "Publisher 97"
          assert opcls["creator_version"] == "unknown"
          assert opcls["writer_version"] == "unknown"

          infl=[
              r for r in rows
              if "INFLNTLB.PUB" in r.get("filenames", [])
              and r.get("distribution_media_version") == "Publisher 97"
              and r.get("contents_serialization_revision") == 125
          ]
          assert infl, "missing Publisher97-media / rev125 counterexample"
          assert all(r["creator_version"] == "unknown" for r in infl)
          assert all(r["writer_version"] == "unknown" for r in infl)
          PY
          if find out -type f -iname '*.pub' | grep -q .; then
            echo "raw PUB unexpectedly retained"
            exit 1
          fi
          sha256sum out/matrix-v2/*.json | tee out/matrix-v2/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-version-identity-matrix-v2-receipt
          path: out/matrix-v2/**
          if-no-files-found: error
          retention-days: 90
