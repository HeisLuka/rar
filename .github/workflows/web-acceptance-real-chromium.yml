name: WEB-ACCEPTANCE-01 real Chromium closure

on:
  pull_request:
    paths:
      - ".github/workflows/web-acceptance-real-chromium.yml"
      - "services/editor-api/web_real_acceptance_service.py"
      - "tools/run_web_editor_real_acceptance.mjs"
      - "apps/web/editor-shell-http-harness.html"
      - "vendor/producer-a/**"
      - "tools/sample_newsletter_move_producer.py"
      - "tools/resolved_graph_scene_bridge_v1.py"
      - "tools/adapt_viewer_scene_v1.py"
      - "tools/validate_browser_acceptance_receipt.py"
      - "tools/validate_web_acceptance_preflight.py"
      - "tools/verify_editable_export_geometry.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python validators
        run: python -m pip install "jsonschema==4.23.0"

      - name: Materialize pinned SampleNewsletter.pub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .web-v0
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" \
            -o .web-v0/SampleNewsletter.pub
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path(".web-v0/SampleNewsletter.pub")
          b=p.read_bytes()
          assert len(b)==291840
          assert hashlib.sha256(b).hexdigest()=="6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
          PY

      - name: Build Rar-owned reader and editable-export authority
        run: cargo build --manifest-path vendor/producer-a/Cargo.toml -p chaptera-producer-a

      - name: Regenerate exact canonical resolved graph
        shell: bash
        run: |
          set -euo pipefail
          vendor/producer-a/target/debug/chaptera-producer-a \
            resolved-graph .web-v0/SampleNewsletter.pub \
            > .web-v0/resolved-graph.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path(".web-v0/resolved-graph.json")
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          expected="7c327cd729fc2f9760e59cce1dd7c104c55162f4c3032c132068cfee513b1c4d"
          assert digest==expected, (digest, expected)
          print({"resolved_graph_sha256":digest,"byte_len":p.stat().st_size})
          PY

      - name: Materialize canonical initial Browser Scene
        shell: bash
        run: |
          set -euo pipefail
          python tools/adapt_viewer_scene_v1.py \
            apps/web/acceptance/receipts/viewer-geometry.real.json \
            .web-v0/initial-scene.json \
            --document-id 9c2f8d5e-3f1b-4a57-9d40-6a7e2c11b001 \
            --revision-id sha256:853fa2471bbf5ce479340e391550c5ee7b972f208a36d81c26808ab52c672d6c
          python tools/validate_scene_protocol.py .web-v0/initial-scene.json

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real Chromium authoring lifecycle
        env:
          REPOSITORY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REAL_FIXTURE: .web-v0/SampleNewsletter.pub
          REAL_RESOLVED_GRAPH: .web-v0/resolved-graph.json
          REAL_VIEWER_RECEIPT: apps/web/acceptance/receipts/viewer-geometry.real.json
          REAL_REVISION_RECEIPT: packages/protocol/revision/v1/producer-receipts/sample-newsletter.real.json
          REAL_EXPORTER: vendor/producer-a/target/debug/chaptera-producer-a
          REAL_WORK_DIR: .web-v0/real-browser-service
        run: node tools/run_web_editor_real_acceptance.mjs

      - name: Validate real browser receipt against canonical producers
        run: |
          python tools/validate_browser_acceptance_receipt.py \
            target/web-acceptance-real/browser-acceptance.real.json \
            packages/protocol/revision/v1/producer-receipts/sample-newsletter.real.json \
            .web-v0/initial-scene.json

      - name: Close WEB-ACCEPTANCE-01 preflight
        shell: bash
        run: |
          set -euo pipefail
          cp target/web-acceptance-real/browser-acceptance.real.json \
             apps/web/acceptance/receipts/browser-acceptance.real.json
          python tools/validate_web_acceptance_preflight.py \
            --fixture .web-v0/SampleNewsletter.pub \
            --mode preflight \
            --output .web-v0/web-acceptance-preflight.real.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(".web-v0/web-acceptance-preflight.real.json").read_text())
          assert report["validated"] == {
              "fixture": True,
              "revision_producer": True,
              "viewer_geometry": True,
              "browser_acceptance": True,
          }, report
          assert report["acceptance_ready"] is True, report
          assert report["blockers"] == [], report
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: web-acceptance-real-chromium
          if-no-files-found: error
          retention-days: 30
          path: |
            target/web-acceptance-real/browser-acceptance.real.json
            target/web-acceptance-real/chromium-real-shell.png
            .web-v0/web-acceptance-preflight.real.json
