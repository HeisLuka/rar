name: Layout resolved Scene receipt V1

on:
  pull_request:
    paths:
      - "packages/protocol/layout-resolved-scene/**"
      - "tools/validate_layout_resolved_scene_receipt.py"
      - "tools/test_layout_resolved_scene_receipt.py"
      - ".github/workflows/layout-resolved-scene-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run resolved-graph to Scene receipt tests
        run: python tools/test_layout_resolved_scene_receipt.py -v
