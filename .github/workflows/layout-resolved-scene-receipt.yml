name: Layout resolved Scene receipt V1

on:
  pull_request:
    paths:
      - "packages/protocol/layout-resolved-scene/**"
      - "tools/validate_layout_resolved_scene_receipt.py"
      - "tools/test_layout_resolved_scene_receipt.py"
      - "tools/build_layout_resolved_scene_receipt.py"
      - "tools/test_build_layout_resolved_scene_receipt.py"
      - "tools/run_local_layout_resolved_scene_engine.py"
      - "tools/test_run_local_layout_resolved_scene_engine.py"
      - "tools/resolved_graph_scene_bridge_v1.py"
      - "tools/run_sample_newsletter_resolved_scene_bridge.py"
      - "tools/test_resolved_graph_scene_bridge_v1.py"
      - ".github/workflows/layout-resolved-scene-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run resolved-graph to Scene receipt tests
        run: python tools/test_layout_resolved_scene_receipt.py -v
      - name: Run local resolved-graph producer orchestration tests
        run: python tools/test_build_layout_resolved_scene_receipt.py -v
      - name: Prove no-reparse local engine launcher
        run: python tools/test_run_local_layout_resolved_scene_engine.py -v
      - name: Prove reusable resolved-graph Scene bridge
        run: python tools/test_resolved_graph_scene_bridge_v1.py -v
