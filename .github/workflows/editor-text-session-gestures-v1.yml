name: Editor Text Session Gestures V1

on:
  pull_request:
    paths:
      - "services/editor-api/editor_text_session_gestures_v1.py"
      - "services/editor-api/test_editor_text_session_gestures_v1.py"
      - "services/editor-api/text_edit_session_v1.py"
      - "services/editor-api/text_pointer_selection_v1.py"
      - "services/editor-api/resolved_text_caret_map_v1.py"
      - "services/editor-api/text_unplaced_interaction_v1.py"
      - ".github/workflows/editor-text-session-gestures-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run desktop text session gesture routing tests
        working-directory: services/editor-api
        run: python -m unittest -v test_editor_text_session_gestures_v1 test_text_edit_session_v1 test_text_pointer_selection_v1 test_text_unplaced_interaction_v1
