name: Carlton March exact Editor census

on:
  pull_request:
    paths:
      - '.github/workflows/carlton-march-editor-census.yml'
      - 'scratch/carlton-yab/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Acquire exact Carlton March PUB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/carlton/download
          python -m pip install -q selenium
          python - <<'PY'
          import hashlib, os, shutil, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.support.ui import WebDriverWait

          out = Path("out/carlton/download").resolve()
          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_experimental_option("prefs", {
              "download.default_directory": str(out),
              "download.prompt_for_download": False,
              "download.directory_upgrade": True,
              "safebrowsing.enabled": True,
          })
          driver_path = shutil.which("chromedriver")
          driver = webdriver.Chrome(service=Service(driver_path) if driver_path else Service(), options=opts)
          try:
              driver.get("https://www.carltonji.org.uk/parents/latest-letters")
              wait = WebDriverWait(driver, 30)
              row = wait.until(lambda d: next(
                  (r for r in d.find_elements(By.CSS_SELECTOR, "tr") if "March 2026.pub" in r.text),
                  None
              ))
              button = row.find_element(By.CSS_SELECTOR, '[title="Download"]')
              driver.execute_script("arguments[0].click()", button)
              deadline = time.time() + 60
              candidate = None
              while time.time() < deadline:
                  pubs = [p for p in out.iterdir() if p.is_file() and p.suffix.lower() == ".pub" and not p.name.endswith(".crdownload")]
                  if pubs:
                      candidate = max(pubs, key=lambda p: p.stat().st_mtime)
                      if candidate.stat().st_size == 9580032:
                          break
                  time.sleep(0.5)
              if candidate is None:
                  raise SystemExit("browser download produced no .pub")
              data = candidate.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              print("downloaded", candidate, len(data), digest)
              assert len(data) == 9580032
              assert digest == "bf9cda0f632b5820ab9dbdbe1b838b2a988b2f3fdd69253c22b4fc3aef9f11c3"
              canonical = out / "March-2026.pub"
              if candidate != canonical:
                  candidate.replace(canonical)
          finally:
              driver.quit()
          PY
          echo "CARLTON_PUB=$PWD/out/carlton/download/March-2026.pub" >> "$GITHUB_ENV"
      - name: Run current Chaptera Editor census
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path scratch/carlton-yab/Cargo.toml -q -p carlton-census-runner -- "$CARLTON_PUB" > out/carlton/census.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("out/carlton/census.json").read_text())
          keys=["schema","source_sha256","source_bytes","viewer_page_count","viewer_story_count","editor_document_page_count","editor_page_registry_count","node_count","story_count","non_empty_story_count","framed_story_count","editable_story_count","editable_non_empty_framed_story_count","story_rejection_reasons","page_node_counts","movable_node_count","image_slot_node_count","replaceable_image_node_count","table_node_count","simple_table_node_count","editable_table_cell_count","smoke"]
          s={k:d[k] for k in keys}
          Path("out/carlton/summary.json").write_text(json.dumps(s,indent=2,sort_keys=True)+"\n")
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carlton-march-editor-census
          path: |
            out/carlton/census.json
            out/carlton/summary.json
            out/carlton/acquired/manifest.json
          if-no-files-found: warn
          retention-days: 30
