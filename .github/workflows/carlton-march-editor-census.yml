name: Carlton March exact Editor census

on:
  pull_request:
    paths:
      - '.github/workflows/carlton-march-editor-census.yml'
      - 'scratch/carlton-yab/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Acquire exact Carlton March PUB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/carlton/download
          expected=bf9cda0f632b5820ab9dbdbe1b838b2a988b2f3fdd69253c22b4fc3aef9f11c3
          urls=(
            "https://sj3-bucket-media.s3.eu-west-1.amazonaws.com/5a/5a939344-76a6-4a6a-b30b-7237edac8bfa"
            "https://docs-cdn.schooljotter3.com/1fd359a4-cb4e-412d-81a1-79f36166cafc/5a939344-76a6-4a6a-b30b-7237edac8bfa/5a939344-76a6-4a6a-b30b-7237edac8bfa.pub"
            "https://docs-cdn.schooljotter3.com/1fd359a4-cb4e-412d-81a1-79f36166cafc/5a939344-76a6-4a6a-b30b-7237edac8bfa/March%202026.pub"
          )
          ok=0
          for url in "${urls[@]}"; do
            echo "trying $url"
            rm -f out/carlton/download/candidate
            if curl -fL --retry 2 --connect-timeout 15 --max-time 90 "$url" -o out/carlton/download/candidate; then
              size=$(stat -c %s out/carlton/download/candidate)
              sha=$(sha256sum out/carlton/download/candidate | awk '{print $1}')
              echo "candidate size=$size sha=$sha"
              if [ "$size" = "9580032" ] && [ "$sha" = "$expected" ]; then
                mv out/carlton/download/candidate out/carlton/download/March-2026.pub
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "No static School Jotter object URL matched exact PUB" >&2
            exit 1
          fi
          echo "CARLTON_PUB=$PWD/out/carlton/download/March-2026.pub" >> "$GITHUB_ENV"
      - name: Run current Chaptera Editor census
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path scratch/carlton-yab/Cargo.toml -q -p carlton-census-runner -- "$CARLTON_PUB" > out/carlton/census.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("out/carlton/census.json").read_text())
          keys=["schema","source_sha256","source_bytes","viewer_page_count","viewer_story_count","editor_document_page_count","editor_page_registry_count","node_count","story_count","non_empty_story_count","framed_story_count","editable_story_count","editable_non_empty_framed_story_count","story_rejection_reasons","page_node_counts","movable_node_count","image_slot_node_count","replaceable_image_node_count","table_node_count","simple_table_node_count","editable_table_cell_count","smoke"]
          s={k:d[k] for k in keys}
          Path("out/carlton/summary.json").write_text(json.dumps(s,indent=2,sort_keys=True)+"\n")
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carlton-march-editor-census
          path: |
            out/carlton/census.json
            out/carlton/summary.json
            out/carlton/acquired/manifest.json
          if-no-files-found: warn
          retention-days: 30
