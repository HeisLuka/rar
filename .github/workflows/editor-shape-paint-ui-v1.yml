name: Editor Shape Paint UI V1

on:
  pull_request:
    paths:
      - "services/editor-api/shape_paint_inspector_v1.py"
      - "services/editor-api/test_shape_paint_inspector_v1.py"
      - ".github/workflows/editor-shape-paint-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded Shape paint inspector tests
        working-directory: services/editor-api
        run: python -m unittest -v test_shape_paint_inspector_v1
