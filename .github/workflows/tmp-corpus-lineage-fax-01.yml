name: TEMP CORPUS fax lineage execution
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-corpus-lineage-fax-01.yml'
permissions:
  contents: read
concurrency:
  group: tmp-corpus-lineage-fax-01
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Rehydrate exact pair and emit source-free receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import difflib, hashlib, json, re, tempfile, time, urllib.parse, urllib.request, zipfile
          from pathlib import Path
          from collections import Counter
          import olefile

          UA="rar-corpus-lineage-fax/1.0"
          SECTOR=2048
          FAX2={
            "sha256":"d5c49df9d276c0d5e16a72c36aa989b154728dd1c9b876c458d357c9a7050564",
            "size":18432,
            "member":"PAGEWIZ/FAX2.PUB",
            "root_sha256":"cb9ced4d7f0606a81638855a1d77430a5d37352ec6993a95668295b854a69d59",
            "root_size":138551296,
            "archive_url":"https://archive.org/download/PUB40CD/PUB_40_CD.ISO",
            "source_page":"https://archive.org/details/PUB40CD",
            "additional_exact_media":[
              {"source_page":"https://archive.org/details/MSPublisher97-EN","root_sha256":"41d4180a7cc8b04db10d5cfc510207f7a9f705915d0090be655a4c27c2cb15ab"},
              {"source_page":"https://archive.org/details/MSPublisher97ThaiEdition","root_sha256":"0e30e5f0817cb94ff78780ac34b386c4c87c475ead40227758c387e985560e4c"}
            ]
          }
          FORM={
            "sha256":"fd634f5884d3d35b311b3b0b2d3a752fee7b2fea8572a6071aa7206a54ea1ca0",
            "size":22528,
            "member":"COMPAQ_4xx_433_425_C-FILES_MS-DOS_6_2/MSPUB/TEMPLATE/FAXFORM2.PUB",
            "root_sha256":"e00e7eeadb82d987083c8234006feaa12fe60fded218e1995af6ecb5b0d27a89",
            "root_size":44319721,
            "urls":[
              "https://dn721606.ca.archive.org/0/items/compaq425433filesmsdos62/COMPAQ_4xx_433_425_C-FILES_MS-DOS_6_2.zip",
              "https://archive.org/download/compaq425433filesmsdos62/COMPAQ_4xx_433_425_C-FILES_MS-DOS_6_2.zip"
            ],
            "source_page":"https://archive.org/details/compaq425433filesmsdos62"
          }

          def sha(data): return hashlib.sha256(data).hexdigest()

          class RangeISO:
            def __init__(self, archive_url):
              self.archive_url=archive_url; self.dir_cache={}
              self.delivery_urls=self._delivery_urls(archive_url)
              self.delivery_url=self._select()
            def _delivery_urls(self,url):
              p=urllib.parse.urlparse(url); parts=p.path.split("/")
              ident=parts[2]; filename="/".join(parts[3:])
              req=urllib.request.Request(f"https://archive.org/metadata/{ident}",headers={"User-Agent":UA})
              with urllib.request.urlopen(req,timeout=30) as r: meta=json.load(r)
              directory=str(meta.get("dir") or "")
              urls=[]
              for key in ("d1","d2"):
                host=str(meta.get(key) or "")
                if host and directory:
                  urls.append("https://"+host+directory.rstrip("/")+"/"+urllib.parse.quote(filename,safe="/"))
              urls.extend([url,url+"?download=1"])
              return list(dict.fromkeys(urls))
            def _read_from(self,url,start,length):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Range":f"bytes={start}-{start+length-1}","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=45) as r:
                cr=r.headers.get("Content-Range"); status=getattr(r,"status",None)
                if status!=206 and not cr: raise ValueError(f"range unsupported {status}")
                data=r.read(length+1)
              if len(data)!=length: raise ValueError(f"range length drift {len(data)} != {length}")
              return data
            def _select(self):
              last=None
              for url in self.delivery_urls:
                for attempt in range(3):
                  try:
                    pvd=self._read_from(url,16*SECTOR,SECTOR)
                    if pvd[0]!=1 or pvd[1:6]!=b"CD001": raise ValueError("not ISO9660 PVD")
                    return url
                  except Exception as e:
                    last=e
                    if attempt<2: time.sleep(2**attempt)
              raise last
            def read(self,start,length):
              last=None
              for attempt in range(3):
                try: return self._read_from(self.delivery_url,start,length)
                except Exception as e:
                  last=e
                  if attempt<2: time.sleep(2**attempt)
              raise last
            @staticmethod
            def record(rec):
              return (rec[33:33+rec[32]].decode("ascii","strict"), int.from_bytes(rec[2:6],"little"), int.from_bytes(rec[10:14],"little"), rec[25])
            def read_dir(self,extent,size):
              key=(extent,size)
              if key in self.dir_cache: return self.dir_cache[key]
              data=self.read(extent*SECTOR,size); out={}; pos=0
              while pos<len(data):
                n=data[pos]
                if n==0: pos=((pos//SECTOR)+1)*SECTOR; continue
                name,ex,sz,flags=self.record(data[pos:pos+n])
                if name not in ("\x00","\x01"): out[name.split(";")[0].upper()]=(ex,sz,flags)
                pos+=n
              self.dir_cache[key]=out; return out
            def member(self,path):
              pvd=self.read(16*SECTOR,SECTOR); rl=pvd[156]
              _,extent,size,flags=self.record(pvd[156:156+rl])
              parts=[p.upper() for p in path.strip("/").split("/") if p]
              for i,part in enumerate(parts):
                listing=self.read_dir(extent,size)
                if part not in listing: raise KeyError(f"missing {part}")
                extent,size,flags=listing[part]
                if i+1<len(parts) and not (flags&2): raise ValueError(f"not dir {part}")
              if flags&2: raise ValueError("target dir")
              return self.read(extent*SECTOR,size)

          def fetch_zip(spec,dest):
            last=None
            for url in spec["urls"]:
              for attempt in range(3):
                try:
                  req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept-Encoding":"identity"})
                  h=hashlib.sha256(); total=0
                  with urllib.request.urlopen(req,timeout=90) as r, dest.open("wb") as f:
                    while True:
                      c=r.read(1024*1024)
                      if not c: break
                      total+=len(c); h.update(c); f.write(c)
                  if total!=spec["root_size"]: raise ValueError(f"root size {total}")
                  if h.hexdigest()!=spec["root_sha256"]: raise ValueError("root sha")
                  return url
                except Exception as e:
                  last=e; dest.unlink(missing_ok=True)
                  if attempt<2: time.sleep(2**attempt)
            raise last

          META_FIELDS=["title","subject","author","keywords","comments","template","last_saved_by","revision_number","total_edit_time","last_printed","create_time","last_saved_time","num_pages","num_words","num_chars","thumbnail","creating_application","security","category","company","version","language","doc_version"]
          def safe(v):
            if v is None:return None
            if isinstance(v,bytes):return {"byte_len":len(v),"sha256":sha(v)}
            if hasattr(v,"isoformat"):
              try:return v.isoformat()
              except:pass
            if isinstance(v,(str,int,float,bool)):return v if not isinstance(v,str) else v[:512]
            return str(v)[:512]

          def probe(data):
            with olefile.OleFileIO(data) as ole:
              streams={}
              for parts in ole.listdir(streams=True,storages=False):
                p="/"+"/".join(parts); streams[p]=ole.openstream(parts).read()
              try:
                m=ole.get_metadata()
                meta={k:safe(getattr(m,k,None)) for k in META_FIELDS if getattr(m,k,None) is not None}
              except Exception as e: meta={"_error":f"{type(e).__name__}:{e}"}
            c=streams.get("/Contents",b"")
            marker=f"0x{int.from_bytes(c[2:4],'little'):04X}" if len(c)>=4 and c[:2]==b"\xe8\xac" else "unrecognized"
            return {"paths":sorted(streams),"streams":{p:{"len":len(v),"sha256":sha(v)} for p,v in sorted(streams.items())},"metadata":meta,"contents_family_marker":marker},streams

          def tokens(data):
            out=set()
            for m in re.finditer(rb"[\x20-\x7e]{4,}",data):out.add("a:"+sha(m.group(0)))
            for m in re.finditer(rb"(?:[\x20-\x7e]\x00){4,}",data):out.add("u:"+sha(m.group(0)))
            return out
          def delta(a,b):
            sm=difflib.SequenceMatcher(None,a,b,autojunk=False)
            spans=[]
            for tag,i1,i2,j1,j2 in sm.get_opcodes():
              if tag!="equal":
                spans.append({"tag":tag,"left_offset":i1,"left_len":i2-i1,"left_sha256":sha(a[i1:i2]),"right_offset":j1,"right_len":j2-j1,"right_sha256":sha(b[j1:j2])})
            ta,tb=tokens(a),tokens(b); u=ta|tb
            return {"left_len":len(a),"right_len":len(b),"sequence_match_ratio":round(sm.ratio(),6),"delta_span_count":len(spans),"delta_spans":spans,"text_token_hash_count_left":len(ta),"text_token_hash_count_right":len(tb),"text_token_overlap":len(ta&tb),"text_token_jaccard":round(len(ta&tb)/len(u),6) if u else 1.0}
          def mdiff(a,b):
            return {k:{"left":a.get(k),"right":b.get(k)} for k in sorted(set(a)|set(b)) if a.get(k)!=b.get(k)}

          out=Path("out"); out.mkdir(exist_ok=True)
          with tempfile.TemporaryDirectory(prefix="fax-lineage-") as td0:
            td=Path(td0)
            iso=RangeISO(FAX2["archive_url"])
            fax=iso.member(FAX2["member"])
            if len(fax)!=FAX2["size"] or sha(fax)!=FAX2["sha256"]: raise ValueError("FAX2 exact member drift")
            zpath=td/"compaq.zip"; zurl=fetch_zip(FORM,zpath)
            with zipfile.ZipFile(zpath) as zf: form=zf.read(FORM["member"])
            if len(form)!=FORM["size"] or sha(form)!=FORM["sha256"]: raise ValueError("FAXFORM2 exact member drift")
            lp,ls=probe(fax); rp,rs=probe(form)
            changed=[]; unchanged=[]; deltas={}
            for p in sorted(set(ls)|set(rs)):
              a,b=ls.get(p),rs.get(p)
              if a is not None and b is not None and a==b: unchanged.append(p)
              else:
                changed.append(p)
                deltas[p]=delta(a,b) if a is not None and b is not None else {"left_present":a is not None,"right_present":b is not None}
            compact=sum(d.get("sequence_match_ratio",0) for d in deltas.values())/max(1,len(deltas))
            content=deltas.get("/Contents",{})
            if lp["paths"]==rp["paths"] and lp["contents_family_marker"]==rp["contents_family_marker"] and content.get("sequence_match_ratio",0)>=0.60:
              conclusion="lineage-plausible-needs-semantic-discriminator"
            elif lp["paths"]==rp["paths"] and content.get("text_token_jaccard",0)>=0.50:
              conclusion="same-template-family-supported"
            else:
              conclusion="structural-resemblance-only"
            receipt={
              "schema":"chaptera.corpus-lineage-fax.v1",
              "files":{
                "fax2":{"sha256":FAX2["sha256"],"byte_len":len(fax),"member":FAX2["member"],"source_page":FAX2["source_page"],"selected_delivery_url":iso.delivery_url,"root_sha256":FAX2["root_sha256"],"additional_exact_media":FAX2["additional_exact_media"],"probe":lp},
                "faxform2":{"sha256":FORM["sha256"],"byte_len":len(form),"member":FORM["member"],"source_page":FORM["source_page"],"selected_delivery_url":zurl,"root_sha256":FORM["root_sha256"],"probe":rp}
              },
              "comparison":{"paths_equal":lp["paths"]==rp["paths"],"contents_family_left":lp["contents_family_marker"],"contents_family_right":rp["contents_family_marker"],"changed_streams":changed,"unchanged_streams":unchanged,"metadata_diff":mdiff(lp["metadata"],rp["metadata"]),"stream_deltas":deltas,"mean_changed_stream_ratio":round(compact,6),"conclusion_class":conclusion},
              "source_safe":True,"raw_pub_retained":False
            }
            (out/"receipt.json").write_text(json.dumps(receipt,indent=2,ensure_ascii=False),encoding="utf-8")
            summary={"schema":"chaptera.corpus-lineage-fax-summary.v1","all_exact_members_verified":True,"paths_equal":receipt["comparison"]["paths_equal"],"changed_streams":changed,"contents_family_left":lp["contents_family_marker"],"contents_family_right":rp["contents_family_marker"],"contents_sequence_match_ratio":content.get("sequence_match_ratio"),"contents_text_token_jaccard":content.get("text_token_jaccard"),"conclusion_class":conclusion,"source_safe":True}
            (out/"summary.json").write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding="utf-8")
            print(json.dumps(summary,indent=2))
          PY
      - name: Enforce source-safe closure
        run: |
          set -euo pipefail
          if find out -type f -iname '*.pub' | grep -q .; then exit 1; fi
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("out/summary.json").read_text())
          assert s["all_exact_members_verified"] is True
          assert s["source_safe"] is True
          assert len(s["changed_streams"]) >= 1
          PY
          sha256sum out/*.json | tee out/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-lineage-fax-receipt
          path: out/**
          if-no-files-found: error
          retention-days: 90
