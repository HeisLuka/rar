name: Validate flattened Quill table coordinates

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-reader/src/bin/table-story-receipt.rs"
      - ".github/workflows/canyua-table-discrim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Build table Story receipt
        working-directory: vendor/producer-a
        run: cargo build -p pub-reader --bin table-story-receipt

      - name: Materialize pinned real PUB corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/table-corpus work/table-receipts

          cat > work/table-corpus/manifest.tsv <<'EOF'
          poi_sample_2007	Sample.pub	https://raw.githubusercontent.com/apache/poi/74700b5692fd0449031ac6a3c78aec1155d144d5/test-data/publisher/Sample.pub	6fefdef46b87c767150878dc384549cb2d2ec2ac54de25f8ddb3a5628301107e
          poi_sample_2010	Sample_2010.pub	https://raw.githubusercontent.com/apache/poi/6fdbaa55f387ea3927512412eadd569a67973a61/test-data/publisher/Sample_2010.pub	f0a90aa566d72eb822eb48b4f378c33007610e35f3f1b999cdb88f2c9683858b
          poi_newsletter	SampleNewsletter.pub	https://raw.githubusercontent.com/apache/poi/6fdbaa55f387ea3927512412eadd569a67973a61/test-data/publisher/SampleNewsletter.pub	6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf
          poi_brochure	SampleBrochure.pub	https://raw.githubusercontent.com/apache/poi/6fdbaa55f387ea3927512412eadd569a67973a61/test-data/publisher/SampleBrochure.pub	
          aspose_christmas	christmas.pub	https://raw.githubusercontent.com/aspose-pub/Aspose.PUB-for-.NET/c6ecc07667948eba21d54ce88e7fb7fdb67570ef/Examples/Data/christmas.pub	550226a1c5d1d3bcb08b31863e60045f85b03061899b2f330217125e808d06d6
          aspose_florist	florist-flyer.pub	https://raw.githubusercontent.com/aspose-pub/Aspose.PUB-for-.NET/c6ecc07667948eba21d54ce88e7fb7fdb67570ef/Examples/Data/florist-flyer.pub	7b7e132df247c306bffac0647cb282fb844811f4d65a35c9ba07fdcca46acd85
          adelphi_newsletter	Adelphi-Newsletter.pub	https://www.adelphi.edu/brand/wp-content/uploads/sites/55/2020/08/Adelphi-Newsletter.pub	5202c03e2c586ed0f6e622324b862742d28e99b3168bd362b4036195ec8bfc60
          EOF

          while IFS=$'\t' read -r slug file url expected; do
            [ -n "$slug" ] || continue
            out="work/table-corpus/$file"
            curl --fail --location --retry 3 --connect-timeout 20 "$url" -o "$out"
            actual="$(sha256sum "$out" | awk '{print $1}')"
            if [ -n "$expected" ]; then
              test "$actual" = "$expected"
            fi
            printf '%s\t%s\t%s\n' "$slug" "$file" "$actual"
          done < work/table-corpus/manifest.tsv | tee work/table-corpus/hashes.tsv

      - name: Run real-PUB table receipts
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/vendor/producer-a/target/debug/table-story-receipt"
          while IFS=$'\t' read -r slug file url expected; do
            [ -n "$slug" ] || continue
            "$BIN" "work/table-corpus/$file" "work/table-receipts/$slug.json"
          done < work/table-corpus/manifest.tsv

      - name: Aggregate discriminator receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          rows=[]
          for path in sorted(Path("work/table-receipts").glob("*.json")):
              r=json.loads(path.read_text())
              rows.append({
                  "slug":path.stem,
                  "status":r["status"],
                  "parse_error":r.get("parse_error"),
                  "table_count":r["table_count"],
                  "simple_table_count":r["simple_table_count"],
                  "non_simple_table_count":r["non_simple_table_count"],
                  "tables_with_valid_ranges":r["tables_with_valid_ranges"],
                  "tables_with_contiguous_story_coverage":r["tables_with_contiguous_story_coverage"],
                  "simple_tables_materialized":r["simple_tables_materialized"],
                  "tables":r["tables"],
              })

          analyzed=[r for r in rows if r["status"]=="analyzed"]
          table_count=sum(r["table_count"] for r in analyzed)
          invalid=[]
          for row in analyzed:
              for table in row["tables"]:
                  if not (
                      table["monotonic_and_bounded"]
                      and table["contiguous_coverage"]
                      and table["leading_cr_convention"]
                  ):
                      invalid.append({
                          "slug":row["slug"],
                          "node_id":table["node_id"],
                          "contents_seq_num":table["contents_seq_num"],
                          "monotonic_and_bounded":table["monotonic_and_bounded"],
                          "contiguous_coverage":table["contiguous_coverage"],
                          "leading_cr_convention":table["leading_cr_convention"],
                      })

          report={
              "schema":"chaptera.table-story-corpus-rollup.v1",
              "scope":"independent Publisher/real-PUB validation of flattened Quill table coordinates; no Canyua constants promoted",
              "files_total":len(rows),
              "files_analyzed":len(analyzed),
              "files_unsupported_or_parse_error":len(rows)-len(analyzed),
              "table_count":table_count,
              "simple_table_count":sum(r["simple_table_count"] for r in analyzed),
              "non_simple_table_count":sum(r["non_simple_table_count"] for r in analyzed),
              "simple_tables_materialized":sum(r["simple_tables_materialized"] for r in analyzed),
              "invalid_table_ranges":invalid,
              "files":rows,
          }
          Path("work/table-receipts/rollup.json").write_text(
              json.dumps(report,indent=2,ensure_ascii=False)+"\n"
          )
          print(json.dumps(report,indent=2,ensure_ascii=False))

          if table_count == 0:
              raise SystemExit("corpus produced no admitted tables; expand corpus before claiming validation")
          if invalid:
              raise SystemExit(f"{len(invalid)} admitted table(s) violate the grounded Story-range contract")
          PY

      - name: Upload table discriminator receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canyua-table-discrim-real-pub-receipts
          path: |
            work/table-corpus/manifest.tsv
            work/table-corpus/hashes.tsv
            work/table-receipts/
          if-no-files-found: error
          retention-days: 30
