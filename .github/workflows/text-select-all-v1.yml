name: Text Select All V1

on:
  pull_request:
    paths:
      - "services/editor-api/text_select_all_v1.py"
      - "services/editor-api/test_text_select_all_v1.py"
      - "services/editor-api/story_edit_domain_v1.py"
      - "services/editor-api/text_selection_state_v1.py"
      - "services/editor-api/text_typing_format_state_v1.py"
      - ".github/workflows/text-select-all-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Story-focus Select All tests
        working-directory: services/editor-api
        run: python -m unittest -v test_text_select_all_v1 test_story_edit_domain_v1 test_text_selection_state_v1 test_text_typing_format_state_v1
