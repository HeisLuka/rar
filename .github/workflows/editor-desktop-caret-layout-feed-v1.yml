name: Editor Desktop Caret Layout Feed V1

on:
  push:
    branches:
      - editor-desktop-caret-layout-feed-01
  pull_request:
    paths:
      - "crates/chaptera-caret-layout-feed/**"
      - "crates/chaptera-text-caret-map-adapter/**"
      - "vendor/producer-a/crates/pub-layout/**"
      - ".github/workflows/editor-desktop-caret-layout-feed-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/chaptera-caret-layout-feed/Cargo.toml -- --check
      - name: Check
        run: cargo check --manifest-path crates/chaptera-caret-layout-feed/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/chaptera-caret-layout-feed/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path crates/chaptera-caret-layout-feed/Cargo.toml
