name: Cloud product projections architecture modelcheck

on:
  pull_request:
    paths:
      - "tools/run_cloud_product_projections_model.py"
      - ".github/workflows/cloud-product-projections-modelcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model-check search/recent/thumbnail semantics
        run: python tools/run_cloud_product_projections_model.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-product-projections-model
          path: target/cloud-projections/product-projections.json
          if-no-files-found: error
