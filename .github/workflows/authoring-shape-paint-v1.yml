name: Authoring Shape Paint V1

on:
  pull_request:
    paths:
      - "crates/pub-model/src/shape_paint.rs"
      - "crates/pub-model/src/shape_paint_op.rs"
      - "crates/pub-paint-bridge/**"
      - "services/editor-api/revision_store.py"
      - "services/editor-api/test_shape_paint.py"
      - "packages/protocol/authoring-shape-paint/v1/**"
      - ".github/workflows/authoring-shape-paint-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RevisionKernel Shape paint tests
        working-directory: services/editor-api
        run: python -m unittest -v test_shape_paint

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -p pub-model -p pub-paint-bridge -- --check
      - name: Check workspace
        run: cargo check -p pub-model -p pub-paint-bridge --all-targets
      - name: Lint workspace
        run: cargo clippy -p pub-model -p pub-paint-bridge --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test -p pub-model -p pub-paint-bridge
