name: CORPUS-VAC GovDocs1 quarantine

on:
  pull_request:
    paths:
      - 'tools/corpus/govdocs1_remote_zip_pub.py'
      - 'tools/corpus/test_govdocs1_remote_zip_pub.py'
      - '.github/workflows/corpus-vac-govdocs1.yml'
  push:
    branches: [main]
    paths:
      - 'tools/corpus/govdocs1_remote_zip_pub.py'
      - 'tools/corpus/test_govdocs1_remote_zip_pub.py'
      - '.github/workflows/corpus-vac-govdocs1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-vac-govdocs1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/corpus/govdocs1_remote_zip_pub.py \
            tools/corpus/test_govdocs1_remote_zip_pub.py
          python tools/corpus/test_govdocs1_remote_zip_pub.py
      - name: Live remote-ZIP range smoke
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/corpus/govdocs1_remote_zip_pub.py \
            --start-dir 0 --end-dir 1 --workers 2 --timeout 30 \
            --out out/govdocs_manifest.json \
            --summary out/govdocs.summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("out/govdocs.summary.json").read_text())
          assert s["zip_archives_requested"] == 2, s
          assert s["zip_archives_ok"] >= 1, s
          assert s["archive_entries_seen"] > 0, s
          PY
          cat out/govdocs.summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: govdocs-zip-smoke-${{ github.run_id }}
          path: |
            out/govdocs.summary.json
            out/govdocs_manifest.json
            out/govdocs_manifest.csv
          retention-days: 7

  production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Index all 1000 official GovDocs1 ZIPs and fetch PUB members only
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/corpus/govdocs1_remote_zip_pub.py \
            --start-dir 0 --end-dir 999 --workers 16 --timeout 30 \
            --max-member-bytes 104857600 \
            --out out/govdocs_manifest.json \
            --summary out/govdocs.summary.json
          cat out/govdocs.summary.json
      - name: Assert quarantine boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path("out/govdocs_manifest.json").read_text())
          assert all((r.get("quarantine") or "").casefold() == "yes" for r in rows), "non-quarantine row"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: govdocs-remote-zip-receipt-${{ github.run_id }}
          path: |
            out/govdocs.summary.json
            out/govdocs_manifest.json
            out/govdocs_manifest.csv
          if-no-files-found: error
          retention-days: 30
