name: Editor off-page staging V1

on:
  pull_request:
    paths:
      - "services/editor-api/offpage_staging_v1.py"
      - "services/editor-api/test_offpage_staging_v1.py"
      - ".github/workflows/editor-offpage-staging-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run off-page staging geometry/admission tests
        working-directory: services/editor-api
        run: python -m unittest -v test_offpage_staging_v1
