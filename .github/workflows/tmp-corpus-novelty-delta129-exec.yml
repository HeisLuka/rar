name: TEMP CORPUS novelty delta129 execution

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-corpus-novelty-delta129-exec.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: tmp-corpus-novelty-delta129-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: class_templates
            artifact_id: 10811670607
            expected: 52
          - lane: training
            artifact_id: 10811710784
            expected: 15
          - lane: mvp_matrix
            artifact_id: 10811134424
            expected: 62
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Download retained source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p src out
          gh api             -H "Accept: application/vnd.github+json"             "/repos/${{ github.repository }}/actions/artifacts/${{ matrix.artifact_id }}/zip"             > src/source.zip
          unzip -q src/source.zip -d src/unpacked
      - name: Probe exact admitted lane
        env:
          LANE: ${{ matrix.lane }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, os, sys
          from pathlib import Path

          sys.path.insert(0, str(Path("tools/corpus").resolve()))
          import structural_novelty as novelty

          lane = os.environ["LANE"]
          expected = int(os.environ["EXPECTED"])
          receipt = Path("tools/corpus/receipts/corpus-post-m1-delta-2026-09-24.tsv")
          wanted = {}
          with receipt.open("r", encoding="utf-8", newline="") as fh:
              for row in csv.DictReader(fh, delimiter="\t"):
                  if row["lane"] == lane:
                      wanted[row["sha256"]] = row
          assert len(wanted) == expected, (lane, len(wanted), expected)

          novel_dir = Path("src/unpacked/novel")
          candidates = sorted(novel_dir.glob("*.pub"))
          by_sha = {}
          for path in candidates:
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha not in wanted:
                  continue
              first = novelty.cfb_probe(data)
              second = novelty.cfb_probe(data)
              if first != second:
                  raise SystemExit(f"nondeterministic probe: {sha}")
              if first["source_sha256"] != sha:
                  raise SystemExit(f"source SHA drift: {sha}")
              row = {
                  "sha256": sha,
                  "sources": [f"post_m1_delta:{lane}"],
                  "filenames": [path.name.split("__", 1)[-1]],
                  **first,
                  "status": "ok",
                  "rehydrated_from": f"artifact:{os.environ.get('ARTIFACT_ID','')}",
              }
              prior = by_sha.get(sha)
              if prior is not None and prior != row:
                  raise SystemExit(f"duplicate SHA disagrees: {sha}")
              by_sha[sha] = row

          missing = sorted(set(wanted) - set(by_sha))
          if missing:
              raise SystemExit(f"missing admitted SHA: {len(missing)} first={missing[:3]}")
          if len(by_sha) != expected:
              raise SystemExit(f"lane count drift: {len(by_sha)} != {expected}")

          rows = [by_sha[k] for k in sorted(by_sha)]
          Path("out/fingerprints.json").write_text(
              json.dumps(rows, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          summary = {
              "schema": "chaptera.cross-arm-129-structural-replay.v1",
              "lane": lane,
              "expected_sha": expected,
              "analyzed_rows": len(rows),
              "status": {"ok": len(rows)},
          }
          Path("out/summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Prove no raw PUB retained
        if: always()
        run: |
          set -euo pipefail
          if find out -type f -iname '*.pub' | grep -q .; then
            echo "raw PUB leaked into retained output" >&2
            exit 1
          fi
          rm -rf src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-cross-arm-129-${{ github.run_id }}-${{ matrix.lane }}
          path: out/**
          if-no-files-found: error
          retention-days: 7

  aggregate:
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - uses: actions/download-artifact@v4
        with:
          pattern: tmp-cross-arm-129-${{ github.run_id }}-*
          path: shards
      - name: Aggregate exact 129-SHA replay
        run: |
          set -euo pipefail
          python tools/corpus/structural_novelty.py aggregate             --input shards             --out aggregate
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("aggregate/summary.json").read_text())
          assert s["analyzed_rows"] == 129, s
          assert s["status"].get("ok") == 129, s
          print(json.dumps(s, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tmp-cross-arm-129-aggregate-${{ github.run_id }}
          path: aggregate/**
          if-no-files-found: error
          retention-days: 7
