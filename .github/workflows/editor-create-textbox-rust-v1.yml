name: Editor Create TextBox Rust V1

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-editor/src/lib.rs"
      - "vendor/producer-a/crates/pub-editor/tests/create_text_box_v1.rs"
      - ".github/workflows/editor-create-textbox-rust-v1.yml"
  push:
    branches:
      - editor-create-textbox-rust-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  create-textbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Format task-owned Rust
        run: rustfmt --edition 2024 --check vendor/producer-a/crates/pub-editor/src/lib.rs vendor/producer-a/crates/pub-editor/tests/create_text_box_v1.rs
      - name: Check pub-editor
        run: cargo check --manifest-path vendor/producer-a/crates/pub-editor/Cargo.toml --all-targets
      - name: Clippy pub-editor
        run: cargo clippy --manifest-path vendor/producer-a/crates/pub-editor/Cargo.toml --all-targets -- -D warnings
      - name: CreateTextBox contract tests
        run: cargo test --manifest-path vendor/producer-a/crates/pub-editor/Cargo.toml --test create_text_box_v1
      - name: Full pub-editor regression
        run: cargo test --manifest-path vendor/producer-a/crates/pub-editor/Cargo.toml
