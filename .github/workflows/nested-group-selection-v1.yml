name: Nested Group Selection V1

on:
  pull_request:
    paths:
      - "services/editor-api/group_member_selection_v1.py"
      - "services/editor-api/group_transform_chain_v1.py"
      - "services/editor-api/nested_group_selection_v1.py"
      - "services/editor-api/test_nested_group_selection_v1.py"
      - ".github/workflows/nested-group-selection-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run path-capable nested selection tests
        working-directory: services/editor-api
        run: python -m unittest -v test_nested_group_selection_v1
      - name: Re-run one-level selection and transform depth primitives
        working-directory: services/editor-api
        run: python -m unittest -v test_group_member_selection_v1 test_group_transform_chain_v1
