name: TEMP PUBWIZ POC XML semantic crosswalk
# trigger-after-utf16-fix
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-pubwiz-poc-xml-semantic-01.yml'
permissions:
  contents: read

jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full msitools iat
      - name: Recover pinned inputs
        run: |
          set -euo pipefail
          mkdir -p out /tmp/x05 /tmp/xml
          python - <<'PY'
          import json, urllib.request, urllib.parse
          req=urllib.request.Request("https://archive.org/metadata/X05-44678",headers={"User-Agent":"rar-poc-xml-semantic/1.0"})
          with urllib.request.urlopen(req,timeout=60) as r: meta=json.load(r)
          fs=[f for f in meta.get("files",[]) if str(f.get("source") or "")=="original" and str(f.get("name") or "").lower().endswith(".7z")]
          fs.sort(key=lambda f:int(f.get("size") or 0),reverse=True)
          f=fs[0]
          url="https://archive.org/download/X05-44678/"+urllib.parse.quote(f["name"],safe="/")
          open("/tmp/x05/url","w").write(url)
          json.dump({"identifier":"X05-44678","member":f["name"],"size":int(f.get("size") or 0),"md5":f.get("md5"),"sha1":f.get("sha1")},open("out/p2000_source.json","w"),indent=2)
          PY
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 -o /tmp/x05/source.7z "$(cat /tmp/x05/url)"
          7z l -slt /tmp/x05/source.7z > /tmp/x05/a.slt
          python - <<'PY'
          import pathlib
          t=pathlib.Path("/tmp/x05/a.slt").read_text(errors="replace")
          rows=[]; cur={}
          for line in t.splitlines():
              if " = " in line:
                  k,v=line.split(" = ",1)
                  if k=="Path" and cur: rows.append(cur); cur={}
                  cur[k]=v
          if cur: rows.append(cur)
          c=sorted([(int(r.get("Size","0") or 0),r.get("Path","")) for r in rows if r.get("Path","").lower().endswith((".iso",".img",".bin",".mdf"))], reverse=True)
          pathlib.Path("/tmp/x05/member").write_text(c[0][1])
          PY
          mkdir -p /tmp/x05/image
          7z x -y -o/tmp/x05/image /tmp/x05/source.7z "$(cat /tmp/x05/member)" >/dev/null
          IMAGE="$(find /tmp/x05/image -type f | head -n1)"
          if [[ "${IMAGE,,}" == *.mdf ]]; then iat "$IMAGE" /tmp/x05/converted.iso >/dev/null; IMAGE=/tmp/x05/converted.iso; fi
          mkdir -p /tmp/x05/install
          7z x -y -o/tmp/x05/install "$IMAGE" -r '*.MSI' '*.msi' '*.CAB' '*.cab' '*.POC' '*.poc' >/dev/null || true
          mkdir -p /tmp/x05/msiout /tmp/x05/cabout
          n=0
          while IFS= read -r msi; do n=$((n+1)); mkdir -p "/tmp/x05/msiout/$n"; msiextract -C "/tmp/x05/msiout/$n" "$msi" >/dev/null 2>&1 || true; done < <(find /tmp/x05/install -type f -iname '*.msi')
          n=0
          while IFS= read -r cab; do n=$((n+1)); mkdir -p "/tmp/x05/cabout/$n"; 7z x -y -o"/tmp/x05/cabout/$n" "$cab" '*.POC' '*.poc' >/dev/null 2>&1 || true; done < <(find /tmp/x05/install -type f -iname '*.cab')
          curl -fL --retry 3 -o /tmp/xml/DGACCBAR.XML 'https://raw.githubusercontent.com/sdbjhksvbd/check/9a3f124df300d19c15b454b1c77808141929d46c/2025-07-13_17-33-09/C/Program%20Files/Microsoft%20Office/Office16/PUBWIZ/DGACCBAR.XML'
          curl -fL --retry 3 -o /tmp/xml/DGACCBOX.XML 'https://raw.githubusercontent.com/sdbjhksvbd/check/9a3f124df300d19c15b454b1c77808141929d46c/2025-07-13_17-33-09/C/Program%20Files/Microsoft%20Office/Office16/PUBWIZ/DGACCBOX.XML'
      - name: Analyze structural semantic discriminator
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, hashlib, json, re, xml.etree.ElementTree as ET, collections
          roots=[pathlib.Path("/tmp/x05/install"),pathlib.Path("/tmp/x05/msiout"),pathlib.Path("/tmp/x05/cabout")]
          targets={}
          for root in roots:
              for p in root.rglob("*"):
                  if p.is_file() and p.name.upper() in {"ACCSBAR.POC","ACCTBOX.POC"}:
                      b=p.read_bytes(); targets[p.name.upper()]=(b,hashlib.sha256(b).hexdigest())
          assert set(targets)=={"ACCSBAR.POC","ACCTBOX.POC"}, targets.keys()
          expected={"ACCSBAR.POC":(4446,"e1efde40"),"ACCTBOX.POC":(2366,"269ca61c")}
          for n,(b,h) in targets.items():
              assert len(b)==expected[n][0] and h.startswith(expected[n][1]), (n,len(b),h)

          def xml_rows(path):
              raw=pathlib.Path(path).read_bytes()
              root=ET.fromstring(raw.decode("utf-16"))
              rows=[]
              for it in root.findall("item"):
                  m=re.search(r"(\d+)='(\d+)=(\d+)'",it.attrib["opl"])
                  assert m, it.attrib["opl"]
                  rows.append({"style":it.attrib["style"],"wid":int(it.attrib["wid"]),"desID":int(it.attrib["desID"]),
                               "outer_key":int(m.group(1)),"key":int(m.group(2)),"value":int(m.group(3))})
              return raw,rows
          xa,accbar=xml_rows("/tmp/xml/DGACCBAR.XML")
          xb,accbox=xml_rows("/tmp/xml/DGACCBOX.XML")
          assert len(accbar)==19 and len(accbox)==5
          assert [r["value"] for r in accbar]==[6,1,0,2,8,7,9,10,4,5,3,0,5,2,4,0,3,2,1]
          assert [r["value"] for r in accbox]==[1,3,0,2,4]

          def u16(b,o): return int.from_bytes(b[o:o+2],"little")
          def u32(b,o): return int.from_bytes(b[o:o+4],"little")
          FIXED={1:0,4:4,7:16}; LEN={16,17,19,24}
          def parse_payload(p):
              pos=0; props=[]; err=None
              while pos<len(p):
                  if len(p)-pos<2: err="truncated_tag"; break
                  tag=u16(p,pos); typ=(tag>>11)&31; opy=tag&0x7ff
                  rec={"type":typ,"opyid":opy}
                  if typ in FIXED:
                      need=2+FIXED[typ]
                      if pos+need>len(p): err="truncated_fixed"; break
                      if typ==4: rec["u32"]=u32(p,pos+2)
                      props.append(rec); pos+=need
                  elif typ in LEN:
                      if pos+6>len(p): err="truncated_len"; break
                      cb=u32(p,pos+2)
                      if cb<4 or pos+2+cb>len(p): err="bad_len"; break
                      rec["cb_after_tag"]=cb; rec["payload_len"]=cb-4
                      props.append(rec); pos+=2+cb
                  else:
                      err=f"unknown_type_{typ}"; break
              return props,len(p)-pos,err
          def parse_file(b):
              assert b.startswith(b"POCPB5")
              root=u32(b,0x10); rcb=u32(b,root); cur=root+rcb
              blocks=[]
              while cur<len(b):
                  cb=u32(b,cur); assert cb>=4 and cur+cb<=len(b)
                  props,resid,err=parse_payload(b[cur+4:cur+cb])
                  sig=tuple((p["type"],p["opyid"]) for p in props)+(("residual",resid),)
                  blocks.append({"index":len(blocks),"offset":cur,"cb":cb,"props":props,"residual_len":resid,"parse_stop":err,
                                 "signature":[list(x) if isinstance(x,tuple) else x for x in sig]})
                  cur+=cb
              assert cur==len(b)
              return blocks
          ab=parse_file(targets["ACCSBAR.POC"][0]); ax=parse_file(targets["ACCTBOX.POC"][0])
          assert len(ab)==95 and len(ax)==53

          vals=[r["value"] for r in accbar]
          groups=[ab[i:i+5] for i in range(0,95,5)]
          position_signature_uniques=[]
          exact_candidates=[]
          for pos in range(5):
              sigs=[json.dumps(g[pos]["signature"],sort_keys=True) for g in groups]
              position_signature_uniques.append({"position":pos,"unique_signature_count":len(set(sigs)),
                                                 "signature_run_lengths":[len(list(v)) for _,v in __import__("itertools").groupby(sigs)]})
              common=None
              for g in groups:
                  here={(p["opyid"],p["u32"]) for p in g[pos]["props"] if p["type"]==4 and "u32" in p}
                  opys={o for o,_ in here}
                  common=opys if common is None else common & opys
              for opy in sorted(common or []):
                  seq=[]
                  unique=True
                  for g in groups:
                      z=[p["u32"] for p in g[pos]["props"] if p["type"]==4 and p["opyid"]==opy and "u32" in p]
                      if len(z)!=1: unique=False; break
                      seq.append(z[0])
                  if unique and seq==vals:
                      exact_candidates.append({"position":pos,"type":4,"opyid":opy,"values":seq})
          group_sigs=[tuple(json.dumps(x["signature"],sort_keys=True) for x in g) for g in groups]
          family_ranges=[(0,11,"AccentBar"),(11,14,"Boxes"),(14,19,"Marquee")]
          family_signature_counts=[]
          for a,z,name in family_ranges:
              family_signature_counts.append({"family":name,"rows":z-a,"unique_group_signatures":len(set(group_sigs[a:z]))})

          # More permissive position-only value match: allow opyid to vary, but require exactly one scalar equal to XML value per group.
          position_value_matches=[]
          for pos in range(5):
              picks=[]
              ok=True
              for gi,g in enumerate(groups):
                  matching=[{"opyid":p["opyid"],"u32":p["u32"]} for p in g[pos]["props"] if p["type"]==4 and p.get("u32")==vals[gi]]
                  if len(matching)!=1: ok=False
                  picks.append(matching)
              if ok: position_value_matches.append({"position":pos,"unique_matching_scalar_each_group":True,"picks":picks})

          # ACCTBOX independent control: exact XML value sequence in any single type4/opyid scalar stream in block order.
          ctrl=[]
          byopy=collections.defaultdict(list)
          for blk in ax:
              for p in blk["props"]:
                  if p["type"]==4 and "u32" in p: byopy[p["opyid"]].append((blk["index"],p["u32"]))
          cvals=[r["value"] for r in accbox]
          for opy,seq in byopy.items():
              for i in range(len(seq)-4):
                  if [v for _,v in seq[i:i+5]]==cvals:
                      ctrl.append({"opyid":opy,"block_indices":[k for k,_ in seq[i:i+5]],"values":cvals})

          verdict="falsified_simple_19x5_state_slot"
          if exact_candidates: verdict="exact_structural_value_sequence_candidate"
          elif position_value_matches: verdict="partial_position_value_sequence_candidate"
          report={
            "schema":"chaptera.pubwiz-poc-xml-semantic-crosswalk.v1",
            "source_safe":True,"raw_inputs_retained":False,
            "inputs":{
              "ACCSBAR.POC":{"size":len(targets["ACCSBAR.POC"][0]),"sha256":targets["ACCSBAR.POC"][1],"sub_opls":len(ab)},
              "ACCTBOX.POC":{"size":len(targets["ACCTBOX.POC"][0]),"sha256":targets["ACCTBOX.POC"][1],"sub_opls":len(ax)},
              "DGACCBAR.XML":{"size":len(xa),"sha256":hashlib.sha256(xa).hexdigest(),"rows":len(accbar)},
              "DGACCBOX.XML":{"size":len(xb),"sha256":hashlib.sha256(xb).hexdigest(),"rows":len(accbox)},
              "xml_snapshot":"sdbjhksvbd/check@9a3f124df300d19c15b454b1c77808141929d46c"
            },
            "dgaccbar_rows":accbar,
            "dgaccbox_rows":accbox,
            "accsbar_95_eq_19x5":len(ab)==len(accbar)*5,
            "accsbar_position_signature_uniques":position_signature_uniques,
            "accsbar_family_signature_counts":family_signature_counts,
            "accsbar_exact_fixed_position_opyid_value_candidates":exact_candidates,
            "accsbar_position_only_value_candidates":position_value_matches,
            "acctbox_control_exact_stream_hits":ctrl,
            "verdict":verdict,
            "guardrail":"No numeric XML-key == POC-opyid semantic identity is inferred by this report."
          }
          pathlib.Path("out/report.json").write_text(json.dumps(report,indent=2))
          summary={k:report[k] for k in ["inputs","accsbar_95_eq_19x5","accsbar_position_signature_uniques","accsbar_family_signature_counts",
                                         "accsbar_exact_fixed_position_opyid_value_candidates","acctbox_control_exact_stream_hits","verdict","guardrail"]}
          pathlib.Path("out/summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          sha256sum out/*.json | sort > out/sha256sums.txt
      - name: Enforce source-safe artifact
        run: |
          set -euo pipefail
          if find out -type f \( -iname '*.poc' -o -iname '*.xml' \) | grep -q .; then exit 1; fi
          python - <<'PY'
          import json
          r=json.load(open("out/report.json"))
          assert r["source_safe"] is True and r["raw_inputs_retained"] is False
          assert r["inputs"]["ACCSBAR.POC"]["sub_opls"]==95
          assert r["inputs"]["DGACCBAR.XML"]["rows"]==19
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pubwiz-poc-xml-semantic-receipt
          path: out/**
          if-no-files-found: error
          retention-days: 90
