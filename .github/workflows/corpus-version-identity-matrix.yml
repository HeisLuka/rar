name: CORPUS version identity matrix

on:
  pull_request:
    paths:
      - 'tools/corpus/structural_novelty.py'
      - 'tools/corpus/version_identity_matrix.py'
      - 'tools/corpus/version_identity_matrix_media_roots.json'
      - 'tools/corpus/version_identity_matrix_family_overrides.json'
      - '.github/workflows/corpus-version-identity-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'tools/corpus/structural_novelty.py'
      - 'tools/corpus/version_identity_matrix.py'
      - 'tools/corpus/version_identity_matrix_media_roots.json'
      - 'tools/corpus/version_identity_matrix_family_overrides.json'
      - '.github/workflows/corpus-version-identity-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned generic CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Compile and run offline fail-closed contract
        run: |
          set -euo pipefail
          python -m py_compile tools/corpus/structural_novelty.py tools/corpus/version_identity_matrix.py
          python tools/corpus/version_identity_matrix.py self-test
