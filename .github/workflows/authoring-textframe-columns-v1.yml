name: Authoring TextFrame columns V1

on:
  pull_request:
    paths:
      - "packages/protocol/authoring-textframe-columns/**"
      - "services/editor-api/revision_store.py"
      - "services/editor-api/test_text_frame_columns.py"
      - ".github/workflows/authoring-textframe-columns-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run SetTextFrameColumns revision-kernel tests
        working-directory: services/editor-api
        run: python -m unittest -v test_text_frame_columns
      - name: Validate public intent schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator

          schema = json.load(open("packages/protocol/authoring-textframe-columns/v1/set-text-frame-columns-intent.schema.json"))
          Draft202012Validator.check_schema(schema)
          fixture = {
              "protocol_version": "chaptera.text-frame-columns-intent.v1",
              "document_id": "doc:1",
              "source_hash": "a" * 64,
              "base_revision_id": "sha256:" + "b" * 64,
              "client_operation_id": "columns-op-00000001",
              "command": {
                  "kind": "set_text_frame_columns",
                  "node_id": "frame:1",
                  "expected_before": {"column_count": 1, "gutter_emu": 0},
                  "after": {"column_count": 3, "gutter_emu": 91440},
              },
          }
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          print("SetTextFrameColumns intent schema valid")
          PY
