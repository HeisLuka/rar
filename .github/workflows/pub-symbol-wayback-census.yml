name: PUB Symbol Wayback Census\n\non:\n  push:\n    branches: [main]\n    paths:\n      - "tools/symbols/symbol_wayback_cdx.py"\n      - ".github/workflows/pub-symbol-wayback-census.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: pub-symbol-wayback-census-${{ github.ref }}\n  cancel-in-progress: false\n\njobs:\n  census:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    steps:\n      - uses: actions/checkout@v5\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n\n      - name: Validate script\n        run: |\n          set -euo pipefail\n          python -m py_compile tools/symbols/symbol_wayback_cdx.py\n\n      - name: Run exact-identity CDX census\n        run: |\n          set -euo pipefail\n          python tools/symbols/symbol_wayback_cdx.py \\\n            --out out/pub-symbol-wayback \\\n            --delay 0.20 \\\n            --limit 50\n          cat out/pub-symbol-wayback/summary.json\n\n      - name: Write summary\n        if: always()\n        run: |\n          echo "## Publisher exact-symbol Wayback census" >> "$GITHUB_STEP_SUMMARY"\n          cat out/pub-symbol-wayback/summary.json >> "$GITHUB_STEP_SUMMARY"\n\n      - name: Guard metadata-only artifact\n        if: always()\n        run: |\n          set -euo pipefail\n          bad="$(find out/pub-symbol-wayback -type f \\( -iname '*.pdb' -o -iname '*.pd_' -o -iname '*.exe' -o -iname '*.dll' -o -iname '*.cab' -o -iname '*.zip' -o -iname '*.7z' \\) -print || true)"\n          if [[ -n "$bad" ]]; then\n            echo "$bad" >&2\n            exit 4\n          fi\n\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: pub-symbol-wayback-${{ github.run_id }}\n          path: out/pub-symbol-wayback/**\n          if-no-files-found: error\n          retention-days: 90\n