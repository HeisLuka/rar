name: CLOUD-REVISION-01 durable artifacts

on:
  pull_request:
    paths:
      - "apps/chaptera-server/migrations/0007_derived_artifacts.sql"
      - "apps/chaptera-server/src/derived_artifacts.rs"
      - "apps/chaptera-server/src/schema_migration.rs"
      - "apps/chaptera-server/src/lib.rs"
      - "docs/cloud-revision-v1.md"
      - ".github/workflows/cloud-revision-durable-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -p chaptera-server -- --check
      - name: Run clippy
        run: cargo clippy -p chaptera-server --all-targets -- -D warnings
      - name: Run durable artifact tests
        run: cargo test -p chaptera-server derived_artifacts::
      - name: Run migration regressions
        run: cargo test -p chaptera-server schema_migration::
