name: Editor Object Select All V1

on:
  pull_request:
    paths:
      - "services/editor-api/editor_object_select_all_v1.py"
      - "services/editor-api/test_editor_object_select_all_v1.py"
      - "services/editor-api/editor_multi_select_v1.py"
      - "services/editor-api/editor_tool_routing_v1.py"
      - "services/editor-api/text_select_all_v1.py"
      - ".github/workflows/editor-object-select-all-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run object Select All focus-routing regressions
        working-directory: services/editor-api
        run: python -m unittest -v test_editor_object_select_all_v1 test_editor_multi_select_v1 test_editor_tool_routing_v1 test_text_select_all_v1
