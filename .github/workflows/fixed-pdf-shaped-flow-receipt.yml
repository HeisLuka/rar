name: Fixed PDF shaped-flow receipt V1

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/pub-fixed-flow-adapter/**"
      - "packages/protocol/fixed-output/**"
      - "tools/validate_fixed_pdf_shaped_flow_receipt.py"
      - "tools/test_fixed_pdf_shaped_flow_receipt.py"
      - ".github/workflows/fixed-pdf-shaped-flow-receipt.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run shaped-flow to fixed-PDF contract tests
        run: python tools/test_fixed_pdf_shaped_flow_receipt.py -v

  rust-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixed-pdf-shaped-flow-01
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install receipt validator dependency
        run: python -m pip install "jsonschema==4.23.0"
      - name: Apply rustfmt and push once
        run: |
          cargo fmt --all
          if ! git diff --quiet -- crates/pub-fixed-flow-adapter; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/pub-fixed-flow-adapter
            git commit -m "FIXED-PDF-SHAPED-FLOW-01: apply rustfmt"
            git push origin HEAD:fixed-pdf-shaped-flow-01
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test shaped-flow adapter
        run: cargo test -p pub-fixed-flow-adapter
