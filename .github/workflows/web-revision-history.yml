name: WEB-REVISION-01 history contract

on:
  pull_request:
    paths:
      - "services/editor-api/revision_store.py"
      - "services/editor-api/test_revision_store.py"
      - "tools/run_web_revision_history_contract.py"
      - "docs/web-revision-history-v1.md"
      - ".github/workflows/web-revision-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run revision kernel and dependent Editor API regressions
        working-directory: services/editor-api
        run: |
          python -m unittest -v \
            test_revision_store.py \
            test_authored_stack.py \
            test_editor_nudge_v1.py \
            test_multi_story_text_transaction_v1.py \
            test_create_picture_frame_v1.py \
            test_create_shape_container_v2.py \
            test_story_range_v1.py \
            test_move_nodes.py \
            test_text_frame_columns.py \
            test_story_edit_transaction_v1.py \
            test_document_text_replace_all_v1.py \
            test_story_find_replace_v1.py \
            test_delete_node.py \
            test_rotate_nodes_quarter_v1.py
      - name: Produce history transition receipt
        run: python tools/run_web_revision_history_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-revision-history-v1
          path: target/web-revision-history-v1/receipt.json
          if-no-files-found: error
