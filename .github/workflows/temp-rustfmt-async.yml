name: TEMP rustfmt async branch

on:
  push:
    branches:
      - "cloud-async-runtime-01-core"

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloud-async-runtime-01-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Format exact branch
        run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/chaptera-server/src/job_queue.rs apps/chaptera-server/src/lib.rs
          git commit -m "CLOUD-ASYNC-RUNTIME-01: apply rustfmt"
          git push origin HEAD:cloud-async-runtime-01-core
