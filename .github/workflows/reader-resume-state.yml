name: Reader Resume State V1

on:
  pull_request:
    paths:
      - "crates/chaptera-reader-resume-state/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/reader-resume-state.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resume-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/chaptera-reader-resume-state/Cargo.toml -- --check
      - name: Check
        run: cargo check --manifest-path crates/chaptera-reader-resume-state/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path crates/chaptera-reader-resume-state/Cargo.toml --all-targets -- -D warnings
      - name: Test resume authority
        run: cargo test --manifest-path crates/chaptera-reader-resume-state/Cargo.toml -- --nocapture
