name: PUB targeted acquisition

on:
  push:
    branches:
      - research/pub-acquisition-targeted
    paths:
      - ".github/workflows/pub-targeted-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  corel-filters-carve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Extract Corel X4 InstallShield payload and locate Filters.msi
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential git unshield msitools file
          mkdir -p out/iss out/unshield
          url="https://web.archive.org/web/20130509032142id_/http://www.corel.com/akdlm/6763/downloads/trials/GraphicsSuiteX4/CorelDRAWGraphicsSuiteX4Installer_EN.exe"
          curl -fL --retry 4 --retry-delay 5 --max-time 2400 "$url" -o out/corel.exe
          test "$(sha1sum out/corel.exe | awk '{print $1}')" = "9b1232bb63cf1257c447146da8e059297fcffa35"

          git clone -q https://github.com/hifi/iss_extract.git tools/iss_extract
          git -C tools/iss_extract checkout -q 01232146c9284a86958817817849f320e77f5fb7
          make -C tools/iss_extract
          tools/iss_extract/iss_extract l out/corel.exe | tee out/iss-list.txt
          (
            cd out/iss
            "$GITHUB_WORKSPACE/tools/iss_extract/iss_extract" x ../corel.exe || true
          ) | tee out/iss-extract.txt
          find out/iss -type f -printf '%s\t%p\n' | sort -nr > out/iss-files.txt

          # First, accept a directly embedded Filters.msi if present.
          filters="$(find out/iss -type f -iname 'Filters.msi' | head -n1 || true)"

          # Otherwise, descend into extracted InstallShield data cabinets.
          if [ -z "$filters" ]; then
            while IFS= read -r cab; do
              d="out/unshield/$(basename "$cab").d"
              mkdir -p "$d"
              (
                cd "$(dirname "$cab")"
                unshield x -d "$GITHUB_WORKSPACE/$d" "$(basename "$cab")"
              ) >"$d/unshield.log" 2>&1 || true
            done < <(find out/iss -type f -iname 'data*.cab' | sort)
            find out/unshield -type f -printf '%s\t%p\n' | sort -nr > out/unshield-files.txt
            filters="$(find out/unshield -type f -iname 'Filters.msi' | head -n1 || true)"
          fi

          # Some packages store component MSI under a non-obvious filename. Use ProductCode as fallback.
          if [ -z "$filters" ]; then
            : > out/msi-candidates.txt
            while IFS= read -r msi; do
              prop="out/$(basename "$msi").Property.txt"
              msiinfo export "$msi" Property > "$prop" 2>/dev/null || continue
              if grep -qi '7F05E704-30A6-421A-97A7-8EEB1C7FF017' "$prop"; then
                printf '%s\n' "$msi" | tee -a out/msi-candidates.txt
                filters="$msi"
                break
              fi
            done < <(find out/iss out/unshield -type f -iname '*.msi' | sort)
          fi

          test -n "$filters"
          cp "$filters" out/Filters.msi
          sha256sum out/Filters.msi | tee out/filters-sha256.txt
          sha1sum out/Filters.msi | tee out/filters-sha1.txt
          md5sum out/Filters.msi | tee out/filters-md5.txt
          stat -c 'size_bytes=%s' out/Filters.msi | tee out/filters-size.txt
          file out/Filters.msi | tee out/filters-file.txt
          msiinfo export out/Filters.msi Property > out/filters-Property.txt
          msiinfo export out/Filters.msi File > out/filters-File.txt || true
          msiinfo export out/Filters.msi Component > out/filters-Component.txt || true
          grep -Ei 'ProductCode|ProductName|ProductVersion|Manufacturer' out/filters-Property.txt | tee out/filters-property-summary.txt
          grep -Ei 'pub|publisher|cdrpub' out/filters-File.txt | tee out/filters-pub-hits.txt || true
          grep -Ei '7F05E704-30A6-421A-97A7-8EEB1C7FF017' out/filters-Property.txt | tee out/filters-productcode-hit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corel-x4-filters-${{ github.run_id }}
          path: |
            out/iss-list.txt
            out/iss-files.txt
            out/unshield-files.txt
            out/Filters.msi
            out/filters-*.txt
            out/msi-candidates.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  p2002-msi-help-map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Map Publisher 2002 MSI File table to VBAPB10 help payload
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full msitools iat
          mkdir -p out/container out/disc out/msi
          url="https://archive.org/download/X08-20172/2001-05_X08-20172_X08-06831_OFFICE10.7z"
          curl -fL --retry 4 --retry-delay 5 --max-time 2400 "$url" -o out/p2002.7z
          test "$(sha1sum out/p2002.7z | awk '{print $1}')" = "1ebbf5a8c188794e14a5ad2556bb751797034d0c"
          7z x -y out/p2002.7z -oout/container > /dev/null
          find out/container -type f -printf '%s\t%p\n' | sort -nr | tee out/container-files.txt
          mdf="$(find out/container -type f -iname '*.mdf' | head -n1 || true)"
          mds="$(find out/container -type f -iname '*.mds' | head -n1 || true)"
          test -n "$mdf"
          stat -c 'raw_size_bytes=%s' "$mdf" | tee out/raw-size.txt
          file "$mdf" | tee out/raw-file.txt
          if [ -n "$mds" ]; then
            sha256sum "$mds" | tee out/mds-sha256.txt
            stat -c 'mds_size_bytes=%s' "$mds" | tee out/mds-size.txt
          fi
          iat "$mdf" out/p2002.iso | tee out/iat.txt
          iso="out/p2002.iso"
          test -n "$iso"
          sha256sum "$iso" | tee out/iso-sha256.txt
          sha1sum "$iso" | tee out/iso-sha1.txt
          md5sum "$iso" | tee out/iso-md5.txt
          stat -c 'iso_size_bytes=%s' "$iso" | tee out/iso-size.txt
          file "$iso" | tee out/iso-file.txt
          7z x -y "$iso" -oout/disc > out/media-extract.txt 2>&1
          find out/disc -type f -iname '*.msi' -printf '%s\t%p\n' | sort -nr > out/msi-list.txt
          : > out/vbapb10-msi-hits.txt
          while IFS= read -r msi; do
            safe="$(basename "$msi")"
            msiinfo export "$msi" File > "out/msi/$safe.File.txt" 2>/dev/null || continue
            msiinfo export "$msi" Media > "out/msi/$safe.Media.txt" 2>/dev/null || true
            msiinfo export "$msi" Component > "out/msi/$safe.Component.txt" 2>/dev/null || true
            if grep -Ei 'VBAPB10|vbapb10|Publisher.*\.chm|\.chm' "out/msi/$safe.File.txt" > "out/msi/$safe.HelpHits.txt"; then
              echo "MSI=$msi" >> out/vbapb10-msi-hits.txt
              cat "out/msi/$safe.HelpHits.txt" >> out/vbapb10-msi-hits.txt
              echo "--- MEDIA ---" >> out/vbapb10-msi-hits.txt
              cat "out/msi/$safe.Media.txt" >> out/vbapb10-msi-hits.txt
            fi
          done < <(find out/disc -type f -iname '*.msi' | sort)
          cat out/vbapb10-msi-hits.txt
          grep -RaiE 'VBAPB10|VBAPB|VBA.*CHM' out/disc > out/raw-vbapb10-hits.txt || true
          head -n 300 out/raw-vbapb10-hits.txt || true

          # PUB.MSI maps English VBAPB10.CHM (656752 bytes) to OFFICE1.CAB.
          mkdir -p out/p2002-chm
          test -f out/disc/OFFICE1.CAB
          7z e -y out/disc/OFFICE1.CAB -oout/p2002-chm VBAPB10.CHM > out/vbapb10-extract.txt
          test -f out/p2002-chm/VBAPB10.CHM
          test "$(stat -c %s out/p2002-chm/VBAPB10.CHM)" -eq 656752
          cp out/p2002-chm/VBAPB10.CHM out/VBAPB10-P2002-1033.CHM
          sha256sum out/VBAPB10-P2002-1033.CHM | tee out/vbapb10-sha256.txt
          sha1sum out/VBAPB10-P2002-1033.CHM | tee out/vbapb10-sha1.txt
          md5sum out/VBAPB10-P2002-1033.CHM | tee out/vbapb10-md5.txt
          stat -c 'size_bytes=%s' out/VBAPB10-P2002-1033.CHM | tee out/vbapb10-size.txt
          file out/VBAPB10-P2002-1033.CHM | tee out/vbapb10-file.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2002-msi-help-map-${{ github.run_id }}
          path: |
            out/container-files.txt
            out/raw-*.txt
            out/iat.txt
            out/mds-*.txt
            out/iso-*.txt
            out/msi-list.txt
            out/vbapb10-msi-hits.txt
            out/raw-vbapb10-hits.txt
            out/vbapb10-extract.txt
            out/VBAPB10-P2002-1033.CHM
            out/vbapb10-*.txt
            out/msi/*.HelpHits.txt
            out/msi/*.Media.txt
          if-no-files-found: warn
          retention-days: 30

  p2003-english-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Search IA exact English Publisher 2003 media identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json, subprocess, urllib.parse
          from pathlib import Path
          queries = {
            "trial_part": '"X10-13869"',
            "trial_sku": '"099-91827"',
            "mvl": '"164-02924"',
            "retail": '"164-03341"',
            "trial_full": '"Microsoft Office Publisher 2003" AND "30-Day Trial"',
          }
          all_docs={}
          for name,q in queries.items():
              url="https://archive.org/advancedsearch.php?"+urllib.parse.urlencode([
                  ("q",q),("fl[]","identifier"),("fl[]","title"),("fl[]","description"),
                  ("rows","100"),("page","1"),("output","json")
              ])
              p=subprocess.run(["curl","-fsSL","--retry","3","--max-time","120",url],capture_output=True)
              Path(f"out/{name}.url.txt").write_text(url+"\n")
              Path(f"out/{name}.json").write_bytes(p.stdout)
              if p.returncode:
                  continue
              d=json.loads(p.stdout)
              docs=d.get("response",{}).get("docs",[])
              all_docs[name]={"numFound":d.get("response",{}).get("numFound"),"docs":docs}
          Path("out/summary.json").write_text(json.dumps(all_docs,indent=2,ensure_ascii=False))
          ids=[]
          for v in all_docs.values():
              for d in v["docs"]:
                  i=d.get("identifier")
                  if i and i not in ids: ids.append(i)
          Path("out/identifiers.txt").write_text("\n".join(ids)+"\n")
          print(json.dumps(all_docs,indent=2,ensure_ascii=False))
          PY
          : > out/candidates.txt
          while IFS= read -r ident; do
            [ -n "$ident" ] || continue
            curl -fsSL --retry 3 --max-time 120 "https://archive.org/metadata/$ident" -o "out/meta-$ident.json" || continue
            python3 - "$ident" "out/meta-$ident.json" <<'PY' >> out/candidates.txt
          import json,sys
          ident,path=sys.argv[1:]
          d=json.load(open(path))
          md=d.get("metadata",{})
          print("IDENT",ident)
          print("TITLE",md.get("title",""))
          for f in d.get("files",[]):
              n=f.get("name",""); sz=int(f.get("size") or 0)
              if f.get("source")=="original" and sz>50_000_000 and n.lower().endswith((".iso",".7z",".zip",".img",".mdf",".bin")):
                  print("FILE",sz,n,f.get("sha1",""),f.get("md5",""))
          print()
          PY
          done < out/identifiers.txt
          cat out/candidates.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2003-english-discovery-${{ github.run_id }}
          path: out/**
          if-no-files-found: warn
          retention-days: 30
