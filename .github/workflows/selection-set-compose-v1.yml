name: Selection Set Compose V1

on:
  pull_request:
    paths:
      - "services/editor-api/object_selection_target_v1.py"
      - "services/editor-api/object_selection_compose_v1.py"
      - "services/editor-api/test_object_selection_compose_v1.py"
      - ".github/workflows/selection-set-compose-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic selection set algebra tests
        working-directory: services/editor-api
        run: python -m unittest -v test_object_selection_compose_v1
      - name: Re-run selection target identity tests
        working-directory: services/editor-api
        run: python -m unittest -v test_object_selection_target_v1
