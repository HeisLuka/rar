name: Drain obsolete Actions generations

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/drain-obsolete-actions-v1.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: drain-obsolete-actions-generations
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete PR-head runs from the queue storm
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          preserve_file="$(mktemp)"
          trap 'rm -f "$preserve_file"' EXIT

          for pr in 767 770 772; do
            state="$(gh api --method GET "repos/$GH_REPO/pulls/$pr" --jq '.state')"
            if [[ "$state" == "open" ]]; then
              gh api --method GET "repos/$GH_REPO/pulls/$pr" --jq '.head.sha' >>"$preserve_file"
            fi
          done

          sort -u "$preserve_file" -o "$preserve_file"
          echo "Preserving current open-PR heads:"
          cat "$preserve_file" || true

          is_target_branch() {
            case "$1" in
              cloud-source-ingress-serve-v1|              cloud-source-ingress-serve-v2|              cloud-source-validation-job-v1|              cloud-source-validation-job-v2|              cloud-source-validation-job-v3|              package-self-contained-local-01|              package-self-contained-local-01-v2|              ci/pr-latest-head-concurrency-v1)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          cancelled=0
          preserved=0

          for status in queued in_progress; do
            page=1
            while :; do
              payload="$(gh api --method GET "repos/$GH_REPO/actions/runs"                 -f status="$status"                 -f per_page=100                 -f page="$page")"

              count="$(jq '.workflow_runs | length' <<<"$payload")"
              [[ "$count" -gt 0 ]] || break

              while IFS=$'\t' read -r id event head_branch head_sha name; do
                [[ "$event" == "pull_request" ]] || continue
                is_target_branch "$head_branch" || continue

                if grep -Fxq "$head_sha" "$preserve_file"; then
                  echo "KEEP   $id  $head_branch  ${head_sha:0:12}  $name"
                  preserved=$((preserved + 1))
                  continue
                fi

                echo "CANCEL $id  $head_branch  ${head_sha:0:12}  $name"
                if gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" >/dev/null; then
                  cancelled=$((cancelled + 1))
                else
                  echo "::warning::Could not cancel run $id; it may have completed concurrently."
                fi
              done < <(
                jq -r '.workflow_runs[] | [.id, .event, (.head_branch // ""), .head_sha, .name] | @tsv' <<<"$payload"
              )

              [[ "$count" -eq 100 ]] || break
              page=$((page + 1))
            done
          done

          echo "Cancelled obsolete runs: $cancelled"
          echo "Preserved current-head runs: $preserved"
