name: CLOUD-JOBS-SERVE-RUNTIME-01

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/jobs_runtime.rs"
      - ".github/workflows/cloud-jobs-serve-runtime-v1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  jobs-serve-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - name: Prove serve-side durable export jobs runtime
        run: cargo test -p chaptera-server jobs_runtime:: -- --nocapture
