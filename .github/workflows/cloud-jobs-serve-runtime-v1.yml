name: CLOUD-JOBS-SERVE-RUNTIME-01

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/jobs_runtime.rs"
      - "apps/chaptera-server/src/lib.rs"
      - ".github/workflows/cloud-jobs-serve-runtime-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jobs-serve-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - name: Check chaptera-server formatting
        run: cargo fmt -p chaptera-server -- --check
      - name: Lint chaptera-server
        run: cargo clippy -p chaptera-server --all-targets -- -D warnings
      - name: Prove serve-side durable export jobs runtime
        run: cargo test -p chaptera-server jobs_runtime:: -- --nocapture
