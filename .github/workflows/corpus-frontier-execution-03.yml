name: CORPUS frontier execution 03

on:
  push:
    branches: [corpus-frontier-execution-03]
    paths:
      - '.github/workflows/corpus-frontier-execution-03.yml'

permissions:
  contents: read
  actions: read

jobs:
  domains-discover:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover positive-domain shard
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/corpus/positive_domain_pub_seed.py \
            --seed tools/corpus/public_legacy_seed.csv \
            --seed tools/corpus/smoke_seed.csv \
            --max-domains 100 --max-pages-per-domain 150 --max-depth 2 \
            --max-candidates-per-domain 200 --delay 0.5 \
            --shard-index "${{ matrix.shard }}" --shard-count 4 \
            --out "out/domain_seed-${{ matrix.shard }}.csv" \
            --summary "out/domain-${{ matrix.shard }}.summary.json"
          cat "out/domain-${{ matrix.shard }}.summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-domain-seed-${{ github.run_id }}-${{ matrix.shard }}
          path: out/**
          retention-days: 14

  domains-harvest:
    needs: domains-discover
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: frontier-domain-seed-${{ github.run_id }}-${{ matrix.shard }}
          path: seed
      - name: Harvest positive-domain shard
        run: |
          set -euo pipefail
          python tools/corpus/harvest_pub.py \
            --seed "seed/domain_seed-${{ matrix.shard }}.csv" \
            --out out/harvest --max-files -1 --timeout 25 \
            --max-bytes 104857600 --per-host-delay 0.5
      - name: Remove raw bytes
        if: always()
        run: |
          find out/harvest -type f ! -name 'manifest.json' ! -name 'manifest.csv' -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-domain-manifest-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            out/harvest/manifest.json
            out/harvest/manifest.csv
          if-no-files-found: error
          retention-days: 30

  domains-aggregate:
    if: always()
    needs: domains-harvest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frontier-domain-manifest-${{ github.run_id }}-*
          path: combined
      - name: Aggregate domain yield
        run: |
          python - <<'PY'
          import glob,json
          from collections import Counter
          from pathlib import Path
          rows=[]
          for p in glob.glob("combined/**/manifest.json",recursive=True):
              rows.extend(json.loads(Path(p).read_text()))
          summary={
            "schema":"rar-frontier-domain-union-v1",
            "manifest_rows":len(rows),
            "unique_sha256":len({r.get("sha256") for r in rows if r.get("sha256")}),
            "classification":dict(Counter(r.get("classification","") for r in rows)),
            "fetch_status":dict(Counter(r.get("fetch_status","") for r in rows)),
            "domains":len({r.get("crawl_domain","") for r in rows if r.get("crawl_domain")}),
          }
          Path("aggregate").mkdir()
          Path("aggregate/manifest.json").write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          Path("aggregate/summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-domain-union-${{ github.run_id }}
          path: aggregate/**
          retention-days: 30

  container-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: container-vacuum-35950494964
          path: base
          github-token: ${{ github.token }}
          run-id: 35950494964
      - name: Slice rows 101+
        run: |
          mkdir -p seeds
          python - <<'PY'
          import csv,json
          from pathlib import Path
          with Path("base/ia_containers.csv").open(encoding="utf-8-sig",newline="") as fh:
              rd=csv.DictReader(fh); fields=rd.fieldnames or []; rows=list(rd)
          rem=rows[100:]
          counts=[]
          for s in range(4):
              part=[r for i,r in enumerate(rem) if i%4==s]
              with Path(f"seeds/shard-{s}.csv").open("w",encoding="utf-8",newline="") as fh:
                  wr=csv.DictWriter(fh,fieldnames=fields); wr.writeheader(); wr.writerows(part)
              counts.append(len(part))
          summary={"total_seed_rows":len(rows),"remaining_rows":len(rem),"shard_rows":counts}
          Path("seeds/summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-container-seeds-${{ github.run_id }}
          path: seeds/**
          retention-days: 14

  container-extract:
    needs: container-prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y p7zip-full
      - uses: actions/download-artifact@v4
        with:
          name: frontier-container-seeds-${{ github.run_id }}
          path: seed
      - name: Extract remaining container shard
        run: |
          mkdir -p out
          python tools/corpus/pub_container_extract.py \
            --seed "seed/shard-${{ matrix.shard }}.csv" \
            --out out/container_manifest.json \
            --max-containers 100 --max-depth 2 \
            --max-container-bytes 314572800 --max-member-bytes 104857600 \
            --max-total-expanded 524288000 --max-members 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-container-manifest-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            out/container_manifest.json
            out/container_manifest.csv
            out/container_manifest.summary.json
          if-no-files-found: error
          retention-days: 30

  container-aggregate:
    if: always()
    needs: container-extract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-vacuum-35950494964
          path: base
          github-token: ${{ github.token }}
          run-id: 35950494964
      - uses: actions/download-artifact@v4
        with:
          pattern: frontier-container-manifest-${{ github.run_id }}-*
          path: resumed
      - name: Build full container union
        run: |
          python - <<'PY'
          import glob,json
          from collections import Counter
          from pathlib import Path
          base=json.loads(Path("base/container_manifest.json").read_text())
          resumed=[]
          for p in glob.glob("resumed/**/container_manifest.json",recursive=True):
              resumed.extend(json.loads(Path(p).read_text()))
          rows=base+resumed
          members=[r for r in rows if r.get("row_kind")=="container_member"]
          errors=[r for r in rows if str(r.get("row_kind","")).endswith("error")]
          summary={
            "schema":"rar-frontier-container-union-v1",
            "base_rows":len(base),"resume_rows":len(resumed),"union_rows":len(rows),
            "publisher_member_rows":sum(r.get("classification")=="cfb_publisher_hint" for r in members),
            "unique_member_sha256":len({r.get("sha256") for r in members if r.get("sha256")}),
            "error_rows":len(errors),
            "error_prefixes":dict(Counter(str(r.get("error","")).split(":")[0][:120] for r in errors)),
          }
          Path("union").mkdir()
          Path("union/manifest.json").write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          Path("union/summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-container-union-${{ github.run_id }}
          path: union/**
          retention-days: 30
