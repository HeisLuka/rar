name: TEMP retry Rar M1 direct0

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-retry-rar-m1-direct0.yml'

permissions:
  contents: read
  actions: read

jobs:
  retry-direct0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Retry shard zero up to three times
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          rc=1
          for n in 1 2 3; do
            rm -rf out/direct-0
            python tools/corpus/tmp_export_rar_union.py direct --shard 0 --shard-count 4 --out out/direct-0
            rc=$?
            [ $rc -eq 0 ] && break
            sleep 10
          done
          echo $rc > out/direct-0/exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: rar-m1-direct-0-retry
          path: out/direct-0/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6