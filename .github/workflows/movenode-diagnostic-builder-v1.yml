name: MoveNode diagnostic builder V1

on:
  pull_request:
    paths:
      - "tools/build_movenode_diagnostic_receipt.py"
      - "tools/test_build_movenode_diagnostic_receipt.py"
      - "tools/operation_blast_radius_v1.py"
      - "tools/validate_movenode_diagnostic_receipt.py"
      - "tools/corpus/cfb_physical_diff.py"
      - "packages/protocol/operation-blast-radius/**"
      - "packages/protocol/movenode-diagnostic/**"
      - ".github/workflows/movenode-diagnostic-builder-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install "jsonschema==4.23.0"
      - name: Compile diagnostic builder
        run: |
          python -m py_compile tools/build_movenode_diagnostic_receipt.py
          python -m py_compile tools/test_build_movenode_diagnostic_receipt.py
      - name: Run diagnostic builder regressions
        run: python tools/test_build_movenode_diagnostic_receipt.py -v
