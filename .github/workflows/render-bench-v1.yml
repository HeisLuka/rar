name: RENDER-BENCH-01 RenderScene benchmark

on:
  pull_request:
    paths:
      - "tools/render_bench_v1.py"
      - "tools/run_render_bench_contract.py"
      - "tools/render_scene_v1.py"
      - "tools/scene_patch_v1.py"
      - "tools/optimization_receipt_v1.py"
      - "tools/run_optimization_spine_contract.py"
      - "tools/glyph_runtime_v1.py"
      - "tools/test_glyph_runtime_v1.py"
      - "tools/run_glyph_runtime_benchmark.py"
      - "docs/render-bench-v1.md"
      - "docs/optimization-regression-spine-v1.md"
      - ".github/workflows/render-bench-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RenderScene and ScenePatch benchmark matrix
        run: python tools/run_render_bench_contract.py
      - name: Normalize benchmark into optimization measurement snapshot
        run: python tools/run_optimization_spine_contract.py
      - name: Unit-test glyph runtime
        working-directory: tools
        run: python test_glyph_runtime_v1.py
      - name: Run glyph runtime benchmark
        run: mkdir -p target/glyph-runtime && PYTHONPATH=tools python tools/run_glyph_runtime_benchmark.py | tee target/glyph-runtime/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: glyph-runtime-${{ github.run_id }}
          path: target/glyph-runtime/receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: render-bench-v1-receipt
          path: target/render-bench-v1/receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: optimization-spine-render-bench-measurement
          path: target/optimization-spine-v1/render-bench-measurement.json
          if-no-files-found: error
