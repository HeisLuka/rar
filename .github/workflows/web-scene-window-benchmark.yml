name: WEB-SCENE-SCALE-01 page-window comparison

on:
  pull_request:
    paths:
      - "apps/web/render-benchmark.html"
      - "apps/web/render-v1.mjs"
      - "tools/run_web_scene_window_benchmark.mjs"
      - ".github/workflows/web-scene-window-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  window-benchmark:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit-test render contract
        run: node --test apps/web/render-v1.test.mjs
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run full-scene vs 3-page window comparison
        run: node tools/run_web_scene_window_benchmark.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-scene-window-benchmark-${{ matrix.browser }}
          path: target/web-scene-window/${{ matrix.browser }}-receipt.json
          if-no-files-found: error
