name: LAYOUT-PROJECTION-INDEX-01

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-layout/**"
      - ".github/workflows/layout-projection-index-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-projection-index:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/producer-a
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check pub-layout formatting
        run: cargo fmt -p pub-layout -- --check
      - name: Check pub-layout
        run: cargo check -p pub-layout --all-targets
      - name: Lint pub-layout
        run: cargo clippy -p pub-layout --all-targets -- -D warnings
      - name: Test exact projection semantics
        run: cargo test -p pub-layout
      - name: Run 1k 10k 50k projection-index benchmark
        env:
          LAYOUT_PROJECTION_INDEX_RECEIPT: target/layout-projection-index/benchmark.json
        run: cargo test -p pub-layout --test projection_index_benchmark -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: layout-projection-index-v1
          path: vendor/producer-a/target/layout-projection-index/benchmark.json
          if-no-files-found: error
