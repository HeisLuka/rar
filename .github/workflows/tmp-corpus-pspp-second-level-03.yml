name: TEMP Publisher PSPP second-level archive crawl

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect proven PSPP second-level HTML captures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          UA="rar-pub-pspp-second-level/2.0"
          # Twelve exact prepress/default captures were proven by #725.
          proven=[
            ("20000521152700","http://office.microsoft.com:80/publisher/prepress/default.htm"),
            ("20000925125640","http://office.microsoft.com:80/publisher/prepress/default.htm"),
            ("20001011004151","http://office.microsoft.com:80/publisher/prepress/default.htm"),
            ("20011112120001","http://office.microsoft.com:80/publisher/prepress/default.htm"),
            ("20011117034621","http://office.microsoft.com:80/publisher/prepress/default.htm"),
            ("20011205094135","http://office.microsoft.com:80/publisher/prepress/default.htm"),
            ("20020204190029","http://office.microsoft.com:80/publisher/prepress/default.htm"),
            ("20020406004115","http://office.microsoft.com:80/publisher/prepress/default.htm"),
            ("20021014102307","http://office.microsoft.com:80/publisher/prepress/default.htm"),
            ("20030417165339","http://office.microsoft.com:80/publisher/prepress/default.htm"),
            ("20030604153844","http://office.microsoft.com:80/publisher/prepress/default.htm"),
            ("20081203191701","http://office.microsoft.com/publisher/prepress/default.htm"),
            # Parent redirect timestamps from #725; raw replay may resolve to nearest target capture.
            ("20010814023300","http://office.microsoft.com/publisher/prepress/AboutPSPP.htm"),
            ("20010504171753","http://microsoft.saltmine.com/publisher/pspp/list/usersearchcriteria.asp"),
          ]
          attr_re=re.compile(r'''(?is)\b(?:href|src|action)\s*=\s*["']([^"']+)["']''')
          refresh_re=re.compile(r'''(?is)http-equiv\s*=\s*["']refresh["'][^>]*content\s*=\s*["'][^"']*url\s*=\s*([^"';>\s]+)''')
          carrier_re=re.compile(r'\.(?:pub|zip|cab|exe|msi|iso|img|bin|cue|7z|rar)(?:$|[?#])',re.I)
          relevant_re=re.compile(r'(publisher|pspp|prepress|printer|service.?provider|training|download|sample|exercise|kit|resource|support|member|file)',re.I)

          pages=[]; observed=[]; errors=[]
          for ts,original in proven:
            replay=f"https://web.archive.org/web/{ts}id_/{original}"
            row={"timestamp":ts,"original":original,"replay":replay}
            try:
              req=Request(replay,headers={"User-Agent":UA,"Accept":"text/html,*/*;q=0.1"})
              with urlopen(req,timeout=20) as r:
                body=r.read(1024*1024)
                row["status"]=getattr(r,"status",None)
                row["final_url"]=r.geturl()
                row["content_type"]=r.headers.get("Content-Type")
              row["length"]=len(body)
              text=body.decode("utf-8","replace")
              vals=[m.group(1) for m in attr_re.finditer(text)]
              vals += [m.group(1) for m in refresh_re.finditer(text)]
              links=[]
              for v in vals:
                v=html.unescape(v.strip())
                if not v or v.startswith(("#","javascript:","mailto:")): continue
                u=urljoin(original,v)
                links.append(u)
                observed.append({"source_timestamp":ts,"source_page":original,"url":u})
              row["links"]=sorted(set(links))
              row["preview"]=text[:2000]
            except Exception as e:
              row["error"]=f"{type(e).__name__}: {e}"
              errors.append({"timestamp":ts,"url":original,"error":row["error"]})
            pages.append(row)
            time.sleep(.15)

          seen=set(); links=[]
          for r in observed:
            k=r["url"].casefold()
            if k in seen: continue
            seen.add(k)
            u=r["url"]
            links.append({**r,
              "carrier_like":bool(carrier_re.search(u)),
              "relevant_like":bool(relevant_re.search(u))
            })

          carriers=[x for x in links if x["carrier_like"]]
          relevant=[x for x in links if x["relevant_like"]]
          summary={
            "schema":"chaptera.corpus-pspp-second-level.v2",
            "source_safe":True,
            "raw_binary_retained":False,
            "proven_replay_count":len(proven),
            "pages_fetched":sum("error" not in x for x in pages),
            "unique_observed_links":len(links),
            "carrier_rows":carriers,
            "relevant_rows":relevant,
            "errors":errors,
            "guardrail":"Only exact/proven PSPP/prepress replay surfaces are opened. No observed linked body is downloaded or executed."
          }
          Path("out/summary.json").write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding="utf-8")
          Path("out/pages.json").write_text(json.dumps(pages,indent=2,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - name: Metadata-only guard
        shell: bash
        run: |
          set -euo pipefail
          if find out -type f \( -iname '*.pub' -o -iname '*.zip' -o -iname '*.cab' -o -iname '*.exe' -o -iname '*.msi' -o -iname '*.iso' -o -iname '*.img' -o -iname '*.7z' -o -iname '*.rar' \) | grep -q .; then
            echo 'unexpected carrier bytes in locator artifact' >&2
            exit 1
          fi
          sha256sum out/* | sort > out/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-pspp-second-level
          path: out/**
          retention-days: 60
          if-no-files-found: error
