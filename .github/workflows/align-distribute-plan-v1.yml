name: Align Distribute Plan V1

on:
  pull_request:
    paths:
      - "services/editor-api/align_distribute_plan_v1.py"
      - "services/editor-api/test_align_distribute_plan_v1.py"
      - ".github/workflows/align-distribute-plan-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact align/distribute planner tests
        working-directory: services/editor-api
        run: python -m unittest -v test_align_distribute_plan_v1
