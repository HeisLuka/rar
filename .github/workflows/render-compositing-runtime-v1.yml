name: Render Compositing Runtime V1

on:
  pull_request:
    paths:
      - "tools/render_compositing_runtime_v1.py"
      - "tools/test_render_compositing_runtime_v1.py"
      - "tools/run_render_compositing_runtime_receipt.py"
      - "tools/render_effect_ir_v1.py"
      - "tools/render_scene_v1.py"
      - "tools/scene_patch_v1.py"
      - "tools/render_segment_plan_v1.py"
      - "tools/render_color_contract_v1.py"
      - ".github/workflows/render-compositing-runtime-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test compositing runtime
        run: PYTHONPATH=tools python -m unittest -v tools/test_render_compositing_runtime_v1.py
      - name: Re-run EffectIR/ScenePatch/SegmentPlan regressions
        run: PYTHONPATH=tools python -m unittest -v tools/test_render_effect_ir_v1.py tools/test_scene_patch_v1.py tools/test_render_segment_plan_v1.py
      - name: Re-run color contract
        run: PYTHONPATH=tools python -m unittest -v tools/test_render_color_contract_v1.py
      - name: Emit compositing runtime receipt
        run: mkdir -p target/render-compositing-runtime && PYTHONPATH=tools python tools/run_render_compositing_runtime_receipt.py | tee target/render-compositing-runtime/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: render-compositing-runtime-${{ github.run_id }}
          path: target/render-compositing-runtime/receipt.json
          if-no-files-found: error
