name: Chaptera ResizeNode producer receipt

on:
  pull_request:
    paths:
      - "packages/protocol/editor-resize/**"
      - "tools/validate_resize_node_producer_receipt.py"
      - "tools/test_resize_node_producer_receipt.py"
      - "tools/build_resize_node_producer_receipt.py"
      - "tools/test_build_resize_node_producer_receipt.py"
      - "services/editor-api/revision_store.py"
      - "services/editor-api/test_revision_store.py"
      - "docs/chaptera-editor-resize-node-v1.md"
      - "vendor/producer-a/crates/pub-editor/src/lib.rs"
      - "vendor/producer-a/crates/pub-editor/src/writer_assessment.rs"
      - "vendor/producer-a/crates/pub-editor/tests/resize_node_v1.rs"
      - "apps/chaptera-desktop/src/agent.rs"
      - "tools/chaptera-resize-producer/**"
      - "tools/run_local_resize_node_receipt.ps1"
      - ".github/workflows/editor-resize-node.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - run: python -m pip install jsonschema
      - name: Test active Rar ResizeNode core
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --test resize_node_v1
      - name: Smoke current-Rar ResizeNode producer on pinned public PUB
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/SampleNewsletter.pub"
          curl -fsSL "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" -o "$fixture"
          echo "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf  $fixture" | sha256sum -c -
          test "$(wc -c < "$fixture")" -eq 291840
          CHAPTERA_SAMPLE_NEWSLETTER="$fixture" cargo test --manifest-path tools/chaptera-resize-producer/Cargo.toml --target-dir target real_sample_contract -- --ignored --nocapture

      - name: Validate ResizeNode receipt contract
        run: python -m unittest tools/test_resize_node_producer_receipt.py
      - name: Validate ResizeNode revision envelope
        run: python services/editor-api/test_revision_store.py -v
      - name: Validate local ResizeNode producer orchestration
        run: python tools/test_build_resize_node_producer_receipt.py -v
      - name: Validate retained real ResizeNode receipts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          receipts=(packages/protocol/editor-resize/v1/producer-receipts/*.json)
          for receipt in "${receipts[@]}"; do
            python tools/validate_resize_node_producer_receipt.py "$receipt"
          done
          echo "validated_real_receipts=${#receipts[@]}"

  windows-producer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Acquire pinned Apache POI SampleNewsletter
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          $url = "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub"
          Invoke-WebRequest -Uri $url -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $fixture).Length
          if ($hash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") {
            throw "SampleNewsletter SHA-256 mismatch: $hash"
          }
          if ($bytes -ne 291840) {
            throw "SampleNewsletter byte length mismatch: $bytes"
          }
          "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Smoke current-Rar ResizeNode producer on Windows
        shell: pwsh
        run: cargo test --manifest-path tools/chaptera-resize-producer/Cargo.toml --target-dir target real_sample_contract -- --ignored --nocapture
