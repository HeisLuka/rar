name: Legacy22 No-Quill Reader SourceGraph

on:
  pull_request:
    paths:
      - 'vendor/producer-a/crates/pub-contents/**'
      - 'vendor/producer-a/crates/pub-reader/**'
      - 'vendor/producer-a/crates/pub-viewer/**'
      - 'apps/chaptera-desktop/**'
      - '.github/workflows/legacy22-noquill-sourcegraph.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publisher97-noquill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Format new no-Quill graph module
        run: rustfmt --check --edition 2024 vendor/producer-a/crates/pub-reader/src/legacy22_noquill_graph.rs

      - name: Test no-Quill bounded units
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-reader legacy22_noquill_graph
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-contents legacy22

      - name: Reacquire exact public Publisher97 OPNHOUS fixture
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, time, urllib.parse, urllib.request
          from pathlib import Path

          UA="chaptera-legacy22-noquill/1.0"
          SECTOR=2048
          URL="https://archive.org/download/PUB40CD/PUB_40_CD.ISO"
          MEMBER="PAGEWIZ/OPNHOUS.PUB"
          EXPECTED_SHA="0c74bed1b862f4603a77567f817ad22bf1f7c42eb5afbee0c907732953534b5c"
          EXPECTED_SIZE=11264

          def candidates(url):
              p=urllib.parse.urlparse(url); parts=p.path.split("/")
              ident=parts[2]; filename="/".join(parts[3:])
              req=urllib.request.Request(f"https://archive.org/metadata/{ident}",headers={"User-Agent":UA})
              with urllib.request.urlopen(req,timeout=30) as r: meta=json.load(r)
              out=[]
              directory=str(meta.get("dir") or "")
              for key in ("d1","d2"):
                  host=str(meta.get(key) or "")
                  if host and directory:
                      out.append("https://"+host+directory.rstrip("/")+"/"+urllib.parse.quote(filename,safe="/"))
              out += [url,url+"?download=1"]
              return list(dict.fromkeys(out))

          def read_range(url,start,size):
              req=urllib.request.Request(url,headers={
                  "User-Agent":UA,
                  "Range":f"bytes={start}-{start+size-1}",
                  "Accept-Encoding":"identity",
              })
              with urllib.request.urlopen(req,timeout=45) as r:
                  if getattr(r,"status",None)!=206 and not r.headers.get("Content-Range"):
                      raise RuntimeError("range unsupported")
                  data=r.read(size+1)
              if len(data)!=size:
                  raise RuntimeError(f"range length drift: {len(data)} != {size}")
              return data

          delivery=None
          last=None
          for url in candidates(URL):
              for attempt in range(3):
                  try:
                      pvd=read_range(url,16*SECTOR,SECTOR)
                      if pvd[:6]!=b"\x01CD001":
                          raise RuntimeError("bad ISO9660 PVD")
                      delivery=url
                      break
                  except Exception as e:
                      last=e
                      if attempt<2: time.sleep(2**attempt)
              if delivery: break
          if not delivery: raise last

          cache={}
          def rr(start,size):
              last=None
              for attempt in range(3):
                  try: return read_range(delivery,start,size)
                  except Exception as e:
                      last=e
                      if attempt<2: time.sleep(2**attempt)
              raise last

          def record(raw):
              name=raw[33:33+raw[32]].decode("ascii","strict")
              extent=int.from_bytes(raw[2:6],"little")
              size=int.from_bytes(raw[10:14],"little")
              flags=raw[25]
              return name,extent,size,flags

          def directory(extent,size):
              key=(extent,size)
              if key in cache: return cache[key]
              data=rr(extent*SECTOR,size); out={}; pos=0
              while pos<len(data):
                  n=data[pos]
                  if not n:
                      pos=((pos//SECTOR)+1)*SECTOR
                      continue
                  name,e,s,f=record(data[pos:pos+n])
                  if name not in ("\x00","\x01"):
                      out[name.split(";")[0].upper()]=(e,s,f)
                  pos+=n
              cache[key]=out
              return out

          pvd=rr(16*SECTOR,SECTOR)
          root_len=pvd[156]
          _,extent,size,flags=record(pvd[156:156+root_len])
          parts=MEMBER.split("/")
          for index,part in enumerate(x.upper() for x in parts):
              extent,size,flags=directory(extent,size)[part]
              if index+1<len(parts) and not flags&2:
                  raise RuntimeError("intermediate path is not directory")
          if flags&2: raise RuntimeError("target is directory")
          data=rr(extent*SECTOR,size)
          if len(data)!=EXPECTED_SIZE: raise RuntimeError("size drift")
          if hashlib.sha256(data).hexdigest()!=EXPECTED_SHA: raise RuntimeError("sha drift")
          Path("/tmp/opnhous.pub").write_bytes(data)
          print(f"exact OPNHOUS acquired via {delivery}")
          PY

      - name: Prove exact Publisher97 Reader product-open
        env:
          CHAPTERA_OPNHOUS_PUB: /tmp/opnhous.pub
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer exact_opnhous_publisher97_noquill_product_open -- --ignored --nocapture

      - name: Compile desktop Reader consumer
        run: cargo check -p chaptera-desktop --features reader-only
