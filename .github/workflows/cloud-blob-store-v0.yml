name: Cloud blob store V0

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/blob_store.rs"
      - "apps/chaptera-server/src/sqlite_blob_metadata.rs"
      - "apps/chaptera-server/tests/sqlite_blob_metadata.rs"
      - "apps/chaptera-server/Cargo.toml"
      - "apps/chaptera-server/migrations/0002_blob_store.sql"
      - ".github/workflows/cloud-blob-store-v0.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Run BlobStore regression suite
        run: cargo test -p chaptera-server blob_store:: -- --nocapture
      - name: Run durable blob metadata repository laws
        run: cargo test -p chaptera-server --test sqlite_blob_metadata -- --nocapture
