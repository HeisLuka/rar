name: PUB current corpus authority

on:
  pull_request:
    paths:
      - 'tools/corpus/receipts/corpus-current-authority-2026-09-24.json'
      - 'tools/corpus/receipts/container-net-new-407-part-*.sha256.txt'
      - 'tools/corpus/test_corpus_current_authority.py'
      - '.github/workflows/corpus-current-authority.yml'
  push:
    branches: [main]
    paths:
      - 'tools/corpus/receipts/corpus-current-authority-2026-09-24.json'
      - 'tools/corpus/receipts/container-net-new-407-part-*.sha256.txt'
      - 'tools/corpus/test_corpus_current_authority.py'
      - '.github/workflows/corpus-current-authority.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/corpus/test_corpus_current_authority.py
