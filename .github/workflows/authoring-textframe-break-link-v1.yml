name: Authoring TextFrame Break Link V1

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-editor/src/lib.rs"
      - "vendor/producer-a/crates/pub-editor/tests/break_text_frame_forward_link_v1.rs"
      - "vendor/producer-a/producer/tests/break_link_layout_v1.rs"
      - ".github/workflows/authoring-textframe-break-link-v1.yml"
  push:
    branches:
      - feature/authoring-textframe-break-link-01

concurrency:
  group: authoring-textframe-break-link-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  break-link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test BreakTextFrameForwardLink lifecycle
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml             -p pub-editor             --test break_text_frame_forward_link_v1
      - name: Test existing pub-editor regressions
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --lib
      - name: Prove layout recomputes upstream overset after split
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml \
            -p chaptera-producer-a \
            --test break_link_layout_v1
