name: PUB-LAB-2019 VMware reset contract

on:
  pull_request:
    paths:
      - "packages/protocol/pub-lab-2019/**"
      - "tools/pub_lab_2019_vmware_reset.ps1"
      - "tools/validate_pub_lab_2019_reset_receipt.py"
      - "tools/test_pub_lab_2019_reset_receipt.py"
      - ".github/workflows/pub-lab-2019-reset-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema==4.23.0"
      - name: Validate reset receipt contract
        run: |
          python -m unittest tools/test_pub_lab_2019_reset_receipt.py -v
          python tools/validate_pub_lab_2019_reset_receipt.py packages/protocol/pub-lab-2019/v1/synthetic-reset-receipt.json
      - name: Parse PowerShell adapter
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/pub_lab_2019_vmware_reset.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
