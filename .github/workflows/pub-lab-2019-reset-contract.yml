name: PUB-LAB-2019 VMware reset contract

on:
  pull_request:
    paths:
      - "packages/protocol/pub-lab-2019/**"
      - "tools/pub_lab_2019_vmware_reset.ps1"
      - "tools/pub_lab_2019_vmware_reset_provider.ps1"
      - "tools/validate_pub_lab_2019_vmware_evidence.py"
      - "tools/test_pub_lab_2019_vmware_evidence.py"
      - "tools/validate_pub_lab_2019_restore_pair.py"
      - "tools/test_pub_lab_2019_restore_pair.py"
      - "tools/build_pub_research_reset_receipt.py"
      - "tools/test_build_pub_research_reset_receipt.py"
      - "tools/research_runner_verify_reset_receipt_compat.py"
      - "tools/research-runner/verify_reset_receipt.py"
      - ".github/workflows/pub-lab-2019-reset-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema==4.23.0"

      - name: Validate VMware backend evidence and restore binding
        run: |
          python -m unittest tools/test_pub_lab_2019_vmware_evidence.py -v
          python -m unittest tools/test_pub_lab_2019_restore_pair.py -v
          python tools/validate_pub_lab_2019_vmware_evidence.py packages/protocol/pub-lab-2019/v1/synthetic-vmware-restore-evidence.json
          python tools/validate_pub_lab_2019_restore_pair.py packages/protocol/pub-lab-2019/v1/synthetic-restore-challenge.json packages/protocol/pub-lab-2019/v1/synthetic-environment-manifest.json

      - name: Prove projection into existing provider-neutral reset receipt
        shell: bash
        run: |
          set -euo pipefail
          packet="$(printf '55%.0s' {1..32})"
          receipt="$RUNNER_TEMP/pub-research-reset-receipt.json"
          python -m unittest tools/test_build_pub_research_reset_receipt.py -v
          python tools/build_pub_research_reset_receipt.py             --evidence packages/protocol/pub-lab-2019/v1/synthetic-vmware-restore-evidence.json             --baseline-id publisher-2019-build12527-golden-v1             --snapshot-id MODERN-2019-12527-GOLDEN-v1             --experiment-id PUB-LAB-CI-01             --packet-sha256 "$packet"             --output "$receipt"
          python tools/research-runner/verify_reset_receipt.py             --receipt "$receipt"             --expected-baseline publisher-2019-build12527-golden-v1             --expected-snapshot MODERN-2019-12527-GOLDEN-v1             --expected-experiment PUB-LAB-CI-01             --expected-packet-sha256 "$packet"

      - name: Parse PowerShell adapters
        shell: pwsh
        run: |
          foreach ($path in @(
            "tools/pub_lab_2019_vmware_reset.ps1",
            "tools/pub_lab_2019_vmware_reset_provider.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path :: $_" }
              exit 1
            }
          }
