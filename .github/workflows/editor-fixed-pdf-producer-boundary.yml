name: Editor fixed-PDF producer boundary V1

on:
  pull_request:
    paths:
      - "tools/build_editor_fixed_pdf_receipt.py"
      - "tools/test_build_editor_fixed_pdf_receipt.py"
      - "tools/editor_fixed_output_current_state_v1.py"
      - "tools/cmo_slot_runtime_bridge_v1.py"
      - "tools/test_cmo_slot_runtime_bridge_v1.py"
      - "tools/fixed_pdf_shaped_flow_bridge_v1.py"
      - "tools/resolved_graph_scene_bridge_v1.py"
      - "crates/chaptera-layout-projection/**"
      - "crates/chaptera-scene-instance/**"
      - "services/editor-api/story_range_v1.py"
      - ".github/workflows/editor-fixed-pdf-producer-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run current-state assembly tests
        run: python tools/test_editor_fixed_output_current_state_v1.py -v
      - name: Run fixed-PDF producer boundary tests
        run: python tools/test_build_editor_fixed_pdf_receipt.py -v
