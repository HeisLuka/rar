name: Editor Desktop TextBox Restore V1

on:
  push:
    branches:
      - editor-desktop-textbox-restore-01-v1
  pull_request:
    paths:
      - "apps/chaptera-desktop/**"
      - "crates/chaptera-canvas-creation-interaction/**"
      - "crates/chaptera-desktop-fallback-font-resource/**"
      - "crates/chaptera-text-*/**"
      - "vendor/producer-a/crates/pub-editor/**"
      - "vendor/producer-a/crates/pub-model/**"
      - "vendor/producer-a/crates/pub-viewer/**"
      - ".github/workflows/editor-desktop-textbox-restore-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path apps/chaptera-desktop/Cargo.toml -- --check
      - name: Check
        run: cargo check --manifest-path apps/chaptera-desktop/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path apps/chaptera-desktop/Cargo.toml --all-targets -- -D warnings
      - name: Desktop unit tests
        run: cargo test --manifest-path apps/chaptera-desktop/Cargo.toml --lib --bins
      - name: Acquire pinned Apache POI SampleNewsletter
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/SampleNewsletter.pub"
          curl -fsSL "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" -o "$fixture"
          actual_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          test "$actual_sha" = "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
          actual_len="$(wc -c < "$fixture" | tr -d ' ')"
          test "$actual_len" = "291840"
          echo "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" >> "$GITHUB_ENV"
      - name: Real GUI TextBox create focus type acceptance
        run: >-
          cargo test --manifest-path apps/chaptera-desktop/Cargo.toml
          --features embedded-fixture-tests
          gui_textbox_tool_creates_focuses_and_types_into_one_new_story
          -- --ignored --nocapture
