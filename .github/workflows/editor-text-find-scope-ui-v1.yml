name: Editor Text Find Scope UI V1

on:
  pull_request:
    paths:
      - "services/editor-api/editor_text_find_scope_ui_v1.py"
      - "services/editor-api/test_editor_text_find_scope_ui_v1.py"
      - "services/editor-api/editor_text_find_replace_ui_v1.py"
      - "services/editor-api/text_find_scope_v1.py"
      - ".github/workflows/editor-text-find-scope-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Find-in-Selection desktop UI tests
        working-directory: services/editor-api
        run: python -m unittest -v test_editor_text_find_scope_ui_v1 test_editor_text_find_replace_ui_v1 test_text_find_scope_v1
