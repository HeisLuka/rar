name: PUB Contents bounded traversal V1

on:
  pull_request:
    paths:
      - "tools/pub_contents_packed_tag_v1.py"
      - "tools/pub_contents_direct_wire_map_v1.py"
      - "tools/pub_contents_bounded_reader_v1.py"
      - "tools/test_pub_contents_bounded_reader_v1.py"
      - ".github/workflows/pub-contents-bounded-traversal-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded traversal regressions
        run: python tools/test_pub_contents_bounded_reader_v1.py -v
