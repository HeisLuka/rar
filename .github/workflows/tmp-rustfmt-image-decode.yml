name: Temporary focused rustfmt

on:
  push:
    branches:
      - "image-decode-contract-01"
    paths:
      - "crates/chaptera-image-decode-contract/**"
      - ".github/workflows/tmp-rustfmt-image-decode.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "image-decode-contract-01"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix Clippy-only fixture construction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("crates/chaptera-image-decode-contract/src/lib.rs")
          s = p.read_text()
          old = """        let mut limits = DecodeLimitsV1::default();
        limits.max_total_pixels = 3;"""
          new = """        let limits = DecodeLimitsV1 {
            max_total_pixels: 3,
            ..DecodeLimitsV1::default()
        };"""
          if old not in s:
              raise SystemExit("expected fixture pattern not found")
          p.write_text(s.replace(old, new))
          PY
      - name: Format only task crate
        run: cargo fmt -p chaptera-image-decode-contract
      - name: Commit focused formatting
        run: |
          if git diff --quiet -- "crates/chaptera-image-decode-contract"; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "crates/chaptera-image-decode-contract"
          git commit -m "IMAGE-DECODE-CONTRACT-01: rustfmt + clippy fixture cleanup"
          git push origin HEAD:image-decode-contract-01
