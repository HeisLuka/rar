name: Temporary focused rustfmt

on:
  push:
    branches:
      - "image-decode-contract-01"
    paths:
      - "crates/chaptera-image-decode-contract/**"
      - ".github/workflows/tmp-rustfmt-image-decode.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "image-decode-contract-01"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format only task crate
        run: cargo fmt -p chaptera-image-decode-contract
      - name: Commit focused formatting
        run: |
          if git diff --quiet -- "crates/chaptera-image-decode-contract"; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "crates/chaptera-image-decode-contract"
          git commit -m "IMAGE-DECODE-CONTRACT-01: rustfmt focused crate"
          git push origin HEAD:image-decode-contract-01
