name: Story Edit Domain V1

on:
  pull_request:
    paths:
      - "services/editor-api/story_edit_domain_v1.py"
      - "services/editor-api/test_story_edit_domain_v1.py"
      - "services/editor-api/story_range_v1.py"
      - ".github/workflows/story-edit-domain-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run provenance-qualified Story edit-domain tests
        working-directory: services/editor-api
        run: python -m unittest -v test_story_edit_domain_v1
