name: CLOUD-MIGRATION-01 schema migration gate

on:
  pull_request:
    paths:
      - "apps/chaptera-server/migrations/**"
      - "apps/chaptera-server/src/db.rs"
      - "apps/chaptera-server/src/lib.rs"
      - "apps/chaptera-server/src/main.rs"
      - "apps/chaptera-server/src/migrate.rs"
      - "apps/chaptera-server/src/schema_migration.rs"
      - "docs/cloud-schema-migration-v0.md"
      - "tools/run_cloud_migration_receipt.py"
      - ".github/workflows/cloud-migration-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -p chaptera-server --all-targets -- -D warnings

      - name: Run migration tests
        run: cargo test -p chaptera-server schema_migration::

      - name: Run full Chaptera server tests
        run: cargo test -p chaptera-server

      - name: Build operator binary
        env:
          CHAPTERA_BUILD_GIT_SHA: ${{ github.sha }}
        run: cargo build -p chaptera-server

      - name: Exercise operator migration surface
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          python tools/run_cloud_migration_receipt.py
          --binary ./target/debug/chaptera
          --out target/cloud-migration-01

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-migration-01-receipt
          path: target/cloud-migration-01/
          if-no-files-found: error
