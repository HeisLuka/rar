name: Chaptera golden SampleNewsletter model render

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/chaptera-desktop/src/main.rs"
      - "apps/chaptera-desktop/src/preview_typography.rs"
      - "vendor/producer-a/crates/pub-quill/**"
      - ".github/workflows/chaptera-golden-samplenewsletter.yml"

permissions:
  contents: read

jobs:
  golden:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Acquire pinned SampleNewsletter
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") {
            throw "SampleNewsletter SHA-256 mismatch: $hash"
          }
          $out = Join-Path $env:RUNNER_TEMP "chaptera-golden-samplenewsletter"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "CHAPTERA_GOLDEN_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_GOLDEN_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate effective typography source model
        run: cargo test -p pub-quill --test effective_typography_real -- --nocapture

      - name: Render golden page from proven model state
        run: cargo test -p chaptera-desktop golden_sample_newsletter_page_2_renders_from_proven_model_state -- --ignored --nocapture

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaptera-golden-samplenewsletter
          path: ${{ env.CHAPTERA_GOLDEN_OUT }}
          if-no-files-found: error
