name: OfficeArt connector-rule raw observation

on:
  pull_request:
    paths:
      - "tools/officeart-connector-rule-read/**"
      - "vendor/producer-a/crates/pub-escher/**"
      - "docs/officeart-connector-rule-read-01.md"
      - ".github/workflows/officeart-connector-rule-read.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt
      - name: Format
        run: cargo fmt --manifest-path tools/officeart-connector-rule-read/Cargo.toml --check
      - name: Test source-free connector-rule observations
        run: cargo test --manifest-path tools/officeart-connector-rule-read/Cargo.toml
