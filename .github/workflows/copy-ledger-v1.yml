name: ENGINE-COPY-LEDGER-01 receipt contract

on:
  pull_request:
    paths:
      - "tools/copy_ledger_v1.py"
      - "tools/test_copy_ledger_v1.py"
      - "tools/run_copy_ledger_contract.py"
      - "docs/copy-ledger-v1.md"
      - ".github/workflows/copy-ledger-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-ledger-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test copy-ledger contract
        run: python tools/test_copy_ledger_v1.py
      - name: Emit synthetic contract receipt
        run: python tools/run_copy_ledger_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: copy-ledger-v1-contract
          path: target/copy-ledger-v1/receipt.json
          if-no-files-found: error
