name: CORPUS-VAC Common Crawl global

on:
  pull_request:
    paths:
      - 'tools/corpus/commoncrawl_global_pub_seed.py'
      - 'tools/corpus/test_commoncrawl_global_pub_seed.py'
      - 'tools/corpus/harvest_pub.py'
      - '.github/workflows/corpus-vac-cc-global.yml'
  push:
    branches: [main]
    paths:
      - 'tools/corpus/commoncrawl_global_pub_seed.py'
      - 'tools/corpus/test_commoncrawl_global_pub_seed.py'
      - '.github/workflows/corpus-vac-cc-global.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-vac-cc-global-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline validation
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/corpus/commoncrawl_global_pub_seed.py \
            tools/corpus/test_commoncrawl_global_pub_seed.py
          python tools/corpus/test_commoncrawl_global_pub_seed.py

  discovery-smoke:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned DuckDB
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1
      - name: Live global-index smoke
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/corpus/commoncrawl_global_pub_seed.py \
            --crawl-count 1 \
            --min-year 2021 \
            --max-parquet-files 2 \
            --max-candidates-per-crawl 10 \
            --batch-size 2 \
            --out out/global_seed.csv \
            --summary out/global_seed.summary.json
          cat out/global_seed.summary.json
      - name: Upload smoke manifest
        uses: actions/upload-artifact@v4
        with:
          name: cc-global-smoke-${{ github.run_id }}
          path: out/**
          retention-days: 7

  discover:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned DuckDB
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1
      - name: Discover globally across six crawl eras
        run: |
          set -euo pipefail
          mkdir -p out/discovery
          python tools/corpus/commoncrawl_global_pub_seed.py \
            --crawl-count 6 \
            --min-year 2015 \
            --max-parquet-files 30 \
            --max-candidates-per-crawl 300 \
            --batch-size 10 \
            --out out/discovery/global_seed.csv \
            --summary out/discovery/global_seed.summary.json
      - name: Upload locator manifest
        uses: actions/upload-artifact@v4
        with:
          name: cc-global-seed-${{ github.run_id }}
          path: out/discovery/**
          retention-days: 14

  harvest:
    if: github.event_name != 'pull_request'
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cc-global-seed-${{ github.run_id }}
          path: seed
      - name: Recover and classify exact archived bytes
        run: |
          set -euo pipefail
          python tools/corpus/harvest_pub.py \
            --seed seed/global_seed.csv \
            --out out/harvest \
            --max-files -1 \
            --timeout 20 \
            --max-bytes 104857600 \
            --per-host-delay 0.05 \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4
      - name: Remove raw payloads before public artifact upload
        if: always()
        run: |
          set -euo pipefail
          find out/harvest -type f \
            ! -name 'manifest.json' \
            ! -name 'manifest.csv' \
            -delete
      - name: Upload shard receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-global-manifest-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            out/harvest/manifest.json
            out/harvest/manifest.csv
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: github.event_name != 'pull_request' && always()
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cc-global-manifest-${{ github.run_id }}-*
          path: combined
      - name: Aggregate exact receipts
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json
          from collections import Counter
          from pathlib import Path

          rows = []
          for p in glob.glob("combined/**/manifest.json", recursive=True):
              rows.extend(json.loads(Path(p).read_text(encoding="utf-8")))

          unique = {}
          for row in rows:
              sha = row.get("sha256")
              if sha and sha not in unique:
                  unique[sha] = row

          summary = {
              "schema": "rar-cc-global-aggregate-v1",
              "manifest_rows": len(rows),
              "unique_sha256": len(unique),
              "fetch_status": dict(Counter(r.get("fetch_status", "") for r in rows)),
              "classification": dict(Counter(r.get("classification", "") for r in rows)),
              "bucket": dict(Counter(r.get("bucket", "") for r in rows)),
              "unique_source_hosts": len({
                  r.get("cc_source_host", "") for r in rows if r.get("cc_source_host")
              }),
              "crawls": sorted({
                  r.get("cc_crawl", "") for r in rows if r.get("cc_crawl")
              }),
          }
          out = Path("aggregate")
          out.mkdir(exist_ok=True)
          (out / "manifest.json").write_text(
              json.dumps(rows, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          (out / "summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload aggregate receipt
        uses: actions/upload-artifact@v4
        with:
          name: cc-global-aggregate-${{ github.run_id }}
          path: aggregate/**
          retention-days: 30
