name: CI Desktop fan-out prep validation

on:
  push:
    branches:
      - "ci-desktop-fanout-01-v2-prep"

concurrency:
  group: ci-desktop-fanout-prep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Prove routing receipt
        run: python3 tools/ci/chaptera_desktop_ci_routing.py
      - name: Test suite handoff authority
        run: cargo test --manifest-path crates/chaptera-suite-handoff/Cargo.toml
      - name: Check Editor desktop
        run: cargo check -p chaptera-desktop --all-targets
      - name: Check Reader-only desktop
        run: cargo check -p chaptera-desktop --features reader-only --all-targets
