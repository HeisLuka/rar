name: PUB Contents direct wire map V1

on:
  pull_request:
    paths:
      - "tools/pub_contents_direct_wire_map_v1.py"
      - "tools/test_pub_contents_direct_wire_map_v1.py"
      - ".github/workflows/pub-contents-direct-wire-map-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run grounded wire-map regressions
        run: python tools/test_pub_contents_direct_wire_map_v1.py -v
