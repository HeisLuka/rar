name: Text Range Fragment V1

on:
  pull_request:
    paths:
      - "services/editor-api/text_range_fragment_v1.py"
      - "services/editor-api/test_text_range_fragment_v1.py"
      - "services/editor-api/text_format_overlay_v1.py"
      - "services/editor-api/text_insert_format_v1.py"
      - ".github/workflows/text-range-fragment-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run semantic text-range fragment and transaction regressions
        working-directory: services/editor-api
        run: >-
          python -m unittest -v
          test_text_range_fragment_v1
          test_story_edit_transaction_v1
          test_text_format_overlay_v1
          test_text_insert_format_v1
