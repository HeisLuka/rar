name: Mobile Reader Android core portability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mobile-reader-android-core-portability.yml"
      - "vendor/producer-a/**"

permissions:
  contents: read

jobs:
  android-core-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust Android target
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.94.1

      - name: Check PUB Reader and Viewer core for Android
        run: |
          cargo +1.94.1 check \
            --manifest-path vendor/producer-a/Cargo.toml \
            --target aarch64-linux-android \
            -p pub-reader \
            -p pub-layout \
            -p pub-viewer

      - name: Guard against desktop shell coupling
        run: |
          cargo +1.94.1 tree \
            --manifest-path vendor/producer-a/Cargo.toml \
            --target aarch64-linux-android \
            -p pub-viewer > /tmp/pub-viewer-android-tree.txt
          cat /tmp/pub-viewer-android-tree.txt
          if grep -E '(^|[[:space:]])(chaptera-desktop|eframe|egui) v' /tmp/pub-viewer-android-tree.txt; then
            echo "desktop UI dependency leaked into Android Viewer core"
            exit 1
          fi
          echo "OK: Android Viewer dependency tree contains no desktop UI packages"
