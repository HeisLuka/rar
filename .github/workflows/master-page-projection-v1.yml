name: Master page projection V1

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/pub-model/src/projection_context.rs"
      - "crates/pub-model/src/lib.rs"
      - "crates/pub-master-projection/**"
      - "tools/resolved_graph_scene_bridge_v1.py"
      - "tools/test_resolved_graph_scene_bridge_v1.py"
      - "tools/test_master_page_projection_v1.py"
      - "packages/protocol/pub-projection/v1/master-page-synthetic-input.json"
      - ".github/workflows/master-page-projection-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-page-projection-01
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt and push once
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/pub-model crates/pub-master-projection
            git commit -m "MASTER-PAGE-PROJECTION-01: apply rustfmt"
            git push origin HEAD:master-page-projection-01
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test master projection crate
        run: cargo test -p pub-master-projection

  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing bridge validator dependency
        run: python -m pip install "jsonschema==4.23.0"
      - name: Existing resolved graph bridge regressions
        run: python tools/test_resolved_graph_scene_bridge_v1.py -v
      - name: Master projection Scene regressions
        run: python tools/test_master_page_projection_v1.py -v
