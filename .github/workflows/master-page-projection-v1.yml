name: Master page projection V1

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/pub-model/src/projection_context.rs"
      - "crates/pub-model/src/lib.rs"
      - "crates/pub-master-projection/**"
      - "tools/resolved_graph_scene_bridge_v1.py"
      - "tools/test_resolved_graph_scene_bridge_v1.py"
      - "tools/test_master_page_projection_v1.py"
      - "packages/protocol/pub-projection/v1/master-page-synthetic-input.json"
      - ".github/workflows/master-page-projection-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test master projection crate
        run: cargo test -p pub-master-projection
      - name: Produce source-free master receipt
        run: cargo run -q -p pub-master-projection --bin master-projection-producer -- packages/protocol/pub-projection/v1/master-page-synthetic-input.json > /tmp/master-receipt.json
      - name: Assert receipt relation count and invariants
        run: |
          python - <<'PY'
          import json
          with open("/tmp/master-receipt.json", encoding="utf-8") as fh:
              data = json.load(fh)
          assert data["receipt_version"] == "chaptera.master-page-projection-receipt.v1"
          assert data["projection_context_version"] == "chaptera.pub-projection-context.v1"
          assert data["relation_count"] == 3
          assert data["invariants"]["exact_field_id"] == 13
          assert data["invariants"]["exact_wire"] == 104
          assert data["invariants"]["target_raw_type"] == 67
          assert data["invariants"]["source_graph_mutated"] is False
          assert data["invariants"]["semantic_node_clones_created"] is False
          PY

  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Existing resolved graph bridge regressions
        run: python tools/test_resolved_graph_scene_bridge_v1.py -v
      - name: Master projection Scene regressions
        run: python tools/test_master_page_projection_v1.py -v
