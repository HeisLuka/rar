name: MoveNode diagnostic receipt V1

on:
  pull_request:
    paths:
      - "packages/protocol/movenode-diagnostic/**"
      - "packages/protocol/operation-blast-radius/**"
      - "tools/validate_movenode_diagnostic_receipt.py"
      - "tools/test_validate_movenode_diagnostic_receipt.py"
      - ".github/workflows/movenode-diagnostic-receipt-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install "jsonschema==4.23.0"
      - name: Compile receipt validator
        run: python -m py_compile tools/validate_movenode_diagnostic_receipt.py tools/test_validate_movenode_diagnostic_receipt.py
      - name: Run causal join regressions
        run: python tools/test_validate_movenode_diagnostic_receipt.py -v
      - name: Validate schema syntax
        run: |
          python -m json.tool packages/protocol/movenode-diagnostic/v1.schema.json > /dev/null
          python -m json.tool packages/protocol/operation-blast-radius/v1.schema.json > /dev/null
