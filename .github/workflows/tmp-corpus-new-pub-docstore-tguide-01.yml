name: TEMP TGUIDE Publisher exact-locator recovery

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-corpus-new-pub-docstore-tguide-01.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe only the author-published short URL variants
        run: |
          set -euo pipefail
          mkdir -p out/discovery
          python - <<'PY'
          import json, urllib.request, urllib.error
          urls=['http://goo.gl/rbk0k5','https://goo.gl/rbk0k5']
          rows=[]
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'rar-t717-tguide/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      rows.append({'url':url,'status':getattr(r,'status',None),'final_url':r.geturl(),'content_type':r.headers.get('Content-Type')})
              except urllib.error.HTTPError as e:
                  rows.append({'url':url,'status':e.code,'final_url':e.geturl(),'content_type':e.headers.get('Content-Type'),'error':str(e)})
              except Exception as e:
                  rows.append({'url':url,'status':None,'final_url':None,'content_type':None,'error':type(e).__name__+': '+str(e)})
          open('out/discovery/live_probe.json','w',encoding='utf-8').write(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - name: Query exact short URLs through Wayback
        run: |
          set -euo pipefail
          for scheme in http https; do
            python tools/corpus/wayback_pub_seed.py               --url "${scheme}://goo.gl/rbk0k5"               --max-domains 0               --exact-limit 100               --delay 0.5               --timeout 60               --retries 2               --out "out/discovery/wayback_${scheme}.csv"               --summary "out/discovery/wayback_${scheme}.summary.json"
          done
          python - <<'PY'
          import csv, pathlib
          files=[pathlib.Path('out/discovery/wayback_http.csv'),pathlib.Path('out/discovery/wayback_https.csv')]
          rows=[]
          fields=None
          seen=set()
          for p in files:
              with p.open(encoding='utf-8',newline='') as f:
                  rd=csv.DictReader(f)
                  fields=fields or rd.fieldnames
                  for row in rd:
                      key=tuple((k,row.get(k,'')) for k in (fields or []))
                      if key not in seen:
                          seen.add(key); rows.append(row)
          out=pathlib.Path('out/discovery/wayback_seed.csv')
          if fields:
              with out.open('w',encoding='utf-8',newline='') as f:
                  wr=csv.DictWriter(f,fieldnames=fields); wr.writeheader(); wr.writerows(rows)
          else:
              out.write_text('',encoding='utf-8')
          print('combined_wayback_rows='+str(len(rows)))
          PY
      - name: Recover only exact archived captures if present
        run: |
          set -euo pipefail
          rows="$(python - <<'PY'
          import csv, pathlib
          p=pathlib.Path('out/discovery/wayback_seed.csv')
          if not p.exists() or p.stat().st_size==0:
              print(0)
          else:
              with p.open(encoding='utf-8') as f:
                  print(sum(1 for _ in csv.DictReader(f)))
          PY
          )"
          echo "locator_rows=$rows"
          mkdir -p out/harvest
          if [ "$rows" -gt 0 ]; then
            python tools/corpus/harvest_pub.py               --seed out/discovery/wayback_seed.csv               --out out/harvest               --max-files -1               --timeout 30               --max-bytes 104857600               --per-host-delay 0.2
          else
            printf '[]\n' > out/harvest/manifest.json
            printf 'source_page,direct_url,candidate_filename,fetch_status,classification,sha256\n' > out/harvest/manifest.csv
          fi
      - name: Summarize and strip byte-bearing payloads
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          from collections import Counter
          rows=json.loads(pathlib.Path('out/harvest/manifest.json').read_text(encoding='utf-8'))
          complete=[r for r in rows if r.get('classification')=='cfb_publisher_hint']
          probe=json.loads(pathlib.Path('out/discovery/live_probe.json').read_text(encoding='utf-8'))
          summary={
            'schema':'chaptera.corpus-docstore-tguide-exact-locator.v1',
            'source_safe':True,
            'raw_pub_retained':False,
            'researchgate_record':'finistere TGUIDE template in Microsoft Publisher format for free re-use',
            'observed_public_locator':'http://goo.gl/rbk0k5',
            'source_context':'Chicot & Mansfield (2014) TGUIDE: Finding Finistere; author/research pages explicitly call it a reusable Microsoft Publisher .PUB template.',
            'live_probe':probe,
            'manifest_rows':len(rows),
            'unique_sha256':len({r.get('sha256') for r in rows if r.get('sha256')}),
            'complete_publisher_sha256':len({r.get('sha256') for r in complete if r.get('sha256')}),
            'classification':dict(Counter(r.get('classification','') for r in rows)),
            'complete_files':[{
              'filename':r.get('candidate_filename'),
              'sha256':r.get('sha256'),
              'size':r.get('size'),
              'wayback_original_url':r.get('wayback_original_url'),
              'wayback_timestamp':r.get('wayback_timestamp')
            } for r in complete],
            'guardrail':'Only the author-published goo.gl/rbk0k5 locator and its public archive history are queried; no ResearchGate/Google storage IDs are guessed.'
          }
          pathlib.Path('out/summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
          find out/harvest -type f ! -name 'manifest.json' ! -name 'manifest.csv' -delete
          if find out -type f \( -iname '*.pub' -o -iname '*.zip' -o -iname '*.exe' -o -iname '*.cab' \) | grep -q .; then
            echo 'byte-bearing payload leaked into public artifact' >&2
            exit 1
          fi
          sha256sum out/discovery/* out/harvest/* out/summary.json | sort > out/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-docstore-tguide-exact-locator-receipt
          path: out/**
          if-no-files-found: error
          retention-days: 90
