name: Layout Invalidation Slice A

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/chaptera-layout-invalidation/**"
      - ".github/workflows/layout-invalidation-slice-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Lint layout crates
        run: cargo clippy -p chaptera-layout-invalidation -p chaptera-layout-projection --all-targets -- -D warnings
      - name: Test invalidation crate
        run: cargo test -p chaptera-layout-invalidation -- --nocapture
