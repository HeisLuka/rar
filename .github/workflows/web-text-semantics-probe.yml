name: WEB-TEXT-AUTHORING browser semantics probe

on:
  pull_request:
    paths:
      - "apps/web/text-semantics-probe.html"
      - "tools/run_web_text_semantics_probe.mjs"
      - ".github/workflows/web-text-semantics-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-semantics:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser text semantics probe
        run: node tools/run_web_text_semantics_probe.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-text-semantics-${{ matrix.browser }}
          path: target/web-text-semantics/${{ matrix.browser }}-receipt.json
          if-no-files-found: error
