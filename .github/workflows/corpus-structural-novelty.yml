name: CORPUS structural novelty

on:
  pull_request:
    paths:
      - 'tools/corpus/structural_novelty.py'
      - 'tools/corpus/structural_novelty_sources.json'
      - '.github/workflows/corpus-structural-novelty.yml'
  push:
    branches: [main]
    paths:
      - 'tools/corpus/structural_novelty.py'
      - 'tools/corpus/structural_novelty_sources.json'
      - '.github/workflows/corpus-structural-novelty.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: corpus-structural-novelty-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Validate and run three-file exact-SHA smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m py_compile tools/corpus/structural_novelty.py
          python tools/corpus/structural_novelty.py scan \
            --sources tools/corpus/structural_novelty_sources.json \
            --out out/shard0 \
            --only-source github_history \
            --limit 3 \
            --workers 2
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("out/shard0/summary.json").read_text())
          assert s["source_union_count"] == 950, s
          assert s["deferred_container_union_count"] == 425, s
          assert s["nondeferred_union_count"] == 525, s
          assert s["selected"] == 3, s
          assert s["status"].get("ok") == 3, s
          PY
          python tools/corpus/structural_novelty.py aggregate \
            --input out \
            --out out/aggregate
          if find out -type f -iname '*.pub' | grep -q .; then
            echo "raw PUB leaked into retained output" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: structural-novelty-smoke-${{ github.run_id }}
          path: out/aggregate/**
          if-no-files-found: error
          retention-days: 7

  scan:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Scan exact-SHA shard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m py_compile tools/corpus/structural_novelty.py
          python tools/corpus/structural_novelty.py scan \
            --sources tools/corpus/structural_novelty_sources.json \
            --out out \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --workers 4
      - name: Prove raw-byte cleanup
        if: always()
        run: |
          set -euo pipefail
          if find out -type f -iname '*.pub' | grep -q .; then
            echo "raw PUB leaked into retained output" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-novelty-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: out/**
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: github.event_name != 'pull_request' && always()
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - uses: actions/download-artifact@v4
        with:
          pattern: structural-novelty-shard-${{ github.run_id }}-*
          path: shards
      - name: Aggregate source-free fingerprints
        run: |
          set -euo pipefail
          python tools/corpus/structural_novelty.py aggregate \
            --input shards \
            --out aggregate
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("aggregate/summary.json").read_text())
          assert s["analyzed_rows"] == 525, s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-novelty-aggregate-${{ github.run_id }}
          path: aggregate/**
          if-no-files-found: error
          retention-days: 30
