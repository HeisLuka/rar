name: Group Member Selection V1

on:
  pull_request:
    paths:
      - "services/editor-api/object_selection_target_v1.py"
      - "services/editor-api/object_selection_compose_v1.py"
      - "services/editor-api/group_member_selection_v1.py"
      - "services/editor-api/test_group_member_selection_v1.py"
      - ".github/workflows/group-member-selection-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run one-level Group member selection scope tests
        working-directory: services/editor-api
        run: python -m unittest -v test_group_member_selection_v1
      - name: Re-run identity and compose primitives
        working-directory: services/editor-api
        run: python -m unittest -v test_object_selection_target_v1 test_object_selection_compose_v1
