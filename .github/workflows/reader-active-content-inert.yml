name: Reader active-content inertness V1

on:
  pull_request:
    paths:
      - "apps/chaptera-desktop/**"
      - "vendor/producer-a/crates/pub-viewer/**"
      - "vendor/producer-a/crates/pub-editor/**"
      - "crates/chaptera-viewer-render-plan/**"
      - "tools/reader_active_content_guard.py"
      - ".github/workflows/reader-active-content-inert.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  inertness-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test guard patterns
        run: python tools/reader_active_content_guard.py --self-test
      - name: Enforce local inert Reader/Viewer runtime
        run: python tools/reader_active_content_guard.py
