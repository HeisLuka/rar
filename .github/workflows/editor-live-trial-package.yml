name: Chaptera Editor live-trial package receipt

on:
  pull_request:
    paths:
      - "packages/product/editor-live-trial/**"
      - "tools/package_editor_live_trial.py"
      - "tools/build_editor_live_trial_package_receipt.py"
      - "tools/validate_editor_live_trial_package_receipt.py"
      - "tools/test_package_editor_live_trial.py"
      - "tools/test_build_editor_live_trial_package_receipt.py"
      - "tools/test_editor_live_trial_package_receipt.py"
      - "docs/chaptera-editor-live-trial-package-v1.md"
      - ".github/workflows/editor-live-trial-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Validate package receipt builder and contract
        run: |
          python -m unittest tools/test_package_editor_live_trial.py
          python -m unittest tools/test_build_editor_live_trial_package_receipt.py
          python -m unittest tools/test_editor_live_trial_package_receipt.py
      - name: Validate retained real package receipts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          receipts=(packages/product/editor-live-trial/v1/receipts/*.json)
          for receipt in "${receipts[@]}"; do
            python tools/validate_editor_live_trial_package_receipt.py "$receipt"
          done
          echo "validated_real_receipts=${#receipts[@]}"
