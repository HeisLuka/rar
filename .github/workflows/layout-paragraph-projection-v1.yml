name: Layout Paragraph Projection V1

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/chaptera-layout-projection/**"
      - ".github/workflows/layout-paragraph-projection-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test paragraph projection
        run: cargo test -p chaptera-layout-projection
