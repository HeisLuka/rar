name: Editor Text Range Format UI V1

on:
  pull_request:
    paths:
      - "services/editor-api/editor_text_range_format_ui_v1.py"
      - "services/editor-api/test_editor_text_range_format_ui_v1.py"
      - "services/editor-api/text_format_overlay_v1.py"
      - "services/editor-api/text_typing_format_state_v1.py"
      - "services/editor-api/text_keyboard_policy_v1.py"
      - "services/editor-api/text_visual_line_navigation_v1.py"
      - "services/editor-api/text_unplaced_interaction_v1.py"
      - "services/editor-api/text_ingress_v1.py"
      - ".github/workflows/editor-text-range-format-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run desktop text range-format surface tests
        working-directory: services/editor-api
        run: python -m unittest -v test_editor_text_range_format_ui_v1 test_text_format_overlay_v1 test_text_typing_format_state_v1 test_text_keyboard_policy_v1 test_text_visual_line_navigation_v1 test_text_unplaced_interaction_v1 test_text_ingress_v1
