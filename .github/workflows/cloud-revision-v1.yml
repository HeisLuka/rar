name: CLOUD-REVISION-01 canonical bridge

on:
  pull_request:
    paths:
      - "services/editor-api/cloud_revision_v1.py"
      - "services/editor-api/test_cloud_revision_v1.py"
      - "services/editor-api/revision_store.py"
      - "services/cloud-export/export_job_v1.py"
      - "tools/run_cloud_revision_v1_contract.py"
      - "docs/cloud-revision-v1.md"
      - ".github/workflows/cloud-revision-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-revision-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run canonical revision bridge tests
        working-directory: services/editor-api
        run: python -m unittest -v test_cloud_revision_v1.py
      - name: Run existing Web revision regressions
        working-directory: services/editor-api
        run: python -m unittest -v test_revision_store.py
      - name: Run durable export contract regressions
        working-directory: services/cloud-export
        run: python -m unittest -v test_export_job_v1.py
      - name: Produce integration receipt
        run: python tools/run_cloud_revision_v1_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-revision-v1-contract
          path: target/cloud-revision-v1/receipt.json
          if-no-files-found: error
