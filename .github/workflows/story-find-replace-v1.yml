name: Story Find Replace V1

on:
  pull_request:
    paths:
      - "services/editor-api/story_find_replace_v1.py"
      - "services/editor-api/test_story_find_replace_v1.py"
      - "services/editor-api/text_find_snapshot_v1.py"
      - "services/editor-api/story_edit_transaction_v1.py"
      - "services/editor-api/paragraph_lifecycle_v1.py"
      - "services/editor-api/text_insert_format_v1.py"
      - "services/editor-api/revision_store.py"
      - ".github/workflows/story-find-replace-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run atomic Story Find Replace tests
        working-directory: services/editor-api
        run: python -m unittest -v test_story_find_replace_v1 test_text_find_snapshot_v1
