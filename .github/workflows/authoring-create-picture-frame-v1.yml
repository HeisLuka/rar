name: Authoring CreatePictureFrame V1

on:
  pull_request:
    paths:
      - "services/editor-api/create_picture_frame_v1.py"
      - "services/editor-api/test_create_picture_frame_v1.py"
      - "services/editor-api/revision_store.py"
      - "services/editor-api/editor_project_asset_registry_v1.py"
      - "services/editor-api/image_asset_intrinsic_v1.py"
      - "services/editor-api/picture_resize_plan_v1.py"
      - "packages/protocol/authoring-create-picture-frame/v1/**"
      - ".github/workflows/authoring-create-picture-frame-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Test atomic CreatePictureFrame contract
        working-directory: services/editor-api
        run: python -m unittest -v test_create_picture_frame_v1
      - name: Re-run asset registry and intrinsic authority
        working-directory: services/editor-api
        run: python -m unittest -v test_editor_project_asset_registry_v1 test_image_asset_intrinsic_v1
      - name: Re-run RevisionKernel regressions
        working-directory: services/editor-api
        run: python -m unittest -v test_revision_store
      - name: Re-run explicit aspect-preserving resize planner
        working-directory: services/editor-api
        run: python -m unittest -v test_picture_resize_plan_v1
      - name: Validate public intent schema
        run: |
          python - <<'PY'
          import json
          import jsonschema
          from pathlib import Path
          p = Path("packages/protocol/authoring-create-picture-frame/v1/create-picture-frame-intent.schema.json")
          schema = json.loads(p.read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          PY
