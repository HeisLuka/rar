name: Web Asset Drop UX V1

on:
  pull_request:
    paths:
      - "apps/web/asset-drop-ux-v1.mjs"
      - "apps/web/asset-drop-ux-v1.test.mjs"
      - ".github/workflows/web-asset-drop-ux-01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-drop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test image drop/paste routing
        run: node --test apps/web/asset-drop-ux-v1.test.mjs
