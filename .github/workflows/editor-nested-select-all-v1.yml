name: Editor Nested Select All V1

on:
  pull_request:
    paths:
      - "services/editor-api/editor_nested_select_all_v1.py"
      - "services/editor-api/test_editor_nested_select_all_v1.py"
      - "services/editor-api/editor_object_select_all_v1.py"
      - "services/editor-api/nested_group_selection_v1.py"
      - ".github/workflows/editor-nested-select-all-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scope-routed Select All regressions
        working-directory: services/editor-api
        run: python -m unittest -v test_editor_nested_select_all_v1 test_editor_object_select_all_v1 test_nested_group_selection_v1
