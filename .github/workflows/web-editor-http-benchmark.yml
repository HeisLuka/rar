name: Web Editor HTTP observability benchmark

on:
  pull_request:
    paths:
      - "apps/web/editor-service-client-v1.mjs"
      - "apps/web/observability-v1.mjs"
      - "apps/web/editor-shell-http-harness.html"
      - "services/editor-api/web_shell_http_harness.py"
      - "services/editor-api/observability.py"
      - "services/editor-api/revision_store.py"
      - "tools/run_web_editor_http_harness.mjs"
      - "tools/aggregate_web_editor_http_benchmark.mjs"
      - ".github/workflows/web-editor-http-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression revision + observability kernels
        working-directory: services/editor-api
        run: python -m unittest -v test_revision_store.py test_observability.py
      - name: Regression browser observability contract
        run: node --test apps/web/observability-v1.test.mjs
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run repeated browser-to-HTTP samples
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          rm -rf target/web-editor-http
          mkdir -p target/web-editor-http
          for i in $(seq 0 7); do
            echo "sample=$i browser=$BROWSER_ENGINE"
            RUN_INDEX="$i" node tools/run_web_editor_http_harness.mjs
          done
      - name: Aggregate p50/p95 receipt
        run: |
          node tools/aggregate_web_editor_http_benchmark.mjs             target/web-editor-http             ${{ matrix.browser }}             target/web-editor-http/${{ matrix.browser }}-benchmark-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-editor-http-benchmark-${{ matrix.browser }}
          path: |
            target/web-editor-http/${{ matrix.browser }}-http-receipt-*.json
            target/web-editor-http/${{ matrix.browser }}-benchmark-summary.json
            target/web-editor-http/${{ matrix.browser }}-http-shell.png
          if-no-files-found: error
