name: RENDER-PATCH-INDEX-01 ownership index

on:
  pull_request:
    paths:
      - "tools/scene_patch_v1.py"
      - "tools/test_scene_patch_v1.py"
      - "tools/run_scene_patch_index_contract.py"
      - "tools/render_bench_v1.py"
      - "docs/scene-patch-index-v1.md"
      - ".github/workflows/render-patch-index-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ScenePatch compatibility and complexity tests
        run: python tools/test_scene_patch_v1.py
      - name: Produce 2k and 10k ownership-index receipt
        run: python tools/run_scene_patch_index_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: scene-patch-index-v1-receipt
          path: target/scene-patch-index-v1/receipt.json
          if-no-files-found: error
