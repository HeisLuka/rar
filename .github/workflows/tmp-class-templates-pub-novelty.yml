name: TEMP class-templates PUB novelty

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/corpus/tmp_class_templates_crawl.py'
      - '.github/workflows/tmp-class-templates-pub-novelty.yml'

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover public Publisher template ZIPs
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/corpus/tmp_class_templates_crawl.py \
            --out out/seed.csv \
            --summary out/discovery.json \
            --max-pages 350 \
            --delay 0.12
          cat out/discovery.json
      - name: Download and extract Publisher files
        run: |
          set -euo pipefail
          python tools/corpus/harvest_pub.py \
            --seed out/seed.csv \
            --out out/harvest \
            --max-files -1 \
            --timeout 30 \
            --max-bytes 104857600 \
            --max-archive-total-bytes 314572800 \
            --max-archive-members 500 \
            --per-host-delay 0.08
      - name: Download exact current-corpus indexes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/known-artifacts
          for aid in 10808750049 10807797944 10808390771 10807882317 10808417821 10807881478 10807597565; do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/HeisLuka/rar/actions/artifacts/${aid}/zip" \
              > "out/known-artifacts/${aid}.zip"
            test -s "out/known-artifacts/${aid}.zip"
          done
      - name: Filter against exact 950-SHA baseline
        run: |
          python - <<'PY'
          import hashlib, json, shutil, zipfile
          from pathlib import Path

          artifact_ids=[10808750049,10807797944,10808390771,10807882317,10808417821,10807881478,10807597565]
          known=set()
          for aid in artifact_ids:
              payload=Path(f'out/known-artifacts/{aid}.zip')
              with zipfile.ZipFile(payload) as z:
                  names=[n for n in z.namelist() if n.endswith('index.json')]
                  if not names: raise RuntimeError(f'no index.json in artifact {aid}')
                  for row in json.loads(z.read(names[0])):
                      sha=str(row.get('sha256','')).lower()
                      if len(sha)==64: known.add(sha)
          if len(known)!=950: raise RuntimeError(f'expected 950 known SHA, got {len(known)}')

          rows=json.loads(Path('out/harvest/manifest.json').read_text(encoding='utf-8'))
          novel_dir=Path('out/novel'); novel_dir.mkdir(parents=True,exist_ok=True)
          publisher=set(); known_hits=set(); novel={}
          for row in rows:
              if row.get('fetch_status') not in {'ok','ok_archive_member'}: continue
              if row.get('classification')!='cfb_publisher_hint': continue
              sha=str(row.get('sha256') or '').lower()
              if len(sha)!=64: continue
              publisher.add(sha)
              if sha in known: known_hits.add(sha); continue
              if sha in novel: continue
              src=Path('out/harvest')/str(row.get('stored_path') or '')
              if not src.is_file(): raise RuntimeError(f'missing payload {src}')
              data=src.read_bytes(); actual=hashlib.sha256(data).hexdigest()
              if actual!=sha: raise RuntimeError(f'SHA mismatch {sha} != {actual}')
              if not data.startswith(bytes.fromhex('D0CF11E0A1B11AE1')): raise RuntimeError(f'non-CFB {sha}')
              name=Path(str(row.get('candidate_filename') or row.get('stored_path') or 'candidate.pub')).name
              if not name.lower().endswith('.pub'): name += '.pub'
              dst=novel_dir/f'{sha}__{name}'
              shutil.copyfile(src,dst)
              rec=dict(row);rec['exported_name']=dst.name;novel[sha]=rec
          out=[novel[k] for k in sorted(novel)]
          Path('out/novel.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          discovery=json.loads(Path('out/discovery.json').read_text(encoding='utf-8'))
          summary={
            'known_corpus_sha':len(known),'discovery':discovery,'harvest_rows':len(rows),
            'publisher_unique_sha':len(publisher),'known_sha_hits':len(known_hits),
            'novel_unique_sha':len(out),'novel_sha256':[r['sha256'] for r in out],
            'novel_files':[{'sha256':r['sha256'],'name':r.get('candidate_filename'),'source':r.get('source_page'),'archive_member':r.get('archive_member')} for r in out],
          }
          Path('out/summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-templates-pub-harvest-${{ github.run_id }}
          path: |
            out/discovery.json
            out/harvest/**
            out/summary.json
            out/novel.json
            out/novel/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
