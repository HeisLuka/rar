name: CORPUS-VAC positive domains

on:
  pull_request:
    paths:
      - 'tools/corpus/positive_domain_pub_seed.py'
      - 'tools/corpus/test_positive_domain_pub_seed.py'
      - 'tools/corpus/public_legacy_seed.csv'
      - '.github/workflows/corpus-vac-positive-domains.yml'
  push:
    branches: [main]
    paths:
      - 'tools/corpus/positive_domain_pub_seed.py'
      - 'tools/corpus/test_positive_domain_pub_seed.py'
      - 'tools/corpus/public_legacy_seed.csv'
      - '.github/workflows/corpus-vac-positive-domains.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-vac-positive-domains-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline validation
        run: |
          set -euo pipefail
          python -m py_compile tools/corpus/positive_domain_pub_seed.py tools/corpus/test_positive_domain_pub_seed.py
          python tools/corpus/test_positive_domain_pub_seed.py

  smoke:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded live crawl smoke
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/corpus/positive_domain_pub_seed.py \
            --seed tools/corpus/smoke_seed.csv \
            --max-domains 1 \
            --max-pages-per-domain 5 \
            --max-depth 1 \
            --max-candidates-per-domain 10 \
            --delay 0.2 \
            --out out/domain_seed.csv \
            --summary out/domain.summary.json
          cat out/domain.summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: positive-domain-smoke-${{ github.run_id }}
          path: out/**
          retention-days: 7

  discover:
    if: github.event_name != 'pull_request'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crawl one bounded domain shard
        run: |
          set -euo pipefail
          mkdir -p out/discovery
          python tools/corpus/positive_domain_pub_seed.py \
            --seed tools/corpus/public_legacy_seed.csv \
            --seed tools/corpus/smoke_seed.csv \
            --max-domains 100 \
            --max-pages-per-domain 150 \
            --max-depth 2 \
            --max-candidates-per-domain 200 \
            --delay 0.5 \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --out "out/discovery/domain_seed-${{ matrix.shard }}.csv" \
            --summary "out/discovery/domain-${{ matrix.shard }}.summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: positive-domain-seed-${{ github.run_id }}-${{ matrix.shard }}
          path: out/discovery/**
          retention-days: 14

  harvest:
    if: github.event_name != 'pull_request'
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: positive-domain-seed-${{ github.run_id }}-${{ matrix.shard }}
          path: seed
      - name: Fetch discovered candidates
        run: |
          set -euo pipefail
          python tools/corpus/harvest_pub.py \
            --seed "seed/domain_seed-${{ matrix.shard }}.csv" \
            --out out/harvest \
            --max-files -1 --timeout 25 --max-bytes 104857600 \
            --per-host-delay 0.5
      - name: Keep public artifact manifest-only
        if: always()
        run: |
          set -euo pipefail
          find out/harvest -type f ! -name 'manifest.json' ! -name 'manifest.csv' -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: positive-domain-manifest-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            out/harvest/manifest.json
            out/harvest/manifest.csv
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: github.event_name != 'pull_request' && always()
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: positive-domain-manifest-${{ github.run_id }}-*
          path: combined
      - name: Aggregate receipts
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json
          from collections import Counter
          from pathlib import Path
          rows=[]
          for p in glob.glob("combined/**/manifest.json",recursive=True):
              rows.extend(json.loads(Path(p).read_text(encoding="utf-8")))
          summary={
              "schema":"rar-positive-domain-aggregate-v1",
              "manifest_rows":len(rows),
              "unique_sha256":len({r.get("sha256") for r in rows if r.get("sha256")}),
              "classification":dict(Counter(r.get("classification","") for r in rows)),
              "fetch_status":dict(Counter(r.get("fetch_status","") for r in rows)),
              "domains":len({r.get("crawl_domain","") for r in rows if r.get("crawl_domain")}),
          }
          Path("aggregate").mkdir(exist_ok=True)
          Path("aggregate/manifest.json").write_text(json.dumps(rows,indent=2,ensure_ascii=False),encoding="utf-8")
          Path("aggregate/summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: positive-domain-aggregate-${{ github.run_id }}
          path: aggregate/**
          retention-days: 30
