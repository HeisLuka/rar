name: TEMP institutional PUB Wayback recovery

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-corpus-new-pub-edu-gov-01.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check olefile==0.47
      - name: Recover bounded institutional candidates
        run: |
          set -euo pipefail
          mkdir -p out /tmp/t714
          python - <<'PY'
          import hashlib,json,pathlib,re,urllib.parse,urllib.request
          import olefile

          UA='rar-t714-institutional-recovery/1.0'
          leads=[
            {'org':'Camas School District','domain':'schools.camas.wednet.edu','tokens':['032911','April','Newsletter'],'filename_witness':'April Newsletter 2011 Final 032911.pub'},
            {'org':'School District of Nekoosa','domain':'nekoosasd.net','tokens':['August','2012'],'filename_witness':'August 2012.pub'},
            {'org':'Oswego CUSD 308','domain':'oswego308.org','tokens':['October','2012'],'filename_witness':'October 2012.pub'},
          ]
          def get(url,timeout=90):
            req=urllib.request.Request(url,headers={'User-Agent':UA})
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return r.read(),dict(r.headers),r.geturl()

          results=[]
          for lead in leads:
            q='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({
              'url':lead['domain']+'/*',
              'output':'json','fl':'timestamp,original,statuscode,mimetype,digest,length',
              'filter':'statuscode:200','collapse':'digest','limit':'5000'
            })
            try:
              raw,_,_=get(q,120); data=json.loads(raw)
            except Exception as e:
              results.append({**lead,'state':'cdx_error','error':repr(e)}); continue
            rows=[]
            if isinstance(data,list) and len(data)>1:
              hdr=data[0]; rows=[dict(zip(hdr,x)) for x in data[1:]]
            cand=[]
            for r in rows:
              u=r.get('original','')
              low=urllib.parse.unquote(u).lower()
              score=sum(1 for t in lead['tokens'] if t.lower() in low)
              if low.endswith('.pub') or '.pub?' in low or score>=2:
                cand.append((score,u,r))
            cand.sort(key=lambda x:(x[0], '.pub' in x[1].lower()), reverse=True)
            recovered=[]
            for score,u,r in cand[:80]:
              replay='https://web.archive.org/web/'+r['timestamp']+'id_/'+u
              try:
                b,h,final=get(replay,120)
              except Exception:
                continue
              if not b.startswith(bytes.fromhex('d0cf11e0a1b11ae1')): continue
              tmp=pathlib.Path('/tmp/t714/candidate.pub'); tmp.write_bytes(b)
              try:
                ole=olefile.OleFileIO(str(tmp)); streams=['/'.join(x) for x in ole.listdir(streams=True,storages=False)]
                has_contents=ole.exists('Contents'); ole.close()
              except Exception:
                continue
              if not has_contents: continue
              recovered.append({
                'original_url':u,'wayback_timestamp':r['timestamp'],'replay_final_url':final,
                'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),
                'stream_count':len(streams),'publisher_contents':True
              })
              tmp.unlink(missing_ok=True)
            results.append({**lead,'state':'recovered' if recovered else 'no_native_pub_recovered',
                            'cdx_rows':len(rows),'candidate_rows':len(cand),'recovered':recovered})
          receipt={'schema':'chaptera.corpus-edu-gov-wayback.v1','source_safe':True,
                   'raw_pub_retained':False,'leads':results,
                   'guardrail':'Yumpu/PDF witnesses are provenance leads only; admission requires archived native CFB with Contents.'}
          pathlib.Path('out/receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Enforce source-safe receipt
        run: |
          set -euo pipefail
          ! find out -type f -iname '*.pub' | grep -q .
          python - <<'PY'
          import json
          r=json.load(open('out/receipt.json'))
          assert r['source_safe'] is True and r['raw_pub_retained'] is False
          assert len(r['leads'])==3
          PY
          sha256sum out/* > out/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-edu-gov-wayback-receipt
          path: out/**
          retention-days: 90
          if-no-files-found: error
