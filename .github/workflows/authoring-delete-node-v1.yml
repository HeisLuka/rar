name: Authoring DeleteNode V1

on:
  pull_request:
    paths:
      - "packages/protocol/authoring-delete-node/**"
      - "services/editor-api/test_delete_node.py"
      - ".github/workflows/authoring-delete-node-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run DeleteNode revision-kernel tests
        working-directory: services/editor-api
        run: python -m unittest -v test_delete_node
      - name: Validate public DeleteNode intent schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator

          schema = json.load(open("packages/protocol/authoring-delete-node/v1/delete-node-intent.schema.json"))
          Draft202012Validator.check_schema(schema)
          fixture = {
              "protocol_version": "chaptera.delete-node-intent.v1",
              "document_id": "doc:1",
              "source_hash": "a" * 64,
              "base_revision_id": "sha256:" + "b" * 64,
              "client_operation_id": "delete-op-00000001",
              "command": {
                  "kind": "delete_node",
                  "node_id": "node:authored:1",
                  "expected_state_id": "sha256:" + "c" * 64,
                  "expected_parent_id": "page:1",
                  "expected_child_index": 1
              }
          }
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          print("DeleteNode intent schema valid")
          PY
