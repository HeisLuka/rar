name: EDITOR-SNAP-01 core

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-interaction/src/lib.rs"
      - "vendor/producer-a/crates/pub-interaction/src/snap.rs"
      - ".github/workflows/editor-snap-core-v1.yml"
  push:
    branches:
      - editor-snap-core-rar-v1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  snap-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test pub-interaction snap core
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-interaction
      - name: Check pub-interaction
        run: cargo check --manifest-path vendor/producer-a/Cargo.toml -p pub-interaction
