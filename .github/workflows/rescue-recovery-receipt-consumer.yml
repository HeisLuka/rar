name: Chaptera Rescue recovery receipt consumer

on:
  pull_request:
    paths:
      - "packages/product/rescue-recovery/**"
      - "tools/validate_rescue_recovery_receipt.py"
      - "tools/test_validate_rescue_recovery_receipt.py"
      - "docs/chaptera-rescue-recovery-receipt-v1.md"
      - ".github/workflows/rescue-recovery-receipt-consumer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema==4.23.0"
      - name: Validate Rescue receipt contract
        run: python -m unittest tools/test_validate_rescue_recovery_receipt.py -v
