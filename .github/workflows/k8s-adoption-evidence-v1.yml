name: K8S adoption evidence gate

on:
  pull_request:
    paths:
      - "tools/k8s_adoption_review_v1.py"
      - "tools/test_k8s_adoption_review_v1.py"
      - ".github/workflows/k8s-adoption-evidence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reducer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile reducer and tests
        run: |
          python -m py_compile tools/k8s_adoption_review_v1.py
          python -m py_compile tools/test_k8s_adoption_review_v1.py

      - name: Run deterministic reducer tests
        run: python tools/test_k8s_adoption_review_v1.py
