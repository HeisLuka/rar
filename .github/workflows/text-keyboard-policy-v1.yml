name: Text Keyboard Policy V1

on:
  pull_request:
    paths:
      - "services/editor-api/text_keyboard_policy_v1.py"
      - "services/editor-api/test_text_keyboard_policy_v1.py"
      - "services/editor-api/text_selection_state_v1.py"
      - "services/editor-api/resolved_text_caret_map_v1.py"
      - "services/editor-api/story_edit_domain_v1.py"
      - "services/editor-api/story_edit_transaction_v1.py"
      - ".github/workflows/text-keyboard-policy-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove pinned Unicode data version
        run: |
          python - <<'PY'
          import unicodedata
          assert unicodedata.unidata_version == "15.0.0", unicodedata.unidata_version
          print("Unicode data:", unicodedata.unidata_version)
          PY
      - name: Run keyboard policy regressions
        working-directory: services/editor-api
        run: python -m unittest -v test_text_keyboard_policy_v1
      - name: Regression caret, selection and transaction contracts
        working-directory: services/editor-api
        run: python -m unittest -v test_resolved_text_caret_map_v1 test_text_selection_state_v1 test_story_edit_domain_v1 test_story_edit_transaction_v1
