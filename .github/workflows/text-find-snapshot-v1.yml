name: Text Find Snapshot V1

on:
  pull_request:
    paths:
      - "services/editor-api/text_find_snapshot_v1.py"
      - "services/editor-api/test_text_find_snapshot_v1.py"
      - "services/editor-api/story_edit_domain_v1.py"
      - "services/editor-api/text_ingress_v1.py"
      - ".github/workflows/text-find-snapshot-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run revision-bound literal Story search tests
        working-directory: services/editor-api
        run: python -m unittest -v test_text_find_snapshot_v1
