name: DIAG 787 blob-store tests

on:
  pull_request:
    paths:
      - ".github/workflows/diag-787-full-suite-hang.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: create_and_verified_read_start_from_tenant_binding_not_hash
          - test: tenant_local_dedupe_reuses_physical_blob_but_not_binding_identity
          - test: cross_tenant_content_does_not_reuse_physical_blob
          - test: unknown_create_outcome_reconciles_by_exact_head_and_read
          - test: streamed_quarantine_fallback_is_exact_create_once_and_reopenable
          - test: streamed_quarantine_fallback_rejects_length_mismatch
          - test: quarantine_inspect_and_exact_read_preserve_object_identity
          - test: quarantine_exact_read_fails_closed_on_identity_drift
          - test: direct_upload_requires_provider_hard_size_and_create_only_capabilities
          - test: signed_grant_is_exactly_scoped_and_expires
          - test: async_hashing_bounded_reader_rejects_one_byte_over_and_under
          - test: async_hashing_owned_reader_rejects_one_byte_over_and_under
          - test: provider_create_only_rejects_same_key_overwrite

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Run isolated BlobStore test
        shell: bash
        run: |
          set -euo pipefail
          echo "test=${{ matrix.test }}"
          timeout 180 cargo test -p chaptera-server "blob_store::tests::${{ matrix.test }}" -- --exact --nocapture --test-threads=1
