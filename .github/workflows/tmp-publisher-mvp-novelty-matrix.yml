name: TEMP Publisher MVP novelty matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/corpus/tmp_publisher_mvp_wayback.py'
      - '.github/workflows/tmp-publisher-mvp-novelty-matrix.yml'

permissions:
  contents: read
  actions: read

jobs:
  scope:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: bigpond-auslandline, scope: 'users.bigpond.com/auslandline/publisher/' }
          - { id: bigpond-www-auslandline, scope: 'www.users.bigpond.com/auslandline/publisher/' }
          - { id: bigpond-ausirion, scope: 'users.bigpond.com/ausirion/' }
          - { id: bigpond-www-ausirion, scope: 'www.users.bigpond.com/ausirion/' }
          - { id: mvps, scope: 'mvps.org/publisher/' }
          - { id: www-mvps, scope: 'www.mvps.org/publisher/' }
          - { id: kvalheim, scope: 'kvalheim.org/' }
          - { id: www-kvalheim, scope: 'www.kvalheim.org/' }
          - { id: publishermvps, scope: 'publishermvps.com/' }
          - { id: www-publishermvps, scope: 'www.publishermvps.com/' }
          - { id: ed-mvps, scope: 'ed.mvps.org/Publisher/' }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover one historical scope
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/corpus/tmp_publisher_mvp_wayback.py \
            --scope '${{ matrix.scope }}' \
            --limit 1500 \
            --timeout 25 \
            --retries 1 \
            --out out/seed.csv \
            --summary out/discovery.json
          cat out/discovery.json
      - name: Recover archived Publisher bytes
        run: |
          set -euo pipefail
          python tools/corpus/harvest_pub.py \
            --seed out/seed.csv \
            --out out/harvest \
            --max-files -1 \
            --timeout 30 \
            --max-bytes 104857600 \
            --per-host-delay 0.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-scope-${{ matrix.id }}
          path: out/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  aggregate:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mvp-scope-*
          path: combined
      - name: Exact SHA novelty against current 950
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import glob, hashlib, io, json, os, shutil, zipfile
          from pathlib import Path
          from urllib.request import Request, urlopen

          artifact_ids = [10808750049,10807797944,10808390771,10807882317,10808417821,10807881478,10807597565]
          token=os.environ['GITHUB_TOKEN']
          known=set()
          for aid in artifact_ids:
              req=Request(f'https://api.github.com/repos/HeisLuka/rar/actions/artifacts/{aid}/zip', headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'User-Agent':'rar-mvp-novelty/1.0'})
              with urlopen(req,timeout=120) as r: payload=r.read()
              with zipfile.ZipFile(io.BytesIO(payload)) as z:
                  names=[n for n in z.namelist() if n.endswith('index.json')]
                  if not names: raise RuntimeError(f'no index.json in {aid}')
                  for row in json.loads(z.read(names[0])):
                      sha=str(row.get('sha256','')).lower()
                      if len(sha)==64: known.add(sha)
          if len(known)!=950: raise RuntimeError(f'expected 950 known SHA, got {len(known)}')

          out=Path('novel'); out.mkdir()
          all_rows=[]; discovery=[]
          for p in glob.glob('combined/**/discovery.json',recursive=True):
              try: discovery.append(json.loads(Path(p).read_text()))
              except Exception: pass
          for mp in glob.glob('combined/**/harvest/manifest.json',recursive=True):
              base=Path(mp).parent
              rows=json.loads(Path(mp).read_text(encoding='utf-8'))
              for row in rows:
                  rec=dict(row); rec['_harvest_dir']=str(base); all_rows.append(rec)

          novel_by_sha={}; known_hits=set(); publisher_seen=set()
          for row in all_rows:
              if row.get('fetch_status')!='ok' or row.get('classification')!='cfb_publisher_hint': continue
              sha=str(row.get('sha256') or '').lower()
              if len(sha)!=64: continue
              publisher_seen.add(sha)
              if sha in known:
                  known_hits.add(sha); continue
              if sha in novel_by_sha: continue
              src=Path(row['_harvest_dir'])/str(row.get('stored_path') or '')
              if not src.is_file(): raise RuntimeError(f'missing payload {src}')
              data=src.read_bytes()
              actual=hashlib.sha256(data).hexdigest()
              if actual!=sha: raise RuntimeError(f'SHA mismatch {sha} != {actual}')
              if not data.startswith(bytes.fromhex('D0CF11E0A1B11AE1')): raise RuntimeError(f'non CFB {sha}')
              name=Path(str(row.get('stored_path') or 'candidate.pub')).name
              dst=out/f'{sha}__{name}'
              shutil.copyfile(src,dst)
              rec={k:v for k,v in row.items() if k!='_harvest_dir'}
              rec['exported_name']=dst.name
              novel_by_sha[sha]=rec

          novel=[novel_by_sha[k] for k in sorted(novel_by_sha)]
          Path('novel.json').write_text(json.dumps(novel,indent=2,ensure_ascii=False),encoding='utf-8')
          summary={
              'known_corpus_sha':len(known),
              'scope_discovery':discovery,
              'harvest_rows':len(all_rows),
              'publisher_unique_sha':len(publisher_seen),
              'known_sha_hits':len(known_hits),
              'novel_unique_sha':len(novel),
              'novel_sha256':[r['sha256'] for r in novel],
              'novel_original_urls':[r.get('wayback_original_url') for r in novel],
          }
          Path('summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: publisher-mvp-novelty-matrix-${{ github.run_id }}
          path: |
            summary.json
            novel.json
            novel/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 6