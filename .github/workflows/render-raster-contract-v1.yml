name: Render Raster Contract V1

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/chaptera-render-raster-contract/**"
      - ".github/workflows/render-raster-contract-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Check focused crate
        run: cargo check -p chaptera-render-raster-contract
      - name: Clippy focused crate
        run: cargo clippy -p chaptera-render-raster-contract --all-targets -- -D warnings
      - name: Run raster contract tests
        run: cargo test -p chaptera-render-raster-contract
      - name: Emit raster contract receipt
        run: mkdir -p target/render-raster-contract && cargo run -q -p chaptera-render-raster-contract --bin raster_contract_receipt | tee target/render-raster-contract/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: render-raster-contract-${{ github.run_id }}
          path: target/render-raster-contract/receipt.json
          if-no-files-found: error
