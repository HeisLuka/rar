name: Story Edit Transaction V1

on:
  pull_request:
    paths:
      - "services/editor-api/story_edit_transaction_v1.py"
      - "services/editor-api/test_story_edit_transaction_v1.py"
      - "services/editor-api/revision_store.py"
      - "services/editor-api/story_range_v1.py"
      - "services/editor-api/story_edit_domain_v1.py"
      - "services/editor-api/paragraph_lifecycle_v1.py"
      - "services/editor-api/range_anchor_rebase_v1.py"
      - "services/editor-api/text_format_overlay_v1.py"
      - "services/editor-api/text_insert_format_v1.py"
      - ".github/workflows/story-edit-transaction-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run atomic Story transaction and producer regressions
        working-directory: services/editor-api
        run: >-
          python -m unittest -v
          test_story_edit_transaction_v1
          test_revision_store.StoryRangeCommitTests
          test_story_edit_domain_v1
          test_paragraph_lifecycle_v1
          test_range_anchor_rebase_v1
          test_text_format_overlay_v1
          test_text_insert_format_v1
