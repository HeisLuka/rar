name: TEMP Univik Publisher provenance
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-univik-prov-01.yml'
permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y innoextract file binutils osslsigncode
      - name: Fetch exact Univik 6.9 installer and inspect installed payload
        run: |
          set -euo pipefail
          mkdir -p out /tmp/univik/payload
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -D /tmp/univik/headers -o /tmp/univik/setup.exe \
            -w 'http_code=%{http_code}\nurl_effective=%{url_effective}\ncontent_type=%{content_type}\nsize_download=%{size_download}\n' \
            'https://univik.com/dl/setup-pub-converter.exe' > /tmp/univik/meta
          echo '609ab9ce2a0c6e7b8cac561fa93450985f6c08190a22f0001f4b45d59a9a2020  /tmp/univik/setup.exe' | sha256sum -c -
          osslsigncode verify -in /tmp/univik/setup.exe > /tmp/univik/signature 2>&1 || true
          innoextract -l /tmp/univik/setup.exe > /tmp/univik/inno-list.txt 2>&1
          innoextract -d /tmp/univik/payload /tmp/univik/setup.exe > /tmp/univik/inno-extract.txt 2>&1

          python - <<'PY'
          import pathlib, hashlib, json, subprocess, re, os
          root=pathlib.Path('/tmp/univik/payload')
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for c in iter(lambda:f.read(1<<20),b''): h.update(c)
              return h.hexdigest()
          def run(args):
              try:
                  r=subprocess.run(args,capture_output=True,text=True,errors='replace',timeout=45)
                  return r.stdout+r.stderr
              except Exception as e:
                  return 'ERROR '+repr(e)
          files=[p for p in root.rglob('*') if p.is_file()]
          inv=[]; bins=[]; combined=''; notices=[]
          high=re.compile(r'Univik|PUB Converter|--no-publisher|no-publisher|Microsoft Publisher|Publisher.Application|MSPUB|PUBFILT|PUBCONV|libmspub|librevenge|writerperfect|libwpd|LibreOffice|OpenOffice|Aspose|KeyView|Outside In|4n6|Forensik|Delphi|Embarcadero|Qt|Electron|Tauri|Rust|Python|CEF|Chromium|license|copyright|third.party|plugin|converter',re.I)
          for p in files:
              rel=str(p.relative_to(root))
              ft=run(['file','-b',str(p)]).strip()
              row={'path':rel,'size':p.stat().st_size,'sha256':sha(p),'file_type':ft}
              inv.append(row)
              low=rel.lower()
              if any(x in low for x in ['license','licence','notice','copying','copyright','readme','eula','thirdparty','third-party']):
                  notices.append(row)
              if 'PE32' in ft or p.suffix.lower() in {'.exe','.dll'}:
                  s=run(['strings','-a','-n','5',str(p)])
                  combined+='\n'+s
                  row['imports_excerpt']=run(['objdump','-p',str(p)])[:50000]
                  row['marker_excerpt']='\n'.join(x for x in s.splitlines() if high.search(x))[:50000]
                  bins.append(row)
          low=combined.lower()
          markers=['libmspub','librevenge','writerperfect','libwpd','libreoffice','openoffice','aspose','keyview','outside in','publisher.application','mspub','pubfilt','pubconv','--no-publisher','no-publisher','4n6','forensik','univik']
          report={
            'schema':'chaptera.univik-publisher-provenance.v1',
            'source_safe':True,
            'raw_package_retained':False,
            'installer':{
              'url':'https://univik.com/dl/setup-pub-converter.exe',
              'size':pathlib.Path('/tmp/univik/setup.exe').stat().st_size,
              'sha256':sha(pathlib.Path('/tmp/univik/setup.exe')),
              'signature_excerpt':pathlib.Path('/tmp/univik/signature').read_text(errors='replace')[:20000]
            },
            'inno_listing_excerpt':pathlib.Path('/tmp/univik/inno-list.txt').read_text(errors='replace')[:40000],
            'file_count':len(files),
            'inventory':inv,
            'binary_count':len(bins),
            'binaries':bins,
            'notice_candidates':notices,
            'marker_counts':{m:low.count(m) for m in markers},
            'guardrail':'Static package evidence can establish bundled dependencies and automation markers; absence of markers does not by itself prove clean-room independence.'
          }
          pathlib.Path('out/report.json').write_text(json.dumps(report,indent=2))
          summary={
            'schema':'chaptera.univik-publisher-provenance-summary.v1',
            'installer':report['installer'],
            'file_count':report['file_count'],
            'binary_count':report['binary_count'],
            'notice_candidates':report['notice_candidates'],
            'marker_counts':report['marker_counts'],
            'binaries':[{
              'path':x['path'],'size':x['size'],'sha256':x['sha256'],'file_type':x['file_type'],
              'imports_excerpt':x.get('imports_excerpt','')[:12000],
              'marker_excerpt':x.get('marker_excerpt','')[:12000]
            } for x in bins],
            'guardrail':report['guardrail']
          }
          pathlib.Path('out/summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          sha256sum out/*.json | sort > out/sha256sums.txt
      - name: Enforce source-safe artifact
        run: |
          set -euo pipefail
          if find out -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.bin' \) | grep -q .; then exit 1; fi
          python - <<'PY'
          import json
          r=json.load(open('out/report.json'))
          assert r['source_safe'] is True and r['raw_package_retained'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: univik-publisher-provenance-receipt
          path: out/**
          if-no-files-found: error
          retention-days: 90
