name: Cmo slot-flow receipt V1

on:
  pull_request:
    paths:
      - "packages/protocol/pub-projection/v1/cmo-slot-flow-*"
      - "tools/cmo_slot_flow_v1.py"
      - "tools/validate_cmo_slot_flow_receipt.py"
      - "tools/test_cmo_slot_flow_v1.py"
      - ".github/workflows/cmo-slot-flow-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run slot-flow unit and negative tests
        run: python tools/test_cmo_slot_flow_v1.py -v
      - name: Produce source-free synthetic receipt
        run: |
          python tools/cmo_slot_flow_v1.py \
            packages/protocol/pub-projection/v1/cmo-slot-flow-synthetic-input.json \
            > /tmp/cmo-slot-flow-receipt.json
      - name: Validate independent public receipt contract
        run: python tools/validate_cmo_slot_flow_receipt.py /tmp/cmo-slot-flow-receipt.json
