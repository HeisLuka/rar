name: Cmo slot-flow receipt V1

on:
  pull_request:
    paths:
      - "crates/chaptera-layout-projection/**"
      - "crates/chaptera-scene-instance/**"
      - "packages/protocol/pub-projection/v1/cmo-slot-flow-*"
      - "tools/cmo_slot_flow_v1.py"
      - "tools/cmo_slot_runtime_bridge_v1.py"
      - "tools/resolved_graph_scene_bridge_v1.py"
      - "tools/validate_cmo_slot_flow_receipt.py"
      - "tools/test_cmo_slot_flow_v1.py"
      - "tools/test_cmo_slot_flow_carlton_march.py"
      - "tools/test_cmo_slot_runtime_bridge_v1.py"
      - "tools/test_resolved_graph_scene_bridge_v1.py"
      - ".github/workflows/cmo-slot-flow-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run source-free slot-flow unit and negative tests
        run: python tools/test_cmo_slot_flow_v1.py -v
      - name: Run exact Carlton March source-free witnesses
        run: python tools/test_cmo_slot_flow_carlton_march.py -v
      - name: Validate resolved Scene Cmo admission boundary
        run: python tools/test_resolved_graph_scene_bridge_v1.py -v
      - name: Check canonical Rust slot-flow formatting
        run: cargo fmt -p chaptera-layout-projection -- --check
      - name: Check canonical Rust slot-flow crate
        run: cargo check -p chaptera-layout-projection --all-targets
      - name: Lint canonical Rust slot-flow crate
        run: cargo clippy -p chaptera-layout-projection --all-targets -- -D warnings
      - name: Test canonical Rust slot-flow crate
        run: cargo test -p chaptera-layout-projection
      - name: Exercise typed current-graph runtime bridge
        run: python tools/test_cmo_slot_runtime_bridge_v1.py -v
      - name: Produce source-free synthetic receipt
        run: |
          python tools/cmo_slot_flow_v1.py \
            packages/protocol/pub-projection/v1/cmo-slot-flow-synthetic-input.json \
            > /tmp/cmo-slot-flow-receipt.json
      - name: Validate independent public receipt contract
        run: python tools/validate_cmo_slot_flow_receipt.py /tmp/cmo-slot-flow-receipt.json
