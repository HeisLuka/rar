name: PlcCmob projection receipt V1

on:
  pull_request:
    paths:
      - "packages/protocol/pub-projection/**"
      - "tools/validate_plccmob_projection_receipt.py"
      - "tools/test_plccmob_projection_receipt.py"
      - ".github/workflows/plccmob-projection-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"

      - name: Run PlcCmob source-free contract tests
        run: python -m unittest -v tools/test_plccmob_projection_receipt.py
