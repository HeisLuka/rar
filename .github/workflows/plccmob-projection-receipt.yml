name: PlcCmob projection receipt V1

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/pub-plccmob-projection/**"
      - "crates/pub-model/src/projection_context.rs"
      - "crates/pub-model/src/source_identity.rs"
      - "packages/protocol/pub-projection/**"
      - "tools/validate_plccmob_projection_receipt.py"
      - "tools/test_plccmob_projection_receipt.py"
      - ".github/workflows/plccmob-projection-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"

      - name: Check bounded Rust core formatting
        run: cargo fmt -p pub-model -p pub-plccmob-projection -- --check

      - name: Check bounded Rust core
        run: cargo check -p pub-plccmob-projection --all-targets

      - name: Lint bounded Rust core
        run: cargo clippy -p pub-plccmob-projection --all-targets -- -D warnings

      - name: Test bounded Rust core
        run: cargo test -p pub-plccmob-projection

      - name: Run PlcCmob source-free contract tests
        run: python tools/test_plccmob_projection_receipt.py -v

      - name: Produce sanitized synthetic receipt through Rust core
        run: cargo run -q -p pub-plccmob-projection --bin plccmob-projection-producer -- packages/protocol/pub-projection/v1/plccmob-synthetic-input.json > /tmp/plccmob-receipt.json

      - name: Validate Rust-produced receipt against public schema
        run: python tools/validate_plccmob_projection_receipt.py /tmp/plccmob-receipt.json
