name: VISREG-01 structured visual regression oracle

on:
  pull_request:
    paths:
      - "packages/validation/visreg/**"
      - "packages/protocol/scene/**"
      - "tools/visreg_v1.py"
      - "tools/test_visreg_v1.py"
      - "tools/run_visreg_contract.py"
      - "tools/scene_v1.py"
      - "tools/adapt_viewer_scene_v1.py"
      - "docs/visreg-v1.md"
      - ".github/workflows/visreg-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visreg-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Unit-test stage separation and determinism
        working-directory: tools
        run: python test_visreg_v1.py
      - name: Produce structured visual regression receipt
        run: python tools/run_visreg_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: visreg-v1-contract
          path: target/visreg-v1/
          if-no-files-found: error
