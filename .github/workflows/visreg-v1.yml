name: VISREG-01 structured visual regression

on:
  pull_request:
    paths:
      - "packages/protocol/scene/**"
      - "tools/scene_v1.py"
      - "tools/visreg_v1.py"
      - "tools/test_visreg_v1.py"
      - ".github/workflows/visreg-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate VISREG-01 structured oracle
        run: python tools/test_visreg_v1.py

      - name: Upload VISREG-01 receipts
        uses: actions/upload-artifact@v4
        with:
          name: visreg-01-receipts
          path: target/visreg/
