name: Multi Story Text Transaction V1

on:
  pull_request:
    paths:
      - "services/editor-api/multi_story_text_transaction_v1.py"
      - "services/editor-api/test_multi_story_text_transaction_v1.py"
      - "services/editor-api/story_edit_transaction_v1.py"
      - "services/editor-api/story_find_replace_v1.py"
      - "services/editor-api/revision_store.py"
      - ".github/workflows/multi-story-text-transaction-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run atomic multi-Story text coordinator tests
        working-directory: services/editor-api
        run: python -m unittest -v test_multi_story_text_transaction_v1 test_story_edit_transaction_v1 test_story_find_replace_v1
