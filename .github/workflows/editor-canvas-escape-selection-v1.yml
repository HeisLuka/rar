name: Editor Canvas Escape Selection V1

on:
  pull_request:
    paths:
      - "services/editor-api/editor_canvas_escape_selection_v1.py"
      - "services/editor-api/test_editor_canvas_escape_selection_v1.py"
      - "services/editor-api/editor_tool_routing_v1.py"
      - "services/editor-api/group_member_selection_v1.py"
      - ".github/workflows/editor-canvas-escape-selection-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run final Escape selection fallback tests
        working-directory: services/editor-api
        run: python -m unittest -v test_editor_canvas_escape_selection_v1 test_editor_tool_routing_v1 test_group_member_selection_v1
