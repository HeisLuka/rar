name: TEMP Office XP SBS OReilly identity recovery

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-corpus-new-pub-training-officexp-oreilly-identity-01.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install static OLE parser
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Crawl bounded archived ISBN route and inspect PUB payloads
        run: |
          set -euo pipefail
          mkdir -p work out
          python - <<'PY'
          import csv, hashlib, io, json, pathlib, re, shutil, time, urllib.parse, urllib.request, zipfile
          from html.parser import HTMLParser
          import olefile

          UA='rar-pub-training-officexp-oreilly-identity/1.0'
          PREFIX='http://examples.oreilly.com/9780735612945/'
          CDX='https://web.archive.org/cdx/search/cdx'
          TARGET_NAMES={'businesscard.pub','spotcolor.pub','spotcolor2.pub','processcolor.pub','printdoc1.pub','printdoc2.pub'}
          INTUIT={
            'businesscard.pub':'58c0746aafd2dd3507e5d423e0517907b3102d01e51b89c5edb8e5bd2b41990b',
            'printdoc1.pub':'fc17e25db2121cf67d4ed7fea9796187d2a8469d720a30fa1dfa545402e9d386',
            'printdoc2.pub':'5ca332349e7c51295daf1feb765522e6fbc3268b29757465a00e8e92afdff017',
            'processcolor.pub':'878006a356b55de273c65f88e731c8610fda37c2ab7985a3b528e5d4e65c7f4b',
            'spotcolor.pub':'66fc3c1c08c8041a873cd890a7bba157af83a6271f221fd0976e5f467481a147',
            'spotcolor2.pub':'2ba7cb71c9637eafe185bde36d0dd0f18a98cc1869ff1c6df6cd86dae0dd4c10',
          }

          def get(url, cap=32*1024*1024, timeout=60, accept='*/*'):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  b=r.read(cap+1)
                  if len(b)>cap: raise ValueError('response exceeded cap')
                  return b,r.geturl(),dict(r.headers)

          def cdx(prefix):
              params=[
                  ('url',prefix),('matchType','prefix'),('output','json'),
                  ('fl','timestamp,original,mimetype,statuscode,digest,length'),
                  ('filter','statuscode:200'),('collapse','digest'),('limit','10000'),('gzip','false')
              ]
              b,_,_=get(CDX+'?'+urllib.parse.urlencode(params),cap=8*1024*1024,accept='application/json')
              v=json.loads(b.decode('utf-8'))
              if not v: return []
              h=v[0]
              return [{str(k):str(x) for k,x in zip(h,row)} for row in v[1:] if isinstance(row,list)]

          rows=cdx(PREFIX)
          pathlib.Path('out/cdx.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')

          class LP(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='a':
                      h=dict(attrs).get('href')
                      if h: self.links.append(h.strip())

          candidates={}
          for row in rows:
              orig=row.get('original','')
              low=orig.lower()
              if any(n in low for n in TARGET_NAMES) or re.search(r'\.(zip|exe|cab|pub)(?:$|[?#])',low):
                  candidates[(row['timestamp'],orig)]=row

          # Parse captured HTML under the exact ISBN path to discover hidden relative links.
          html_rows=[r for r in rows if 'html' in r.get('mimetype','').lower()]
          for row in html_rows[:50]:
              ts,orig=row['timestamp'],row['original']
              snap=f'https://web.archive.org/web/{ts}id_/{orig}'
              try:
                  b,_,_=get(snap,cap=2*1024*1024,accept='text/html,*/*;q=0.1')
                  p=LP(); p.feed(b.decode('utf-8','replace'))
                  for href in p.links:
                      u=urllib.parse.urljoin(orig,href)
                      low=u.lower()
                      if any(n in low for n in TARGET_NAMES) or re.search(r'\.(zip|exe|cab|pub)(?:$|[?#])',low):
                          # Find an exact capture for discovered URL.
                          try:
                              exact=cdx(u)
                              for er in exact:
                                  candidates[(er['timestamp'],er['original'])]=er
                          except Exception:
                              pass
              except Exception:
                  pass

          found=[]
          seen_payload=set()

          def inspect_pub(raw,name,source):
              sha=hashlib.sha256(raw).hexdigest()
              rec={'name':name,'size':len(raw),'sha256':sha,'source':source,'is_cfb':raw[:8]==bytes.fromhex('d0cf11e0a1b11ae1')}
              if rec['is_cfb']:
                  tmp=pathlib.Path('work/tmp.pub'); tmp.write_bytes(raw)
                  try:
                      ole=olefile.OleFileIO(str(tmp))
                      streams=['/'.join(x) for x in ole.listdir(streams=True,storages=False)]
                      rec['streams']=streams
                      cn=next((x for x in ole.listdir(streams=True,storages=False) if x and x[-1]=='Contents'),None)
                      rec['has_contents']=cn is not None
                      if cn:
                          c=ole.openstream(cn).read(64)
                          rec['contents_prefix_hex']=c.hex()
                          rec['contents_len']=ole.get_size(cn)
                      ole.close()
                  finally:
                      tmp.unlink(missing_ok=True)
              base=name.rsplit('/',1)[-1].casefold()
              rec['matches_intuit_sha']=INTUIT.get(base)==sha if base in INTUIT else None
              return rec

          for row in sorted(candidates.values(),key=lambda x:(x.get('original',''),x.get('timestamp',''))):
              ts,orig=row['timestamp'],row['original']
              snap=f'https://web.archive.org/web/{ts}id_/{orig}'
              try:
                  b,final,h=get(snap,cap=32*1024*1024,timeout=90)
              except Exception as e:
                  found.append({'source':orig,'timestamp':ts,'fetch_error':f'{type(e).__name__}: {e}'})
                  continue
              ph=hashlib.sha256(b).hexdigest()
              if ph in seen_payload: continue
              seen_payload.add(ph)
              low=orig.lower()
              ctype=(h.get('Content-Type') or '').lower()
              if low.endswith('.pub') or b[:8]==bytes.fromhex('d0cf11e0a1b11ae1'):
                  found.append(inspect_pub(b,orig,{'original':orig,'timestamp':ts,'snapshot':snap}))
              elif low.endswith('.zip') or b[:4]==b'PK\x03\x04' or 'zip' in ctype:
                  try:
                      with zipfile.ZipFile(io.BytesIO(b)) as z:
                          for info in z.infolist():
                              if info.is_dir() or not info.filename.lower().endswith('.pub'): continue
                              if info.file_size>50*1024*1024: continue
                              raw=z.read(info)
                              found.append(inspect_pub(raw,info.filename,{'original':orig,'timestamp':ts,'snapshot':snap,'container_sha256':ph}))
                  except Exception as e:
                      found.append({'source':orig,'timestamp':ts,'container_sha256':ph,'zip_error':f'{type(e).__name__}: {e}'})
              else:
                  found.append({'source':orig,'timestamp':ts,'size':len(b),'sha256':ph,'content_type':ctype,'classification':'non_pub_carrier'})

          pub_rows=[r for r in found if r.get('sha256') and r.get('is_cfb')]
          exact_matches=[r for r in pub_rows if r.get('matches_intuit_sha') is True]
          summary={
              'schema':'chaptera.corpus-training-officexp-oreilly-identity.v1',
              'source_safe':True,'raw_pub_retained':False,
              'isbn13':'9780735612945','prefix':PREFIX,
              'cdx_rows':len(rows),'candidate_captures':len(candidates),
              'pub_rows':len(pub_rows),'unique_pub_sha256':len({r['sha256'] for r in pub_rows}),
              'intuit_exact_sha_matches':len(exact_matches),
              'all_six_intuit_identities_confirmed':len({r['sha256'] for r in exact_matches})==6,
              'files':found,
              'guardrail':'OReilly examples ISBN routing is independent provenance evidence only if archived payload identity is recovered; URL naming alone does not upgrade provenance.'
          }
          pathlib.Path('out/summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          shutil.rmtree('work',ignore_errors=True)
          PY

      - name: Source-safe artifact guard
        run: |
          set -euo pipefail
          if find out -type f \( -iname '*.pub' -o -iname '*.zip' -o -iname '*.cab' -o -iname '*.exe' -o -iname '*.iso' -o -iname '*.img' \) | grep -q .; then
            echo 'unexpected raw payload leaked into artifact' >&2
            exit 1
          fi
          sha256sum out/* | sort > out/sha256sums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-training-officexp-oreilly-identity
          path: out/**
          if-no-files-found: error
          retention-days: 90
