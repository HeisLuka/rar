name: Authoring overset receipt V1

on:
  pull_request:
    paths:
      - "packages/protocol/authoring-overset/**"
      - "tools/validate_authoring_overset_receipt.py"
      - "tools/test_authoring_overset_receipt.py"
      - "tools/build_authoring_overset_receipt.py"
      - "tools/test_build_authoring_overset_receipt.py"
      - ".github/workflows/authoring-overset-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run one-frame overset contract tests
        run: python tools/test_authoring_overset_receipt.py -v
      - name: Run local authoritative-producer orchestration tests
        run: python tools/test_build_authoring_overset_receipt.py -v
