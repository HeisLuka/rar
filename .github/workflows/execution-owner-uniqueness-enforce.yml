name: Execution owner uniqueness enforcement

on:
  issues:
    types: [opened, reopened, edited]
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review]
  workflow_dispatch:

concurrency:
  group: execution-owner-uniqueness-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch for issue events
        if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout trusted PR base for pull_request_target
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce role-aware execution owner uniqueness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/execution_owner_uniqueness.py --receipt target/execution-owner-uniqueness.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-owner-uniqueness-${{ github.run_id }}
          path: target/execution-owner-uniqueness.json
          if-no-files-found: warn
          retention-days: 30
