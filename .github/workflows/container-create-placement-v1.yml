name: Container Create Placement V1

on:
  pull_request:
    paths:
      - "services/editor-api/container_create_placement_v1.py"
      - "services/editor-api/test_container_create_placement_v1.py"
      - ".github/workflows/container-create-placement-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact Page/Group creation placement tests
        working-directory: services/editor-api
        run: python -m unittest -v test_container_create_placement_v1
