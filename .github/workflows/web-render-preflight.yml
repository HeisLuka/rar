name: WEB-RENDER-01 synthetic preflight

on:
  pull_request:
    paths:
      - "apps/web/render-v1.mjs"
      - "apps/web/render-v1.test.mjs"
      - "apps/web/render-benchmark.html"
      - "tools/run_web_renderer_benchmark.mjs"
      - "apps/web/frame-pacing-v1.mjs"
      - "apps/web/frame-pacing-v1.test.mjs"
      - "tools/run_web_worker_boundary_benchmark.mjs"
      - "docs/web-editor-render-surface-v1.md"
      - ".github/workflows/web-render-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit-test pure render contract
        run: node --test apps/web/render-v1.test.mjs
      - name: Unit-test frame pacing contract
        run: node --test apps/web/frame-pacing-v1.test.mjs
      - name: Install Playwright runner
        run: npm install --no-save playwright@1.55.0
      - name: Install browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run synthetic/protocol fixture benchmark
        run: node tools/run_web_renderer_benchmark.mjs ${{ matrix.browser }}
      - name: Run rAF storm benchmark
        run: node tools/run_web_worker_boundary_benchmark.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-render-preflight-${{ matrix.browser }}
          path: |
            target/web-render/${{ matrix.browser }}-*
            target/web-frame-pacing/${{ matrix.browser }}.json
