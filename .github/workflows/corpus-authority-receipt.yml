name: PUB corpus authority receipt

on:
  pull_request:
    paths:
      - 'tools/corpus/receipts/corpus-authority-lower-bound-2026-09-24.json'
      - 'tools/corpus/receipts/corpus-current-authority-2026-09-24.json'
      - 'tools/corpus/receipts/corpus-current-authority-2026-09-25-v3.json'
      - 'tools/corpus/receipts/corpus-current-authority-2026-09-25.json'
      - 'tools/corpus/receipts/current-rar-1515.sha256.txt'
      - 'tools/corpus/receipts/current-rar-1521.sha256.txt'
      - 'tools/corpus/receipts/version-labelled-training-29-input-2026-09-25.json'
      - 'tools/corpus/receipts/publisher2002-sbs-06-input-2026-09-25.json'
      - 'tools/corpus/receipts/container-net-new-407-part-*.sha256.txt'
      - 'tools/corpus/test_corpus_authority_receipt.py'
      - 'tools/corpus/test_corpus_current_authority.py'
      - '.github/workflows/corpus-authority-receipt.yml'
  push:
    branches: [main]
    paths:
      - 'tools/corpus/receipts/corpus-authority-lower-bound-2026-09-24.json'
      - 'tools/corpus/receipts/corpus-current-authority-2026-09-24.json'
      - 'tools/corpus/receipts/corpus-current-authority-2026-09-25-v3.json'
      - 'tools/corpus/receipts/corpus-current-authority-2026-09-25.json'
      - 'tools/corpus/receipts/current-rar-1515.sha256.txt'
      - 'tools/corpus/receipts/current-rar-1521.sha256.txt'
      - 'tools/corpus/receipts/version-labelled-training-29-input-2026-09-25.json'
      - 'tools/corpus/receipts/publisher2002-sbs-06-input-2026-09-25.json'
      - 'tools/corpus/receipts/container-net-new-407-part-*.sha256.txt'
      - 'tools/corpus/test_corpus_authority_receipt.py'
      - 'tools/corpus/test_corpus_current_authority.py'
      - '.github/workflows/corpus-authority-receipt.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/corpus/test_corpus_authority_receipt.py
      - run: python tools/corpus/test_corpus_current_authority.py
