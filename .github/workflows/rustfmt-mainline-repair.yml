name: Rustfmt mainline repair

# One-shot compatibility repair for current rustfmt 1.94.1.

on:
  push:
    branches:
      - rustfmt-mainline-repair-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rustfmt-mainline-repair-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - name: Normalize current workspace
        run: cargo fmt --all
      - name: Commit format-only delta
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No rustfmt delta."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "chore: normalize rustfmt on current mainline"
          git push origin HEAD:rustfmt-mainline-repair-v1
