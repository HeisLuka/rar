name: Authoring DeleteNodes V1

on:
  pull_request:
    paths:
      - "packages/protocol/authoring-delete-nodes/**"
      - "services/editor-api/delete_nodes_v1.py"
      - "services/editor-api/revision_store.py"
      - "services/editor-api/test_delete_nodes.py"
      - ".github/workflows/authoring-delete-nodes-v1.yml"
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run DeleteNodes revision and inverse tests
        working-directory: services/editor-api
        run: python -m unittest -v test_delete_nodes
      - name: Validate public DeleteNodes intent schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator

          schema = json.load(open("packages/protocol/authoring-delete-nodes/v1/delete-nodes-intent.schema.json"))
          Draft202012Validator.check_schema(schema)
          fixture = {
              "protocol_version": "chaptera.delete-nodes-intent.v1",
              "document_id": "doc:1",
              "source_hash": "a" * 64,
              "base_revision_id": "sha256:" + "b" * 64,
              "client_operation_id": "delete-nodes-op-0001",
              "command": {
                  "kind": "delete_nodes",
                  "page_id": "page:1",
                  "entries": [
                      {
                          "node_id": "node:a",
                          "expected_state_id": "sha256:" + "c" * 64,
                          "expected_child_index": 2
                      },
                      {
                          "node_id": "node:b",
                          "expected_state_id": "sha256:" + "d" * 64,
                          "expected_child_index": 1
                      }
                  ]
              }
          }
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          print("DeleteNodes intent schema valid")
          PY
