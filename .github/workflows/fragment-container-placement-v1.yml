name: Fragment Container Placement V1

on:
  pull_request:
    paths:
      - "services/editor-api/fragment_container_placement_v1.py"
      - "services/editor-api/test_fragment_container_placement_v1.py"
      - ".github/workflows/fragment-container-placement-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact fragment destination placement tests
        working-directory: services/editor-api
        run: python -m unittest -v test_fragment_container_placement_v1
