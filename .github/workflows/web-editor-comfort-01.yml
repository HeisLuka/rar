name: Web Editor Comfort V1

on:
  pull_request:
    paths:
      - "apps/web/editor-comfort-v1.mjs"
      - "apps/web/editor-comfort-v1.test.mjs"
      - ".github/workflows/web-editor-comfort-01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comfort:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test editor comfort controller
        run: node --test apps/web/editor-comfort-v1.test.mjs
