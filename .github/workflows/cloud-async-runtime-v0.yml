name: CLOUD-ASYNC-RUNTIME-01

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/job_queue.rs"
      - "apps/chaptera-server/src/job_worker.rs"
      - "apps/chaptera-server/src/jobs.rs"
      - "apps/chaptera-server/src/worker.rs"
      - "apps/chaptera-server/src/worker_runtime.rs"
      - "apps/chaptera-server/src/main.rs"
      - "apps/chaptera-server/src/config.rs"
      - "deploy/config/chaptera.prod.example.toml"
      - "apps/chaptera-server/src/lib.rs"
      - "apps/chaptera-server/migrations/0003_jobs.sql"
      - ".github/workflows/cloud-async-runtime-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Check task-owned formatting
        run: |
          rustfmt --edition 2024 --check \
            apps/chaptera-server/src/config.rs \
            apps/chaptera-server/src/jobs.rs \
            apps/chaptera-server/src/lib.rs \
            apps/chaptera-server/src/main.rs \
            apps/chaptera-server/src/worker.rs \
            apps/chaptera-server/src/worker_runtime.rs
      - name: Run clippy
        run: cargo clippy -p chaptera-server --all-targets -- -D warnings
      - name: Run durable queue and worker tests
        run: |
          cargo test -p chaptera-server job_queue::
          cargo test -p chaptera-server job_worker::
          cargo test -p chaptera-server worker_runtime::
          cargo test -p chaptera-server config::
