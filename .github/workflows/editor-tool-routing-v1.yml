name: Editor Tool Routing V1

on:
  pull_request:
    paths:
      - "services/editor-api/editor_tool_routing_v1.py"
      - "services/editor-api/test_editor_tool_routing_v1.py"
      - "services/editor-api/canvas_tool_state_v1.py"
      - "services/editor-api/editor_text_session_gestures_v1.py"
      - "services/editor-api/group_member_selection_v1.py"
      - ".github/workflows/editor-tool-routing-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run desktop tool routing regressions
        working-directory: services/editor-api
        run: python -m unittest -v test_editor_tool_routing_v1 test_canvas_tool_state_v1 test_group_member_selection_v1 test_editor_text_session_gestures_v1
