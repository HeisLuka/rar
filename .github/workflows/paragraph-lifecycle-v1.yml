name: Paragraph Lifecycle V1

on:
  pull_request:
    paths:
      - "services/editor-api/paragraph_lifecycle_v1.py"
      - "services/editor-api/test_paragraph_lifecycle_v1.py"
      - "services/editor-api/story_range_v1.py"
      - "services/editor-api/text_ingress_v1.py"
      - ".github/workflows/paragraph-lifecycle-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic paragraph lifecycle tests
        working-directory: services/editor-api
        run: python -m unittest -v test_paragraph_lifecycle_v1
