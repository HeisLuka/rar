name: Chaptera Windows update acceptance

on:
  pull_request:
    paths:
      - "apps/chaptera-desktop/**"
      - "crates/chaptera-update-engine/**"
      - "crates/chaptera-update-orchestrator/**"
      - "crates/chaptera-update-trust/**"
      - "crates/chaptera-update-handoff/**"
      - "installer/windows/chaptera-reader.iss"
      - "vendor/producer-a/**"
      - ".github/workflows/chaptera-win-update-accept.yml"
      - ".github/workstream-scopes/chaptera-win-update-accept-01.md"
  workflow_dispatch:

concurrency:
  group: chaptera-win-update-accept-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEWSLETTER_SHA256: 6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf
  INNO_SETUP_VERSION: 6.7.1
  CHAPTERA_VERSION: 0.1.0-preview

jobs:
  windows-update-acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Run deterministic Windows updater acceptance
        run: cargo test -p chaptera-update-orchestrator --test windows_product_acceptance windows_product_update_crash_rollback_recovery_cycle -- --exact --nocapture

  real-installed-reader-update:
    name: Real installed Reader update + rollback + uninstall
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Build Reader-only binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -p chaptera-desktop --release --features reader-only
          if (-not (Test-Path "target/release/chaptera-editor.exe")) {
            throw "reader-only shared desktop binary missing"
          }

      - name: Stage installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force stage,dist -ErrorAction SilentlyContinue
          $stage = "stage/chaptera-reader"
          New-Item -ItemType Directory -Force -Path $stage,dist | Out-Null
          Copy-Item "target/release/chaptera-editor.exe" "$stage/Chaptera-Reader.exe"
          @"
          # Chaptera PUB Reader — updater acceptance

          Real installed Reader composition fixture.
          "@ | Set-Content -Encoding utf8 "$stage/README.md"

      - name: Acquire pinned real PUB fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $fixture).Length
          if ($hash -ne $env:NEWSLETTER_SHA256) { throw "fixture SHA-256 mismatch: $hash" }
          if ($bytes -ne 291840) { throw "fixture byte length mismatch: $bytes" }
          "CHAPTERA_UPDATE_ACCEPT_PUB=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --version=$env:INNO_SETUP_VERSION --yes --no-progress --limit-output
          $candidate = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (Test-Path $candidate) {
            $iscc = $candidate
          } else {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "ISCC.exe not found after pinned Inno Setup install" }
            $iscc = $cmd.Source
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile existing stable-AppId Reader installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDir = (Resolve-Path "stage/chaptera-reader").Path
          $outputDir = (Resolve-Path "dist").Path
          & $env:ISCC_PATH "/DMyAppVersion=$env:CHAPTERA_VERSION" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" "installer/windows/chaptera-reader.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with code $LASTEXITCODE" }
          $setup = Join-Path $outputDir "Chaptera-Reader-Setup-$env:CHAPTERA_VERSION.exe"
          if (-not (Test-Path $setup)) { throw "expected installer missing: $setup" }
          "CHAPTERA_READER_SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install old Reader and preserve foreign default
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pubKey = "Registry::HKEY_CURRENT_USER\Software\Classes\.pub"
          New-Item -Path $pubKey -Force | Out-Null
          Set-Item -Path $pubKey -Value "Chaptera.Acceptance.PreExistingHandler"
          "CHAPTERA_UPDATE_ACCEPT_FOREIGN_DEFAULT=Chaptera.Acceptance.PreExistingHandler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $externalState = Join-Path $env:RUNNER_TEMP "chaptera-update-user-state.txt"
          Set-Content -Encoding utf8 -Path $externalState -Value "must-survive-update-rollback-uninstall"
          $externalHash = (Get-FileHash $externalState -Algorithm SHA256).Hash.ToLowerInvariant()
          "CHAPTERA_UPDATE_ACCEPT_EXTERNAL_STATE=$externalState" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_UPDATE_ACCEPT_EXTERNAL_HASH=$externalHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $install = Start-Process -FilePath $env:CHAPTERA_READER_SETUP -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer exited with code $($install.ExitCode)" }

          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\Chaptera PUB Reader"
          $installed = Join-Path $installRoot "current\chaptera-reader.exe"
          if (-not (Test-Path $installed)) { throw "installed Reader binary missing" }
          "CHAPTERA_UPDATE_ACCEPT_INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove Restart Manager quiesces two live installed Readers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test -p chaptera-update-orchestrator --test windows_product_acceptance real_installed_reader_restart_manager_quiesces_two_live_processes -- --exact --nocapture

      - name: Run real installed Reader authenticated update + rollback
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test -p chaptera-update-orchestrator --test windows_product_acceptance real_installed_reader_update_rollback_cycle -- --exact --nocapture

      - name: Verify installed product boundary after rollback
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:CHAPTERA_UPDATE_ACCEPT_INSTALL_ROOT
          $current = Join-Path $root "current"
          $reader = Join-Path $current "chaptera-reader.exe"
          $marker = Join-Path $current "acceptance-version.txt"
          if (-not (Test-Path $reader)) { throw "Reader missing after rollback" }
          if ((Get-Content -Raw $marker).Trim() -ne "B") { throw "rollback did not restore confirmed B marker" }
          if (-not (Test-Path (Join-Path $root "update-journal.json.prev"))) { throw "terminal updater journal receipt missing" }

          $pubKey = "Registry::HKEY_CURRENT_USER\Software\Classes\.pub"
          if ((Get-Item $pubKey).GetValue("") -ne $env:CHAPTERA_UPDATE_ACCEPT_FOREIGN_DEFAULT) {
            throw "update changed foreign .pub default"
          }
          $openWithPath = "$pubKey\OpenWithProgids"
          if (-not ((Get-Item $openWithPath).GetValueNames() -contains "Chaptera.PUB.Reader")) {
            throw "Chaptera Reader disappeared from Open With"
          }
          $commandPath = "Registry::HKEY_CURRENT_USER\Software\Classes\Chaptera.PUB.Reader\shell\open\command"
          $command = (Get-Item $commandPath).GetValue("")
          if ($command -notlike '*current*chaptera-reader.exe*%1*') {
            throw "Reader registration no longer targets current/chaptera-reader.exe: $command"
          }

          $externalHash = (Get-FileHash $env:CHAPTERA_UPDATE_ACCEPT_EXTERNAL_STATE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($externalHash -ne $env:CHAPTERA_UPDATE_ACCEPT_EXTERNAL_HASH) { throw "update changed external user state" }
          $pubHash = (Get-FileHash $env:CHAPTERA_UPDATE_ACCEPT_PUB -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pubHash -ne $env:NEWSLETTER_SHA256) { throw "update smoke mutated source PUB" }

          New-Item -ItemType Directory -Force -Path "target/update-acceptance" | Out-Null
          [ordered]@{
            schema_version = "chaptera.reader-update-acceptance.v1"
            product_id = "chaptera.reader"
            source_commit = "${{ github.sha }}"
            installed_layout_epoch = 1
            confirmed_version_marker = "B"
            bad_candidate = "C"
            rollback_restored_byte_identical_tree = $true
            real_pub_smoke_before_update = "pass"
            real_pub_smoke_candidate_b = "pass"
            real_pub_smoke_candidate_c_before_rejection = "pass"
            real_pub_smoke_after_rollback = "pass"
            source_pub_sha256 = $pubHash
            foreign_pub_default_preserved = $true
            open_with_preserved = $true
            external_user_state_preserved = $true
            reader_sha256_after_rollback = (Get-FileHash $reader -Algorithm SHA256).Hash.ToLowerInvariant()
            terminal_journal_receipt_present = $true
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "target/update-acceptance/receipt.json"

      - name: Uninstall after updater generations
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installRoot = $env:CHAPTERA_UPDATE_ACCEPT_INSTALL_ROOT
          $uninstallRoots = @(Get-ChildItem "Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
            Where-Object { (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -eq "Chaptera PUB Reader $env:CHAPTERA_VERSION" })
          if ($uninstallRoots.Count -ne 1) { throw "expected one Chaptera Reader uninstall entry, got $($uninstallRoots.Count)" }
          $uninstaller = (Get-ItemProperty $uninstallRoots[0].PSPath).UninstallString.Trim('"')
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller failed: $($uninstall.ExitCode)" }

          if (Test-Path $installRoot) {
            $remaining = @(Get-ChildItem -LiteralPath $installRoot -Force -Recurse -ErrorAction SilentlyContinue)
            if ($remaining.Count -gt 0) { throw "install root retained updater-owned content: $($remaining.FullName -join ', ')" }
          }
          $externalHash = (Get-FileHash $env:CHAPTERA_UPDATE_ACCEPT_EXTERNAL_STATE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($externalHash -ne $env:CHAPTERA_UPDATE_ACCEPT_EXTERNAL_HASH) { throw "uninstall changed external user state" }
          $pubKey = "Registry::HKEY_CURRENT_USER\Software\Classes\.pub"
          if ((Get-Item $pubKey).GetValue("") -ne $env:CHAPTERA_UPDATE_ACCEPT_FOREIGN_DEFAULT) {
            throw "uninstall changed foreign .pub default"
          }
          $openWithPath = "$pubKey\OpenWithProgids"
          if (Test-Path $openWithPath) {
            if ((Get-Item $openWithPath).GetValueNames() -contains "Chaptera.PUB.Reader") {
              throw "Chaptera Open With value survived uninstall"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: chaptera-real-installed-update-acceptance
          path: target/update-acceptance/receipt.json
          if-no-files-found: error
