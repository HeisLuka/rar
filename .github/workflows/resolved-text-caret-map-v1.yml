name: Resolved Text Caret Map V1

on:
  pull_request:
    paths:
      - "services/editor-api/resolved_text_caret_map_v1.py"
      - "services/editor-api/test_resolved_text_caret_map_v1.py"
      - ".github/workflows/resolved-text-caret-map-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source-neutral caret map and selection coverage tests
        working-directory: services/editor-api
        run: python -m unittest -v test_resolved_text_caret_map_v1
