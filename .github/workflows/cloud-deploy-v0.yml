name: CLOUD-DEPLOY-01 static host packet

on:
  pull_request:
    paths:
      - "deploy/**"
      - "docs/cloud-single-host-v0.md"
      - "tools/validate_cloud_deploy_v0.py"
      - ".github/workflows/cloud-deploy-v0.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static-host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate public-safe deployment packet
        run: python tools/validate_cloud_deploy_v0.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-deploy-v0-static-receipt
          path: target/cloud-deploy-v0/receipt.json
          if-no-files-found: error
