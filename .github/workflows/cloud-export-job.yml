name: CLOUD-EXPORT-JOB-01 contract

on:
  pull_request:
    paths:
      - "services/cloud-export/**"
      - "tools/run_cloud_export_job_contract.py"
      - "docs/cloud-export-job-v1.md"
      - ".github/workflows/cloud-export-job.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-job-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run export job contract tests
        working-directory: services/cloud-export
        run: python -m unittest -v test_export_job_v1.py
      - name: Produce machine-readable contract receipt
        run: python tools/run_cloud_export_job_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-export-job-v1-contract
          path: target/cloud-export-job-v1/receipt.json
          if-no-files-found: error
