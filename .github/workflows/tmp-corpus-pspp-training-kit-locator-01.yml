name: TEMP Publisher PSPP training-kit locator census

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-corpus-pspp-training-kit-locator-01.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enumerate bounded PSPP archive surfaces
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,re,time
          from urllib.parse import urlencode
          from urllib.request import Request,urlopen
          from pathlib import Path

          UA='rar-pub-pspp-locator/1.0'
          cdx='https://web.archive.org/cdx/search/cdx'
          queries=[
            ('office-help-asset','office.microsoft.com/en-us/help/HA010772371033.aspx','exact'),
            ('office-assistance-asset','office.microsoft.com/assistance/preview.aspx?AssetID=HA010772371033&CTT=98','exact'),
            ('publisher-root','microsoft.com/publisher/','prefix'),
            ('publisher-root-www','www.microsoft.com/publisher/','prefix'),
            ('publisher-printers','microsoft.com/publisher/printers','prefix'),
            ('publisher-printers-www','www.microsoft.com/publisher/printers','prefix'),
          ]
          rows=[]; errors=[]
          for label,url,mode in queries:
              params=[
                ('url',url),('matchType',mode),('output','json'),
                ('fl','timestamp,original,mimetype,statuscode,digest,length'),
                ('filter','statuscode:200'),('collapse','urlkey'),('limit','50000'),('gzip','false')
              ]
              try:
                  req=Request(cdx+'?'+urlencode(params),headers={'User-Agent':UA,'Accept':'application/json'})
                  with urlopen(req,timeout=90) as r:
                      data=json.load(r)
                  if data:
                      hdr=data[0]
                      for x in data[1:]:
                          if isinstance(x,list):
                              d={str(k):str(v) for k,v in zip(hdr,x)}
                              d['query_label']=label
                              rows.append(d)
              except Exception as e:
                  errors.append({'query':label,'error':f'{type(e).__name__}: {e}'})
              time.sleep(.5)

          # Retain only historically relevant root rows plus explicit carrier/training/prepress candidates.
          carrier_re=re.compile(r'\.(?:pub|zip|cab|exe|msi|iso|img|bin|cue|7z|rar)(?:$|[?#])',re.I)
          relevant_re=re.compile(r'(service.?provider|pspp|prepress|commercial.?print|printer|training|guide|troubleshoot|sample|exercise|download|kit)',re.I)
          likely=[r for r in rows if carrier_re.search(r.get('original','')) or relevant_re.search(r.get('original',''))]

          # Deduplicate original URL preserving earliest capture.
          dedup={}
          for r in sorted(likely,key=lambda x:x.get('timestamp','')):
              dedup.setdefault(r.get('original','').casefold(),r)
          likely=sorted(dedup.values(),key=lambda x:(x.get('query_label',''),x.get('original','')))

          summary={
            'schema':'chaptera.corpus-pspp-training-kit-locator.v1',
            'source_safe':True,
            'raw_payload_retained':False,
            'historical_basis':[
              'Microsoft 1999 Publisher 2000 release: PSPP free member kit included Publisher 2000 software and training material.',
              'Microsoft 2001 Publisher 2002 release: 5000+ service providers would receive Publisher 2002 and training materials.',
              'Historical Office help registration AssetID HA010772371033; Publisher referral path /publisher/printers.'
            ],
            'query_count':len(queries),
            'raw_rows':len(rows),
            'likely_rows':len(likely),
            'likely':likely,
            'errors':errors,
            'guardrail':'Program membership/product wording is provenance only. Locator metadata only; do not download/execute software or infer writer version.'
          }
          Path('out/summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          Path('out/likely.json').write_text(json.dumps(likely,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          for r in likely:
              print(r.get('timestamp',''),r.get('original',''),r.get('mimetype',''),r.get('length',''))
          PY
      - name: Metadata-only guard
        run: |
          set -euo pipefail
          if find out -type f \( -iname '*.pub' -o -iname '*.zip' -o -iname '*.cab' -o -iname '*.exe' -o -iname '*.msi' -o -iname '*.iso' \) | grep -q .; then
            echo 'unexpected carrier bytes in locator artifact' >&2
            exit 1
          fi
          sha256sum out/* | sort > out/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-pspp-training-kit-locator
          path: out/**
          retention-days: 60
