name: LAYOUT-RESOLVED-SCENE real SampleNewsletter closure

on:
  pull_request:
    paths:
      - "vendor/producer-a/producer/**"
      - "tools/build_layout_resolved_scene_receipt.py"
      - "tools/run_local_layout_resolved_scene_engine.py"
      - "tools/run_sample_newsletter_resolved_scene_bridge.py"
      - "tools/resolved_graph_scene_bridge_v1.py"
      - "tools/projection_context_sidecar_v1.py"
      - "apps/web/acceptance/receipts/viewer-geometry.real.json"
      - ".github/workflows/layout-resolved-scene-real.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-layout-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install "jsonschema==4.23.0"

      - name: Materialize pinned SampleNewsletter.pub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .web-v0
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" \
            -o .web-v0/SampleNewsletter.pub
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path(".web-v0/SampleNewsletter.pub")
          b=p.read_bytes()
          assert len(b)==291840
          assert hashlib.sha256(b).hexdigest()=="6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
          PY

      - name: Build bounded Rar producer slice
        run: cargo build --manifest-path vendor/producer-a/Cargo.toml -p chaptera-producer-a

      - name: Generate fresh resolved graph from pinned PUB
        shell: bash
        run: |
          set -euo pipefail
          vendor/producer-a/target/debug/resolved_graph \
            .web-v0/SampleNewsletter.pub \
            6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf \
            > .web-v0/resolved-graph.json
          actual="$(sha256sum .web-v0/resolved-graph.json | awk '{print $1}')"
          echo "resolved_graph_sha256=$actual"
          test "$actual" = "7c327cd729fc2f9760e59cce1dd7c104c55162f4c3032c132068cfee513b1c4d"

      - name: Upload fresh graph for mismatch diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-resolved-scene-fresh-graph
          path: .web-v0/resolved-graph.json
          if-no-files-found: warn
          retention-days: 3

      - name: Build real current-graph Scene lifecycle receipt
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_layout_resolved_scene_receipt.py \
            --source-hash 6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf \
            --document-id 9c2f8d5e-3f1b-4a57-9d40-6a7e2c11b001 \
            --output .web-v0/layout-resolved-scene.real.json \
            --implementation rar-resolved-graph-scene-bridge-v1 \
            --commit-or-build "$GITHUB_SHA" \
            -- python tools/run_local_layout_resolved_scene_engine.py \
              --fixture .web-v0/SampleNewsletter.pub \
              --source-byte-len 291840 \
              --state-dir .web-v0/layout-resolved-scene-state \
              -- python tools/run_sample_newsletter_resolved_scene_bridge.py \
                --resolved-graph .web-v0/resolved-graph.json \
                --viewer-receipt apps/web/acceptance/receipts/viewer-geometry.real.json \
                --expected-resolved-graph-sha256 7c327cd729fc2f9760e59cce1dd7c104c55162f4c3032c132068cfee513b1c4d \
                --target-node-id 007d9898-568b-5125-b519-8d88243aabfb \
                --target-page-id 58ffa2e0-896e-5a40-806c-bd0184ea9c85 \
                --after-x-emu 653710 \
                --after-y-emu 1445292
          python tools/validate_layout_resolved_scene_receipt.py \
            .web-v0/layout-resolved-scene.real.json

      - uses: actions/upload-artifact@v4
        with:
          name: layout-resolved-scene-real-sample-newsletter
          path: |
            .web-v0/resolved-graph.json
            .web-v0/layout-resolved-scene.real.json
          if-no-files-found: error
          retention-days: 14
