name: T720 corpus register 29 proof

on:
  pull_request:
    paths:
      - 'tools/corpus/t720_register_29_proof.py'
      - 'tools/corpus/test_t720_register_29.py'
      - 'tools/corpus/receipts/version-labelled-training-29-input-2026-09-25.json'
      - '.github/workflows/t720-corpus-register-29-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CFB dependency
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Run offline input tests
        working-directory: tools/corpus
        run: python -m unittest -v test_t720_register_29
      - name: Reproduce four Microsoft Press packages and exact successor authority
        working-directory: tools/corpus
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python t720_register_29_proof.py \
            --sources structural_novelty_sources.json \
            --input receipts/version-labelled-training-29-input-2026-09-25.json \
            --container-artifact-id 10805973231 \
            --container-artifact-sha256 1959aad2c1d1e274a1823c3261f7c04c9c3ffa4be10674fb166d89329705f26d \
            --crossarm-artifact-id 10812415542 \
            --crossarm-artifact-sha256 e773f22e0ee2efa1851485b16fd954d76bce970eccb20cc41733403d1f03301b \
            --out ../../out/t720-register-29
      - name: Prove source-safe output
        run: |
          set -euo pipefail
          if find out -type f -iname '*.pub' | grep -q .; then
            echo "raw PUB leaked into T720 proof output" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          r=json.load(open('out/t720-register-29/proof-summary.json'))
          assert r['source_safe'] is True
          assert r['raw_pub_retained'] is False
          assert r['predecessor_count'] == 1486
          assert r['observation_count'] == 33
          assert r['new_unique_sha_count'] == 29
          assert r['overlap_with_predecessor'] == 0
          assert r['successor_count'] == 1515
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t720-corpus-register-29-proof-${{ github.run_id }}
          path: out/t720-register-29/**
          if-no-files-found: error
          retention-days: 90
