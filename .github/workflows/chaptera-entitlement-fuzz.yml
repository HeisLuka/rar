name: chaptera-entitlement-fuzz

on:
  push:
    branches:
      - "chaptera-entitlement-fuzz"
  pull_request:
    paths:
      - "crates/chaptera-entitlement/**"
      - ".github/workflows/chaptera-entitlement-fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-23
      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-09-23 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz raw COSE/parser boundary
        working-directory: crates/chaptera-entitlement
        run: cargo +nightly-2026-09-23 fuzz run verify_raw -- -max_total_time=20 -max_len=16385
      - name: Fuzz signed payload boundary
        working-directory: crates/chaptera-entitlement
        run: cargo +nightly-2026-09-23 fuzz run verify_signed_payload -- -max_total_time=20 -max_len=16384
