name: One-shot vetted branch garbage collection

on:
  push:
    branches:
      - main
    paths:
      - ".github/branch-cleanup/2026-09-28-updater-safe-delete.txt"
      - ".github/workflows/branch-gc-safe-20260928.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-vetted-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Delete only vetted closed/superseded branch refs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = ".github/branch-cleanup/2026-09-28-updater-safe-delete.txt"
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "cleanup manifest missing"
          }

          $branches = @(
            Get-Content -LiteralPath $manifest |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith("#") }
          )

          if ($branches.Count -eq 0) {
            throw "cleanup manifest is empty"
          }

          if ($branches -contains "main") {
            throw "safety violation: manifest contains main"
          }

          $dupes = @($branches | Group-Object | Where-Object Count -gt 1)
          if ($dupes.Count -gt 0) {
            throw "safety violation: duplicate branches in manifest: $($dupes.Name -join ', ')"
          }

          $openPulls = @()
          $page = 1
          while ($true) {
            $batchJson = gh api "repos/$env:GH_REPO/pulls?state=open&per_page=100&page=$page"
            if ($LASTEXITCODE -ne 0) { throw "failed to query open pull requests" }
            $batch = @($batchJson | ConvertFrom-Json)
            $openPulls += $batch
            if ($batch.Count -lt 100) { break }
            $page++
          }

          $openHeads = @{}
          foreach ($pr in $openPulls) {
            if ($pr.head.repo.full_name -eq $env:GH_REPO) {
              $openHeads[[string]$pr.head.ref] = [int]$pr.number
            }
          }

          $result = [ordered]@{
            schema_version = "rar.branch-gc.v1"
            repository = $env:GH_REPO
            source_commit = "${{ github.sha }}"
            manifest_count = $branches.Count
            open_pr_count = $openPulls.Count
            deleted = @()
            already_absent = @()
            skipped_open_pr = @()
            failed = @()
          }

          foreach ($branch in $branches) {
            if ($branch -eq "main") {
              throw "refusing to delete main"
            }

            if ($openHeads.ContainsKey($branch)) {
              $result.skipped_open_pr += [ordered]@{
                branch = $branch
                pr = $openHeads[$branch]
              }
              Write-Host "SKIP open PR #$($openHeads[$branch]): $branch"
              continue
            }

            gh api "repos/$env:GH_REPO/git/ref/heads/$branch" *> $null
            if ($LASTEXITCODE -ne 0) {
              $global:LASTEXITCODE = 0
              $result.already_absent += $branch
              Write-Host "ABSENT $branch"
              continue
            }

            gh api --method DELETE "repos/$env:GH_REPO/git/refs/heads/$branch"
            if ($LASTEXITCODE -eq 0) {
              $result.deleted += $branch
              Write-Host "DELETED $branch"
            } else {
              $code = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              $result.failed += [ordered]@{
                branch = $branch
                exit_code = $code
              }
              Write-Host "FAILED $branch"
            }
          }

          New-Item -ItemType Directory -Force -Path "target/branch-gc" | Out-Null
          $result | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "target/branch-gc/receipt.json"

          Write-Host ($result | ConvertTo-Json -Depth 8)

          if ($result.failed.Count -gt 0) {
            throw "branch GC had $($result.failed.Count) deletion failures"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-gc-receipt
          path: target/branch-gc/receipt.json
          if-no-files-found: warn
