name: one-shot workspace rustfmt

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'chore/rustfmt-current-main-20260925'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt
      - name: Apply exact workspace formatter
        run: cargo fmt --all
      - name: Commit formatter diff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "workspace already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply workspace rustfmt"
          git push origin HEAD:${{ github.head_ref }}
