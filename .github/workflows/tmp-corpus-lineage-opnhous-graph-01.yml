name: TEMP CORPUS OPNHOUS graph discriminator

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-corpus-lineage-opnhous-graph-01.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Route OPNHOUS by exact no-Quill 0x22 dialect and compare text/property state
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, math, time, urllib.parse, urllib.request
          from pathlib import Path
          import olefile

          UA="rar-opnhous-dialect/2.0"; SECTOR=2048
          SPECS={
            "left":{"sha256":"0c74bed1b862f4603a77567f817ad22bf1f7c42eb5afbee0c907732953534b5c","size":11264,"member":"PAGEWIZ/OPNHOUS.PUB","archive_url":"https://archive.org/download/PUB40CD/PUB_40_CD.ISO","source_page":"https://archive.org/details/PUB40CD"},
            "right":{"sha256":"227961e2fba4a6fb814aa2da47e79b19d55ff04e87e49d9c5ceef8d07ce36d0e","size":11264,"member":"PageWiz/OPNHOUS.PUB","archive_url":"https://archive.org/download/pub-40-cd/PUB_40_CD.iso","source_page":"https://archive.org/details/pub-40-cd"}
          }
          def sha(b): return hashlib.sha256(b).hexdigest()
          def u16(b,o):
            if o<0 or o+2>len(b): raise ValueError(f"u16 oob {o}")
            return int.from_bytes(b[o:o+2],"little")
          def u32(b,o):
            if o<0 or o+4>len(b): raise ValueError(f"u32 oob {o}")
            return int.from_bytes(b[o:o+4],"little")

          class ISO:
            def __init__(self,url):
              self.url=url; self.cache={}; self.delivery=self._choose()
            def candidates(self):
              p=urllib.parse.urlparse(self.url); parts=p.path.split("/"); ident=parts[2]; fn="/".join(parts[3:])
              req=urllib.request.Request(f"https://archive.org/metadata/{ident}",headers={"User-Agent":UA})
              with urllib.request.urlopen(req,timeout=30) as r:m=json.load(r)
              out=[]; d=str(m.get("dir") or "")
              for k in ("d1","d2"):
                h=str(m.get(k) or "")
                if h and d: out.append("https://"+h+d.rstrip("/")+"/"+urllib.parse.quote(fn,safe="/"))
              out += [self.url,self.url+"?download=1"]; return list(dict.fromkeys(out))
            def rr(self,url,start,n):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Range":f"bytes={start}-{start+n-1}","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=45) as r:
                if getattr(r,"status",None)!=206 and not r.headers.get("Content-Range"): raise ValueError("range unsupported")
                d=r.read(n+1)
              if len(d)!=n: raise ValueError(f"range size {len(d)} != {n}")
              return d
            def _choose(self):
              last=None
              for u in self.candidates():
                for a in range(3):
                  try:
                    p=self.rr(u,16*SECTOR,SECTOR)
                    if p[:6]!=b"\x01CD001": raise ValueError("bad pvd")
                    return u
                  except Exception as e:
                    last=e
                    if a<2: time.sleep(2**a)
              raise last
            def read(self,start,n):
              last=None
              for a in range(3):
                try:return self.rr(self.delivery,start,n)
                except Exception as e:
                  last=e
                  if a<2:time.sleep(2**a)
              raise last
            @staticmethod
            def rec(r):
              return r[33:33+r[32]].decode("ascii","strict"),int.from_bytes(r[2:6],"little"),int.from_bytes(r[10:14],"little"),r[25]
            def directory(self,e,s):
              if (e,s) in self.cache:return self.cache[e,s]
              d=self.read(e*SECTOR,s); out={}; p=0
              while p<len(d):
                n=d[p]
                if not n:p=((p//SECTOR)+1)*SECTOR;continue
                name,ex,sz,fl=self.rec(d[p:p+n])
                if name not in ("\x00","\x01"):out[name.split(";")[0].upper()]=(ex,sz,fl)
                p+=n
              self.cache[e,s]=out;return out
            def member(self,path):
              p=self.read(16*SECTOR,SECTOR); rl=p[156]; _,e,s,fl=self.rec(p[156:156+rl])
              parts=[x.upper() for x in path.strip("/").split("/") if x]
              for i,x in enumerate(parts):
                e,s,fl=self.directory(e,s)[x]
                if i+1<len(parts) and not fl&2:raise ValueError("not dir")
              if fl&2:raise ValueError("target dir")
              return self.read(e*SECTOR,s)

          def controls(t):
            return {
              "shape_0c":[i+1 for i,x in enumerate(t) if x==0x0c],
              "cell_0f":[i for i,x in enumerate(t) if x==0x0f],
              "field_05":[i for i,x in enumerate(t) if x==0x05],
              "field_06":[i for i,x in enumerate(t) if x==0x06],
              "vertical_0b":[i for i,x in enumerate(t) if x==0x0b],
              "crlf":[i+2 for i in range(len(t)-1) if t[i:i+2]==b"\r\n"],
            }

          def generation(sig,cv):
            return {
              ("c002",200):"Publisher2.0",
              ("7d00",300):"Publisher95",
              ("8800",300):"Publisher97",
            }.get((sig,cv),"unknown-noquill-0x22")

          def parse_directory_prefix(c,trailer):
            if trailer+2>len(c):
              return {"num_blocks":None,"valid_prefix_count":0,"error":"trailer-oob","entries":[]}
            n=u16(c,trailer); entries=[]; err=None
            for i in range(n):
              off=trailer+2+i*10
              if off+10>len(c):
                err={"kind":"truncated","row":i}; break
              service=u16(c,off); oid=u16(c,off+2); parent=u16(c,off+4); chunk=u32(c,off+6)
              if chunk+2>len(c):
                err={"kind":"chunk-offset-oob","row":i,"service":service,"id":oid,"parent":parent,"chunk_offset":chunk}; break
              entries.append({"row":i,"service":service,"id":oid,"parent":parent,"chunk_offset":chunk,"marker":u16(c,chunk)})
            return {"num_blocks":n,"valid_prefix_count":len(entries),"error":err,"entries":entries}

          def parse(pub):
            with olefile.OleFileIO(pub) as ole:c=ole.openstream(["Contents"]).read()
            if c[:2]!=b"\xe8\xac" or u16(c,2)!=0x22:raise ValueError("not old 0x22")
            cv=u16(c,4); sig=c[0x0c:0x0e].hex()
            text_root=u32(c,0x12); trailer=u32(c,0x16); m=text_root+14
            ts=u32(c,m); te=u32(c,m+4); i0=u16(c,m+8); i1=u16(c,m+10); i2=u16(c,m+12); i3=u16(c,m+14)
            if not (0<=ts<=te<=len(c)):raise ValueError("bad text bounds")
            t=c[ts:te]
            pages=math.ceil(len(c)/0x200)
            def role_hashes(a,b):
              out={}
              for idx in range(a,b):
                if idx<0 or idx>=pages: break
                raw=c[idx*0x200:min((idx+1)*0x200,len(c))]
                out[str(idx)]={"len":len(raw),"sha256":sha(raw)}
              return out
            return {
              "contents_len":len(c),"contents_sha256":sha(c),"family":"0x0022",
              "content_version":cv,"secondary_signature_hex":sig,"generation_hint":generation(sig,cv),
              "text_root_offset":text_root,"trailer_offset":trailer,
              "text":{"start":ts,"end":te,"len":len(t),"sha256":sha(t),"controls":controls(t)},
              "property_indexes":{"char_start":i0,"paragraph_start":i1,"cell_start":i2,"end":i3},
              "char_pages":role_hashes(i0,i1),"paragraph_pages":role_hashes(i1,i2),"cell_pages":role_hashes(i2,i3),
              "directory_probe":parse_directory_prefix(c,trailer)
            }

          parsed={}; deliveries={}
          for side,s in SPECS.items():
            iso=ISO(s["archive_url"]); pub=iso.member(s["member"])
            if len(pub)!=s["size"] or sha(pub)!=s["sha256"]:raise ValueError(side+" exact member drift")
            parsed[side]=parse(pub); deliveries[side]=iso.delivery

          L,R=parsed["left"],parsed["right"]
          text_equal=L["text"]["sha256"]==R["text"]["sha256"]
          controls_equal=L["text"]["controls"]==R["text"]["controls"]
          char_equal=L["char_pages"]==R["char_pages"]; para_equal=L["paragraph_pages"]==R["paragraph_pages"]; cell_equal=L["cell_pages"]==R["cell_pages"]
          same_generation=L["generation_hint"]==R["generation_hint"]
          dirL=L["directory_probe"]; dirR=R["directory_probe"]
          directory_full=(dirL["error"] is None and dirR["error"] is None)
          if same_generation and text_equal and controls_equal and char_equal and para_equal and cell_equal and not directory_full:
            classification="positive-lineage-generation-routed-directory-grammar-open"
          elif same_generation and text_equal and controls_equal and char_equal and para_equal and cell_equal:
            classification="positive-lineage-text-style-identical"
          elif not same_generation:
            classification="cross-generation-lineage-candidate"
          else:
            classification="semantic-state-diff-present"

          receipt={"schema":"chaptera.opnhous-dialect-route.v2","files":{side:{"sha256":SPECS[side]["sha256"],"member":SPECS[side]["member"],"source_page":SPECS[side]["source_page"],"selected_delivery_url":deliveries[side]} for side in ("left","right")},"left":L,"right":R,"comparison":{"same_generation_hint":same_generation,"text_exact":text_equal,"controls_equal":controls_equal,"char_pages_equal":char_equal,"paragraph_pages_equal":para_equal,"cell_pages_equal":cell_equal,"directory_full_parse_both":directory_full,"classification":classification},"source_safe":True,"raw_pub_retained":False}
          summary={"schema":"chaptera.opnhous-dialect-route-summary.v2","all_exact_members_verified":True,"left_generation_hint":L["generation_hint"],"right_generation_hint":R["generation_hint"],"left_secondary_signature":L["secondary_signature_hex"],"right_secondary_signature":R["secondary_signature_hex"],"left_content_version":L["content_version"],"right_content_version":R["content_version"],"text_exact":text_equal,"controls_equal":controls_equal,"char_pages_equal":char_equal,"paragraph_pages_equal":para_equal,"cell_pages_equal":cell_equal,"left_directory_valid_prefix":dirL["valid_prefix_count"],"right_directory_valid_prefix":dirR["valid_prefix_count"],"left_directory_error":dirL["error"],"right_directory_error":dirR["error"],"classification":classification,"source_safe":True}
          out=Path("out");out.mkdir(exist_ok=True)
          (out/"receipt.json").write_text(json.dumps(receipt,indent=2,ensure_ascii=False),encoding="utf-8")
          (out/"summary.json").write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(summary,indent=2))
          PY
      - name: Enforce source-safe receipt
        run: |
          set -euo pipefail
          if find out -type f -iname '*.pub' | grep -q .; then exit 1; fi
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("out/summary.json").read_text())
          assert s["all_exact_members_verified"] is True
          assert s["source_safe"] is True
          PY
          sha256sum out/*.json | tee out/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-lineage-opnhous-graph-receipt
          path: out/**
          if-no-files-found: error
          retention-days: 90
