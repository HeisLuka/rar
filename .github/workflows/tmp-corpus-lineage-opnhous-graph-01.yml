name: TEMP CORPUS OPNHOUS graph discriminator

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-corpus-lineage-opnhous-graph-01.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis and pinned libmspub build dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check olefile==0.47
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool pkg-config libboost-dev libicu-dev zlib1g-dev librevenge-dev
      - name: Build pinned current libmspub
        run: |
          set -euo pipefail
          git clone -q https://github.com/LibreOffice/libmspub.git /tmp/libmspub
          git -C /tmp/libmspub checkout -q 2b094242f97923f918972d5f1bfd26cd915f836c
          cd /tmp/libmspub
          ./autogen.sh --prefix=/tmp/libmspub-install >/tmp/libmspub-configure.log 2>&1
          make -j2 >/tmp/libmspub-make.log 2>&1
          make install >/tmp/libmspub-install.log 2>&1
          test -x /tmp/libmspub-install/bin/pub2raw
          test -x /tmp/libmspub-install/bin/pub2xhtml
      - name: Scan relocated property pages and run independent parser acceptance
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, subprocess, tempfile, time, urllib.parse, urllib.request
          from pathlib import Path
          import olefile

          UA="rar-opnhous-acceptance/4.0"; SECTOR=2048
          SPECS={
            "left":{"sha256":"0c74bed1b862f4603a77567f817ad22bf1f7c42eb5afbee0c907732953534b5c","size":11264,"member":"PAGEWIZ/OPNHOUS.PUB","archive_url":"https://archive.org/download/PUB40CD/PUB_40_CD.ISO","source_page":"https://archive.org/details/PUB40CD"},
            "right":{"sha256":"227961e2fba4a6fb814aa2da47e79b19d55ff04e87e49d9c5ceef8d07ce36d0e","size":11264,"member":"PageWiz/OPNHOUS.PUB","archive_url":"https://archive.org/download/pub-40-cd/PUB_40_CD.iso","source_page":"https://archive.org/details/pub-40-cd"}
          }
          def sha(b): return hashlib.sha256(b).hexdigest()
          def u16(b,o): return int.from_bytes(b[o:o+2],"little")
          def u32(b,o): return int.from_bytes(b[o:o+4],"little")

          class ISO:
            def __init__(self,url):self.url=url;self.cache={};self.delivery=self._choose()
            def candidates(self):
              p=urllib.parse.urlparse(self.url);q=p.path.split("/");ident=q[2];fn="/".join(q[3:])
              req=urllib.request.Request(f"https://archive.org/metadata/{ident}",headers={"User-Agent":UA})
              with urllib.request.urlopen(req,timeout=30) as r:m=json.load(r)
              d=str(m.get("dir") or "");out=[]
              for k in ("d1","d2"):
                h=str(m.get(k) or "")
                if h and d:out.append("https://"+h+d.rstrip("/")+"/"+urllib.parse.quote(fn,safe="/"))
              out += [self.url,self.url+"?download=1"];return list(dict.fromkeys(out))
            def rr(self,url,start,n):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Range":f"bytes={start}-{start+n-1}","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=45) as r:
                if getattr(r,"status",None)!=206 and not r.headers.get("Content-Range"):raise ValueError("range unsupported")
                d=r.read(n+1)
              if len(d)!=n:raise ValueError("range length drift")
              return d
            def _choose(self):
              last=None
              for url in self.candidates():
                for a in range(3):
                  try:
                    p=self.rr(url,16*SECTOR,SECTOR)
                    if p[:6]!=b"\x01CD001":raise ValueError("bad pvd")
                    return url
                  except Exception as e:
                    last=e
                    if a<2:time.sleep(2**a)
              raise last
            def read(self,start,n):
              last=None
              for a in range(3):
                try:return self.rr(self.delivery,start,n)
                except Exception as e:
                  last=e
                  if a<2:time.sleep(2**a)
              raise last
            @staticmethod
            def rec(r):return r[33:33+r[32]].decode("ascii","strict"),int.from_bytes(r[2:6],"little"),int.from_bytes(r[10:14],"little"),r[25]
            def directory(self,e,s):
              if (e,s) in self.cache:return self.cache[e,s]
              d=self.read(e*SECTOR,s);out={};p=0
              while p<len(d):
                n=d[p]
                if not n:p=((p//SECTOR)+1)*SECTOR;continue
                name,ex,sz,fl=self.rec(d[p:p+n])
                if name not in ("\x00","\x01"):out[name.split(";")[0].upper()]=(ex,sz,fl)
                p+=n
              self.cache[e,s]=out;return out
            def member(self,path):
              p=self.read(16*SECTOR,SECTOR);rl=p[156];_,e,s,fl=self.rec(p[156:156+rl])
              parts=[x.upper() for x in path.strip("/").split("/") if x]
              for i,x in enumerate(parts):
                e,s,fl=self.directory(e,s)[x]
                if i+1<len(parts) and not fl&2:raise ValueError("not dir")
              if fl&2:raise ValueError("target dir")
              return self.read(e*SECTOR,s)

          def contents(pub):
            with olefile.OleFileIO(pub) as ole:return ole.openstream(["Contents"]).read()

          def text_model(c):
            root=u32(c,0x12);m=root+14
            ts=u32(c,m);te=u32(c,m+4)
            return {
              "root":root,"start":ts,"end":te,"len":te-ts,
              "char_index":u16(c,m+8),"paragraph_index":u16(c,m+10),"cell_index":u16(c,m+12),"end_index":u16(c,m+14),
              "text":c[ts:te]
            }

          def control_positions(t):
            shape=[i+1 for i,x in enumerate(t) if x==0x0c]
            para=[i+2 for i in range(len(t)-1) if t[i:i+2]==b"\r\n"]
            return shape,para

          def char_candidate(page,expected):
            n=page[-1]
            if not (1<=n<=64) or 4*(n+1)+n>511:return None
            base=u32(page,0);vals=[u32(page,4*i) for i in range(n+1)]
            pos=[x-base for x in vals[1:]]
            if pos!=expected:return None
            styles=list(page[4*(n+1):4*(n+1)+n])
            return {"n":n,"positions":pos,"style_offsets":styles,"page_sha256":sha(page)}

          def paragraph_candidate(page,expected):
            n=page[-1]
            if not (1<=n<=64) or 5*n>511:return None
            pos=[u32(page,4*i) for i in range(n)]
            if pos!=expected:return None
            styles=list(page[4*n:5*n])
            return {"n":n,"positions":pos,"style_offsets":styles,"page_sha256":sha(page)}

          def cell_candidate(page,text_start):
            n=page[-1]
            if n==0:return {"n":0,"positions":[],"style_offsets":[],"page_sha256":sha(page)}
            if not (1<=n<=64) or 5*n>511:return None
            pos=[u32(page,4*i) for i in range(n)]
            if pos[0]!=text_start:return None
            styles=list(page[4*n:5*n])
            return {"n":n,"positions":pos,"style_offsets":styles,"page_sha256":sha(page)}

          def scan_pages(c,tm):
            shape,para=control_positions(tm["text"])
            expected_char=sorted(shape+para)
            expected_para=[tm["start"]]+[tm["start"]+x for x in para[:-1]]
            out={"expected_char_positions":expected_char,"expected_paragraph_positions":expected_para,"char":[],"paragraph":[],"cell":[]}
            for idx in range(len(c)//0x200):
              page=c[idx*0x200:(idx+1)*0x200]
              a=char_candidate(page,expected_char)
              if a:out["char"].append({"page_index":idx,**a})
              b=paragraph_candidate(page,expected_para)
              if b:out["paragraph"].append({"page_index":idx,**b})
              d=cell_candidate(page,tm["start"])
              if d and (d["n"]>0 or idx==tm["cell_index"]):out["cell"].append({"page_index":idx,**d})
            return out

          def run_tool(cmd,env,output_path=None):
            try:
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30,env=env)
              out=p.stdout
              if output_path and Path(output_path).exists():out=Path(output_path).read_bytes()
              return {"returncode":p.returncode,"stdout_len":len(p.stdout),"stdout_sha256":sha(p.stdout),"stderr_len":len(p.stderr),"stderr_sha256":sha(p.stderr),"output_len":len(out),"output_sha256":sha(out)}
            except subprocess.TimeoutExpired as e:
              return {"timeout":True,"stdout_len":len(e.stdout or b""),"stderr_len":len(e.stderr or b"")}

          env=os.environ.copy()
          env["LD_LIBRARY_PATH"]="/tmp/libmspub-install/lib:"+env.get("LD_LIBRARY_PATH","")
          rows={}
          with tempfile.TemporaryDirectory(prefix="opnhous-accept-") as td0:
            td=Path(td0)
            for side,s in SPECS.items():
              iso=ISO(s["archive_url"]);pub=iso.member(s["member"])
              if len(pub)!=s["size"] or sha(pub)!=s["sha256"]:raise ValueError(side+" exact member drift")
              p=td/(side+".pub");p.write_bytes(pub)
              c=contents(pub);tm=text_model(c)
              if c[0x0c:0x0e].hex()!="8800" or u16(c,4)!=300:raise ValueError("dialect drift")
              scans=scan_pages(c,tm)
              raw=run_tool(["/tmp/libmspub-install/bin/pub2raw",str(p)],env)
              xhtml_path=str(td/(side+".xhtml"))
              xhtml=run_tool(["/tmp/libmspub-install/bin/pub2xhtml",str(p),xhtml_path],env,xhtml_path)
              rows[side]={
                "sha256":s["sha256"],"source_page":s["source_page"],"selected_delivery_url":iso.delivery,
                "text_len":tm["len"],"text_sha256":sha(tm["text"]),
                "declared_indexes":{"char":tm["char_index"],"paragraph":tm["paragraph_index"],"cell":tm["cell_index"],"end":tm["end_index"]},
                "page_locator":scans,"pub2raw":raw,"pub2xhtml":xhtml
              }

          left_ok=(any(x["page_index"]==2 for x in rows["left"]["page_locator"]["char"]) and any(x["page_index"]==3 for x in rows["left"]["page_locator"]["paragraph"]))
          if not left_ok:raise ValueError("page locator failed left positive control")
          right_relocated=bool(rows["right"]["page_locator"]["char"] or rows["right"]["page_locator"]["paragraph"])
          left_parse=rows["left"]["pub2xhtml"].get("returncode")==0
          right_parse=rows["right"]["pub2xhtml"].get("returncode")==0
          right_supported=rows["right"]["pub2raw"].get("returncode")==0
          if left_parse and not right_parse and not right_relocated:
            classification="malformed-or-stale-publisher97-media-variant"
          elif left_parse and right_parse and right_relocated:
            classification="alternate-property-page-placement-supported"
          elif left_parse and right_parse:
            classification="parser-accepts-alternate-serialization-grammar-open"
          else:
            classification="acceptance-inconclusive"

          summary={
            "schema":"chaptera.opnhous-independent-acceptance-summary.v4",
            "all_exact_members_verified":True,
            "left_locator_positive_control":left_ok,
            "right_relocated_property_pages_found":right_relocated,
            "right_char_candidates":[x["page_index"] for x in rows["right"]["page_locator"]["char"]],
            "right_paragraph_candidates":[x["page_index"] for x in rows["right"]["page_locator"]["paragraph"]],
            "right_cell_candidates":[x["page_index"] for x in rows["right"]["page_locator"]["cell"]],
            "left_pub2raw_returncode":rows["left"]["pub2raw"].get("returncode"),
            "right_pub2raw_returncode":rows["right"]["pub2raw"].get("returncode"),
            "left_pub2xhtml_returncode":rows["left"]["pub2xhtml"].get("returncode"),
            "right_pub2xhtml_returncode":rows["right"]["pub2xhtml"].get("returncode"),
            "right_isSupported_via_pub2raw":right_supported,
            "classification":classification,
            "libmspub_commit":"2b094242f97923f918972d5f1bfd26cd915f836c",
            "source_safe":True
          }
          receipt={"schema":"chaptera.opnhous-independent-acceptance.v4","rows":rows,"summary":summary,"raw_pub_retained":False,"source_safe":True}
          out=Path("out");out.mkdir(exist_ok=True)
          (out/"summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          (out/"receipt.json").write_text(json.dumps(receipt,indent=2),encoding="utf-8")
          print(json.dumps(summary,indent=2))
          PY
      - name: Enforce source-safe receipt
        run: |
          set -euo pipefail
          if find out -type f -iname '*.pub' | grep -q .; then exit 1; fi
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("out/summary.json").read_text())
          assert s["all_exact_members_verified"] is True
          assert s["left_locator_positive_control"] is True
          assert s["source_safe"] is True
          PY
          sha256sum out/*.json | tee out/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-lineage-opnhous-graph-receipt
          path: out/**
          if-no-files-found: error
          retention-days: 90
