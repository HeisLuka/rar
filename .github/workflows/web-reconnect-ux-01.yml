name: Web Reconnect UX V1

on:
  pull_request:
    paths:
      - "apps/web/reconnect-ux-v1.mjs"
      - "apps/web/reconnect-ux-v1.test.mjs"
      - ".github/workflows/web-reconnect-ux-01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconnect-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test reconnect status surface
        run: node --test apps/web/reconnect-ux-v1.test.mjs
