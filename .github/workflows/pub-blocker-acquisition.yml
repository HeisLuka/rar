name: PUB blocker artifact acquisition
# observable acquisition run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pub-blocker-acquisition.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pub-blocker-acquisition.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: pub-blocker-acquisition-${{ github.sha }}
  cancel-in-progress: false

jobs:
  aspose-19-10-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch official Aspose.PUB 19.10.1 DLL package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          tagid='/pub/net/new-releases/aspose.pub-for-.net-19.10.1-(dlls-only)/1746707ea91249a6a5fe68a839f0042c%20%20'
          printf '%s\n' "$tagid" > out/tagid.txt
          url="$(curl -fsSL --retry 3 --retry-delay 2 \
            -X POST -F "tagid=$tagid" \
            https://releases.admin.aspose.com/download-release)"
          printf '%s\n' "$url" | tee out/resolved-url.txt
          test -n "$url"
          curl -fL --retry 3 --retry-delay 2 --max-time 1200 "$url" -o out/Aspose.PUB-19.10.1-dlls.zip
          test "$(stat -c %s out/Aspose.PUB-19.10.1-dlls.zip)" -gt 30000000
          sha256sum out/Aspose.PUB-19.10.1-dlls.zip | tee out/sha256.txt
          sha1sum out/Aspose.PUB-19.10.1-dlls.zip | tee out/sha1.txt
          md5sum out/Aspose.PUB-19.10.1-dlls.zip | tee out/md5.txt
          stat -c 'size_bytes=%s' out/Aspose.PUB-19.10.1-dlls.zip | tee out/size.txt
          file out/Aspose.PUB-19.10.1-dlls.zip | tee out/file.txt
          unzip -l out/Aspose.PUB-19.10.1-dlls.zip > out/zip-list.txt
      - name: Upload Aspose acquisition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspose-pub-19.10.1-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  pubconv-12-0-4518:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact archived Microsoft X12-30247 package
        shell: bash
        env:
          EXPECTED_SHA256: "6caa1d57b0b91485beb7cfbd38a44ab723043651a117223ef7ac735bf920c6dd"
        run: |
          set -euo pipefail
          mkdir -p out
          url="https://web.archive.org/web/20111006143949id_/http://msft-dnl.digitalrivercontent.net/msoffice/pub/X12-30247/X12-30247.exe"
          echo "$url" > out/source-url.txt
          curl -fL --retry 4 --retry-delay 5 --max-time 1800 "$url" -o out/X12-30247.exe
          sha256sum out/X12-30247.exe | tee out/sha256.txt
          actual="$(sha256sum out/X12-30247.exe | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          sha1sum out/X12-30247.exe | tee out/sha1.txt
          md5sum out/X12-30247.exe | tee out/md5.txt
          stat -c 'size_bytes=%s' out/X12-30247.exe | tee out/size.txt
          file out/X12-30247.exe | tee out/file.txt
          test "$(stat -c %s out/X12-30247.exe)" -eq 233139240
      - name: Extract and verify exact PUBCONV.DLL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full msitools cabextract
          mkdir -p out/extracted out/msi-scan out/msi-extracted
          7z x -y out/X12-30247.exe -oout/extracted >/tmp/7z-pubconv.log 2>&1
          find out/extracted -type f -printf '%s\t%p\n' | sort -nr > out/extracted-files.txt

          # Prefer MSI semantic extraction: locate the MSI File-table row that owns PUBCONV.DLL.
          : > out/pubconv-msi-hits.txt
          while IFS= read -r msi; do
            safe="$(printf '%s' "$msi" | tr '/ ' '__')"
            msiinfo export "$msi" File > "out/msi-scan/$safe.File.txt" 2>/dev/null || continue
            if grep -i 'PUBCONV' "out/msi-scan/$safe.File.txt" >> out/pubconv-msi-hits.txt; then
              printf 'MSI=%s\n' "$msi" >> out/pubconv-msi-hits.txt
            fi
          done < <(find out/extracted -type f -iname '*.msi' | sort)
          cat out/pubconv-msi-hits.txt

          owner_msi="$(grep '^MSI=' out/pubconv-msi-hits.txt | head -n1 | cut -d= -f2- || true)"
          if [ -n "$owner_msi" ]; then
            (
              cd "$(dirname "$owner_msi")"
              msiextract -C "$GITHUB_WORKSPACE/out/msi-extracted" "$(basename "$owner_msi")"
            ) >out/msiextract.log 2>&1 || true
          fi

          dll="$(find out/msi-extracted out/extracted -type f -iname 'PUBCONV.DLL' | head -n1 || true)"
          if [ -z "$dll" ]; then
            # Fallback: expand likely Office cabinets and search again.
            while IFS= read -r cab; do
              d="out/cab-$(basename "$cab" .cab)"
              mkdir -p "$d"
              7z x -y "$cab" -o"$d" >/dev/null 2>&1 || true
            done < <(find out/extracted -type f \( -iname 'EnterWW.cab' -o -iname '*WW.cab' \) | sort)
            dll="$(find out -type f -iname 'PUBCONV.DLL' | head -n1 || true)"
          fi
          test -n "$dll"
          cp "$dll" out/PUBCONV.DLL
          test "$(stat -c %s out/PUBCONV.DLL)" -eq 590144
          sha256sum out/PUBCONV.DLL | tee out/pubconv-dll-sha256.txt
          sha1sum out/PUBCONV.DLL | tee out/pubconv-dll-sha1.txt
          md5sum out/PUBCONV.DLL | tee out/pubconv-dll-md5.txt
          file out/PUBCONV.DLL | tee out/pubconv-dll-file.txt
          stat -c 'size_bytes=%s' out/PUBCONV.DLL | tee out/pubconv-dll-size.txt
          python3 -m pip install --disable-pip-version-check pefile
          python3 - <<'PY' | tee out/pubconv-pe-verification.txt
          import pefile
          pe=pefile.PE("out/PUBCONV.DLL")
          print(f"checksum_header={pe.OPTIONAL_HEADER.CheckSum}")
          print(f"checksum_generated={pe.generate_checksum()}")
          strings={}
          if hasattr(pe, "FileInfo"):
              for group in pe.FileInfo:
                  for entry in group:
                      if getattr(entry, "Key", b"") == b"StringFileInfo":
                          for st in entry.StringTable:
                              for k,v in st.entries.items():
                                  kk=k.decode(errors="replace") if isinstance(k,bytes) else str(k)
                                  vv=v.decode(errors="replace") if isinstance(v,bytes) else str(v)
                                  strings[kk]=vv
          for k in ["FileVersion","ProductVersion","OriginalFilename","CompanyName","ProductName"]:
              print(f"{k}={strings.get(k,'')}")
          assert strings.get("FileVersion","").startswith("12.0.4518.1014"), strings
          assert strings.get("ProductVersion","").startswith("12.0.4518.1014"), strings
          assert strings.get("OriginalFilename","").upper()=="PUBCONV.DLL", strings
          assert pe.OPTIONAL_HEADER.CheckSum == 652414, pe.OPTIONAL_HEADER.CheckSum
          assert pe.generate_checksum() == pe.OPTIONAL_HEADER.CheckSum, (pe.generate_checksum(),pe.OPTIONAL_HEADER.CheckSum)
          PY
          sudo apt-get install -y --no-install-recommends osslsigncode
          osslsigncode verify -in out/PUBCONV.DLL > out/pubconv-signature.txt 2>&1 || true
          cat out/pubconv-signature.txt
      - name: Upload exact X12-30247 package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubconv-x12-30247-${{ github.run_id }}
          path: |
            out/X12-30247.exe
            out/PUBCONV.DLL
            out/source-url.txt
            out/sha256.txt
            out/sha1.txt
            out/md5.txt
            out/size.txt
            out/file.txt
            out/pubconv-dll-*.txt
            out/pubconv-pe-verification.txt
            out/pubconv-signature.txt
            out/pubconv-msi-hits.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  corel-x4-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch archived original Corel X4 trial
        shell: bash
        env:
          EXPECTED_SHA1: "9b1232bb63cf1257c447146da8e059297fcffa35"
        run: |
          set -euo pipefail
          mkdir -p out
          url="https://web.archive.org/web/20130509032142id_/http://www.corel.com/akdlm/6763/downloads/trials/GraphicsSuiteX4/CorelDRAWGraphicsSuiteX4Installer_EN.exe"
          echo "$url" > out/source-url.txt
          curl -fL --retry 4 --retry-delay 5 --max-time 2400 "$url" -o out/CorelDRAWGraphicsSuiteX4Installer_EN.exe
          sha1sum out/CorelDRAWGraphicsSuiteX4Installer_EN.exe | tee out/sha1.txt
          actual="$(sha1sum out/CorelDRAWGraphicsSuiteX4Installer_EN.exe | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA1"
          sha256sum out/CorelDRAWGraphicsSuiteX4Installer_EN.exe | tee out/sha256.txt
          md5sum out/CorelDRAWGraphicsSuiteX4Installer_EN.exe | tee out/md5.txt
          stat -c 'size_bytes=%s' out/CorelDRAWGraphicsSuiteX4Installer_EN.exe | tee out/size.txt
          file out/CorelDRAWGraphicsSuiteX4Installer_EN.exe | tee out/file.txt
      - name: Extract Corel X4 and identify Filters MSI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full msitools
          mkdir -p out/extracted out/msi-scan
          7z x -y out/CorelDRAWGraphicsSuiteX4Installer_EN.exe -oout/extracted >/tmp/7z-corel.log 2>&1
          find out/extracted -type f -printf '%s\t%p\n' | sort -nr > out/extracted-files.txt
          find out/extracted -type f -iname '*.msi' -printf '%s\t%p\n' | sort -nr > out/msi-files.txt
          grep -RaiE '7F05E704-30A6-421A-97A7-8EEB1C7FF017|cdrPUB|Publisher' out/extracted > out/raw-pub-productcode-hits.txt || true

          found=0
          : > out/msi-pub-hits.txt
          while IFS= read -r msi; do
            safe="$(printf '%s' "$msi" | tr '/ ' '__')"
            prop="out/msi-scan/$safe.Property.txt"
            filetab="out/msi-scan/$safe.File.txt"
            msiinfo export "$msi" Property > "$prop" 2>/dev/null || continue
            msiinfo export "$msi" File > "$filetab" 2>/dev/null || true
            if grep -Eqi '7F05E704-30A6-421A-97A7-8EEB1C7FF017|Filters' "$prop" || grep -Eqi 'pub|publisher|cdrpub' "$filetab"; then
              {
                echo "MSI=$msi"
                grep -Ei 'ProductCode|ProductName|ProductVersion' "$prop" || true
                grep -Ei 'pub|publisher|cdrpub' "$filetab" || true
              } >> out/msi-pub-hits.txt
            fi
            if grep -qi '7F05E704-30A6-421A-97A7-8EEB1C7FF017' "$prop"; then
              cp "$msi" out/Corel-X4-Filters.msi
              printf '%s\n' "$msi" | tee out/filters-msi-path.txt
              found=1
              break
            fi
          done < <(find out/extracted -type f -iname '*.msi' | sort)
          echo "=== MSI INVENTORY ==="
          cat out/msi-files.txt || true
          echo "=== RAW PRODUCT/PUB HITS ==="
          cat out/raw-pub-productcode-hits.txt || true
          echo "=== MSI PUB HITS ==="
          cat out/msi-pub-hits.txt || true

          if [ "$found" -ne 1 ]; then
            candidate="$(find out/extracted -type f \( -iname '*filter*.msi' -o -iname 'Filters.msi' \) | head -n1 || true)"
            if [ -n "$candidate" ]; then
              cp "$candidate" out/Corel-X4-Filters.msi
              printf '%s\n' "$candidate" | tee out/filters-msi-path.txt
              found=1
            fi
          fi
          if [ "$found" -ne 1 ]; then
            echo "No direct Filters MSI identified; preserving diagnostic inventory." | tee out/filters-msi-not-found.txt
            exit 2
          fi
          sha256sum out/Corel-X4-Filters.msi | tee out/filters-msi-sha256.txt
          sha1sum out/Corel-X4-Filters.msi | tee out/filters-msi-sha1.txt
          md5sum out/Corel-X4-Filters.msi | tee out/filters-msi-md5.txt
          stat -c 'size_bytes=%s' out/Corel-X4-Filters.msi | tee out/filters-msi-size.txt
          msiinfo export out/Corel-X4-Filters.msi File > out/filters-msi-File.txt 2>/dev/null || true
          grep -Ei 'pub|publisher|cdrpub' out/filters-msi-File.txt > out/filters-msi-pub-hits.txt || true
      - name: Upload exact Corel X4 trial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corel-x4-trial-${{ github.run_id }}
          path: |
            out/CorelDRAWGraphicsSuiteX4Installer_EN.exe
            out/Corel-X4-Filters.msi
            out/source-url.txt
            out/sha256.txt
            out/sha1.txt
            out/md5.txt
            out/size.txt
            out/file.txt
            out/msi-files.txt
            out/raw-pub-productcode-hits.txt
            out/msi-pub-hits.txt
            out/filters-msi-*.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  publisher-2010:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            filename: X16-32967.exe
            url: https://web.archive.org/web/20110930003223id_/http://msft.digitalrivercontent.net/office2010/X16-32967.exe
          - arch: x64
            filename: X16-32930.exe
            url: https://web.archive.org/web/20110930003223id_/http://msft.digitalrivercontent.net/office2010/X16-32930.exe
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Fetch archived original Publisher 2010 ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          echo "${{ matrix.url }}" > out/source-url.txt
          curl -fL --retry 4 --retry-delay 5 --max-time 3000 "${{ matrix.url }}" -o "out/${{ matrix.filename }}"
          size="$(stat -c %s "out/${{ matrix.filename }}")"
          test "$size" -gt 50000000
          head -c 2 "out/${{ matrix.filename }}" | od -An -tx1 | tr -d ' \n' | grep -qi '^4d5a$'
          sha256sum "out/${{ matrix.filename }}" | tee out/sha256.txt
          sha1sum "out/${{ matrix.filename }}" | tee out/sha1.txt
          md5sum "out/${{ matrix.filename }}" | tee out/md5.txt
          printf 'size_bytes=%s\n' "$size" | tee out/size.txt
          file "out/${{ matrix.filename }}" | tee out/file.txt
      - name: Upload Publisher 2010 candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-2010-${{ matrix.arch }}-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  modern-12527-filelists:
    strategy:
      fail-fast: false
      matrix:
        arch: [32, 64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact Microsoft build file list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          url="https://config.office.com/api/filelist?Channel=Insiders&Version=16.0.12527.22145&Arch=${{ matrix.arch }}&AllLanguages=True"
          echo "$url" > out/source-url.txt
          curl -fL --retry 3 --retry-delay 2 --max-time 120 "$url" -o out/filelist.json
          python3 -m json.tool out/filelist.json > out/filelist.pretty.json
          sha256sum out/filelist.json | tee out/sha256.txt
          stat -c 'size_bytes=%s' out/filelist.json | tee out/size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: modern-12527-filelist-${{ matrix.arch }}-${{ github.run_id }}
          path: out/**
          retention-days: 30


  publisher-2002-exact-media:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Resolve Internet Archive item and fetch exact Publisher 2002 image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ident='X08-20172'
          curl -fL --retry 3 --max-time 120 "https://archive.org/metadata/$ident" -o out/metadata.json
          python3 - <<'PY' > out/selected-file.txt
          import json
          d=json.load(open("out/metadata.json"))
          files=d.get("files",[])
          cand=[]
          for f in files:
              name=f.get("name","")
              size=int(f.get("size") or 0)
              lo=name.lower()
              if lo.endswith((".iso",".img",".bin",".mdf")):
                  cand.append((size,name,f.get("sha1"),f.get("md5")))
          cand.sort(reverse=True)
          if not cand:
              raise SystemExit("no disc image")
          print(cand[0][1])
          print(cand[0][0])
          print(cand[0][2] or "")
          print(cand[0][3] or "")
          PY
          image="$(sed -n '1p' out/selected-file.txt)"
          expected_size="$(sed -n '2p' out/selected-file.txt)"
          expected_sha1="$(sed -n '3p' out/selected-file.txt)"
          expected_md5="$(sed -n '4p' out/selected-file.txt)"
          printf 'identifier=%s\nfile=%s\nexpected_size=%s\nexpected_sha1=%s\nexpected_md5=%s\n' "$ident" "$image" "$expected_size" "$expected_sha1" "$expected_md5" | tee out/selection.txt
          url="https://archive.org/download/$ident/$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$image")"
          printf '%s\n' "$url" > out/source-url.txt
          curl -fL --retry 4 --retry-delay 5 --max-time 3600 "$url" -o out/publisher2002-media.bin
          test "$(stat -c %s out/publisher2002-media.bin)" -eq "$expected_size"
          sha256sum out/publisher2002-media.bin | tee out/sha256.txt
          sha1sum out/publisher2002-media.bin | tee out/sha1.txt
          md5sum out/publisher2002-media.bin | tee out/md5.txt
          if [ -n "$expected_sha1" ]; then test "$(sha1sum out/publisher2002-media.bin | awk '{print $1}')" = "$expected_sha1"; fi
          if [ -n "$expected_md5" ]; then test "$(md5sum out/publisher2002-media.bin | awk '{print $1}')" = "$expected_md5"; fi
          file out/publisher2002-media.bin | tee out/file.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-2002-exact-media-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publisher-2000-trial-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch known coverdisc containing Microsoft Publisher 2000 Trial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ident='k-cd-2000-07'
          curl -fL --retry 3 --max-time 120 "https://archive.org/metadata/$ident" -o out/metadata.json
          python3 - <<'PY' > out/selected-file.txt
          import json
          d=json.load(open("out/metadata.json"))
          cand=[]
          for f in d.get("files",[]):
              name=f.get("name","")
              size=int(f.get("size") or 0)
              if name.lower().endswith((".iso",".img",".bin")):
                  cand.append((size,name,f.get("sha1"),f.get("md5")))
          cand.sort(reverse=True)
          if not cand:
              raise SystemExit("no disc image")
          print(cand[0][1]); print(cand[0][0]); print(cand[0][2] or ""); print(cand[0][3] or "")
          PY
          image="$(sed -n '1p' out/selected-file.txt)"
          expected_size="$(sed -n '2p' out/selected-file.txt)"
          expected_sha1="$(sed -n '3p' out/selected-file.txt)"
          expected_md5="$(sed -n '4p' out/selected-file.txt)"
          printf 'identifier=%s\nfile=%s\nexpected_size=%s\nexpected_sha1=%s\nexpected_md5=%s\nprovenance=third-party magazine coverdisc containing Microsoft Publisher 2000 Trial\n' "$ident" "$image" "$expected_size" "$expected_sha1" "$expected_md5" | tee out/selection.txt
          url="https://archive.org/download/$ident/$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$image")"
          printf '%s\n' "$url" > out/source-url.txt
          curl -fL --retry 4 --retry-delay 5 --max-time 4200 "$url" -o out/publisher2000-trial-coverdisc.bin
          test "$(stat -c %s out/publisher2000-trial-coverdisc.bin)" -eq "$expected_size"
          sha256sum out/publisher2000-trial-coverdisc.bin | tee out/sha256.txt
          sha1sum out/publisher2000-trial-coverdisc.bin | tee out/sha1.txt
          md5sum out/publisher2000-trial-coverdisc.bin | tee out/md5.txt
          if [ -n "$expected_sha1" ]; then test "$(sha1sum out/publisher2000-trial-coverdisc.bin | awk '{print $1}')" = "$expected_sha1"; fi
          if [ -n "$expected_md5" ]; then test "$(md5sum out/publisher2000-trial-coverdisc.bin | awk '{print $1}')" = "$expected_md5"; fi
          file out/publisher2000-trial-coverdisc.bin | tee out/file.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-2000-trial-candidate-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  historical-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Search Internet Archive by exact historical identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json, subprocess, urllib.parse
          from pathlib import Path
          queries = {
            "publisher2000_trial": '"Microsoft Publisher 2000" AND (trial OR "trial cd")',
            "publisher2002_trial": '"Publisher 2002" AND (trial OR X08-20172 OR X08-06831)',
            "publisher2003_trial": '("Publisher 2003" OR "Microsoft Office Publisher 2003") AND (trial OR SKU119 OR OFFICE11)',
            "vbapb10_chm": '"VBAPB10.CHM"',
            "keyview_mspubsr": '"mspubsr.dll"',
            "pub2id": '"Pub2ID" AND (installer OR updater OR plugin)',
            "office2000_cd2": '"O9PRMCD02"',
            "office2000_cd1": '"O9PROCD01"',
          }
          for name,q in queries.items():
              url="https://archive.org/advancedsearch.php?"+urllib.parse.urlencode([
                  ("q",q),("fl[]","identifier"),("fl[]","title"),("fl[]","description"),
                  ("fl[]","date"),("rows","50"),("page","1"),("output","json")
              ])
              p=subprocess.run(["curl","-fL","--retry","3","--max-time","120",url],capture_output=True)
              Path(f"out/{name}.url.txt").write_text(url+"\n")
              Path(f"out/{name}.json").write_bytes(p.stdout)
              Path(f"out/{name}.stderr.txt").write_bytes(p.stderr)
              if p.returncode==0:
                  try:
                      data=json.loads(p.stdout)
                      docs=data.get("response",{}).get("docs",[])
                      Path(f"out/{name}.summary.json").write_text(json.dumps({
                          "query":q,
                          "numFound":data.get("response",{}).get("numFound"),
                          "top":docs[:20],
                      },indent=2,ensure_ascii=False))
                  except Exception as e:
                      Path(f"out/{name}.parse-error.txt").write_text(repr(e))
          PY
          for f in out/*.summary.json; do echo "===== $f ====="; cat "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-acquisition-discovery-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 30
