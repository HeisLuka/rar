name: TEMP CORPUS version identity census

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-corpus-version-identity-census.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: tmp-corpus-version-identity-census-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase1-scan:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Reprobe phase1 exact SHA shard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/corpus/structural_novelty.py scan             --sources tools/corpus/structural_novelty_sources.json             --out out             --shard-index "${{ matrix.shard }}"             --shard-count 4             --workers 4
      - name: Prove source-safe output
        run: |
          set -euo pipefail
          if find out -type f -iname '*.pub' | grep -q .; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: version-census-p1-${{ github.run_id }}-${{ matrix.shard }}
          path: out/**
          if-no-files-found: error
          retention-days: 30

  phase1-aggregate:
    if: always()
    needs: phase1-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check olefile==0.47
      - uses: actions/download-artifact@v4
        with:
          pattern: version-census-p1-${{ github.run_id }}-*
          path: shards
      - run: |
          set -euo pipefail
          python tools/corpus/structural_novelty.py aggregate --input shards --out aggregate
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("aggregate/summary.json").read_text())
          assert s["analyzed_rows"] == 525, s
          assert s["status"].get("ok") == 510, s
          assert s["status"].get("probe_failed") == 12, s
          assert s["status"].get("rehydrate_failed") == 3, s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: version-census-aggregate-${{ github.run_id }}-phase1
          path: aggregate/**
          if-no-files-found: error
          retention-days: 30

  container425-scan:
    strategy:
      fail-fast: false
      matrix:
        container_index: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CFB/archive tools
        run: |
          python -m pip install --disable-pip-version-check olefile==0.47
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
      - name: Reprobe original container cohort
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/corpus/structural_novelty_container_phase2.py scan-container             --sources tools/corpus/structural_novelty_sources.json             --out out             --container-index "${{ matrix.container_index }}"
      - name: Prove source-safe output
        run: |
          set -euo pipefail
          if find out -type f -iname '*.pub' | grep -q .; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: version-census-c425-${{ github.run_id }}-${{ matrix.container_index }}
          path: out/**
          if-no-files-found: error
          retention-days: 30

  container425-aggregate:
    if: always()
    needs: container425-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check olefile==0.47
      - uses: actions/download-artifact@v4
        with:
          pattern: version-census-c425-${{ github.run_id }}-*
          path: shards
      - run: |
          set -euo pipefail
          python tools/corpus/structural_novelty_container_phase2.py aggregate             --input shards --out aggregate
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("aggregate/summary.json").read_text())
          assert s["analyzed_rows"] == 425, s
          assert s["status"].get("ok") == 425, s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: version-census-aggregate-${{ github.run_id }}-container425
          path: aggregate/**
          if-no-files-found: error
          retention-days: 30

  container407-scan:
    strategy:
      fail-fast: false
      matrix:
        root_index: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CFB/archive tools
        run: |
          python -m pip install --disable-pip-version-check olefile==0.47
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
      - name: Reprobe retained 407-SHA cohort
        run: |
          set -euo pipefail
          python tools/corpus/structural_novelty_container_delta.py scan-root             --root-index "${{ matrix.root_index }}"             --out out
      - name: Prove source-safe output
        run: |
          set -euo pipefail
          if find out -type f -iname '*.pub' | grep -q .; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: version-census-c407-${{ github.run_id }}-${{ matrix.root_index }}
          path: out/**
          if-no-files-found: error
          retention-days: 30

  container407-aggregate:
    if: always()
    needs: container407-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check olefile==0.47
      - uses: actions/download-artifact@v4
        with:
          pattern: version-census-c407-${{ github.run_id }}-*
          path: shards
      - run: |
          set -euo pipefail
          python tools/corpus/structural_novelty_container_delta.py aggregate             --input shards --out aggregate
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("aggregate/summary.json").read_text())
          assert s["analyzed_rows"] == 407, s
          assert s["status"].get("ok") == 407, s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: version-census-aggregate-${{ github.run_id }}-container407
          path: aggregate/**
          if-no-files-found: error
          retention-days: 30

  crossarm129-scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: class_templates
            artifact_id: 10811670607
            expected: 52
          - lane: training
            artifact_id: 10811710784
            expected: 15
          - lane: mvp_matrix
            artifact_id: 10811134424
            expected: 62
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Download retained exact source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p src out
          gh api -H "Accept: application/vnd.github+json"             "/repos/${{ github.repository }}/actions/artifacts/${{ matrix.artifact_id }}/zip"             > src/source.zip
          unzip -q src/source.zip -d src/unpacked
      - name: Reprobe admitted lane
        env:
          LANE: ${{ matrix.lane }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools/corpus").resolve()))
          import structural_novelty as novelty
          lane=os.environ["LANE"]; expected=int(os.environ["EXPECTED"])
          receipt=Path("tools/corpus/receipts/corpus-post-m1-delta-2026-09-24.tsv")
          wanted={}
          with receipt.open("r", encoding="utf-8", newline="") as fh:
              for row in csv.DictReader(fh, delimiter="\t"):
                  if row["lane"] == lane:
                      wanted[row["sha256"]] = row
          assert len(wanted) == expected
          by_sha={}
          for path in sorted(Path("src/unpacked/novel").glob("*.pub")):
              data=path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha not in wanted: continue
              first=novelty.cfb_probe(data); second=novelty.cfb_probe(data)
              assert first == second
              assert first["source_sha256"] == sha
              by_sha[sha]={
                  "sha256": sha,
                  "sources": [f"post_m1_delta:{lane}"],
                  "filenames": [path.name.split("__",1)[-1]],
                  **first,
                  "status": "ok",
                  "rehydrated_from": f"post_m1_delta:{lane}",
              }
          missing=sorted(set(wanted)-set(by_sha))
          assert not missing, missing[:3]
          assert len(by_sha) == expected
          Path("out/fingerprints.json").write_text(
              json.dumps([by_sha[k] for k in sorted(by_sha)], indent=2),
              encoding="utf-8")
          PY
          rm -rf src
          if find out -type f -iname '*.pub' | grep -q .; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: version-census-a129-${{ github.run_id }}-${{ matrix.lane }}
          path: out/**
          if-no-files-found: error
          retention-days: 30

  crossarm129-aggregate:
    if: always()
    needs: crossarm129-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check olefile==0.47
      - uses: actions/download-artifact@v4
        with:
          pattern: version-census-a129-${{ github.run_id }}-*
          path: shards
      - run: |
          set -euo pipefail
          python tools/corpus/structural_novelty.py aggregate --input shards --out aggregate
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("aggregate/summary.json").read_text())
          assert s["analyzed_rows"] == 129, s
          assert s["status"].get("ok") == 129, s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: version-census-aggregate-${{ github.run_id }}-crossarm129
          path: aggregate/**
          if-no-files-found: error
          retention-days: 30

  matrix:
    if: always()
    needs:
      - phase1-aggregate
      - container425-aggregate
      - container407-aggregate
      - crossarm129-aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check olefile==0.47
      - uses: actions/download-artifact@v4
        with:
          pattern: version-census-aggregate-${{ github.run_id }}-*
          path: cohorts
      - name: Build logical-identity weighted matrix
        run: |
          set -euo pipefail
          python tools/corpus/version_identity_matrix.py build             --input cohorts             --out matrix
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("matrix/summary.json").read_text())
          assert s["physical_sha_count"] == 1486, s
          assert s["successful_physical_sha_count"] == 1471, s
          assert s["status"].get("ok") == 1471, s
          assert s["status"].get("probe_failed") == 12, s
          assert s["status"].get("rehydrate_failed") == 3, s
          assert s["logical_identity_count"] == 1311, s
          assert s["surplus_physical_sha_count"] == 160, s
          PY
          if find matrix -type f -iname '*.pub' | grep -q .; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: version-identity-matrix-${{ github.run_id }}
          path: matrix/**
          if-no-files-found: error
          retention-days: 90
