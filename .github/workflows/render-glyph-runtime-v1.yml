name: RENDER-GLYPH-RUNTIME-01

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/chaptera-glyph-runtime/**"
      - ".github/workflows/render-glyph-runtime-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  glyph-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Format crate snapshot
        run: cargo fmt -p chaptera-glyph-runtime
      - name: Commit exact rustfmt normalization to task branch
        shell: bash
        run: |
          git config user.name "chaptera-glyph-runtime-ci"
          git config user.email "chaptera-glyph-runtime-ci@users.noreply.github.com"
          git add crates/chaptera-glyph-runtime/src/lib.rs \
                  crates/chaptera-glyph-runtime/src/bin/glyph_runtime_receipt.rs \
                  crates/chaptera-glyph-runtime/tests/runtime_v1.rs
          if ! git diff --cached --quiet; then
            git commit -m "RENDER-GLYPH-RUNTIME: apply rustfmt normalization"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Check crate
        run: cargo check -p chaptera-glyph-runtime
      - name: Test cache atlas and generation laws
        run: cargo test -p chaptera-glyph-runtime
      - name: Emit source-neutral text-heavy runtime receipt
        run: |
          mkdir -p target/glyph-runtime
          cargo run -p chaptera-glyph-runtime --bin glyph_runtime_receipt --quiet | tee target/glyph-runtime/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: glyph-runtime-${{ github.run_id }}
          path: target/glyph-runtime/receipt.json
          if-no-files-found: error
