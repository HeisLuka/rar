name: Editor Overset UI V1

on:
  pull_request:
    paths:
      - "services/editor-api/editor_overset_ui_v1.py"
      - "services/editor-api/test_editor_overset_ui_v1.py"
      - "vendor/producer-a/producer/src/overset.rs"
      - "tools/build_authoring_overset_receipt.py"
      - "tools/test_build_authoring_overset_receipt.py"
      - ".github/workflows/editor-overset-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test presentation-only overset projection
        working-directory: services/editor-api
        run: python -m unittest -v test_editor_overset_ui_v1
      - name: Regression canonical overset receipt builder
        run: python -m unittest -v tools/test_build_authoring_overset_receipt.py
