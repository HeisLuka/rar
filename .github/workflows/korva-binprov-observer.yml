name: Observe Korva binprov

on:
  workflow_run:
    workflows:
      - "Korva 1.8.7 static provenance"
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Capture run metadata and logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euxo pipefail
          DEST="research/korva/1.8.7"
          mkdir -p "$DEST"

          {
            echo "run_id=$RUN_ID"
            echo "run_url=$RUN_URL"
            echo "conclusion=$RUN_CONCLUSION"
            echo "head_sha=$RUN_HEAD_SHA"
            echo "captured_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$DEST/run-status.txt"

          gh api "/repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100"             > "$DEST/run-jobs.json"

          job_id="$(jq -r '.jobs[0].id // empty' "$DEST/run-jobs.json")"
          if [ -n "$job_id" ]; then
            gh api               -H "Accept: application/vnd.github+json"               "/repos/$GH_REPO/actions/jobs/$job_id/logs"               > "$DEST/job-log.txt" || true
          fi

          {
            echo "=== STATUS ==="
            cat "$DEST/run-status.txt"
            echo
            echo "=== JOBS ==="
            cat "$DEST/run-jobs.json"
            echo
            echo "=== JOB LOG ==="
            cat "$DEST/job-log.txt" 2>/dev/null || true
          } > "$DEST/RUN-RESULT.txt"

          path="$DEST/RUN-RESULT.txt"
          encoded="$(base64 -w0 "$path")"
          remote="research/korva/1.8.7/RUN-RESULT.txt"
          sha="$(gh api "/repos/$GH_REPO/contents/$remote?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "/repos/$GH_REPO/contents/$remote" -f message="research: capture Korva binprov workflow result" -f content="$encoded" -f branch="main")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          gh api "${args[@]}" >/dev/null
