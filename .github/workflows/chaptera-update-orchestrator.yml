name: Chaptera update lock and health orchestration

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/chaptera-update-engine/**"
      - "crates/chaptera-update-orchestrator/**"
      - ".github/workflows/chaptera-update-orchestrator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaptera-update-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator:
    name: lock + health orchestration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Test lock, quiesce, health and recovery orchestration
        run: cargo test -p chaptera-update-orchestrator --all-targets
