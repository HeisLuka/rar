name: Authoring Hyperlink V1

on:
  pull_request:
    paths:
      - "services/editor-api/hyperlink_v1.py"
      - "services/editor-api/test_hyperlink_v1.py"
      - "services/editor-api/revision_store.py"
      - "services/editor-api/range_anchor_rebase_v1.py"
      - ".github/workflows/authoring-hyperlink-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run canonical hyperlink authoring tests
        working-directory: services/editor-api
        run: python -m unittest -v test_hyperlink_v1 test_range_anchor_rebase_v1 test_revision_store
