name: TEMP PUBWIZ P2000 POC structural inventory
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-pubwiz-poc-p2000-structural-01.yml'
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full msitools iat
      - name: Recover exact X05-44678 assets and analyze
        run: |
          set -euo pipefail
          mkdir -p out /tmp/x05
          python - <<'PY'
          import json,urllib.request,urllib.parse
          req=urllib.request.Request("https://archive.org/metadata/X05-44678",headers={"User-Agent":"rar-poc-struct/1.0"})
          with urllib.request.urlopen(req,timeout=60) as r: meta=json.load(r)
          fs=[f for f in meta.get("files",[]) if str(f.get("source") or "")=="original" and str(f.get("name") or "").lower().endswith(".7z")]
          fs.sort(key=lambda f:int(f.get("size") or 0),reverse=True)
          f=fs[0]; name=f["name"]
          url="https://archive.org/download/X05-44678/"+urllib.parse.quote(name,safe="/")
          open("/tmp/x05/url","w").write(url)
          open("out/source.json","w").write(json.dumps({"name":name,"size":int(f.get("size") or 0),"md5":f.get("md5"),"sha1":f.get("sha1")},indent=2))
          PY
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 -o /tmp/x05/source.7z "$(cat /tmp/x05/url)"
          7z l -slt /tmp/x05/source.7z > /tmp/x05/a.slt
          python - <<'PY'
          import pathlib
          t=pathlib.Path("/tmp/x05/a.slt").read_text(errors="replace")
          rows=[];cur={}
          for line in t.splitlines():
              if " = " in line:
                  k,v=line.split(" = ",1)
                  if k=="Path" and cur: rows.append(cur);cur={}
                  cur[k]=v
          if cur: rows.append(cur)
          c=[]
          for r in rows:
              p=r.get("Path","")
              if p.lower().endswith((".iso",".img",".bin",".mdf")):
                  c.append((int(r.get("Size","0") or 0),p))
          c.sort(reverse=True)
          pathlib.Path("/tmp/x05/member").write_text(c[0][1])
          PY
          mkdir -p /tmp/x05/image
          7z x -y -o/tmp/x05/image /tmp/x05/source.7z "$(cat /tmp/x05/member)" >/dev/null
          IMAGE="$(find /tmp/x05/image -type f | head -n1)"
          if [[ "${IMAGE,,}" == *.mdf ]]; then iat "$IMAGE" /tmp/x05/converted.iso >/dev/null; IMAGE=/tmp/x05/converted.iso; fi
          mkdir -p /tmp/x05/install
          7z x -y -o/tmp/x05/install "$IMAGE" -r '*.MSI' '*.msi' '*.CAB' '*.cab' '*.POC' '*.poc' >/dev/null || true
          mkdir -p /tmp/x05/msiout /tmp/x05/cabout
          n=0
          while IFS= read -r msi; do
            n=$((n+1)); mkdir -p "/tmp/x05/msiout/$n"
            msiextract -C "/tmp/x05/msiout/$n" "$msi" >/dev/null 2>&1 || true
          done < <(find /tmp/x05/install -type f \( -iname '*.msi' \))
          n=0
          while IFS= read -r cab; do
            n=$((n+1)); mkdir -p "/tmp/x05/cabout/$n"
            7z x -y -o"/tmp/x05/cabout/$n" "$cab" '*.POC' '*.poc' >/dev/null 2>&1 || true
          done < <(find /tmp/x05/install -type f \( -iname '*.cab' \))
          python - <<'PY'
          import pathlib,hashlib,json,collections
          roots=[pathlib.Path("/tmp/x05/install"),pathlib.Path("/tmp/x05/msiout"),pathlib.Path("/tmp/x05/cabout")]
          targets={}
          for root in roots:
              for p in root.rglob("*"):
                  if p.is_file() and p.name.upper() in {"ACCSBAR.POC","ACCTBOX.POC"}:
                      b=p.read_bytes(); h=hashlib.sha256(b).hexdigest()
                      targets[p.name.upper()] = (p,b,h)
          if set(targets)!={"ACCSBAR.POC","ACCTBOX.POC"}: raise SystemExit(f"missing targets: {targets.keys()}")
          def u16(b,o): return int.from_bytes(b[o:o+2],"little")
          def u32(b,o): return int.from_bytes(b[o:o+4],"little")
          FIXED={1:0,4:4,7:16}
          LEN_TYPES={16,17,19,24}
          def parse_opl(payload, base_off):
              pos=0; props=[]; ok=True; error=None
              while pos < len(payload):
                  if len(payload)-pos < 2:
                      ok=False; error={"kind":"truncated_tag","at":base_off+pos,"remaining":len(payload)-pos}; break
                  tag=u16(payload,pos); typ=(tag>>11)&0x1f; opy=tag&0x7ff
                  rec={"offset":base_off+pos,"tag":tag,"type":typ,"opyid":opy}
                  if typ in FIXED:
                      need=2+FIXED[typ]
                      if pos+need>len(payload):
                          ok=False; error={"kind":"truncated_fixed","at":base_off+pos,"type":typ,"need":need,"remaining":len(payload)-pos}; break
                      rec["serialized_len"]=need
                      if typ==4: rec["value_u32"]=u32(payload,pos+2)
                      props.append(rec); pos+=need
                  elif typ in LEN_TYPES:
                      if pos+6>len(payload):
                          ok=False; error={"kind":"truncated_length_header","at":base_off+pos,"type":typ}; break
                      cb=u32(payload,pos+2)
                      if cb<4 or pos+2+cb>len(payload):
                          ok=False; error={"kind":"invalid_length","at":base_off+pos,"type":typ,"cb_after_tag":cb,"remaining":len(payload)-pos}; break
                      rec["cb_after_tag"]=cb
                      rec["serialized_len"]=2+cb
                      rec["payload_len"]=cb-4
                      props.append(rec); pos+=2+cb
                  else:
                      remaining=len(payload)-pos
                      diag={
                        "kind":"unknown_wire_type","at":base_off+pos,"tag":tag,"type":typ,"opyid":opy,
                        "remaining_in_opl":remaining,
                        "bytes_after_tag":max(0,remaining-2),
                        "zero_payload_closes_opl": remaining==2,
                        "fixed_u32_closes_opl": remaining==6,
                      }
                      if remaining>=6:
                          after=u32(payload,pos+2)
                          diag["u32_after_tag"]=after
                          diag["length_delimited_closes_opl"]=after>=4 and (2+after)==remaining
                      else:
                          diag["u32_after_tag"]=None
                          diag["length_delimited_closes_opl"]=False
                      ok=False; error=diag; break
              residual=payload[pos:]
              residual_info=None
              if residual:
                  residual_info={"len":len(residual),"sha256":hashlib.sha256(residual).hexdigest(),"first_u16":u16(residual,0) if len(residual)>=2 else None}
              return {"known_prefix_ok":ok,"consumed":pos,"payload_len":len(payload),"exact_end":ok and pos==len(payload),"property_count":len(props),"properties":props,"error":error,"residual":residual_info}
          def block_summary(b, off, label):
              if off<0 or off+4>len(b):
                  return {"label":label,"offset":off,"length_ok":False,"error":"offset_oob"}
              cb=u32(b,off)
              if cb<4 or off+cb>len(b):
                  return {"label":label,"offset":off,"cb":cb,"length_ok":False,"error":"length_oob"}
              parsed=parse_opl(b[off+4:off+cb],off+4)
              return {"label":label,"offset":off,"cb":cb,"end":off+cb,"length_ok":True,"parse_exact":parsed["exact_end"],"parse":parsed}
          def analyze(name,b,h):
              if not b.startswith(b"POCPB5"): raise SystemExit(f"{name}: bad magic")
              if len(b)<20: raise SystemExit(f"{name}: short header")
              root_off=u32(b,0x10)
              root=block_summary(b,root_off,"root")
              sub=[]
              cursor=(root.get("end") if root.get("length_ok") else None)
              framing_ok=bool(root.get("length_ok"))
              if cursor is not None:
                  idx=0
                  while cursor<len(b):
                      blk=block_summary(b,cursor,f"sub{idx}")
                      sub.append(blk)
                      if not blk.get("length_ok"):
                          framing_ok=False; break
                      cursor=blk["end"]; idx+=1
                  if cursor!=len(b): framing_ok=False
              pair_counts=collections.Counter()
              type_counts=collections.Counter()
              unknown_type_counts=collections.Counter()
              unknown_cases=[]
              parse_exact_count=0
              parse_incomplete_count=0
              for blk in [root]+sub:
                  parsed=blk.get("parse") or {}
                  if parsed.get("exact_end"): parse_exact_count+=1
                  else:
                      parse_incomplete_count+=1
                      err=parsed.get("error") or {}
                      if err.get("kind")=="unknown_wire_type":
                          unknown_type_counts[err.get("type")]+=1
                          unknown_cases.append({
                            "block":blk.get("label"),"block_offset":blk.get("offset"),"block_cb":blk.get("cb"),
                            "type":err.get("type"),"opyid":err.get("opyid"),"tag_offset":err.get("at"),
                            "remaining_in_opl":err.get("remaining_in_opl"),"bytes_after_tag":err.get("bytes_after_tag"),
                            "zero_payload_closes_opl":err.get("zero_payload_closes_opl"),
                            "fixed_u32_closes_opl":err.get("fixed_u32_closes_opl"),
                            "length_delimited_closes_opl":err.get("length_delimited_closes_opl"),
                            "u32_after_tag":err.get("u32_after_tag"),
                            "residual_sha256":(parsed.get("residual") or {}).get("sha256")
                          })
                  for p in parsed.get("properties",[]):
                      type_counts[p["type"]]+=1
                      pair_counts[(p["type"],p["opyid"])]+=1
              return {
                "name":name,"size":len(b),"sha256":h,
                "prefix24_hex":b[:24].hex(),"suffix16_hex":b[-16:].hex(),
                "header":{"magic":"POCPB5","u16_06":u16(b,6),"u16_08":u16(b,8),"u16_0a":u16(b,10),"u32_0c":u32(b,12),"root_block_offset_u32_10":root_off},
                "root":root,
                "sub_opl_count":len(sub),
                "sub_opls":sub,
                "framing_exact_to_eof":framing_ok,
                "inner_parse_exact_count":parse_exact_count,
                "inner_parse_incomplete_count":parse_incomplete_count,
                "unknown_type_counts":dict(sorted(unknown_type_counts.items())),
                "unknown_wire_cases":unknown_cases,
                "type_counts":dict(sorted(type_counts.items())),
                "top_type_opy_pairs":[{"type":k[0],"opyid":k[1],"count":v} for k,v in pair_counts.most_common(64)]
              }
          report={"schema":"chaptera.pubwiz-poc-p2000-structural-inventory.v1","source_safe":True,"raw_poc_retained":False,
                  "files":[analyze(n,b,h) for n,(p,b,h) in sorted(targets.items())]}
          pathlib.Path("out/report.json").write_text(json.dumps(report,indent=2))
          summary={"schema":"chaptera.pubwiz-poc-p2000-structural-summary.v1","files":[
              {"name":x["name"],"size":x["size"],"sha256":x["sha256"],"prefix24_hex":x["prefix24_hex"],"header":x["header"],"root_length_ok":x["root"]["length_ok"],"root_parse_exact":x["root"]["parse_exact"],
               "root_cb":x["root"].get("cb"),"sub_opl_count":x["sub_opl_count"],
               "framing_exact_to_eof":x["framing_exact_to_eof"],
               "inner_parse_exact_count":x["inner_parse_exact_count"],
               "inner_parse_incomplete_count":x["inner_parse_incomplete_count"],
               "unknown_type_counts":x["unknown_type_counts"],
               "unknown_wire_cases":x["unknown_wire_cases"],
               "type_counts":x["type_counts"],
               "top_pairs":x["top_type_opy_pairs"][:16]} for x in report["files"]]}
          pathlib.Path("out/summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          sha256sum out/*.json | sort > out/sha256sums.txt
      - name: Enforce source-safe output
        run: |
          set -euo pipefail
          if find out -type f -iname '*.poc' | grep -q .; then exit 1; fi
          python - <<'PY'
          import json
          r=json.load(open("out/report.json"))
          assert r["source_safe"] is True
          assert r["raw_poc_retained"] is False
          assert len(r["files"])==2
          assert {x["name"] for x in r["files"]}=={"ACCSBAR.POC","ACCTBOX.POC"}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pubwiz-poc-p2000-structural-receipt
          path: out/**
          if-no-files-found: error
          retention-days: 90
