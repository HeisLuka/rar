name: TEMP CORPUS physical duplicate classify execution

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-corpus-physical-dup-classify-exec.yml'
      - 'tools/corpus/tmp_en_range_physical.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: tmp-corpus-physical-dup-classify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-en:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Range-read exact EN + PUB40 members and classify
        run: |
          set -euo pipefail
          python tools/corpus/tmp_en_range_physical.py --out out
      - name: Prove source-safe retained output
        run: |
          set -euo pipefail
          if find out -type f -iname '*.pub' | grep -q .; then
            echo "raw PUB leaked into retained output" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("out/summary.json").read_text())
          assert s["comparison_count"] == 45, s
          assert s["logical_streams_identical"] == 45, s
          assert s["fully_classified"] == 45, s
          assert s["with_unclassified"] == 0, s
          PY
          sha256sum out/*.json | tee out/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: physical-dup-classify-${{ github.run_id }}-en
          path: out/**
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: always()
    needs: classify-en
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: physical-dup-classify-${{ github.run_id }}-*
          path: shards/current
      - name: Bring forward proven Thai and Deluxe source-free shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p shards/thai shards/deluxe
          gh api -H "Accept: application/vnd.github+json"             "/repos/${{ github.repository }}/actions/artifacts/10836416863/zip"             > /tmp/thai.zip
          gh api -H "Accept: application/vnd.github+json"             "/repos/${{ github.repository }}/actions/artifacts/10836556631/zip"             > /tmp/deluxe.zip
          unzip -q /tmp/thai.zip -d shards/thai
          unzip -q /tmp/deluxe.zip -d shards/deluxe
      - name: Aggregate exact 160-comparison result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          pairs=[]; shard_summaries=[]
          for p in sorted(Path("shards").rglob("pairs.json")):
              pairs.extend(json.loads(p.read_text()))
          for p in sorted(Path("shards").rglob("summary.json")):
              shard_summaries.append(json.loads(p.read_text()))
          assert len(pairs)==160, len(pairs)
          media=Counter(r["target_root"] for r in pairs)
          assert media==Counter({"thai":102,"en":45,"deluxe":13}), media
          identities=[(r["logical_identity"],r["right_sha256"]) for r in pairs]
          assert len(identities)==len(set(identities))==160
          signatures=Counter(r["physical_signature"] for r in pairs)
          broad=Counter(); fields=Counter()
          for r in pairs:
              broad.update(r["broad_category_counts"])
              for row in r["directory_metadata_diffs"]:
                  fields.update(row["changed_fields"].keys())
          pairs.sort(key=lambda r:(r["logical_identity"],r["target_root"],r["right_sha256"]))
          summary={
              "schema":"chaptera.logical-duplicate-physical-classification.v1",
              "comparison_count":160,
              "media_counts":dict(sorted(media.items())),
              "logical_streams_identical":sum(r["logical_streams_identical"] for r in pairs),
              "fully_classified":sum(r["unclassified_byte_count"]==0 for r in pairs),
              "with_unclassified":sum(r["unclassified_byte_count"]!=0 for r in pairs),
              "total_different_bytes":sum(r["different_byte_count"] for r in pairs),
              "physical_signature_count":len(signatures),
              "physical_signature_sizes":dict(sorted(signatures.items())),
              "broad_category_counts":dict(sorted(broad.items())),
              "directory_changed_fields":dict(sorted(fields.items())),
              "pairs_with_fat_table_diff":sum(bool(r["fat_table_diff_entries"]) for r in pairs),
              "pairs_with_minifat_table_diff":sum(bool(r["minifat_table_diff_entries"]) for r in pairs),
              "pairs_with_stream_chain_diff":sum(bool(r["stream_chain_diffs"]) for r in pairs),
              "shards":sorted(shard_summaries,key=lambda s:s["target_root"]),
          }
          out=Path("aggregate"); out.mkdir(parents=True,exist_ok=True)
          (out/"pairs.json").write_text(json.dumps(pairs,indent=2,ensure_ascii=False),encoding="utf-8")
          (out/"summary.json").write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(summary,indent=2))
          PY
          sha256sum aggregate/*.json | tee aggregate/sha256sums.txt
      - name: Enforce exact closure boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("aggregate/summary.json").read_text())
          assert s["comparison_count"]==160, s
          assert s["logical_streams_identical"]==160, s
          assert s["fully_classified"]==160, s
          assert s["with_unclassified"]==0, s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: physical-dup-classify-aggregate-${{ github.run_id }}
          path: aggregate/**
          if-no-files-found: error
          retention-days: 90
