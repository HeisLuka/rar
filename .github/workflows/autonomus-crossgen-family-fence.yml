name: Autonomus crossgen family fence

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-contents/tests/crossgen_family_fence.rs"
      - "tools/pub-research/build_crossgen_family_fence_receipt.py"
      - ".github/workflows/autonomus-crossgen-family-fence.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run source-free cross-generation family fence
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-contents --test crossgen_family_fence
      - name: Build receipt
        run: |
          python tools/pub-research/build_crossgen_family_fence_receipt.py \
            --test-source vendor/producer-a/crates/pub-contents/tests/crossgen_family_fence.rs \
            --commit-sha "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/autonomus-crossgen-family-fence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: autonomus-crossgen-family-fence
          path: ${{ runner.temp }}/autonomus-crossgen-family-fence.json
          if-no-files-found: error
