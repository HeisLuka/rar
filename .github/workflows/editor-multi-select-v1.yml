name: Editor Multi Select V1

on:
  pull_request:
    paths:
      - "services/editor-api/editor_multi_select_v1.py"
      - "services/editor-api/test_editor_multi_select_v1.py"
      - "services/editor-api/object_selection_compose_v1.py"
      - "services/editor-api/object_selection_target_v1.py"
      - ".github/workflows/editor-multi-select-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run authored multi-selection regressions
        working-directory: services/editor-api
        run: python -m unittest -v test_editor_multi_select_v1 test_object_selection_compose_v1 test_object_selection_target_v1
