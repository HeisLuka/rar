name: TEMP Publisher 2000 Course Technology data pages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect exact Publisher 2000 ISBN data-file pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import urlencode, urljoin
          from urllib.request import Request, urlopen

          UA="rar-publisher2000-scsite-datafiles/1.0"
          books=[
            ("0789555972","0-7895-5597-2","introductory"),
            ("0789557134","0-7895-5713-4","complete"),
            ("0789557746","0-7895-5774-6","essential"),
          ]
          variants=[]
          for isbn10,hyph,label in books:
            variants += [
              {"isbn10":isbn10,"hyphenated":hyph,"label":label,"url":f"http://scsite.com:80/catalog/viewtitle.cfm?isbn={hyph}&help=Data+Files+for+Students"},
              {"isbn10":isbn10,"hyphenated":hyph,"label":label,"url":f"http://scsite.com:80/catalog/viewtitle.cfm?isbn={hyph}&help=Data%20Files%20for%20Students%20%28Windows%29"},
              {"isbn10":isbn10,"hyphenated":hyph,"label":label,"url":f"http://www.scsite.com:80/catalog/viewtitle.cfm?isbn={hyph}&help=Data+Files+for+Students"},
              {"isbn10":isbn10,"hyphenated":hyph,"label":label,"url":f"http://www.scsite.com:80/catalog/viewtitle.cfm?isbn={hyph}&help=Data%20Files%20for%20Students%20%28Windows%29"},
            ]

          attr_re=re.compile(r'''(?is)\b(?:href|src|action)\s*=\s*["']([^"']+)["']''')
          refresh_re=re.compile(r'''(?is)http-equiv\s*=\s*["']refresh["'][^>]*content\s*=\s*["'][^"']*url\s*=\s*([^"';>\s]+)''')
          carrier_re=re.compile(r'\.(?:pub|zip|cab|exe|msi|iso|img|bin|cue|7z|rar)(?:$|[?#])',re.I)
          relevant_re=re.compile(r'(publisher|data.?file|student|download|exercise|project|practice|chapter|graphic.?design|5597|5713|5774)',re.I)

          def cdx(u):
            params=[
              ("url",u),("matchType","exact"),("output","json"),
              ("fl","timestamp,original,mimetype,statuscode,digest,length"),
              ("filter","statuscode:200"),("collapse","digest"),("limit","20"),("gzip","false")
            ]
            q="https://web.archive.org/cdx/search/cdx?"+urlencode(params)
            req=Request(q,headers={"User-Agent":UA,"Accept":"application/json"})
            with urlopen(req,timeout=30) as r:
              data=json.load(r)
            return [dict(zip(data[0],x)) for x in data[1:]] if data else []

          targets=[]; pages=[]; observed=[]; errors=[]
          seen_target=set()
          for t in variants:
            if t["url"].casefold() in seen_target:
              continue
            seen_target.add(t["url"].casefold())
            try:
              caps=cdx(t["url"])
            except Exception as e:
              caps=[]
              errors.append({"surface":"cdx","url":t["url"],"error":f"{type(e).__name__}: {e}"})
            targets.append({**t,"capture_count":len(caps),"captures":caps})
            for cap in caps[:6]:
              ts=cap["timestamp"]; original=cap["original"]
              replay=f"https://web.archive.org/web/{ts}id_/{original}"
              row={"isbn10":t["isbn10"],"label":t["label"],"timestamp":ts,"original":original,"replay":replay}
              try:
                req=Request(replay,headers={"User-Agent":UA,"Accept":"text/html,*/*;q=0.1"})
                with urlopen(req,timeout=25) as r:
                  body=r.read(1024*1024)
                  row["status"]=getattr(r,"status",None)
                  row["content_type"]=r.headers.get("Content-Type")
                row["length"]=len(body)
                text=body.decode("utf-8","replace")
                vals=[m.group(1) for m in attr_re.finditer(text)]
                vals += [m.group(1) for m in refresh_re.finditer(text)]
                links=[]
                for v in vals:
                  v=html.unescape(v.strip())
                  if not v or v.startswith(("#","javascript:","mailto:")): continue
                  u=urljoin(original,v)
                  links.append(u)
                  observed.append({"isbn10":t["isbn10"],"label":t["label"],"source_timestamp":ts,"source_page":original,"url":u})
                row["links"]=sorted(set(links))
                row["preview"]=text[:2200]
              except Exception as e:
                row["error"]=f"{type(e).__name__}: {e}"
                errors.append({"surface":"replay","url":original,"timestamp":ts,"error":row["error"]})
              pages.append(row)
              time.sleep(.15)

          seen=set(); links=[]
          for r in observed:
            k=(r["isbn10"],r["url"].casefold())
            if k in seen: continue
            seen.add(k)
            u=r["url"]
            links.append({**r,"carrier_like":bool(carrier_re.search(u)),"relevant_like":bool(relevant_re.search(u))})

          summary={
            "schema":"chaptera.corpus-publisher2000-scsite-datafiles.v1",
            "source_safe":True,
            "raw_binary_retained":False,
            "books":[{"isbn10":x[0],"hyphenated":x[1],"label":x[2]} for x in books],
            "targets":targets,
            "pages_fetched":sum("error" not in x for x in pages),
            "unique_observed_links":len(links),
            "carrier_rows":[x for x in links if x["carrier_like"]],
            "relevant_rows":[x for x in links if x["relevant_like"]],
            "errors":errors,
            "guardrail":"Only exact ISBN-specific Course Technology Publisher 2000 data-file pages are inspected. Linked binary bodies are not downloaded or executed."
          }
          Path("out/summary.json").write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding="utf-8")
          Path("out/pages.json").write_text(json.dumps(pages,indent=2,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - name: Metadata-only guard
        shell: bash
        run: |
          set -euo pipefail
          if find out -type f \( -iname '*.pub' -o -iname '*.zip' -o -iname '*.cab' -o -iname '*.exe' -o -iname '*.msi' -o -iname '*.iso' -o -iname '*.img' -o -iname '*.7z' -o -iname '*.rar' \) | grep -q .; then
            echo 'unexpected raw carrier bytes in locator artifact' >&2
            exit 1
          fi
          sha256sum out/* | sort > out/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-publisher2000-scsite-datafiles
          path: out/**
          retention-days: 60
          if-no-files-found: error
