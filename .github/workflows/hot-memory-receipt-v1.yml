name: CLOUD-HOT-MEMORY-01 receipt contract

on:
  pull_request:
    paths:
      - "tools/hot_memory_receipt_v1.py"
      - "tools/test_hot_memory_receipt_v1.py"
      - "tools/run_hot_memory_contract.py"
      - "docs/hot-memory-receipt-v1.md"
      - ".github/workflows/hot-memory-receipt-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hot-memory-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test hot-memory receipt contract
        run: python tools/test_hot_memory_receipt_v1.py
      - name: Emit synthetic contract receipt
        run: python tools/run_hot_memory_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: hot-memory-v1-contract
          path: target/hot-memory-v1/receipt.json
          if-no-files-found: error
