name: Viewer script font map bounded probe

on:
  push:
    branches:
      - "feature/viewer-script-font-map-01"
    paths:
      - "vendor/producer-a/crates/pub-quill/**"
      - "vendor/producer-a/crates/pub-reader/**"
      - "vendor/producer-a/crates/pub-viewer/**"
      - ".github/workflows/viewer-script-font-map-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Rustfmt donor typography path
        run: cargo fmt --manifest-path vendor/producer-a/Cargo.toml -- --check

      - name: Clippy bounded typography path
        run: cargo clippy --manifest-path vendor/producer-a/Cargo.toml -p pub-quill -p pub-reader -p pub-viewer --all-targets -- -D warnings

      - name: Test bounded Quill typography
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-quill typography -- --nocapture

      - name: Test pub-reader
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-reader

      - name: Test pub-viewer
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer
