name: Document Text Replace All V1

on:
  pull_request:
    paths:
      - "services/editor-api/document_text_replace_all_v1.py"
      - "services/editor-api/test_document_text_replace_all_v1.py"
      - "services/editor-api/document_text_find_v1.py"
      - "services/editor-api/story_find_replace_v1.py"
      - "services/editor-api/multi_story_text_transaction_v1.py"
      - ".github/workflows/document-text-replace-all-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run atomic document Replace All tests
        working-directory: services/editor-api
        run: python -m unittest -v test_document_text_replace_all_v1 test_document_text_find_v1 test_multi_story_text_transaction_v1 test_story_find_replace_v1
