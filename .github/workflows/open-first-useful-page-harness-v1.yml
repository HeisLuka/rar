name: OPEN-FIRST-USEFUL-PAGE-HARNESS-01

on:
  pull_request:
    paths:
      - "apps/chaptera-desktop/src/main.rs"
      - "apps/chaptera-desktop/src/open_phase.rs"
      - "vendor/producer-a/crates/pub-reader/**"
      - "vendor/producer-a/crates/pub-viewer/**"
      - "tools/open_first_useful_page_v1.py"
      - "tools/test_open_first_useful_page_v1.py"
      - "tools/run_open_first_useful_page_harness.py"
      - "docs/open-first-useful-page-v1.md"
      - ".github/workflows/open-first-useful-page-harness-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-open-phase-harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test receipt evidence classes
        run: python tools/test_open_first_useful_page_v1.py

      - name: Check Reader timing crates
        shell: pwsh
        run: |
          cargo fmt --manifest-path vendor/producer-a/Cargo.toml -p pub-reader -p pub-viewer -- --check
          cargo check --manifest-path vendor/producer-a/Cargo.toml -p pub-reader -p pub-viewer --lib
          cargo clippy --manifest-path vendor/producer-a/Cargo.toml -p pub-reader -p pub-viewer --lib -- -D warnings

      - name: Check Reader-only desktop timing surface
        run: cargo check -p chaptera-desktop --features reader-only --all-targets

      - name: Build Reader-only timing binary
        run: cargo build -p chaptera-desktop --release --features reader-only

      - name: Qualify pinned public PUB for first-useful-page mechanics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "chaptera-open-phase-fixtures"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $poiCommit = "942d95d85b15d0dfdb3bc9ba1b4f273f277757c8"
          $candidates = @(
            @{ Name = "Sample.pub"; Bytes = 72192 },
            @{ Name = "SampleBrochure.pub"; Bytes = 161792 },
            @{ Name = "SampleNewsletter.pub"; Bytes = 291840 }
          )

          $selected = $null
          foreach ($candidate in $candidates) {
            $fixture = Join-Path $root $candidate.Name
            $url = "https://raw.githubusercontent.com/apache/poi/$poiCommit/test-data/publisher/$($candidate.Name)"
            Invoke-WebRequest -Uri $url -OutFile $fixture
            $bytes = (Get-Item $fixture).Length
            if ($bytes -ne $candidate.Bytes) {
              throw "$($candidate.Name) byte length mismatch: expected $($candidate.Bytes), got $bytes"
            }

            $observation = Join-Path $root "$($candidate.Name).qualification.json"
            $process = Start-Process -FilePath "target/release/chaptera-editor.exe" -ArgumentList @(
              "--open-phase-run-v1", $fixture, "unknown", $observation
            ) -Wait -PassThru
            if ($process.ExitCode -ne 0 -or -not (Test-Path $observation)) {
              Write-Host "Candidate $($candidate.Name) is not supported by the current mature Reader path."
              continue
            }

            $run = Get-Content -Raw $observation | ConvertFrom-Json
            $definition = $run.first_useful_page_definition
            $qualified = (
              $definition.page_geometry_present -eq $true -and
              $definition.fidelity_diagnostics_present -eq $true -and
              $definition.visible_resources_ready -eq $true -and
              $definition.current_text_layout_present -eq $true -and
              $definition.non_empty_visible_content -eq $true
            )
            Write-Host "Candidate $($candidate.Name): qualified=$qualified definition=$($definition | ConvertTo-Json -Compress)"
            if ($qualified) {
              $selected = $fixture
              break
            }
          }

          if (-not $selected) {
            throw "No pinned Apache POI candidate satisfies the unchanged first-useful-page contract."
          }

          $hash = (Get-FileHash $selected -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $selected).Length
          "CHAPTERA_OPEN_PHASE_FIXTURE=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_OPEN_PHASE_FIXTURE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_OPEN_PHASE_FIXTURE_BYTES=$bytes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_OPEN_PHASE_FIXTURE_NAME=$(Split-Path $selected -Leaf)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run cold and warm real Reader phase receipt
        shell: pwsh
        run: python tools/run_open_first_useful_page_harness.py --binary target/release/chaptera-editor.exe --fixture "$env:CHAPTERA_OPEN_PHASE_FIXTURE" --out target/open-first-useful-page-harness/receipt.json --build-sha "${{ github.sha }}" --expected-sha256 "$env:CHAPTERA_OPEN_PHASE_FIXTURE_SHA256" --expected-byte-len "$env:CHAPTERA_OPEN_PHASE_FIXTURE_BYTES" --cold-runs 3 --warm-runs 3

      - name: Render actual Reader first WGPU frame
        shell: pwsh
        run: |
          $env:CHAPTERA_OPEN_FIRST_PAINT_RECEIPT = "target/open-first-useful-page-harness/first-paint-wgpu.json"
          cargo test -p chaptera-desktop --features reader-only reader_open_phase_wgpu_first_paint_uses_current_viewer_app -- --ignored --nocapture

      - name: Verify source-free authority fences
        shell: pwsh
        run: |
          $receipt = Get-Content -Raw "target/open-first-useful-page-harness/receipt.json" | ConvertFrom-Json
          if ($receipt.measurement_class -ne "hosted_public_fixture") { throw "wrong measurement class" }
          if ($receipt.evidence_authority.real_pub_runtime -ne $true) { throw "real Reader runtime not recorded" }
          if ($receipt.evidence_authority.architecture_decision_allowed -ne $false) { throw "hosted timing gained architecture authority" }
          if ($receipt.corpus_identity.raw_path -ne $null) { throw "raw path leaked into public receipt" }
          $paint = Get-Content -Raw "target/open-first-useful-page-harness/first-paint-wgpu.json" | ConvertFrom-Json
          if ($paint.frame_rendered -ne $true -or $paint.source_unchanged -ne $true) { throw "Reader first-paint WGPU proof failed" }
          if ($paint.architecture_decision_allowed -ne $false) { throw "WGPU hosted timing gained architecture authority" }

      - uses: actions/upload-artifact@v4
        with:
          name: open-first-useful-page-harness-v1
          path: |
            target/open-first-useful-page-harness/receipt.json
            target/open-first-useful-page-harness/first-paint-wgpu.json
          if-no-files-found: error
