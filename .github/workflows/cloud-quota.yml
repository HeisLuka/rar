name: CLOUD-QUOTA-01 contract
on:
  pull_request:
    paths:
      - "services/cloud-quota/**"
      - "tools/run_cloud_quota_contract.py"
      - "docs/cloud-quota-v1.md"
      - ".github/workflows/cloud-quota.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run quota contract tests
        working-directory: services/cloud-quota
        run: python -m unittest -v test_quota_v1.py
      - name: Produce quota receipt
        run: python tools/run_cloud_quota_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-quota-v1-contract
          path: target/cloud-quota-v1/receipt.json
          if-no-files-found: error
