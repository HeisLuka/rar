          summary={
            "source":"internet_archive_bounded_probe",
            "rows":len(rows),
            "unique_sha256":len({r.get("sha256") for r in rows if r.get("sha256")}),
            "fetch_status":dict(Counter(r.get("fetch_status","") for r in rows)),
            "classification":dict(Counter(r.get("classification","") for r in rows)),
          }
          Path("out/ia/summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          find out/ia/harvest -type f ! -name 'manifest.json' ! -name 'manifest.csv' -delete || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-bounded-ia-${{ github.run_id }}
          path: out/ia/**
          retention-days: 14

  github-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover bounded GitHub-history candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/github
          python tools/corpus/github_history_pub_seed.py \
            --repo apache/poi --no-search --max-repos 1 \
            --history-depth 500 --max-paths-per-repo 25 --max-captures-per-path 2 \
            --out out/github/seed.csv --summary out/github/discovery.json
      - name: Harvest bounded exact bytes
        run: |
          set -euo pipefail
          python tools/corpus/harvest_pub.py \
            --seed out/github/seed.csv --out out/github/harvest \
            --max-files 20 --timeout 20 --max-bytes 104857600 \
            --per-host-delay 0.05
      - name: Summarize and remove raw bytes
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=Path("out/github/harvest/manifest.json")
          rows=json.loads(p.read_text()) if p.exists() else []
          summary={
            "source":"github_history_bounded_probe",
            "rows":len(rows),
            "unique_sha256":len({r.get("sha256") for r in rows if r.get("sha256")}),
            "fetch_status":dict(Counter(r.get("fetch_status","") for r in rows)),
            "classification":dict(Counter(r.get("classification","") for r in rows)),
          }
          Path("out/github/summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          find out/github/harvest -type f ! -name 'manifest.json' ! -name 'manifest.csv' -delete || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-bounded-github-${{ github.run_id }}
          path: out/github/**
          retention-days: 14
