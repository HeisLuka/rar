name: TEMP Publisher training novelty matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/corpus/tmp_publisher_training_wayback.py'
      - '.github/workflows/tmp-publisher-training-novelty.yml'

permissions:
  contents: read
  actions: read

jobs:
  scope:
    strategy:
      fail-fast: false
      matrix:
        id: [kcls-instruction, kcls-techtutor, nottingham-o2016, ezref, www-ezref, cherylprice, www-cherylprice, simonsezit, www-simonsezit, sample-courseware-s3, cheltenham, www-cheltenham]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover training payloads
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/corpus/tmp_publisher_training_wayback.py \
            --scope '${{ matrix.id }}' \
            --out out/seed.csv \
            --summary out/discovery.json
          cat out/discovery.json
      - name: Recover direct PUB and PUB members from ZIP
        run: |
          set -euo pipefail
          python tools/corpus/harvest_pub.py \
            --seed out/seed.csv \
            --out out/harvest \
            --max-files -1 \
            --timeout 30 \
            --max-bytes 157286400 \
            --max-archive-member-bytes 104857600 \
            --max-archive-total-bytes 314572800 \
            --max-archive-members 500 \
            --per-host-delay 0.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-scope-${{ matrix.id }}
          path: out/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  aggregate:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: training-scope-*
          path: combined
      - name: Filter to SHA-novel Publisher CFB
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import glob, hashlib, io, json, os, shutil, zipfile
          from pathlib import Path
          from urllib.request import Request, urlopen

          artifact_ids=[10808750049,10807797944,10808390771,10807882317,10808417821,10807881478,10807597565]
          token=os.environ['GITHUB_TOKEN']; known=set()
          for aid in artifact_ids:
              req=Request(f'https://api.github.com/repos/HeisLuka/rar/actions/artifacts/{aid}/zip',headers={
                'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'rar-training-novelty/1.0'})
              with urlopen(req,timeout=120) as r: payload=r.read()
              with zipfile.ZipFile(io.BytesIO(payload)) as z:
                  names=[n for n in z.namelist() if n.endswith('index.json')]
                  if not names: raise RuntimeError(f'no index.json in artifact {aid}')
                  for row in json.loads(z.read(names[0])):
                      sha=str(row.get('sha256','')).lower()
                      if len(sha)==64: known.add(sha)
          if len(known)!=950: raise RuntimeError(f'expected 950 known SHA, got {len(known)}')

          discoveries=[]; rows=[]
          for p in glob.glob('combined/**/discovery.json',recursive=True):
              try: discoveries.append(json.loads(Path(p).read_text(encoding='utf-8')))
              except Exception: pass
          for p in glob.glob('combined/**/harvest/manifest.json',recursive=True):
              base=Path(p).parent
              for row in json.loads(Path(p).read_text(encoding='utf-8')):
                  rec=dict(row); rec['_base']=str(base); rows.append(rec)

          novel_dir=Path('novel'); novel_dir.mkdir()
          publisher=set(); known_hits=set(); novel={}
          for row in rows:
              if row.get('fetch_status') not in {'ok','ok_archive_member'}: continue
              if row.get('classification')!='cfb_publisher_hint': continue
              sha=str(row.get('sha256') or '').lower()
              if len(sha)!=64: continue
              publisher.add(sha)
              if sha in known: known_hits.add(sha); continue
              if sha in novel: continue
              src=Path(row['_base'])/str(row.get('stored_path') or '')
              if not src.is_file(): raise RuntimeError(f'missing payload {src}')
              data=src.read_bytes(); actual=hashlib.sha256(data).hexdigest()
              if actual!=sha: raise RuntimeError(f'SHA mismatch {sha} != {actual}')
              if not data.startswith(bytes.fromhex('D0CF11E0A1B11AE1')): raise RuntimeError(f'non-CFB {sha}')
              name=Path(str(row.get('candidate_filename') or row.get('stored_path') or 'candidate.pub')).name
              if not name.lower().endswith('.pub'): name += '.pub'
              dst=novel_dir/f'{sha}__{name}'
              shutil.copyfile(src,dst)
              rec={k:v for k,v in row.items() if k!='_base'}; rec['exported_name']=dst.name; novel[sha]=rec

          out=[novel[k] for k in sorted(novel)]
          Path('novel.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          summary={
            'known_corpus_sha':len(known),'scope_discovery':discoveries,'harvest_rows':len(rows),
            'publisher_unique_sha':len(publisher),'known_sha_hits':len(known_hits),
            'novel_unique_sha':len(out),'novel_sha256':[r['sha256'] for r in out],
            'novel_sources':[{'sha256':r['sha256'],'scope':r.get('training_scope'),'url':r.get('wayback_original_url'),'archive_member':r.get('archive_member')} for r in out],
          }
          Path('summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: publisher-training-novelty-${{ github.run_id }}
          path: |
            summary.json
            novel.json
            novel/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 6