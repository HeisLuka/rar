name: CLOUD-BLOB-GC-01

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/blob_gc.rs"
      - "apps/chaptera-server/src/blob_store.rs"
      - "apps/chaptera-server/src/sqlite_blob_metadata.rs"
      - "apps/chaptera-server/src/schema_migration.rs"
      - "apps/chaptera-server/tests/sqlite_blob_metadata.rs"
      - "apps/chaptera-server/migrations/0004_blob_gc.sql"
      - "apps/chaptera-server/migrations/0012_blob_gc_delete_fence.sql"
      - "tools/run_cloud_migration_receipt.py"
      - ".github/workflows/cloud-blob-gc-v0.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Run Blob GC tests
        run: cargo test -p chaptera-server blob_gc::
      - name: Run durable blob metadata fence regressions
        run: cargo test -p chaptera-server --test sqlite_blob_metadata -- --nocapture
      - name: Run migration ownership regressions
        run: cargo test -p chaptera-server schema_migration::
      - name: Build operator binary
        run: cargo build -p chaptera-server
      - name: Prove migration chain through GC fence v12
        run: |
          python tools/run_cloud_migration_receipt.py             --binary target/debug/chaptera             --out target/cloud-blob-gc/migration
