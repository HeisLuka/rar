name: CLOUD-BLOB-GC-01

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/blob_gc.rs"
      - "apps/chaptera-server/src/blob_store.rs"
      - "apps/chaptera-server/src/lib.rs"
      - "apps/chaptera-server/migrations/0004_blob_gc.sql"
      - ".github/workflows/cloud-blob-gc-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -p chaptera-server -- --check
      - name: Run clippy
        run: cargo clippy -p chaptera-server --all-targets -- -D warnings
      - name: Run Blob GC tests
        run: cargo test -p chaptera-server blob_gc::
      - name: Run migration ownership regressions
        run: cargo test -p chaptera-server schema_migration::
