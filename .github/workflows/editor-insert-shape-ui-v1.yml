name: Editor Insert Shape UI V1

on:
  pull_request:
    paths:
      - "services/editor-api/insert_shape_ui_v1.py"
      - "services/editor-api/test_insert_shape_ui_v1.py"
      - ".github/workflows/editor-insert-shape-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Rectangle tool orchestration tests
        working-directory: services/editor-api
        run: python -m unittest -v test_insert_shape_ui_v1
