name: Desktop PUB open worker protocol V1

on:
  pull_request:
    paths:
      - "crates/chaptera-desktop-open-protocol/**"
      - ".github/workflows/desktop-pub-open-protocol.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/chaptera-desktop-open-protocol/Cargo.toml -- --check
      - name: Check
        run: cargo check --manifest-path crates/chaptera-desktop-open-protocol/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path crates/chaptera-desktop-open-protocol/Cargo.toml --all-targets -- -D warnings
      - name: Test framing and source identity
        run: cargo test --manifest-path crates/chaptera-desktop-open-protocol/Cargo.toml -- --nocapture
