name: Authoring PasteFragment V1

on:
  pull_request:
    paths:
      - "crates/pub-model/src/fragment.rs"
      - "crates/pub-model/src/create_shape.rs"
      - "crates/pub-model/src/shape_paint.rs"
      - "services/editor-api/authoring_fragment_v1.py"
      - "services/editor-api/authoring_fragment_set_v1.py"
      - "services/editor-api/revision_store.py"
      - "services/editor-api/test_authoring_fragment.py"
      - "services/editor-api/test_authoring_fragment_set_v1.py"
      - "packages/protocol/authoring-paste-fragment/v1/**"
      - ".github/workflows/authoring-paste-fragment-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Run PasteFragment revision/core tests
        working-directory: services/editor-api
        run: python -m unittest -v test_authoring_fragment
      - name: Run atomic FragmentSet revision lifecycle
        working-directory: services/editor-api
        run: python -m unittest -v test_authoring_fragment_set_v1
      - name: Regression CreateShape and revision kernel
        working-directory: services/editor-api
        run: python -m unittest -v test_create_shape test_revision_store
      - name: Validate public PasteFragment intent schema
        run: |
          python - <<'PY'
          import json
          import jsonschema
          from pathlib import Path

          schema = json.loads(Path("packages/protocol/authoring-paste-fragment/v1/paste-fragment-intent.schema.json").read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          PY

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check pub-model formatting
        run: cargo fmt -p pub-model -- --check
      - name: Check pub-model
        run: cargo check -p pub-model --all-targets
      - name: Lint pub-model
        run: cargo clippy -p pub-model --all-targets -- -D warnings
      - name: Test pub-model
        run: cargo test -p pub-model
