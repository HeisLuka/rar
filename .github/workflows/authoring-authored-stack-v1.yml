name: Authoring AuthoredStack V1

on:
  pull_request:
    paths:
      - "packages/protocol/authoring-authored-stack/**"
      - "services/editor-api/authored_stack_v1.py"
      - "services/editor-api/test_authored_stack.py"
      - ".github/workflows/authoring-authored-stack-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run AuthoredStack model + revision tests
        working-directory: services/editor-api
        run: python -m unittest -v test_authored_stack
      - name: Validate public reorder intent schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator

          schema = json.load(open("packages/protocol/authoring-authored-stack/v1/reorder-intent.schema.json"))
          Draft202012Validator.check_schema(schema)
          fixture = {
              "protocol_version": "chaptera.authored-stack-reorder-intent.v1",
              "document_id": "doc:1",
              "source_hash": "a" * 64,
              "base_revision_id": "sha256:" + "b" * 64,
              "client_operation_id": "stack-op-00000001",
              "command": {
                  "kind": "reorder_authored_stack",
                  "page_id": "page:1",
                  "node_id": "node:b",
                  "expected_before": ["node:a", "node:b", "node:c"],
                  "mode": "to_front"
              }
          }
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          print("AuthoredStack reorder intent schema valid")
          PY
