name: Nudge Plan V1

on:
  pull_request:
    paths:
      - "services/editor-api/nudge_plan_v1.py"
      - "services/editor-api/test_nudge_plan_v1.py"
      - ".github/workflows/nudge-plan-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact document-space nudge policy tests
        working-directory: services/editor-api
        run: python -m unittest -v test_nudge_plan_v1
