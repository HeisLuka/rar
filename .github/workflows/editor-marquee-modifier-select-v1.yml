name: Editor Marquee Modifier Select V1

on:
  pull_request:
    paths:
      - "services/editor-api/editor_marquee_modifier_select_v1.py"
      - "services/editor-api/test_editor_marquee_modifier_select_v1.py"
      - "services/editor-api/editor_marquee_select_v1.py"
      - "services/editor-api/object_selection_compose_v1.py"
      - ".github/workflows/editor-marquee-modifier-select-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Shift-marquee composition regressions
        working-directory: services/editor-api
        run: python -m unittest -v test_editor_marquee_modifier_select_v1 test_editor_marquee_select_v1 test_object_selection_compose_v1
