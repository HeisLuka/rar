name: WEB-WORKER-BOUNDARY-01

on:
  pull_request:
    paths:
      - "apps/web/worker-boundary-v1.mjs"
      - "apps/web/worker-boundary-v1.test.mjs"
      - "apps/web/image-decode-worker-v1.mjs"
      - "tools/run_web_worker_boundary_benchmark.mjs"
      - ".github/workflows/web-worker-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit-test bounded Worker admission/fencing
        run: node --test apps/web/worker-boundary-v1.test.mjs
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Benchmark clone vs transferable transport
        run: node tools/run_web_worker_boundary_benchmark.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-worker-boundary-${{ matrix.browser }}
          path: target/web-worker-boundary/*.json
          if-no-files-found: error
